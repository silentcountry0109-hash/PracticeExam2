 (Ｂ)上弦月 (Ｃ)新月 (Ｄ)下弦月。", "ans": "A", "topic": "月相", "analysis": "農曆十五前後月球受光面大致朝向地球，夜晚可見接近完整圓面的滿月。", "ext": "農曆初一為新月、初七八為上弦月、十五滿月、二十二三為下弦月，約一月一循環。"}, {"num": 10, "content": "下列哪一種植物最適合利用葉來進行無性繁殖？ (Ａ)馬鈴薯 (Ｂ)空心菜 (Ｃ)落地生根 (Ｄ)甘藷。", "ans": "C", "topic": "無性繁殖", "analysis": "落地生根的葉緣能長出不定芽並形成新植株，是典型的葉繁殖；馬鈴薯和甘藷分別主要利用莖、根繁殖。", "ext": "馬鈴薯以塊莖、甘藷以塊根、草莓以匍匐莖繁殖，無性繁殖後代性狀與親代相同。"}, {"num": 11, "content": "電磁鐵通電後，若只把電池正、負極對調，最可能發生什麼改變？ (Ａ)磁力完全消失 (Ｂ)磁極方向互換 (Ｃ)線圈圈數增加 (Ｄ)鐵芯變成木芯。", "ans": "B", "topic": "電磁鐵", "analysis": "電池正負極對調會使線圈中的電流方向相反，因此電磁鐵的南、北極互換，但線圈圈數與鐵芯不變。", "ext": "增加線圈圈數、加大電流或加入鐵芯可增強電磁鐵磁力；斷電後磁力隨即消失。"}, {"num": 12, "content": "食物鏈「草→蚱蜢→青蛙→蛇」中，若蚱蜢數量短期內大量減少，最先可能受到食物不足影響的是誰？ (Ａ)草 (Ｂ)分解者 (Ｃ)蛇 (Ｄ)青蛙。", "ans": "D", "topic": "食物鏈", "analysis": "青蛙直接以蚱蜢為食，蚱蜢驟減後青蛙最先面臨食物不足；蛇受到的是較間接、較晚的影響。", "ext": "蚱蜢減少時草因被取食減少而可能增多，影響沿食物鏈上下傳遞，先及相鄰階層。"}, {"num": 13, "content": "將相同燈泡分別接入四種水溶液測試導電性，哪一杯最不容易使燈泡發亮？ (Ａ)食鹽水 (Ｂ)小蘇打水 (Ｃ)糖水 (Ｄ)醋水。", "ans": "C", "topic": "電解質", "analysis": "糖溶於水後主要以不帶電的分子存在，溶液缺少可移動離子，因此最不易導電。", "ext": "酸、鹼、鹽溶於水解離出離子而導電；糖、酒精溶液不解離，屬非電解質。"}, {"num": 14, "content": "燒水時，鍋底附近的水受熱上升、較冷的水下降，主要屬於哪一種傳熱方式？ (Ａ)傳導 (Ｂ)輻射 (Ｃ)對流 (Ｄ)凝結。", "ans": "C", "topic": "熱對流", "analysis": "受熱的水密度降低而上升，較冷的水下沉，形成流體循環，屬於對流。", "ext": "對流發生於液體與氣體；冷氣裝高處、暖爐放低處，正是利用冷降熱升的對流。"}, {"num": 15, "content": "河流彎曲處通常一側侵蝕、一側堆積。水流較快的一側最可能形成什麼地形？ (Ａ)凸岸 (Ｂ)凹岸 (Ｃ)沙洲中央 (Ｄ)三角洲。", "ans": "B", "topic": "河流地形", "analysis": "彎道外側水流較快、侵蝕較強，形成凹岸；內側水流較慢，較易堆積成凸岸。", "ext": "凹岸水深流急、易崩塌需護岸；凸岸堆積成河灘。河道彎曲加劇可能自然裁彎形成牛軛湖。"}, {"num": 16, "content": "植物細胞比一般動物細胞多出的構造，最適合下列哪一組？ (Ａ)細胞壁、葉綠體 (Ｂ)細胞膜、細胞核 (Ｃ)細胞質、細胞膜 (Ｄ)細胞核、液泡。", "ans": "A", "topic": "細胞構造", "analysis": "植物細胞通常具有細胞壁與葉綠體，而一般動物細胞沒有；細胞膜、細胞質與細胞核則兩者皆可具有。", "ext": "植物細胞的液泡通常大而明顯，動物細胞液泡小或不明顯；兩者皆有細胞核。"}, {"num": 17, "content": "使用一個理想動滑輪吊起重物，若重物上升 20 公分，手至少要拉動繩子多少公分？ (Ａ)10 公分 (Ｂ)20 公分 (Ｃ)80 公分 (Ｄ)40 公分。", "ans": "D", "topic": "滑輪", "analysis": "理想動滑輪由兩段繩子支撐，重物上升 20 公分時兩段各縮短 20 公分，所以需拉繩 2×20＝40 公分。", "ext": "定滑輪只改變施力方向不省力；動滑輪省一半力但費距離，兩者常組成滑輪組。"}, {"num": 18, "content": "將帶火星的木條伸入一瓶氣體，木條重新燃燒，該氣體最可能是什麼？ (Ａ)氮氣 (Ｂ)二氧化碳 (Ｃ)氧氣 (Ｄ)水蒸氣。", "ans": "C", "topic": "氧氣性質", "analysis": "氧氣具有助燃性，能使帶火星的木條重新燃燒；二氧化碳通常使火焰熄滅。", "ext": "氧氣助燃但本身不可燃；實驗室可用雙氧水加二氧化錳催化分解製取氧氣。"}, {"num": 19, "content": "上午觀察直立旗杆的影子指向西北方，太陽最可能位於哪一方？ (Ａ)東南方 (Ｂ)西南方 (Ｃ)東北方 (Ｄ)西北方。", "ans": "A", "topic": "太陽視運動", "analysis": "影子方向與太陽所在方向大致相反；影子指向西北，因此太陽位於東南方。", "ext": "北半球中緯度地區影子由西向北再向東移動，正午影子最短，方向與太陽相反。"}, {"num": 20, "content": "森林中的黴菌與蕈類主要扮演什麼角色？ (Ａ)生產者 (Ｂ)初級消費者 (Ｃ)分解者 (Ｄ)捕食者。", "ans": "C", "topic": "分解者", "analysis": "黴菌與蕈類分解生物遺體和排遺，使有機物轉為較簡單物質，屬於分解者。", "ext": "分解者將動植物遺體分解為簡單物質回歸環境，促進物質循環；細菌亦屬分解者。"}, {"num": 21, "content": "家中各盞電燈通常採並聯，最主要的好處是什麼？ (Ａ)所有燈只能同時亮滅 (Ｂ)任一燈壞掉，其餘仍可工作 (Ｃ)電池一定更耐用 (Ｄ)每盞燈都沒有電流。", "ans": "B", "topic": "並聯電路", "analysis": "並聯電路的各燈位於獨立支路，一盞燈故障只使該支路斷路，其餘支路仍可通電。", "ext": "串聯時一燈損壞全部熄滅；並聯各支路獨立，家用電器與插座皆採並聯設計。"}, {"num": 22, "content": "下列哪一種材料最適合做為鍋柄外層？ (Ａ)銅 (Ｂ)鋁 (Ｃ)鐵 (Ｄ)木材。", "ans": "D", "topic": "熱的絕緣", "analysis": "木材導熱慢，能減少鍋中熱量快速傳到手上；銅、鋁、鐵都是較佳導熱材料。", "ext": "木材、塑膠、空氣導熱差，適合作隔熱材料；保溫瓶利用真空層阻絕傳導與對流。"}, {"num": 23, "content": "小安想研究水分對吐司長黴的影響，最適合的實驗設計為何？ (Ａ)乾吐司放冰箱、溼吐司放窗邊 (Ｂ)乾、溼吐司放在相同溫度與光線下 (Ｃ)使用不同品牌與不同大小吐司 (Ｄ)只觀察一片溼吐司。", "ans": "B", "topic": "實驗設計", "analysis": "操作變因應只有吐司的乾溼程度，溫度、光線、品牌和大小等條件均須相同，才能判斷水分的影響。", "ext": "操作變因僅乾溼一項，其餘條件如溫度、光線、吐司種類皆須相同才是公平測試。"}, {"num": 24, "content": "外來種進入新環境後，最可能造成哪一項影響？ (Ａ)一定立刻滅絕 (Ｂ)可能與原生種競爭資源 (Ｃ)必定增加所有物種數量 (Ｄ)完全不影響食物網。", "ans": "B", "topic": "外來種", "analysis": "外來種可能缺少天敵並與原生種競爭食物、空間等資源，因而擾動原有食物網。", "ext": "福壽螺、小花蔓澤蘭皆為臺灣著名外來入侵種，可能排擠原生種並破壞生態平衡。"}, {"num": 25, "content": "雲形成時，大氣中的水主要經歷哪一項變化？ (Ａ)水滴直接分解成氫和氧 (Ｂ)液態水受熱凝固 (Ｃ)冰晶受熱凝華 (Ｄ)水蒸氣遇冷凝結成小水滴或冰晶。", "ans": "D", "topic": "雲的形成", "analysis": "水蒸氣遇冷可凝結成小水滴；在更低溫條件下，也可能經凝華或由過冷水滴凍結形成冰晶，因此雲由小水滴或冰晶組成。", "ext": "空氣上升膨脹冷卻至露點，水氣凝結成雲；霧則是近地面水氣凝結的小水滴。"}, {"num": 26, "content": "在暗室中用綠光照射紅色不透明紙片，紙片最可能呈現什麼顏色？ (Ａ)紅色 (Ｂ)綠色 (Ｃ)接近黑色 (Ｄ)黃色。", "ans": "C", "topic": "光與顏色", "analysis": "紅紙主要反射紅光，但綠光中沒有紅色成分可供反射，因此只反射極少光而接近黑色。", "ext": "不透明物體呈現其反射光的顏色；白色反射所有色光，黑色幾乎吸收所有色光。"}, {"num": 27, "content": "在彈性限度內，同一彈簧掛 1、2、3 個相同砝碼時，伸長量分別為 2、4、6 公分。掛 4 個砝碼時，伸長量最可能是多少？ (Ａ)5 公分 (Ｂ)6 公分 (Ｃ)8 公分 (Ｄ)12 公分。", "ans": "C", "topic": "虎克定律", "analysis": "在彈性限度內，砝碼數與伸長量成正比，每個砝碼伸長 2 公分，4 個應伸長 4×2＝8 公分。", "ext": "彈性限度內伸長量與外力成正比；超過彈性限度彈簧將無法恢復原長。"}, {"num": 28, "content": "人體消化與吸收養分的主要場所是哪一個器官？ (Ａ)食道 (Ｂ)小腸 (Ｃ)胃 (Ｄ)大腸。", "ans": "B", "topic": "消化器官", "analysis": "小腸具有絨毛以擴大吸收面積，也是大部分化學性消化完成之處，因此是消化與吸收的主要場所。", "ext": "胃主要消化蛋白質並暫存食物；大腸主要吸收水分，幾乎不進行消化作用。"}, {"num": 29, "content": "夏天架設橋梁時，各段橋面之間保留縫隙，主要是為了什麼？ (Ａ)預留熱脹冷縮空間 (Ｂ)增加摩擦力 (Ｃ)讓雨水變乾淨 (Ｄ)減少橋面重量。", "ans": "A", "topic": "熱脹冷縮", "analysis": "橋面會隨溫度升高而膨脹、降低而收縮，預留縫隙可避免膨脹時擠壓變形。", "ext": "電線夏天受熱伸長而下垂、冬天收縮繃緊；鐵軌與地磚接縫皆為熱脹冷縮預留空間。"}, {"num": 30, "content": "在可見光衛星雲圖上，某地持續被厚而明亮的雲團覆蓋，最合理的推測為何？ (Ａ)可能有陰雨天氣 (Ｂ)一定沒有風 (Ｃ)氣壓一定最高 (Ｄ)地面一定乾燥。", "ans": "A", "topic": "衛星雲圖", "analysis": "可見光雲圖中的厚亮雲團表示雲層厚、反射日光多，因此該地可能為陰天並有降雨，但不能據此斷定氣壓或風。", "ext": "可見光雲圖靠反射日光成像，夜間無法使用；紅外線雲圖依雲頂溫度日夜皆可觀測。"}, {"num": 31, "content": "使用複式顯微鏡由低倍換成高倍觀察，通常會出現什麼變化？ (Ａ)視野變亮且範圍變大 (Ｂ)視野變暗且範圍變小 (Ｃ)影像正立且變小 (Ｄ)標本顏色一定改變。", "ans": "B", "topic": "顯微鏡操作", "analysis": "換高倍後放大率增加，但能看到的範圍變小，進入眼中的光也通常較少，所以視野較暗。", "ext": "換高倍前應先在低倍下將目標移至視野中央；高倍下僅能微調，避免壓壞玻片。"}, {"num": 32, "content": "大、小兩齒輪直接互相咬合，大齒輪順時針轉動，則小齒輪如何轉動？ (Ａ)順時針且較慢 (Ｂ)順時針且較快 (Ｃ)逆時針且較慢 (Ｄ)逆時針且較快。", "ans": "D", "topic": "齒輪傳動", "analysis": "直接咬合的兩齒輪轉向相反；小齒輪齒數較少，所以在相同時間內轉得較快。", "ext": "咬合齒輪轉速與齒數成反比，大輪帶小輪變快、省時，小輪帶大輪變慢但省力。"}, {"num": 33, "content": "椰子的果實外層具有纖維且能漂浮，最有利於藉由什麼方式傳播？ (Ａ)風力 (Ｂ)水力 (Ｃ)自身彈力 (Ｄ)昆蟲。", "ans": "B", "topic": "種子傳播", "analysis": "椰果外層纖維能保護種子並使果實漂浮，適合隨海流或水流傳播。", "ext": "蒲公英靠風、鬼針草附著動物、鳳仙花果實彈裂傳播，構造與傳播方式互相對應。"}, {"num": 34, "content": "將相同體積的木塊與鐵塊放入水中，木塊浮、鐵塊沉。下列推論何者最合理？ (Ａ)鐵塊沒有受到浮力 (Ｂ)木塊密度小於水 (Ｃ)木塊質量一定比鐵塊大 (Ｄ)水只對木塊施力。", "ans": "B", "topic": "浮力", "analysis": "物體浮在水面表示其平均密度小於水；鐵塊沉下仍受浮力，只是浮力小於其重量。", "ext": "沉在水中的物體仍受浮力，浮力等於排開水的重量；密度大於水者下沉。"}, {"num": 35, "content": "下列哪一項能源在短時間尺度內可持續補充，較屬於再生能源？ (Ａ)風能 (Ｂ)石油 (Ｃ)天然氣 (Ｄ)煤。", "ans": "A", "topic": "再生能源", "analysis": "風的動能可由持續的大氣運動補充，屬於再生能源；煤、石油與天然氣均為耗竭性化石燃料。", "ext": "太陽能、水力、地熱、潮汐皆屬再生能源；化石燃料生成需億萬年，用完難以補充。"}, {"num": 36, "content": "30 分鐘內蒸發最快的是哪一組？ (Ａ)丁 (Ｂ)乙 (Ｃ)丙 (Ｄ)甲。", "ans": "A", "topic": "蒸發實驗", "analysis": "各組起始水量皆為 100 mL，丁組剩 82 mL，蒸發量 (100-82=18) mL 最大，因此蒸發最快。", "ext": "蒸發量須由起始水量減剩餘水量求得；剩餘愈少代表蒸發愈多、速率愈快。", "gr": "第 36–40 題", "gi": "小晴研究水的蒸發快慢，把 100 mL 的水分別裝入相同淺盤，30 分鐘後測量剩餘水量。紀錄如下：\n\n組別｜水溫｜風速｜剩餘水量\n甲｜25°C｜無風｜96 mL\n乙｜45°C｜無風｜90 mL\n丙｜25°C｜微風｜92 mL\n丁｜45°C｜微風｜82 mL"}, {"num": 37, "content": "若要在無風條件下研究水溫對蒸發快慢的影響，應比較哪兩組？ (Ａ)丙與丁 (Ｂ)甲與丁 (Ｃ)乙與丙 (Ｄ)甲與乙。", "ans": "D", "topic": "變因控制", "analysis": "研究水溫時需控制風速相同，甲、乙皆無風而水溫分別為 25°C、45°C，符合單一變因原則。", "ext": "比較兩組時只能有一項條件不同，甲乙僅水溫不同，才能歸因於水溫的影響。"}, {"num": 38, "content": "若只研究風速對蒸發快慢的影響，可比較甲與哪一組？ (Ａ)乙 (Ｂ)丁 (Ｃ)丙 (Ｄ)四組皆可。", "ans": "C", "topic": "單一變因", "analysis": "研究風速須維持水溫相同；甲與丙皆為 25°C，只有無風與微風不同。", "ext": "甲丙同為25°C僅風速不同；若比較甲丁則溫度與風速同時改變，無法判斷原因。"}, {"num": 39, "content": "根據資料，下列哪一項推論最合理？ (Ａ)微風會加快蒸發 (Ｂ)升高水溫會減慢蒸發 (Ｃ)蒸發與水溫、風速都無關 (Ｄ)無風時一定不會蒸發。", "ans": "A", "topic": "資料推論", "analysis": "同溫下比較可見微風組的剩餘水量較少：丙少於甲、丁少於乙，支持微風會加快蒸發。", "ext": "蒸發隨溫度高、風速大、表面積大而加快；晾衣服選晴朗有風處正是應用。"}, {"num": 40, "content": "為使實驗公平，下列哪一項最應保持相同？ (Ａ)每組水溫 (Ｂ)每組開始時的水量與容器形狀 (Ｃ)每組風速 (Ｄ)每組剩餘水量。", "ans": "B", "topic": "公平測試", "analysis": "開始水量和容器形狀會影響可蒸發的水量及水面積，應保持相同；水溫與風速則是本實驗的操作條件。", "ext": "起始水量與容器形狀影響水面表面積，表面積不同會使蒸發量無法公平比較。"}, {"num": 41, "content": "此食物關係中的生產者是誰？ (Ａ)水草 (Ｂ)螺 (Ｃ)小魚 (Ｄ)白鷺。", "ans": "A", "topic": "生產者", "analysis": "水草可利用光能製造有機養分，是此食物關係中能量進入的生產者。", "ext": "生產者能行光合作用自製養分，是能量進入生態系的入口；藻類也是水中生產者。", "gr": "第 41–45 題", "gi": "某池塘的食物關係如下：「水草被螺與蝌蚪取食；螺與蝌蚪被小魚取食；小魚被白鷺取食。」"}, {"num": 42, "content": "小魚在此食物關係中最主要扮演什麼角色？ (Ａ)只為生產者 (Ｂ)非生物因子 (Ｃ)分解者 (Ｄ)消費者。", "ans": "D", "topic": "消費者", "analysis": "小魚取食螺與蝌蚪，必須從其他生物獲得能量，因此是消費者而非生產者或分解者。", "ext": "直接吃生產者為初級消費者；小魚吃螺與蝌蚪，屬次級消費者，白鷺階層更高。"}, {"num": 43, "content": "若農藥使螺與蝌蚪大量減少，短期內小魚最可能如何變化？ (Ａ)因食物減少而數量下降 (Ｂ)因食物增加而數量上升 (Ｃ)立刻成為生產者 (Ｄ)完全不受影響。", "ans": "A", "topic": "族群變動", "analysis": "螺與蝌蚪都是小魚的食物，兩者大量減少會使小魚食物不足，短期內數量可能下降。", "ext": "農藥會沿食物鏈累積，愈高階消費者體內濃度愈高，稱為生物放大作用。"}, {"num": 44, "content": "若白鷺數量大幅減少，其他條件不變，短期內最可能先增加的是誰？ (Ａ)水草 (Ｂ)小魚 (Ｃ)螺 (Ｄ)蝌蚪。", "ans": "B", "topic": "捕食關係", "analysis": "白鷺是小魚的捕食者，白鷺減少會使小魚受到的捕食壓力先降低，因而可能增加。", "ext": "小魚增多後螺與蝌蚪將因捕食壓力上升而減少，水草再受影響，波動逐層傳遞。"}, {"num": 45, "content": "若要判斷池塘水質是否影響蝌蚪數量，哪一項資料最有幫助？ (Ａ)池塘旁道路寬度 (Ｂ)白鷺羽毛顏色 (Ｃ)水草名稱 (Ｄ)多個池塘的水質指標與蝌蚪數量。", "ans": "D", "topic": "科學證據", "analysis": "要判斷水質是否影響蝌蚪數量，需取得多個池塘的水質指標與蝌蚪數量，才能比較兩者是否呈現一致關聯。", "ext": "多組資料若呈一致關聯才有說服力，但相關不等於因果，仍需控制變因實驗驗證。"}], "29": [{"num": 1, "content": "青蛙的受精卵通常在水中發育成蝌蚪，再變成成蛙。此過程最能說明下列哪一項？ (Ａ)生物一生的形態可能改變 (Ｂ)青蛙屬於胎生動物 (Ｃ)蝌蚪不需要呼吸 (Ｄ)成蛙只能生活在水中。", "ans": "A", "topic": "變態發育", "analysis": "青蛙由受精卵、蝌蚪到成蛙，外形與生活方式明顯改變，顯示生物的形態可隨發育階段改變。", "ext": "蝌蚪以鰓呼吸生活於水中，成蛙改用肺與皮膚呼吸；青蛙屬卵生而非胎生。"}, {"num": 2, "content": "植物葉片的氣孔除了交換氣體，也和哪一項作用最直接相關？ (Ａ)蒸散水分 (Ｂ)固定根部 (Ｃ)保護種子 (Ｄ)傳播果實。", "ans": "A", "topic": "蒸散作用", "analysis": "氣孔是葉片水蒸氣散出的主要通道，因此與蒸散作用直接相關。", "ext": "氣孔多分布於葉背，由兩個保衛細胞控制開閉，白天張開進行氣體交換與蒸散。"}, {"num": 3, "content": "下列哪一種疾病是由病毒引起？ (Ａ)瘧疾 (Ｂ)流行性感冒 (Ｃ)香港腳 (Ｄ)細菌性肺炎。", "ans": "B", "topic": "病原體種類", "analysis": "流行性感冒由流感病毒引起；瘧疾為原生生物造成，香港腳為真菌感染，另有細菌性肺炎。", "ext": "瘧疾由瘧原蟲經蚊子傳播，香港腳為真菌感染；抗生素只對細菌有效，對病毒無效。"}, {"num": 4, "content": "洋蔥表皮細胞與人的口腔皮膜細胞都具有哪一組構造？ (Ａ)細胞壁、葉綠體 (Ｂ)細胞壁、細胞膜、葉綠體 (Ｃ)細胞膜、細胞質、細胞核 (Ｄ)葉綠體、液泡。", "ans": "C", "topic": "細胞構造", "analysis": "洋蔥表皮細胞與口腔皮膜細胞都具有細胞膜、細胞質與細胞核；細胞壁只見於前者，兩者都無葉綠體。", "ext": "細胞壁與液泡為植物細胞常見構造；洋蔥表皮不見光，通常不含葉綠體。"}, {"num": 5, "content": "人吸氣時，橫膈最可能如何運動？ (Ａ)下降，使胸腔變大 (Ｂ)上升，使胸腔變小 (Ｃ)上升，使胸腔變大 (Ｄ)不動，只有肋骨運動。", "ans": "A", "topic": "呼吸運動", "analysis": "吸氣時橫膈收縮下降，使胸腔容積增大、內部氣壓降低，空氣因而進入肺部。", "ext": "呼氣時橫膈舒張上升、胸腔變小；肋骨與橫膈共同改變胸腔容積造成氣壓差。"}, {"num": 6, "content": "製作麵包時，酵母菌可分解糖並產生氣體，使麵糰膨脹。這種氣體主要是什麼？ (Ａ)氧氣 (Ｂ)氮氣 (Ｃ)氫氣 (Ｄ)二氧化碳。", "ans": "D", "topic": "發酵作用", "analysis": "酵母菌發酵糖會產生二氧化碳，氣泡困在麵糰中使其膨脹。", "ext": "檢驗二氧化碳可用澄清石灰水變混濁；發酵是微生物分解糖的化學變化。"}, {"num": 7, "content": "藍色石蕊試紙接觸白醋後，最可能出現什麼變化？ (Ａ)變藍 (Ｂ)變紅 (Ｃ)變綠 (Ｄ)不變且溶解。", "ans": "B", "topic": "酸鹼指示劑", "analysis": "白醋呈酸性，酸性溶液會使藍色石蕊試紙變紅。", "ext": "紅色石蕊遇鹼變藍；紫色高麗菜汁遇酸變紅、遇鹼變綠或黃，可自製指示劑。"}, {"num": 8, "content": "下列哪一種變化會產生新物質？ (Ａ)冰融化 (Ｂ)食鹽溶於水 (Ｃ)酒精揮發 (Ｄ)鐵釘生鏽。", "ans": "D", "topic": "化學變化", "analysis": "生鏽會形成性質不同的氧化鐵，是產生新物質的化學變化；其餘只改變狀態或分散情形。", "ext": "判斷化學變化的關鍵是有無新物質生成；溶解、融化、揮發僅是物理變化。"}, {"num": 9, "content": "要從混有少量沙子的食鹽水中依序取得沙與食鹽，最合適的方法為何？ (Ａ)先磁吸，再過濾 (Ｂ)先蒸發，再磁吸 (Ｃ)先過濾，再蒸發 (Ｄ)只需靜置。", "ans": "C", "topic": "混合物分離", "analysis": "先用過濾留下不溶於水的沙，再蒸發濾液中的水，便可取得不揮發的食鹽。", "ext": "過濾分離不溶性固體，蒸發取得溶解的鹽類；磁吸只適用於鐵等磁性物質。"}, {"num": 10, "content": "燃燒中的蠟燭用透明杯完全罩住後逐漸熄滅，最主要的原因是什麼？ (Ａ)杯內可燃物耗盡 (Ｂ)杯內氧氣逐漸不足 (Ｃ)杯內二氧化碳能助燃 (Ｄ)杯子吸走所有熱。", "ans": "B", "topic": "燃燒條件", "analysis": "燃燒需要氧氣，杯內氧氣逐漸被消耗，降到不足以支持燃燒時蠟燭便熄滅。", "ext": "燃燒三要素為可燃物、助燃物與達到燃點；滅火只需破壞其中一項即可。"}, {"num": 11, "content": "真空玻璃罩內的鬧鐘雖仍振動，外面卻幾乎聽不到聲音。此現象最能說明什麼？ (Ａ)聲音傳播需要介質 (Ｂ)真空能吸收所有振動 (Ｃ)光比聲音慢 (Ｄ)聲音不能在固體傳播。", "ans": "A", "topic": "聲音傳播", "analysis": "鬧鐘仍振動卻在抽氣後幾乎聽不到，表示聲波需透過空氣等介質傳播，不能有效通過真空。", "ext": "聲音在固體中傳播最快、液體次之、氣體最慢，真空中完全無法傳播。"}, {"num": 12, "content": "同一支鼓以更大的力量敲擊，主要會使聲音的哪一項特徵改變？ (Ａ)響度變大 (Ｂ)音色改變 (Ｃ)音調變高 (Ｄ)傳播速度變慢。", "ans": "A", "topic": "聲音三要素", "analysis": "較大力敲鼓使鼓面振幅增大，傳出的聲音能量較大，因此響度增加；音調主要由頻率決定。", "ext": "響度由振幅決定，音調由頻率決定，音色與發聲體的材質形狀有關。"}, {"num": 13, "content": "兩顆相同燈泡串聯接在一顆電池上，若其中一顆燈泡燒斷，另一顆燈泡會如何？ (Ａ)更亮 (Ｂ)仍一樣亮 (Ｃ)變暗但不熄滅 (Ｄ)熄滅。", "ans": "D", "topic": "串聯電路", "analysis": "串聯電路只有一條電流路徑，一顆燈泡燒斷即使整條通路中斷，所以另一顆也熄滅。", "ext": "並聯電路各有獨立通路，一顆燈泡損壞其餘仍可亮，家用電路多採並聯。"}, {"num": 14, "content": "要增強相同電磁鐵的磁力，下列哪一種做法最合理？ (Ａ)減少線圈圈數 (Ｂ)抽出鐵芯 (Ｃ)增加串聯電池數 (Ｄ)把導線換成棉線。", "ans": "C", "topic": "電磁鐵", "analysis": "增加同向串聯電池數可增大電流，使電磁鐵磁力增強；減少圈數或抽出鐵芯反而削弱磁力。", "ext": "增加線圈圈數、加入鐵芯或加大電流皆可增強電磁鐵磁力，斷電後磁力消失。"}, {"num": 15, "content": "指北針放在通電直導線旁發生偏轉，主要可證明什麼？ (Ａ)導線能阻隔地磁 (Ｂ)指北針會發電 (Ｃ)電池具有重力 (Ｄ)電流周圍會產生磁場。", "ans": "D", "topic": "電流磁效應", "analysis": "通電導線旁的指北針因受到磁力而偏轉，證明電流周圍會產生磁場。", "ext": "厄斯特發現通電導線使磁針偏轉；電流方向改變時，磁針偏轉方向也相反。"}, {"num": 16, "content": "以 20 牛頓向右拉木箱，摩擦力為 8 牛頓向左，木箱受到的水平合力是多少？ (Ａ)12 牛頓向右 (Ｂ)12 牛頓向左 (Ｃ)28 牛頓向右 (Ｄ)28 牛頓向左。", "ans": "A", "topic": "力的合成", "analysis": "取向右為正，水平合力為 20－8＝12 N，方向向右。", "ext": "同方向兩力相加、反方向相減；合力為零時物體保持靜止或等速運動。"}, {"num": 17, "content": "使用剪刀剪硬紙板時，把紙板移近支點會比較省力，主要原因為何？ (Ａ)施力臂縮短 (Ｂ)支點消失 (Ｃ)抗力臂縮短 (Ｄ)摩擦力必為零。", "ans": "C", "topic": "槓桿原理", "analysis": "紙板靠近剪刀支點可縮短抗力臂；在相同抗力下所需施力矩變小，因此較省力。", "ext": "施力臂大於抗力臂省力費時；抗力臂較長則費力省時，如鑷子與筷子。"}, {"num": 18, "content": "下列哪一項設計主要是為了減少摩擦力？ (Ａ)輪胎刻紋 (Ｂ)鞋底凹槽 (Ｃ)軸承中的滾珠 (Ｄ)瓶蓋刻紋。", "ans": "C", "topic": "摩擦力", "analysis": "軸承以滾珠將滑動摩擦改為較小的滾動摩擦；輪胎、鞋底和瓶蓋刻紋皆用來增加摩擦。", "ext": "滾動摩擦通常小於滑動摩擦；加潤滑油、磁浮也是減少摩擦的常見方法。"}, {"num": 19, "content": "光由空氣斜射入水中時方向改變，稱為什麼現象？ (Ａ)折射 (Ｂ)反射 (Ｃ)繞射 (Ｄ)蒸散。", "ans": "A", "topic": "光的折射", "analysis": "光斜向通過空氣與水的界面時，因傳播速率改變而偏折，稱為折射。", "ext": "筷子插入水中看似彎折、水中物體看起來變淺，皆是光折射造成的現象。"}, {"num": 20, "content": "平面鏡中的像具有哪一項特性？ (Ａ)像與物到鏡面的距離相等 (Ｂ)一定倒立 (Ｃ)一定比物體大 (Ｄ)可以投影在白紙上。", "ans": "A", "topic": "平面鏡成像", "analysis": "平面鏡形成正立、等大的虛像，物距等於像距；虛像無法投影在白紙上。", "ext": "平面鏡成正立等大的虛像且左右相反；虛像不能投影成像於屏幕上。"}, {"num": 21, "content": "冬天穿蓬鬆羽絨衣能保暖，最主要是因為衣物內保留了什麼？ (Ａ)容易導熱的水 (Ｂ)冰晶 (Ｃ)大量金屬 (Ｄ)不易導熱的空氣。", "ans": "D", "topic": "熱的傳導", "analysis": "蓬鬆羽絨間留有大量不易導熱且不易流動的空氣，可減少傳導與對流散熱。", "ext": "空氣是熱的不良導體；羽絨衣靠減少散熱保暖，並非自行產生熱量。"}, {"num": 22, "content": "在相同日照下，哪一種表面通常吸收輻射熱較多？ (Ａ)白色光滑面 (Ｂ)黑色粗糙面 (Ｃ)銀色光滑面 (Ｄ)透明玻璃面一定最少。", "ans": "B", "topic": "輻射吸熱", "analysis": "深色粗糙表面通常吸收輻射的能力較強，白色或銀色光滑面則反射較多。", "ext": "深色粗糙面吸熱快、散熱也快；太陽能熱水器集熱板常漆成黑色以多吸熱。"}, {"num": 23, "content": "地震發生時，若人在室內，較合適的第一時間行動為何？ (Ａ)立刻搭電梯下樓 (Ｂ)站在玻璃窗旁 (Ｃ)躲在堅固桌下並保護頭頸 (Ｄ)衝到陽臺邊。", "ans": "C", "topic": "防災避難", "analysis": "室內地震時應先「趴下、掩護、穩住」，躲在堅固桌下並保護頭頸，避免玻璃與掉落物傷害。", "ext": "地震口訣為趴下、掩護、穩住；搖晃停止後再依指示疏散，切勿搭乘電梯。"}, {"num": 24, "content": "地震規模與震度的主要差異為何？ (Ａ)規模只表示風速 (Ｂ)各地規模不同但震度相同 (Ｃ)同一次地震只有一個規模，但各地震度可不同 (Ｄ)震度只表示地震深度。", "ans": "C", "topic": "地震規模震度", "analysis": "規模表示地震釋放能量，同一次地震只有一個主要數值；震度表示各地搖晃程度，會隨距離和地質而異。", "ext": "規模以小數表示且無單位；震度分級表示搖晃程度，通常離震央愈近震度愈大。"}, {"num": 25, "content": "河流由山區流向平原時，坡度變緩、流速下降，最容易加強哪一種作用？ (Ａ)堆積 (Ｂ)搬運 (Ｃ)侵蝕 (Ｄ)蒸發。", "ans": "A", "topic": "河流作用", "analysis": "坡度變緩使流速與搬運能力下降，河流攜帶的泥沙較易沉降，因而加強堆積。", "ext": "上游流速快以侵蝕為主，中游以搬運為主，下游與出海口以堆積為主。"}, {"num": 26, "content": "臺灣東部地震頻繁，主要與哪兩個板塊交界有關？ (Ａ)太平洋板塊與南極板塊 (Ｂ)歐亞板塊與菲律賓海板塊 (Ｃ)印度板塊與非洲板塊 (Ｄ)北美板塊與南美板塊。", "ans": "B", "topic": "板塊構造", "analysis": "臺灣位於歐亞板塊與菲律賓海板塊交界，兩板塊相互作用使東部地震頻繁。", "ext": "板塊交界處多地震與火山；臺灣位於環太平洋地震帶上，地殼活動頻繁。"}, {"num": 27, "content": "高氣壓中心附近的空氣通常如何運動？ (Ａ)下沉，天氣較穩定 (Ｂ)上升，易形成陰雨 (Ｃ)水平靜止不動 (Ｄ)只向正東流動。", "ans": "A", "topic": "天氣系統", "analysis": "高氣壓中心常有下沉氣流，水氣較難凝結成雲，天氣通常較穩定。", "ext": "低氣壓中心空氣上升，易成雲致雨；地面風由高氣壓吹向低氣壓。"}, {"num": 28, "content": "北半球冬至時，臺灣正午太陽高度與白晝長度通常如何？ (Ａ)高度較小、白晝較短 (Ｂ)高度較大、白晝較長 (Ｃ)高度較大、白晝較短 (Ｄ)與夏至完全相同。", "ans": "A", "topic": "四季變化", "analysis": "北半球冬至時太陽直射南回歸線，臺灣正午太陽高度較小，且白晝為全年較短。", "ext": "夏至太陽直射北回歸線，臺灣白晝最長；春秋分直射赤道，晝夜約等長。"}, {"num": 29, "content": "月亮每天東升西落，最主要是受到哪一項運動影響？ (Ａ)太陽公轉地球 (Ｂ)地球公轉 (Ｃ)月球自轉 (Ｄ)地球自轉。", "ans": "D", "topic": "地球自轉", "analysis": "地球由西向東自轉，使月亮、太陽與星星每天看似由東向西移動。", "ext": "地球自轉週期約24小時造成晝夜；由西向東轉使天體視運動東升西落。"}, {"num": 30, "content": "月食最可能發生在什麼時候？ (Ａ)地球位於太陽與月球之間 (Ｂ)月球位於地球與太陽之間 (Ｃ)太陽位於地球與月球之間 (Ｄ)月球進入金星影子。", "ans": "A", "topic": "月食成因", "analysis": "月食發生時地球位於太陽與月球之間，月球進入地球影子；月球位於兩者之間則可能日食。", "ext": "月食只可能發生在農曆十五前後的滿月；日食則發生在農曆初一的新月。"}, {"num": 31, "content": "下列哪一項是保護生物多樣性的適當做法？ (Ａ)任意放生外來寵物 (Ｂ)捕捉所有掠食者 (Ｃ)保存棲地並設置生態廊道 (Ｄ)在保護區大量開路。", "ans": "C", "topic": "生物多樣性", "analysis": "保存棲地並連接被分割的棲地，可維持物種所需資源與族群交流，是保護多樣性的合適做法。", "ext": "外來種可能競爭或捕食原生種；任意放生反而破壞生態平衡，並非善舉。"}, {"num": 32, "content": "乾燥種子萌發時通常不需要下列哪一個條件？ (Ａ)適量水分 (Ｂ)強烈陽光 (Ｃ)空氣 (Ｄ)適當溫度。", "ans": "B", "topic": "種子萌發", "analysis": "多數種子萌發需要水、空氣與適當溫度，初期可用種子內養分，因此通常不需要強烈陽光。", "ext": "種子萌發初期靠子葉或胚乳的養分，不需光；長出綠葉後才行光合作用。"}, {"num": 33, "content": "植物根毛數量多且細長，最主要有何好處？ (Ａ)增加花粉數量 (Ｂ)增加吸收水與礦物質的面積 (Ｃ)直接製造種子 (Ｄ)防止葉片蒸散。", "ans": "B", "topic": "根的吸收", "analysis": "大量細長根毛可擴大根與土壤接觸面積，提高水與礦物質的吸收效率。", "ext": "小腸絨毛與肺泡也以增大表面積提高效率，與根毛概念相同可對照記憶。"}, {"num": 34, "content": "血液中的哪一種細胞主要負責運送氧氣？ (Ａ)神經細胞 (Ｂ)白血球 (Ｃ)血小板 (Ｄ)紅血球。", "ans": "D", "topic": "血液組成", "analysis": "紅血球內的血紅素能與氧結合，是血液運送氧氣的主要細胞；白血球主要防禦，血小板參與凝血。", "ext": "血紅素含鐵能與氧結合；白血球負責免疫防禦，血小板幫助止血凝血。"}, {"num": 35, "content": "比較不同肥料對豆苗高度的影響時，下列哪一項最適合作為應變變因？ (Ａ)肥料種類 (Ｂ)豆苗品種 (Ｃ)一週後豆苗高度 (Ｄ)每盆土壤量。", "ans": "C", "topic": "實驗變因", "analysis": "肥料種類是操作變因，實驗後量得的豆苗高度隨之改變，屬於應變變因。", "ext": "操作變因是刻意改變的條件，應變變因是觀測的結果，其餘條件須控制相同。"}, {"num": 36, "content": "根據結果，哪一杯導電能力最好？ (Ａ)甲 (Ｂ)乙 (Ｃ)丙 (Ｄ)丁。", "ans": "B", "topic": "溶液導電性", "analysis": "在相同檢測器下燈泡愈亮表示導電能力愈好，乙杯食鹽水使燈泡很亮，為四杯最佳。", "ext": "溶液導電靠可自由移動的離子；燈泡愈亮表示電流愈大、導電性愈好。", "gr": "第 36–40 題", "gi": "小哲把相同燈泡、電池與兩支碳棒接成檢測器，分別測試四杯等量水溶液，結果如下：\n\n水溶液｜燈泡現象\n甲：蒸餾水｜不亮\n乙：食鹽水｜很亮\n丙：糖水｜不亮\n丁：稀醋水｜微亮"}, {"num": 37, "content": "甲與丙的共同結果最能支持哪一項敘述？ (Ａ)所有透明液體都不導電 (Ｂ)溶液中有溶質就一定導電 (Ｃ)蒸餾水與糖水在此裝置下不易導電 (Ｄ)食鹽能阻止電流。", "ans": "C", "topic": "溶液導電性", "analysis": "資料只顯示蒸餾水與糖水在這套裝置下都不亮，可推知兩者不易導電；不能擴大為所有透明液體都不導電。", "ext": "糖溶於水以分子存在不解離故不導電；食鹽解離出鈉離子與氯離子而導電。"}, {"num": 38, "content": "若把乙杯再加入較多蒸餾水，並調整碳棒使浸入深度與間距維持相同，燈泡最可能如何？ (Ａ)更亮 (Ｂ)亮度可能降低 (Ｃ)一定燒毀 (Ｄ)顏色變紅但亮度不變。", "ans": "B", "topic": "濃度與導電", "analysis": "加入蒸餾水使食鹽水稀釋，單位體積內可移動離子減少，導電能力可能下降，燈泡因而變暗。", "ext": "稀釋使單位體積內離子數減少、電阻變大；蒸發濃縮則使導電性增強。"}, {"num": 39, "content": "為公平比較四杯，哪一項不必刻意相同？ (Ａ)碳棒間距 (Ｂ)電池數量 (Ｃ)溶液體積 (Ｄ)水溶液種類。", "ans": "D", "topic": "實驗變因", "analysis": "為比較不同水溶液的導電性，水溶液種類本來就是操作變因，不需相同；碳棒間距、電池和體積應控制。", "ext": "公平測試須控制其他條件相同，只讓操作變因不同，結果才具比較意義。"}, {"num": 40, "content": "若測量時乙杯的碳棒互相碰觸，這筆資料為何不可靠？ (Ａ)食鹽會消失 (Ｂ)形成不經溶液的通路 (Ｃ)碳棒會變成絕緣體 (Ｄ)電池不再有正負極。", "ans": "B", "topic": "短路現象", "analysis": "碳棒接觸會形成繞過溶液的低電阻通路，燈泡亮度便不能反映食鹽水本身的導電性。", "ext": "短路時電流改走低電阻捷徑，可能使電池發燙損壞，電路中應避免導體直接相碰。"}, {"num": 41, "content": "哪一天白晝最長？ (Ａ)三天相同 (Ｂ)乙 (Ｃ)丙 (Ｄ)甲。", "ans": "D", "topic": "晝夜長短", "analysis": "白晝長度為日落減日出：甲 13 小時 35 分、乙 12 小時、丙 10 小時 40 分，因此甲最長。", "ext": "白晝愈長代表愈接近夏至；臺灣夏至白晝約13.5小時，冬至約10.5小時。", "gr": "第 41–45 題", "gi": "某地三個節氣的日出、正午太陽高度角與日落資料如下：\n\n日期代號｜日出｜正午太陽高度角｜日落\n甲｜05:10｜88°｜18:45\n乙｜05:50｜65°｜17:50\n丙｜06:35｜42°｜17:15"}, {"num": 42, "content": "哪一天正午直立竿影最長？ (Ａ)甲 (Ｂ)乙 (Ｃ)丙 (Ｄ)無法比較。", "ans": "C", "topic": "太陽高度角", "analysis": "太陽高度愈低，同一竿子的影子愈長；丙的正午高度 42° 最小，所以竿影最長。", "ext": "太陽高度角愈大影子愈短；一天之中正午影子最短，且在臺灣大致指北。"}, {"num": 43, "content": "若此地位於臺灣，甲最可能接近哪一個節氣？ (Ａ)春分 (Ｂ)夏至 (Ｃ)秋分 (Ｄ)冬至。", "ans": "B", "topic": "節氣判斷", "analysis": "臺灣夏至附近白晝長、日出早、日落晚且正午太陽高度高，與甲的資料最相符。", "ext": "夏至太陽直射北回歸線，該線通過嘉義附近，正午太陽幾乎位於頭頂正上方。"}, {"num": 44, "content": "由甲依序變成乙、丙，最合理的趨勢為何？ (Ａ)白晝變長、正午太陽升高 (Ｂ)日出愈早、日落愈晚 (Ｃ)白晝不變、太陽降低 (Ｄ)白晝變短、正午太陽降低。", "ans": "D", "topic": "季節變化", "analysis": "由甲到丙，日出變晚、日落變早，故白晝縮短；正午太陽高度也由 88° 降到 42°。", "ext": "由夏入冬白晝漸短、正午太陽高度漸低，日出方位也由偏東北漸轉偏東南。"}, {"num": 45, "content": "要由表中計算乙的白晝長度，應使用哪一種方法？ (Ａ)日出時間加日落時間 (Ｂ)日落時間乘正午高度 (Ｃ)正午高度除以日出時間 (Ｄ)日落時間減日出時間。", "ans": "D", "topic": "晝長計算", "analysis": "白晝長度是從日出到日落的時間差，乙為 17:50－05:50＝12 小時。", "ext": "晝長等於日落時刻減日出時刻；夜長為24小時減晝長，春秋分晝夜約各半。"}], "30": [{"num": 1, "content": "蝙蝠和麻雀都會飛，但蝙蝠的翅膀主要由什麼構造形成？ (Ａ)羽毛覆蓋前肢 (Ｂ)前肢指骨間的皮膜 (Ｃ)外骨骼延伸 (Ｄ)鰓蓋變形。", "ans": "B", "topic": "動物分類", "analysis": "蝙蝠是哺乳類，翅膀由前肢延長的指骨和其間皮膜構成，並非羽毛或外骨骼。", "ext": "蝙蝠為會飛的哺乳類，胎生哺乳；鳥翼由羽毛構成，昆蟲翅是外骨骼延伸。"}, {"num": 2, "content": "種子萌發初期，尚未長出綠葉前，主要利用哪裡儲存的養分？ (Ａ)胚乳或子葉 (Ｂ)萼片 (Ｃ)根毛 (Ｄ)花瓣。", "ans": "A", "topic": "種子構造", "analysis": "萌發初期尚不能充分光合作用，胚會利用胚乳或子葉中儲存的養分生長。", "ext": "雙子葉植物如綠豆養分多存於子葉；單子葉植物如玉米、稻米存於胚乳。"}, {"num": 3, "content": "心臟、血管與血液共同組成人體的哪一個系統？ (Ａ)消化系統 (Ｂ)呼吸系統 (Ｃ)神經系統 (Ｄ)循環系統。", "ans": "D", "topic": "循環系統", "analysis": "心臟負責泵血、血管輸送血液，三者共同構成循環系統。", "ext": "血液循環運送養分、氧氣與廢物；心臟分四腔，動脈負責將血液送離心臟。"}, {"num": 4, "content": "唾液可先將食物中的哪一類養分進行初步分解？ (Ａ)澱粉 (Ｂ)脂肪 (Ｃ)蛋白質 (Ｄ)維生素。", "ans": "A", "topic": "消化作用", "analysis": "唾液中的澱粉酶可在口腔先分解部分澱粉，脂肪與蛋白質主要在後續消化道處理。", "ext": "蛋白質主要在胃開始分解；脂肪在小腸由膽汁協助乳化後再被消化。"}, {"num": 5, "content": "某草原上的兔大量增加，若其他條件不變，短期內最可能出現哪一項變化？ (Ａ)兔立刻變成生產者 (Ｂ)草量增加 (Ｃ)以兔為食的狐狸可能增加 (Ｄ)分解者完全消失。", "ans": "C", "topic": "食物鏈", "analysis": "兔增加可為狐狸提供更多食物，因此狐狸族群在一段時間後可能增加；草則可能因啃食加重而減少。", "ext": "兔增加會使草被啃食而減少；族群數量互相牽制，最終趨向新的動態平衡。"}, {"num": 6, "content": "綠色植物進行光合作用時，主要吸收哪一種氣體？ (Ａ)氧氣 (Ｂ)氮氣 (Ｃ)二氧化碳 (Ｄ)氫氣。", "ans": "C", "topic": "光合作用", "analysis": "光合作用以二氧化碳和水製造養分並釋放氧氣，因此主要吸收二氧化碳。", "ext": "光合作用在葉綠體進行，需要光、水與二氧化碳，產生養分並釋放氧氣。"}, {"num": 7, "content": "同一物種個體間存在差異，當環境改變時，具有適合特徵者較容易存活繁殖。此敘述最接近哪一概念？ (Ａ)熱脹冷縮 (Ｂ)適應與天擇 (Ｃ)水循環 (Ｄ)電磁感應。", "ans": "B", "topic": "天擇演化", "analysis": "環境會篩選原有個體差異，適合者較能留下後代，描述的是適應與自然選擇。", "ext": "天擇是環境篩選族群中既有的變異，並非生物依需求主動改變身體構造。"}, {"num": 8, "content": "下列哪一種生物的發育屬於完全變態？ (Ａ)蟋蟀 (Ｂ)蜻蜓 (Ｃ)螳螂 (Ｄ)蝴蝶。", "ans": "D", "topic": "昆蟲變態", "analysis": "蝴蝶經過卵、幼蟲、蛹、成蟲四期，幼體與成體差異大，屬完全變態；其餘沒有蛹期。", "ext": "完全變態有蛹期，如蝶、蛾、甲蟲、蚊蠅；蟋蟀與蜻蜓屬不完全變態。"}, {"num": 9, "content": "把紫色高麗菜汁加入某溶液後呈紅色，該溶液最可能是什麼？ (Ａ)石灰水 (Ｂ)白醋 (Ｃ)小蘇打水 (Ｄ)肥皂水。", "ans": "B", "topic": "酸鹼指示劑", "analysis": "紫色高麗菜汁遇酸呈紅色，白醋為酸性；石灰水、小蘇打水和肥皂水皆偏鹼性。", "ext": "紫色高麗菜汁遇鹼呈綠或黃色，中性維持紫色；石蕊遇酸變紅、遇鹼變藍。"}, {"num": 10, "content": "將小蘇打粉加入白醋後產生大量氣泡，若以澄清石灰水檢驗，最可能看到什麼？ (Ａ)石灰水結冰 (Ｂ)石灰水變成藍色 (Ｃ)石灰水變混濁 (Ｄ)完全沒有變化。", "ans": "C", "topic": "氣體檢驗", "analysis": "小蘇打與白醋反應產生二氧化碳，通入石灰水會生成白色沉澱，使其變混濁。", "ext": "二氧化碳不助燃可滅火；氧氣能使餘燼復燃，是常見的兩種氣體檢驗法。"}, {"num": 11, "content": "同樣多的砂糖分別加入冷水與熱水並以相同速度攪拌，通常哪一杯溶解較快？ (Ａ)冷水 (Ｂ)熱水 (Ｃ)速度必定相同 (Ｄ)兩杯都不會溶解。", "ans": "B", "topic": "溶解速率", "analysis": "熱水中分子運動較快，使糖粒與水接觸、擴散得較快，所以在其他條件相同時溶解較快。", "ext": "升溫、攪拌、磨細顆粒皆可加快溶解；溶解快慢與溶解度多寡是不同概念。"}, {"num": 12, "content": "密封針筒內有空氣，堵住出口再推活塞，活塞仍可推進一小段，主要說明什麼？ (Ａ)活塞不受壓力 (Ｂ)空氣沒有質量 (Ｃ)空氣會變成固體 (Ｄ)氣體可以被壓縮。", "ans": "D", "topic": "氣體性質", "analysis": "堵住出口仍能推進活塞，表示空氣體積可在受壓時縮小，即氣體具有可壓縮性。", "ext": "液體與固體幾乎不可壓縮；空氣有質量也占有空間，皆可由實驗證明。"}, {"num": 13, "content": "下列哪一項屬於物理變化？ (Ａ)木材燃燒 (Ｂ)牛奶變酸 (Ｃ)蠟受熱熔化 (Ｄ)銅幣變黑。", "ans": "C", "topic": "物理變化", "analysis": "蠟熔化只是固態變液態，物質仍是蠟；燃燒、變酸和變黑均涉及新物質生成。", "ext": "燃燒、生鏽、腐敗皆生成新物質屬化學變化；三態變化則屬物理變化。"}, {"num": 14, "content": "向東行駛的玩具車受到向西的摩擦力，若馬達推力大於摩擦力，車子會如何？ (Ａ)受到向西的合力 (Ｂ)受到向東的合力 (Ｃ)完全不受力 (Ｄ)合力必為零。", "ans": "B", "topic": "力與運動", "analysis": "馬達推力向東且大於向西摩擦力，兩力相減後合力仍向東，車會向東加速。", "ext": "合力不為零時物體速度改變；等速直線前進時合力為零，推力恰等於摩擦力。"}, {"num": 15, "content": "用定滑輪升旗的主要好處是什麼？ (Ａ)改變施力方向 (Ｂ)省一半的力 (Ｃ)減少旗子的重量 (Ｄ)增加繩子長度。", "ans": "A", "topic": "滑輪", "analysis": "理想定滑輪不省力，但可使人向下拉繩便讓旗子上升，改變施力方向。", "ext": "動滑輪隨物體移動，可省約一半力但費距離；定滑輪只改變方向不省力。"}, {"num": 16, "content": "輪軸工具中，若施力在較大的輪上、重物作用在較小的軸上，通常有何效果？ (Ａ)費力但省距離 (Ｂ)省力 (Ｃ)完全不轉動 (Ｄ)只改變物體顏色。", "ans": "B", "topic": "輪軸", "analysis": "施力作用在半徑較大的輪上，能以較長施力臂產生相同力矩，因此較省力。", "ext": "方向盤、螺絲起子皆為輪軸應用；改施力於軸、抗力在輪則費力但省距離。"}, {"num": 17, "content": "一個 60 齒齒輪帶動一個 20 齒齒輪，兩者直接咬合。大齒輪轉 1 圈時，小齒輪轉幾圈？ (Ａ)1/3 圈 (Ｂ)1 圈 (Ｃ)20 圈 (Ｄ)3 圈。", "ans": "D", "topic": "齒輪傳動", "analysis": "齒輪轉數與齒數成反比，小齒輪轉數為 60÷20＝3 圈。", "ext": "直接咬合的兩齒輪轉向相反；轉速與齒數成反比，齒數少的齒輪轉得較快。"}, {"num": 18, "content": "短跑選手穿釘鞋，主要是為了什麼？ (Ａ)增加與地面的摩擦 (Ｂ)減少與地面的摩擦 (Ｃ)減少重力 (Ｄ)增加空氣阻力。", "ans": "A", "topic": "摩擦力應用", "analysis": "釘鞋使鞋底與跑道咬合更緊，提高最大靜摩擦力，利於加速且不易滑倒。", "ext": "增加摩擦可加深紋路或增加正向力；減少摩擦可用滾輪、滾珠或潤滑油。"}, {"num": 19, "content": "彈簧秤在使用前應先檢查哪一項？ (Ａ)彈簧顏色 (Ｂ)掛鉤是否有磁性 (Ｃ)指針是否歸零 (Ｄ)刻度是否為攝氏。", "ans": "C", "topic": "測量儀器", "analysis": "彈簧秤未受力時指針應在零刻度，先檢查歸零才能避免所有測量帶有固定誤差。", "ext": "彈簧秤不可超過最大量程，讀數時視線應與指針刻度同高以避免視差。"}, {"num": 20, "content": "以相同音量吹奏長短不同的空氣柱，空氣柱愈短通常音調如何？ (Ａ)不變 (Ｂ)愈低 (Ｃ)愈高 (Ｄ)完全無聲。", "ans": "C", "topic": "音調與頻率", "analysis": "空氣柱愈短，振動頻率通常愈高，因此音調愈高；響度相同不代表音調相同。", "ext": "敲裝水瓶子時水愈多音調愈低；吹瓶口則水愈多空氣柱愈短音調愈高。"}, {"num": 21, "content": "太陽光穿過三稜鏡後分散成多種色光，稱為什麼？ (Ａ)凝結 (Ｂ)色散 (Ｃ)對流 (Ｄ)導電。", "ans": "B", "topic": "光的色散", "analysis": "白光通過三稜鏡後不同色光折射程度不同而分開，這種現象稱為色散。", "ext": "彩虹是陽光經水滴折射與反射形成的色散現象，紅光偏折最少、紫光最多。"}, {"num": 22, "content": "潛望鏡利用兩面平面鏡改變光的方向，主要應用哪一項性質？ (Ａ)光的蒸發 (Ｂ)光的傳導 (Ｃ)光的反射 (Ｄ)光的溶解。", "ans": "C", "topic": "光的反射", "analysis": "潛望鏡中的兩面平面鏡依反射定律逐次改變光路，使觀察者看到被遮擋處。", "ext": "反射定律指入射角等於反射角；萬花筒與汽車後視鏡皆利用光的反射。"}, {"num": 23, "content": "保溫瓶的雙層瓶壁中抽成近似真空，主要可減少哪兩種傳熱？ (Ａ)傳導與輻射 (Ｂ)對流與輻射 (Ｃ)傳導與對流 (Ｄ)只減少蒸發。", "ans": "C", "topic": "熱的傳播", "analysis": "真空幾乎沒有粒子進行熱傳導，也不能形成流體對流；輻射仍可穿過真空。", "ext": "保溫瓶內壁鍍銀可反射輻射熱，瓶塞減少對流散熱，三種傳熱皆被抑制。"}, {"num": 24, "content": "雷雨時先看到閃電、後聽到雷聲，最合理的原因是什麼？ (Ａ)聲音先到但耳朵較慢 (Ｂ)光不需要時間傳播 (Ｃ)雷聲由地面產生 (Ｄ)光在空氣中傳得比聲音快。", "ans": "D", "topic": "光速聲速", "analysis": "光速遠大於聲速，同時產生的閃光會先抵達觀察者，雷聲較晚到達。", "ext": "聲音在空氣中約每秒340公尺；由閃電到雷聲的秒數可估算與雷雨的距離。"}, {"num": 25, "content": "颱風中心附近的氣壓與外圍相比通常如何？ (Ａ)較高 (Ｂ)較低 (Ｃ)完全相同 (Ｄ)無法測量。", "ans": "B", "topic": "颱風", "analysis": "颱風是強烈低氣壓系統，愈接近中心氣壓通常愈低，外圍相對較高。", "ext": "颱風眼內為下沉氣流，風雨較小；眼牆附近風雨最強，不可誤判颱風已離開。"}, {"num": 26, "content": "地面天氣圖上，一條線將氣壓相同的地點連起來，稱為什麼？ (Ａ)等壓線 (Ｂ)等溫線 (Ｃ)等高線 (Ｄ)海岸線。", "ans": "A", "topic": "天氣圖判讀", "analysis": "等壓線連接同一時間氣壓相同的地點，可用來判讀高低氣壓與氣壓梯度。", "ext": "等壓線愈密集代表氣壓差愈大、風速愈強；由閉合中心可判高低氣壓。"}, {"num": 27, "content": "山區迎風坡比背風坡容易降雨，主要原因為何？ (Ａ)空氣下降升溫，水氣凝結 (Ｂ)岩石會製造水氣 (Ｃ)背風坡完全沒有空氣 (Ｄ)空氣上升冷卻，水氣凝結。", "ans": "D", "topic": "地形雨", "analysis": "潮溼空氣被山坡迫升後膨脹冷卻，水蒸氣凝結成雲雨，使迎風坡降雨較多。", "ext": "背風坡空氣下沉增溫且乾燥，形成雨影區；焚風即背風坡的乾熱風。"}, {"num": 28, "content": "海邊白天常吹海風，主要是因為白天陸地與海水受熱快慢不同。風向通常為何？ (Ａ)由海洋吹向陸地 (Ｂ)由陸地吹向海洋 (Ｃ)由高山直吹天空 (Ｄ)沒有固定但一定向北。", "ans": "A", "topic": "海陸風", "analysis": "白天陸地升溫較快，陸地上空空氣上升，較涼海面空氣便由海洋吹向陸地補充。", "ext": "夜晚陸地散熱快而較涼，改吹由陸地吹向海洋的陸風，與白天海風相反。"}, {"num": 29, "content": "岩石因日夜溫差反覆熱脹冷縮而碎裂，屬於哪一種作用？ (Ａ)搬運 (Ｂ)風化 (Ｃ)堆積 (Ｄ)火山噴發。", "ans": "B", "topic": "風化作用", "analysis": "岩石在原地因溫差反覆膨脹收縮而碎裂，屬物理風化，尚未涉及搬運。", "ext": "風化分物理與化學風化；生物根系撐裂岩石也屬風化，皆發生於原地。"}, {"num": 30, "content": "在河川下游發現顆粒小且較圓的石頭，最合理的解釋為何？ (Ａ)下游水流一定最快 (Ｂ)小石頭不受摩擦 (Ｃ)石頭在下游自行長大 (Ｄ)搬運中碰撞磨蝕且大顆粒較早沉積。", "ans": "D", "topic": "河流搬運", "analysis": "石塊搬運途中反覆碰撞磨蝕而變圓變小，水流轉弱時較大顆粒也會較早沉積。", "ext": "上游石塊大而稜角分明，下游顆粒小而圓；磨圓度可推測搬運距離長短。"}, {"num": 31, "content": "北極星看起來位置較固定，主要是因為它接近哪一個方向？ (Ａ)地球自轉軸延伸方向 (Ｂ)太陽正上方 (Ｃ)月球背面 (Ｄ)地球公轉軌道平面。", "ans": "A", "topic": "北極星", "analysis": "北極星靠近地球北端自轉軸的延伸方向，因此地球自轉時它在天空中的視位置變化很小。", "ext": "北極星位於小熊座，可利用北斗七星勺口兩星連線延長約五倍距離找到。"}, {"num": 32, "content": "觀察同一星座，隔一個月在同一時刻通常會發現它的位置如何？ (Ａ)約向東移動且完全相同 (Ｂ)約向西移動 (Ｃ)永遠固定 (Ｄ)一定消失一年。", "ans": "B", "topic": "星空變化", "analysis": "地球公轉使星空每天約提早 4 分鐘出現，因此隔一個月同一時刻星座約向西移動 30°。", "ext": "同一晚每小時星空約西移15度；週年視運動則使星座每月約西移30度。"}, {"num": 33, "content": "日食發生時，三個天體的位置關係為何？ (Ａ)太陽－地球－月球 (Ｂ)地球－太陽－月球 (Ｃ)月球－太陽－地球 (Ｄ)太陽－月球－地球。", "ans": "D", "topic": "日食成因", "analysis": "日食需月球位於太陽與地球之間，排列順序為太陽－月球－地球，月影才能落到地球。", "ext": "日食發生於農曆初一新月時；觀察日食須使用專用減光設備保護眼睛。"}, {"num": 34, "content": "在臺灣，夏至正午與冬至正午相比，直立竿影通常如何？ (Ａ)夏至較長 (Ｂ)兩者必相等 (Ｃ)夏至較短 (Ｄ)夏至沒有影子。", "ans": "C", "topic": "太陽高度角", "analysis": "夏至正午太陽高度較高，直立竿的影子較短；影子不一定完全消失。", "ext": "臺灣冬至正午影子最長且指向北方；太陽愈接近直射，正午影子愈短。"}, {"num": 35, "content": "要研究光照時間對綠豆生長的影響，下列何者應作為操作變因？ (Ａ)綠豆品種 (Ｂ)生長後的株高 (Ｃ)每盆水量 (Ｄ)每日光照時數。", "ans": "D", "topic": "實驗變因", "analysis": "實驗主動改變每日光照時數，這是操作變因；株高是應變變因，品種與水量應控制。", "ext": "一次實驗只能改變一個變因；若同時改變多項，將無法確定影響的原因。"}, {"num": 36, "content": "根據甲，左、右兩側的「砝碼數×距離」各是多少？ (Ａ)5 與 5 (Ｂ)3 與 6 (Ｃ)6 與 5 (Ｄ)6 與 6。", "ans": "D", "topic": "槓桿原理", "analysis": "甲實驗左側為 2×3＝6，右側為 3×2＝6，所以兩側「砝碼數×距離」都是 6。", "ext": "槓桿尺平衡條件為兩側砝碼數乘距離相等，對應力矩等於力乘力臂。", "gr": "第 36–40 題", "gi": "小羽使用槓桿尺，支點在中央。左側掛 2 個相同砝碼，右側改變掛法並觀察是否平衡。距離以離支點幾格表示。\n\n實驗｜左側｜右側｜結果\n甲｜2 個，距離 3 格｜3 個，距離 2 格｜平衡\n乙｜2 個，距離 3 格｜2 個，距離 2 格｜左端下降\n丙｜2 個，距離 3 格｜1 個，距離 6 格｜平衡"}, {"num": 37, "content": "乙實驗左端下降，最合理的原因為何？ (Ａ)左側力矩較大 (Ｂ)右側力矩較大 (Ｃ)兩側力矩相等 (Ｄ)支點沒有作用。", "ans": "A", "topic": "力矩比較", "analysis": "乙左側力矩比例為 2×3＝6，右側為 2×2＝4，左側較大，因此左端下降。", "ext": "力矩較大的一側會下沉；要恢復平衡可增加另一側砝碼或加長其距離。"}, {"num": 38, "content": "若左側改掛 3 個砝碼、距離 4 格，右側在距離 6 格處應掛幾個相同砝碼才能平衡？ (Ａ)1 個 (Ｂ)4個 (Ｃ)3 個 (Ｄ)2 個。", "ans": "D", "topic": "槓桿計算", "analysis": "平衡時兩側力矩相等，左側為 3×4＝12；右側距離 6 格，需 12÷6＝2 個砝碼。", "ext": "平衡計算先求一側力矩，再除以另一側距離即得所需砝碼數，單位須一致。"}, {"num": 39, "content": "丙實驗中，右側砝碼較少卻能平衡，是因為什麼？ (Ａ)右側抗力臂較長 (Ｂ)左側距離為零 (Ｃ)支點偏向右側 (Ｄ)右側砝碼沒有重量。", "ans": "A", "topic": "槓桿平衡", "analysis": "丙右側只有 1 個砝碼，但距支點 6 格，較長力臂使其力矩等於左側的 2×3。", "ext": "力臂加倍可使所需力量減半；蹺蹺板上體重較輕者坐遠端即可取得平衡。"}, {"num": 40, "content": "上述實驗最能支持哪一項槓桿平衡規律？ (Ａ)兩側砝碼數必須相同 (Ｂ)兩側距離必須相同 (Ｃ)兩側「力×力臂」相等 (Ｄ)距離愈短一定下降。", "ans": "C", "topic": "槓桿規律", "analysis": "甲、丙的平衡資料皆顯示兩側「力×力臂」相等，力與距離本身不必各自相同。", "ext": "阿基米德槓桿原理：力與力臂乘積相等即平衡，兩側力或距離不必各自相同。"}, {"num": 41, "content": "甲最可能是哪一種岩石？ (Ａ)花崗岩 (Ｂ)石灰岩 (Ｃ)浮石 (Ｄ)大理岩。", "ans": "A", "topic": "岩石辨識", "analysis": "甲具有可見的黑、白、透明礦物顆粒且堅硬，符合由岩漿地下緩慢冷卻形成的花崗岩特徵。", "ext": "花崗岩為深成火成岩，岩漿在地下緩慢冷卻使晶體粗大可見，常用作建材。", "gr": "第 41–45 題", "gi": "學生檢測四種岩石，結果如下：\n\n岩石｜顆粒或構造｜滴稀酸｜其他特徵\n甲｜可見黑、白、透明顆粒｜無明顯反應｜堅硬\n乙｜有層理，夾有貝殼化石｜產生氣泡｜較軟\n丙｜有許多孔洞｜無明顯反應｜顏色深\n丁｜晶體緊密，紋理美觀｜產生氣泡｜可拋光"}, {"num": 42, "content": "乙的形成環境最可能與哪一項有關？ (Ａ)岩漿快速冷卻 (Ｂ)金屬熔化 (Ｃ)生物遺骸沉積 (Ｄ)冰直接凝華。", "ans": "C", "topic": "沉積岩", "analysis": "乙有層理與貝殼化石，表示生物遺骸與沉積物曾逐層沉積，並含可與酸反應的碳酸鹽。", "ext": "石灰岩主成分為碳酸鈣，遇稀酸起泡放出二氧化碳；層理與化石為沉積岩特徵。"}, {"num": 43, "content": "丙具有許多孔洞，最可能如何形成？ (Ａ)河水把所有礦物溶光 (Ｂ)岩漿中的氣體逸出後冷卻 (Ｃ)強風吹入空氣 (Ｄ)動物啃咬。", "ans": "B", "topic": "火成岩", "analysis": "含氣泡的岩漿冷卻時，氣體逸出後留下孔洞，可形成多孔的火山岩。", "ext": "浮石多孔質輕可浮於水面；玄武岩與安山岩亦為岩漿冷卻形成的火成岩。"}, {"num": 44, "content": "丁最可能是哪一種岩石？ (Ａ)砂岩 (Ｂ)頁岩 (Ｃ)礫岩 (Ｄ)大理岩。", "ans": "D", "topic": "變質岩", "analysis": "丁晶體緊密、紋理美觀、可拋光又能與酸反應，符合石灰岩變質形成的大理岩。", "ext": "大理岩由石灰岩變質而成，頁岩可變質成板岩；變質作用需高溫高壓。"}, {"num": 45, "content": "只依表中資料，下列哪一項推論最合理？ (Ａ)會與稀酸反應的岩石可能含碳酸鹽成分 (Ｂ)有孔洞的岩石一定含化石 (Ｃ)所有堅硬岩石都會冒氣泡 (Ｄ)有層理的岩石一定由岩漿形成。", "ans": "A", "topic": "科學推論", "analysis": "乙、丁都遇稀酸產生氣泡，因此可合理推測含碳酸鹽成分；其他選項都把特徵過度推廣為「一定」。", "ext": "科學推論應依據證據，避免以「一定」過度推廣，僅能說可能或傾向。"}], "31": [{"num": 1, "content": "水筆仔的種子在母樹上先發芽，再掉入泥灘，這種特性最有利於適應哪種環境？ (Ａ)高山針葉林 (Ｂ)乾燥沙漠 (Ｃ)河口溼地 (Ｄ)極地冰原。", "ans": "C", "topic": "生物適應", "analysis": "水筆仔的胎生苗落下後可迅速插入或固定於潮間帶泥灘，減少被潮水沖走的機會。", "ext": "水筆仔屬紅樹林植物，胎生苗與排鹽構造皆為適應高鹽缺氧泥灘的特徵。"}, {"num": 2, "content": "魚的鰓具有許多細小鰓絲，最主要的好處是什麼？ (Ａ)發出聲音 (Ｂ)增加氣體交換面積 (Ｃ)儲存大量脂肪 (Ｄ)保護魚卵。", "ans": "B", "topic": "呼吸構造", "analysis": "大量細小鰓絲能擴大鰓與水接觸的表面積，提高氧、二氧化碳交換效率。", "ext": "肺泡眾多、小腸絨毛密布同樣是以增加表面積提升交換或吸收效率的例子。"}, {"num": 3, "content": "鳥類骨骼中部分骨頭中空，對飛行最直接的幫助為何？ (Ａ)減輕身體重量 (Ｂ)使羽毛防水 (Ｃ)增加消化速度 (Ｄ)增加體溫。", "ans": "A", "topic": "飛行適應", "analysis": "部分骨骼中空可在維持支撐的同時減輕體重，降低飛行所需能量。", "ext": "鳥類尚有氣囊輔助呼吸、胸肌發達與流線型身體等構造配合飛行需求。"}, {"num": 4, "content": "花粉由雄蕊傳到同種花的柱頭，稱為什麼？ (Ａ)授粉 (Ｂ)蒸散 (Ｃ)結果 (Ｄ)萌發。", "ans": "A", "topic": "授粉作用", "analysis": "花粉從雄蕊的花藥移到同種花柱頭稱為授粉；受精則發生在花粉管把精細胞送至胚珠之後。", "ext": "授粉後花粉管把精細胞送入胚珠才完成受精，授粉與受精是不同步驟。"}, {"num": 5, "content": "食物網比單一食物鏈更能描述自然界，主要是因為什麼？ (Ａ)分解者不屬於生態系 (Ｂ)多條取食關係彼此交織 (Ｃ)生物通常只有一種食物 (Ｄ)能量會循環不減少。", "ans": "B", "topic": "食物網", "analysis": "自然界的生物常有多種食物與天敵，多條食物鏈彼此交織才形成較真實的食物網。", "ext": "食物鏈起點是生產者；能量沿食物網流動會逐級遞減，無法循環回收。"}, {"num": 6, "content": "若海洋中的大型藻類大量減少，最先直接受影響的可能是哪一類生物？ (Ａ)所有肉食動物立刻增加 (Ｂ)岩石 (Ｃ)以藻類為食的動物 (Ｄ)海水鹽分必歸零。", "ans": "C", "topic": "生態平衡", "analysis": "以大型藻類為食的動物直接失去食物來源，會最先受到影響；肉食動物的影響較間接。", "ext": "生產者減少會先影響植食動物，再沿食物網波及肉食動物，屬連鎖效應。"}, {"num": 7, "content": "人體運動後呼吸與心跳加快，主要是為了什麼？ (Ａ)供應細胞更多氧並帶走二氧化碳 (Ｂ)降低所有細胞代謝 (Ｃ)將血液變成空氣 (Ｄ)讓骨骼停止活動。", "ans": "A", "topic": "呼吸循環調節", "analysis": "運動時細胞呼吸加強，需要更多氧氣並產生更多二氧化碳，因此呼吸與循環速率提高。", "ext": "運動時心跳呼吸加快屬人體恆定性調節，休息後會逐漸恢復安靜值。"}, {"num": 8, "content": "白血球數量在感染時可能增加，最主要與哪一功能有關？ (Ａ)運送氧氣 (Ｂ)幫助血液凝固 (Ｃ)防禦病原體 (Ｄ)運送尿液。", "ans": "C", "topic": "血液組成", "analysis": "白血球能辨識、吞噬或協助消滅病原體，所以感染時數量可能上升；紅血球與血小板功能不同。", "ext": "紅血球運送氧氣、血小板幫助凝血、血漿運送養分與廢物，功能各不相同。"}, {"num": 9, "content": "同一杯飽和食鹽水在室溫下再加入少量食鹽並攪拌，最可能出現什麼現象？ (Ａ)食鹽全部立刻溶解 (Ｂ)水全部凝固 (Ｃ)產生氧氣 (Ｄ)部分食鹽沉在杯底。", "ans": "D", "topic": "飽和溶液", "analysis": "飽和溶液在該溫度已達最大溶解量，再加食鹽也不能全溶，未溶部分會留在杯底。", "ext": "攪拌與研磨只加快溶解速率，不改變溶解度；升溫才可能提高溶解量。"}, {"num": 10, "content": "將熱的飽和糖水冷卻後出現晶體，這種分離物質的方法稱為什麼？ (Ａ)過濾 (Ｂ)磁選 (Ｃ)結晶 (Ｄ)燃燒。", "ans": "C", "topic": "結晶分離", "analysis": "熱飽和糖水冷卻後溶解度降低，多餘溶質排列成晶體析出，這種方法稱為結晶。", "ext": "過濾分離不溶固體與液體；結晶利用溶解度隨溫度下降使溶質析出。"}, {"num": 11, "content": "下列哪一項是二氧化碳的性質或用途？ (Ａ)能使帶火星木條復燃 (Ｂ)是空氣中含量最多的氣體 (Ｃ)可供人直接呼吸 (Ｄ)可用於部分滅火器。", "ans": "D", "topic": "二氧化碳性質", "analysis": "二氧化碳不助燃，部分滅火器用它隔絕或稀釋氧氣；能使帶火星木條復燃的是氧氣。", "ext": "二氧化碳可使澄清石灰水變混濁，密度比空氣大且不助燃也不可燃。"}, {"num": 12, "content": "氧氣瓶應遠離油脂與火源，主要因為氧氣具有什麼性質？ (Ａ)助燃性 (Ｂ)可燃性 (Ｃ)酸性 (Ｄ)強磁性。", "ans": "A", "topic": "氧氣助燃", "analysis": "氧氣本身不屬可燃物，但會使燃燒更旺盛，因此油脂與火源附近使用高濃度氧氣很危險。", "ext": "氧氣助燃但本身不可燃；可燃物、助燃物與溫度達燃點是燃燒三要素。"}, {"num": 13, "content": "一杯透明液體蒸發後留下白色晶體，可合理推測原液體可能是什麼？ (Ａ)純水 (Ｂ)酒精 (Ｃ)食鹽水 (Ｄ)食用油。", "ans": "C", "topic": "溶液蒸發", "analysis": "水蒸發後若留下白色晶體，表示原液中含不揮發的溶質，食鹽水符合這項特徵。", "ext": "純水與酒精蒸發不留殘渣；糖水蒸發留下的固體加熱易焦黑可資區別。"}, {"num": 14, "content": "小球從斜坡高處滾下，重力使它加速。重力屬於哪一類力？ (Ａ)接觸力 (Ｂ)摩擦力 (Ｃ)彈力 (Ｄ)超距力。", "ans": "D", "topic": "超距力", "analysis": "重力不需物體彼此接觸即可作用，屬超距力；摩擦力與彈力則需接觸。", "ext": "磁力與靜電力也屬超距力；摩擦力、彈力、繩張力則屬接觸力。"}, {"num": 15, "content": "兩人拔河僵持不動，甲向左拉 300 牛頓，繩子近似靜止，乙向右的拉力最可能是多少？ (Ａ)150 牛頓 (Ｂ)300 牛頓 (Ｃ)0 牛頓 (Ｄ)600 牛頓。", "ans": "B", "topic": "二力平衡", "analysis": "繩子近似靜止表示水平合力為零，所以乙的拉力須與甲大小相等、方向相反，即 300 N 向右。", "ext": "靜止物體所受合力為零；二力平衡須大小相等、方向相反且在同一直線上。"}, {"num": 16, "content": "腳踏車煞車時，煞車皮壓住輪圈使車停下，主要利用哪一種作用？ (Ａ)增加摩擦 (Ｂ)增加浮力 (Ｃ)減少摩擦 (Ｄ)消除重力。", "ans": "A", "topic": "摩擦力應用", "analysis": "煞車皮壓緊輪圈會增加摩擦力，使車輪轉動減慢並將動能轉為熱。", "ext": "輪胎刻紋、鞋底花紋是增加摩擦；加潤滑油、裝滾輪則是減少摩擦的例子。"}, {"num": 17, "content": "使用鑷子夾物體時，施力點位於支點與抗力點之間，通常有何特性？ (Ａ)費力但可放大移動距離 (Ｂ)省力 (Ｃ)既省力又省距離 (Ｄ)沒有支點。", "ans": "A", "topic": "槓桿原理", "analysis": "鑷子屬施力點在支點與抗力點之間的第三類槓桿，通常費力，但末端能得到較大的移動距離與速度。", "ext": "筷子與釣竿同為費力槓桿；施力臂長於抗力臂時才會省力。"}, {"num": 18, "content": "理想輪軸的輪半徑是軸半徑的 4 倍，施力在輪上時，理論上所需力約為抗力的多少？ (Ａ)4 倍 (Ｂ)2 倍 (Ｃ)1/4 (Ｄ)1/2。", "ans": "C", "topic": "輪軸原理", "analysis": "輪軸平衡為施力×輪半徑＝抗力×軸半徑；輪半徑為軸的 4 倍，所以施力為抗力的 1/4。", "ext": "施力於輪可省力但須轉更多距離，方向盤與螺絲起子皆屬此類應用。"}, {"num": 19, "content": "同一根彈簧超過彈性限度後卸下重物，最可能如何？ (Ａ)可能無法恢復原長 (Ｂ)一定恢復原長 (Ｃ)立刻變成磁鐵 (Ｄ)質量變為零。", "ans": "A", "topic": "彈性限度", "analysis": "超過彈性限度會造成永久形變，卸下重物後彈簧可能不能恢復原長。", "ext": "彈性限度內彈簧伸長量與外力成正比，即虎克定律；超限則永久變形。"}, {"num": 20, "content": "把尺的一端壓在桌邊，露出部分愈短，撥動後發出的音調通常如何？ (Ａ)愈低 (Ｂ)響度一定為零 (Ｃ)音色必與鼓相同 (Ｄ)愈高。", "ans": "D", "topic": "音調與頻率", "analysis": "尺露出部分愈短，振動頻率愈高，因此音調愈高；響度則主要由振幅決定。", "ext": "振動體愈短、愈細、愈緊，頻率愈高音調愈高；振幅大小則決定響度。"}, {"num": 21, "content": "月球表面無法直接傳遞一般說話聲，主要原因是什麼？ (Ａ)月光太強 (Ｂ)沒有足夠空氣作為介質 (Ｃ)月球沒有重力 (Ｄ)月球溫度太低。", "ans": "B", "topic": "聲音傳播", "analysis": "一般說話聲是機械波，需要空氣等物質傳遞振動；月球表面近似真空，無足夠介質。", "ext": "聲音在固體中傳播通常最快，液體次之，氣體最慢，真空完全不能傳聲。"}, {"num": 22, "content": "放大鏡使用的鏡片屬於哪一種？ (Ａ)凹透鏡 (Ｂ)平面鏡 (Ｃ)凸透鏡 (Ｄ)凸面鏡。", "ans": "C", "topic": "凸透鏡成像", "analysis": "放大鏡使用凸透鏡，物體位於焦距內時可形成正立放大的虛像。", "ext": "物體在焦距內成正立放大虛像；在焦距外可成倒立實像，如照相機成像。"}, {"num": 23, "content": "白光照在藍色物體上，物體看起來是藍色，最合理的解釋為何？ (Ａ)主要反射藍光 (Ｂ)自行製造藍光 (Ｃ)白光不含藍光 (Ｄ)吸收藍光並反射所有其他光。", "ans": "A", "topic": "物體顏色", "analysis": "白光含多種色光，藍色物體主要反射藍光並吸收其餘大部分色光，所以看起來呈藍色。", "ext": "不透明物體顏色由反射光決定；透明物體顏色則由透過的色光決定。"}, {"num": 24, "content": "金屬鍋柄比陶瓷鍋柄更容易燙手，主要因為金屬的哪一項性質？ (Ａ)沒有熱脹冷縮 (Ｂ)導熱較快 (Ｃ)密度一定較小 (Ｄ)不會吸收熱。", "ans": "B", "topic": "熱傳導", "analysis": "金屬熱傳導較快，鍋中熱量較快沿鍋柄傳到手；陶瓷導熱較慢。", "ext": "金屬是熱的良導體；木頭、陶瓷、空氣導熱慢，常用作隔熱材料。"}, {"num": 25, "content": "冰塊浮在水面上，可推知冰的密度與液態水相比如何？ (Ａ)較大 (Ｂ)較小 (Ｃ)完全相同 (Ｄ)無法由浮沉判斷。", "ans": "B", "topic": "浮力與密度", "analysis": "物體能浮在液體表面，表示其平均密度小於液體，因此冰的密度比液態水小。", "ext": "冰山約十分之九體積沒入水中；冰熔化成水後體積縮小、密度變大。"}, {"num": 26, "content": "高山上氣壓比平地低，密封零食袋帶上高山後常膨脹，主要原因為何？ (Ａ)袋內食物產生大量氧氣 (Ｂ)塑膠質量增加 (Ｃ)袋外氣壓降低 (Ｄ)高山重力消失。", "ans": "C", "topic": "氣壓與體積", "analysis": "上高山後袋外大氣壓降低，密封袋內氣體相對向外膨脹，使零食袋鼓起。", "ext": "氣體體積隨外界壓力降低而膨脹；上高山耳朵不適也與氣壓變化有關。"}, {"num": 27, "content": "空氣中的水蒸氣直接變成霜，屬於哪一種狀態變化？ (Ａ)蒸發 (Ｂ)凝華 (Ｃ)凝固 (Ｄ)熔化。", "ans": "B", "topic": "凝華現象", "analysis": "水蒸氣由氣態直接變成固態冰晶，未經液態，稱為凝華。", "ext": "霜由凝華形成、露由凝結形成；固態直接變氣態則稱昇華，如乾冰。"}, {"num": 28, "content": "氣象報告顯示等壓線排列愈密集，通常表示該區域可能如何？ (Ａ)氣壓差小、風弱 (Ｂ)完全無雲 (Ｃ)氣壓差大、風較強 (Ｄ)一定發生地震。", "ans": "C", "topic": "等壓線判讀", "analysis": "等壓線愈密表示單位距離內氣壓差愈大，氣壓梯度大時風通常較強。", "ext": "風由高壓吹向低壓，等壓線愈密氣壓梯度愈大、風速通常愈強。"}, {"num": 29, "content": "地下水被長期超量抽取，最可能造成什麼問題？ (Ａ)火山噴發 (Ｂ)地層下陷 (Ｃ)極光 (Ｄ)月食。", "ans": "B", "topic": "地層下陷", "analysis": "過量抽取地下水會使地層孔隙壓力降低並壓密，長期可能造成地層下陷。", "ext": "臺灣西南沿海因超抽地下水發生地層下陷，易加劇淹水與海水倒灌。"}, {"num": 30, "content": "河流出海口形成三角洲，主要是因為哪一種作用？ (Ａ)侵蝕 (Ｂ)搬運 (Ｃ)堆積 (Ｄ)蒸發。", "ans": "C", "topic": "流水作用", "analysis": "河水進入海洋後流速下降，搬運能力減弱，泥沙在出海口堆積形成三角洲。", "ext": "流速快處以侵蝕搬運為主，流速慢處以堆積為主；上游侵蝕、下游堆積。"}, {"num": 31, "content": "夏季大三角不包含下列哪一顆星？ (Ａ)織女星 (Ｂ)天狼星 (Ｃ)天津四 (Ｄ)牛郎星。", "ans": "B", "topic": "夏季星空", "analysis": "夏季大三角由織女星、牛郎星與天津四組成，天狼星是冬季著名亮星。", "ext": "織女屬天琴座、牛郎屬天鷹座、天津四屬天鵝座；天狼星屬大犬座冬季可見。"}, {"num": 32, "content": "星座在一夜中看似由東向西移動，主要原因為何？ (Ａ)地球由東向西公轉 (Ｂ)星星繞月球公轉 (Ｃ)太陽每天繞地球 (Ｄ)地球由西向東自轉。", "ans": "D", "topic": "天體視運動", "analysis": "地球由西向東自轉，使整片星空在一夜中呈現由東向西的日周視運動；星星繞月球並不是此現象的原因。", "ext": "太陽東升西落同樣因地球自轉；星空每小時約向西移動十五度。"}, {"num": 33, "content": "在農曆初七、初八傍晚常見的半月，最可能是什麼月相？ (Ａ)新月 (Ｂ)滿月 (Ｃ)下弦月 (Ｄ)上弦月。", "ans": "D", "topic": "月相變化", "analysis": "農曆初七、初八約為上弦月，傍晚可見右半側明亮的半月；下弦月約在二十二、二十三。", "ext": "上弦月傍晚位於南方天空、午夜西沉；下弦月午夜東升、清晨在南方。"}, {"num": 34, "content": "若面向北極星，右手邊大致是哪一方？ (Ａ)西方 (Ｂ)南方 (Ｃ)北方 (Ｄ)東方。", "ans": "D", "topic": "方位辨識", "analysis": "面向北方時，右側為東方、左側為西方，因此面向北極星時右手邊大致是東方。", "ext": "北極星位於正北方，仰角約等於當地緯度，可由北斗七星斗口延伸尋找。"}, {"num": 35, "content": "研究不同紙張吸水性時，下列哪一項做法最能提高測量可靠度？ (Ａ)每種紙只測一次 (Ｂ)每次滴不同水量 (Ｃ)多次重複並取平均值 (Ｄ)同時改變紙張大小。", "ans": "C", "topic": "實驗設計", "analysis": "在相同條件下多次重複並取平均，可降低偶然誤差；只測一次或同時改變條件不可靠。", "ext": "重複測量取平均可減少偶然誤差；控制變因相同才能公平比較結果。"}, {"num": 36, "content": "哪一接法中兩顆燈泡各自形成不同支路？ (Ａ)甲 (Ｂ)丙 (Ｃ)乙 (Ｄ)丁。", "ans": "B", "topic": "並聯電路", "analysis": "丙為兩顆燈泡並聯，各燈泡位於一條不同支路；乙的兩燈則在同一路徑上串聯。", "ext": "並聯各支路電壓相同、可獨立通電；家庭電器多採並聯方式連接。", "gr": "第 36–40 題", "gi": "小宇以相同電池和燈泡測試四種接法，結果如下：\n\n接法｜電池｜燈泡連接｜結果\n甲｜1 顆｜1 顆燈泡｜正常發亮\n乙｜1 顆｜2 顆相同燈泡串聯｜兩燈都較暗\n丙｜1 顆｜2 顆相同燈泡並聯｜兩燈亮度接近甲\n丁｜2 顆同向串聯｜1 顆燈泡｜比甲亮很多"}, {"num": 37, "content": "乙中的一顆燈泡若燒斷，另一顆會如何？ (Ａ)更亮 (Ｂ)閃爍 (Ｃ)亮度不變 (Ｄ)熄滅。", "ans": "D", "topic": "串聯電路", "analysis": "乙為串聯電路，一顆燈泡燒斷會使唯一通路中斷，因此另一顆也熄滅。", "ext": "串聯電路只有一條通路，任一處斷路整個電路便無電流通過。"}, {"num": 38, "content": "丙中的一顆燈泡若燒斷，另一顆最可能如何？ (Ａ)立刻爆裂 (Ｂ)一定熄滅 (Ｃ)變成電池 (Ｄ)仍可發亮。", "ans": "D", "topic": "並聯特性", "analysis": "丙為並聯電路，各支路可獨立形成通路，一支路斷路時另一燈仍能發亮。", "ext": "並聯一支路斷路不影響其他支路，住宅插座採並聯以便各自獨立使用。"}, {"num": 39, "content": "丁比甲亮很多且燈泡可能容易損壞，最合理的原因為何？ (Ａ)電池串聯使供電效果增強 (Ｂ)導線變成絕緣體 (Ｃ)電路未閉合 (Ｄ)燈泡數變多。", "ans": "A", "topic": "電池串聯", "analysis": "兩顆同向串聯電池使供電電壓提高，燈泡電流增大而更亮，也更可能超過額定條件損壞。", "ext": "電池串聯電壓相加使燈更亮；電池並聯電壓不變但可供電較久。"}, {"num": 40, "content": "根據表格，下列哪一項敘述正確？ (Ａ)並聯支路可各自工作 (Ｂ)串聯兩燈通常比單燈亮 (Ｃ)電池愈多燈泡一定愈安全 (Ｄ)電路斷開燈泡仍會亮。", "ans": "A", "topic": "電路判讀", "analysis": "並聯各支路可獨立工作；表中也顯示串聯兩燈較暗，且增加電池不必然安全。", "ext": "串聯燈泡愈多愈暗；並聯支路愈多電池消耗愈快，使用時須注意負載。"}, {"num": 41, "content": "哪位學生運動後立即脈搏增加最多？ (Ａ)甲 (Ｂ)丁 (Ｃ)丙 (Ｄ)乙。", "ans": "D", "topic": "脈搏測量", "analysis": "脈搏增加量分別為甲 54、乙 60、丙 50、丁 56 次／分鐘，乙增加最多。", "ext": "脈搏由心跳產生，可在手腕橈動脈或頸部頸動脈處測得次數。", "gr": "第 41–45 題", "gi": "四位學生安靜坐 5 分鐘後量脈搏，再踏階 2 分鐘，結果如下（單位：次／分鐘）：\n\n學生｜安靜時｜運動後立即｜休息 5 分鐘後\n甲｜72｜126｜78\n乙｜80｜140｜92\n丙｜68｜118｜70\n丁｜76｜132｜84"}, {"num": 42, "content": "哪位學生休息 5 分鐘後的脈搏最接近原本安靜值？ (Ａ)甲 (Ｂ)乙 (Ｃ)丁 (Ｄ)丙。", "ans": "D", "topic": "數據比較", "analysis": "休息值與安靜值的差分別為甲 6、乙 12、丙 2、丁 8，丙的差距最小。", "ext": "比較恢復程度應計算休息值與安靜值的差距，而非只看數值大小。"}, {"num": 43, "content": "由資料可得到哪一項共同趨勢？ (Ａ)運動後脈搏都下降 (Ｂ)休息後都低於安靜值 (Ｃ)運動後立即脈搏都上升 (Ｄ)四人脈搏完全相同。", "ans": "C", "topic": "趨勢判讀", "analysis": "四人的運動後立即脈搏都高於安靜值，這是表格共同呈現的趨勢。", "ext": "歸納共同趨勢須所有數據皆支持；出現單一例外即不能稱為共同趨勢。"}, {"num": 44, "content": "若要公平比較四人的恢復情形，下列哪一項最重要？ (Ａ)踏階時間與強度相同 (Ｂ)使用不同計時方式 (Ｃ)穿不同鞋子 (Ｄ)各自在不同日測量且不記錄環境。", "ans": "A", "topic": "公平測試", "analysis": "恢復情形要公平比較，四人的運動時間與強度必須一致，否則脈搏差異可能來自運動量不同。", "ext": "公平測試須只改變一項操縱變因，其餘條件如時間與強度皆須相同。"}, {"num": 45, "content": "根據表中資料，下列哪一項無法直接推論？ (Ａ)丙休息後最接近安靜值 (Ｂ)乙運動後立即脈搏最高 (Ｃ)四人休息後脈搏均低於運動後立即值 (Ｄ)運動會使所有人的體溫下降。", "ans": "D", "topic": "推論與證據", "analysis": "表格只記錄脈搏，沒有體溫資料，因此無法推論運動會使所有人體溫下降；其餘皆可直接由數值比較。", "ext": "結論不能超出資料範圍；未測量的項目不可直接推論，避免過度延伸。"}], "32": [{"num": 1, "content": "仙人掌肥厚的綠色莖可行光合作用並儲水，這主要是對哪種環境的適應？ (Ａ)乾旱少雨 (Ｂ)終年冰凍 (Ｃ)深海無光 (Ｄ)河口潮間帶。", "ans": "A", "topic": "沙漠植物適應", "analysis": "肥厚莖能儲水並代替退化的葉行光合作用，可減少乾旱環境中的水分散失。", "ext": "仙人掌的葉退化成針刺可減少蒸散並具保護作用，由綠色莖代行光合作用。"}, {"num": 2, "content": "蕨類植物不開花也不形成種子，主要利用什麼繁殖？ (Ａ)鳥卵 (Ｂ)果實 (Ｃ)胞子 (Ｄ)花粉管。", "ans": "C", "topic": "蕨類繁殖", "analysis": "蕨類不形成花、果實和種子，而是在葉片背面等處產生胞子繁殖。", "ext": "蕨類具維管束，孢子囊常聚生於葉背；苔蘚也以孢子繁殖但無維管束。"}, {"num": 3, "content": "一朵花受精後，胚珠通常發育成什麼？ (Ａ)果皮 (Ｂ)萼片 (Ｃ)花瓣 (Ｄ)種子。", "ans": "D", "topic": "果實與種子", "analysis": "被子植物受精後，胚珠發育成種子，子房通常發育成果實。", "ext": "子房發育成果實、胚珠發育成種子；胚珠數目影響果實內種子數量。"}, {"num": 4, "content": "蜜蜂採蜜時也替花傳粉，蜜蜂與開花植物的關係最接近哪一項？ (Ａ)植物受益、蜜蜂必受害 (Ｂ)蜜蜂受益、植物必受害 (Ｃ)雙方皆可能受益 (Ｄ)雙方完全無關。", "ans": "C", "topic": "互利共生", "analysis": "蜜蜂得到花蜜作食物，植物則由蜜蜂協助傳粉，雙方都可能受益，屬互利關係。", "ext": "小丑魚與海葵亦屬互利；寄生則一方受益一方受害，如蛔蟲與人。"}, {"num": 5, "content": "生態系中的能量最初多由哪一來源進入？ (Ａ)太陽 (Ｂ)土壤 (Ｃ)月球 (Ｄ)分解者。", "ans": "A", "topic": "能量流動", "analysis": "生產者以光合作用把太陽能轉成化學能，因此生態系中的能量多由太陽進入。", "ext": "能量沿食物鏈單向流動且逐級遞減，物質則可經分解者循環利用。"}, {"num": 6, "content": "把落葉裝入密閉透明袋並保持潮溼，過一段時間落葉腐爛。主要參與分解的是誰？ (Ａ)陽光與月光 (Ｂ)岩石與砂粒 (Ｃ)細菌與真菌 (Ｄ)氧氣與氮氣本身。", "ans": "C", "topic": "分解者", "analysis": "細菌與真菌可分解落葉中的有機物，是落葉腐爛的主要生物因子；潮溼有利其活動。", "ext": "分解者將有機物分解成簡單物質歸還環境，促成生態系的物質循環。"}, {"num": 7, "content": "人體吸收後的養分主要經由哪一系統運送到全身？ (Ａ)生殖系統 (Ｂ)骨骼系統 (Ｃ)循環系統 (Ｄ)感覺系統。", "ans": "C", "topic": "循環系統", "analysis": "養分經小腸吸收進入血液後，由循環系統隨血液運送到全身細胞。", "ext": "小腸絨毛吸收養分進入血液；氧氣由紅血球中的血紅素負責運送。"}, {"num": 8, "content": "完成某種疫苗接種後，再接觸對應病原時，免疫系統通常能較快反應，主要因為？ (Ａ)身體已建立對該病原的免疫記憶 (Ｂ)體內所有微生物已永久消失 (Ｃ)疫苗直接補充紅血球 (Ｄ)體溫會永久降低。", "ans": "A", "topic": "免疫記憶", "analysis": "疫苗使免疫系統先辨識特定抗原並建立記憶細胞，再遇同一病原時便能較快、較強地反應。", "ext": "疫苗屬主動免疫，以減毒或不活化的抗原誘發身體產生記憶細胞。"}, {"num": 9, "content": "將酚紅等適當指示劑加入未知溶液後變色，這類指示劑主要用來判斷什麼？ (Ａ)質量 (Ｂ)聲音大小 (Ｃ)磁性 (Ｄ)酸鹼性。", "ans": "D", "topic": "酸鹼指示劑", "analysis": "酸鹼指示劑在不同酸鹼環境下呈現不同顏色，因此可用來判斷溶液的酸鹼性。", "ext": "石蕊試紙遇酸變紅、遇鹼變藍；紫色高麗菜汁是常見的天然指示劑。"}, {"num": 10, "content": "等量白醋分別加入小蘇打粉與食鹽，只有前者大量冒泡。此實驗中小蘇打粉和食鹽屬於什麼變因？ (Ａ)應變變因 (Ｂ)控制變因 (Ｃ)操作變因 (Ｄ)誤差。", "ans": "C", "topic": "實驗變因", "analysis": "實驗主動改變加入白醋的固體種類，即小蘇打粉或食鹽，所以固體種類是操作變因；冒泡情形是應變變因。", "ext": "操縱變因是刻意改變的條件，應變變因是觀察結果，其餘條件須控制相同。"}, {"num": 11, "content": "水沸騰時持續加熱，在一般氣壓下溫度大致維持不變，加入的熱主要用於什麼？ (Ａ)使水立即結冰 (Ｂ)使水進行汽化 (Ｃ)讓水分子停止運動 (Ｄ)使容器質量歸零。", "ans": "B", "topic": "汽化潛熱", "analysis": "沸騰時液體吸收的熱主要作為汽化潛熱，使水由液態轉為氣態，因此溫度大致不再上升。", "ext": "一大氣壓下水沸點約100℃；熔化與沸騰過程持續吸熱但溫度維持不變。"}, {"num": 12, "content": "裝有冰水的玻璃杯外壁出現小水滴，這些水滴主要來自哪裡？ (Ａ)杯內水穿過玻璃 (Ｂ)空氣中的水蒸氣凝結 (Ｃ)玻璃融化 (Ｄ)氧氣變成液體。", "ans": "B", "topic": "凝結現象", "analysis": "杯外空氣中的水蒸氣遇到低溫杯壁後凝結成小水滴，並非杯內水穿過玻璃。", "ext": "清晨草葉上的露珠成因相同，都是水蒸氣遇冷凝結成的小水滴。"}, {"num": 13, "content": "下列哪一種混合物最適合用磁鐵分離？ (Ａ)鐵粉與砂 (Ｂ)食鹽與糖 (Ｃ)酒精與水 (Ｄ)沙與碎石。", "ans": "A", "topic": "磁性分離", "analysis": "鐵粉能被磁鐵吸引而砂不能，可利用磁性差異分離；其餘混合物成分不具此差異。", "ext": "過濾分離不溶固體、蒸餾利用沸點差異、磁選利用磁性，依性質選方法。"}, {"num": 14, "content": "鐵粉與硫粉混合後仍可用磁鐵分離；充分加熱形成新物質後卻不易分離。這最能說明什麼？ (Ａ)加熱只讓顆粒變大 (Ｂ)鐵完全沒有磁性 (Ｃ)硫變成水 (Ｄ)加熱後發生化學變化。", "ans": "D", "topic": "化學變化", "analysis": "混合前仍保有鐵的磁性而可分離，加熱後產生性質不同且難分離的新物質，顯示發生化學變化。", "ext": "化學變化生成新物質且多不易復原；狀態改變、溶解則屬物理變化。"}, {"num": 15, "content": "推購物車時，車輪若卡住，通常會比能滾動時更費力，主要原因為何？ (Ａ)重力消失 (Ｂ)車子質量變小 (Ｃ)地面沒有支持力 (Ｄ)滑動摩擦通常大於滾動摩擦。", "ans": "D", "topic": "滾動摩擦", "analysis": "車輪正常時主要為較小的滾動摩擦；卡住後變成滑動摩擦，阻力通常較大而更費力。", "ext": "行李箱裝輪子、機器加滾珠軸承，都是以滾動取代滑動來減少摩擦。"}, {"num": 16, "content": "將同一物體分別放在地球與月球表面，它的質量與重量會如何？ (Ａ)質量較小，重量相同 (Ｂ)兩者皆相同 (Ｃ)質量相同，月球上重量較小 (Ｄ)月球上質量與重量皆為零。", "ans": "C", "topic": "質量與重量", "analysis": "質量表示物質的量，不因地點改變；重量等於質量乘當地重力加速度，月球重力較小所以重量較小。", "ext": "月球表面重力約為地球六分之一，同一物體在月球重量約剩六分之一。"}, {"num": 17, "content": "潛水艇調整水艙內水量來上浮或下沉，主要是改變什麼？ (Ａ)整體平均密度 (Ｂ)地球重力方向 (Ｃ)聲音頻率 (Ｄ)海水顏色。", "ans": "A", "topic": "浮沉原理", "analysis": "水艙進、排水會改變潛水艇總質量而體積變化較小，因此改變整體平均密度，使其沉降或上浮。", "ext": "魚鰾調節氣體量改變魚體浮沉；平均密度大於液體時物體會下沉。"}, {"num": 18, "content": "同樣大小的實心球放入水中，甲浮、乙懸浮、丙沉底，三者密度由小到大為何？ (Ａ)丙＜乙＜甲 (Ｂ)乙＜甲＜丙 (Ｃ)三者相同 (Ｄ)甲＜乙＜丙。", "ans": "D", "topic": "密度比較", "analysis": "甲浮表示密度小於水，乙懸浮表示密度約等於水，丙沉底表示密度大於水，故甲＜乙＜丙。", "ext": "懸浮表示密度與液體約相等；提高液體濃度可使下沉物上浮，如鹽水浮蛋。"}, {"num": 19, "content": "使用斜面把重物推上貨車，斜面愈長通常如何？ (Ａ)愈省力但移動距離較長 (Ｂ)愈費力且距離較長 (Ｃ)力與距離都減少 (Ｄ)重物重量消失。", "ans": "A", "topic": "斜面原理", "analysis": "達到相同高度時，斜面愈長坡度愈緩，所需推力較小，但必須移動更長距離。", "ext": "斜面省力但不省功；山區之字形道路與無障礙坡道都是斜面應用。"}, {"num": 20, "content": "理想滑輪組有 4 段繩子共同支撐重物，忽略摩擦時，拉力約為重物重量的多少？ (Ａ)4 倍 (Ｂ)1/4 (Ｃ)1/2 (Ｄ)2 倍。", "ans": "B", "topic": "滑輪組", "analysis": "四段繩子平均支撐重物時，理想狀況有 4T＝W，因此拉力 T＝W÷4，即重量的 1/4。", "ext": "動滑輪省力費距離、定滑輪只改變施力方向；省力倍數看承重繩段數。"}, {"num": 21, "content": "聲音的音調主要與振動的哪一項性質有關？ (Ａ)振幅 (Ｂ)頻率 (Ｃ)音色名稱 (Ｄ)傳播方向。", "ans": "B", "topic": "音調與頻率", "analysis": "振動頻率愈高，音調愈高；振幅主要影響響度，音色與波形特徵有關。", "ext": "頻率單位為赫茲，人耳約可聽20至20000赫茲，更高頻稱為超音波。"}, {"num": 22, "content": "敲擊音叉後放入水中，水花四濺，最能證明什麼？ (Ａ)水會製造磁場 (Ｂ)音叉質量消失 (Ｃ)聲音只能在水中傳播 (Ｄ)發聲物體正在振動。", "ans": "D", "topic": "聲音的產生", "analysis": "音叉接觸水後濺起水花，是叉臂快速往復運動推動水的證據，證明發聲體正在振動。", "ext": "聲音由振動產生，振動停止發聲即停；說話時聲帶同樣在振動。"}, {"num": 23, "content": "近視眼鏡通常使用哪一種鏡片矯正？ (Ａ)凸透鏡 (Ｂ)平面鏡 (Ｃ)凹透鏡 (Ｄ)凹面鏡。", "ans": "C", "topic": "視力矯正", "analysis": "近視眼的遠方光線聚焦在視網膜前，使用凹透鏡先使光線發散，可把焦點移回視網膜。", "ext": "遠視與老花以凸透鏡矯正；近視成因常為眼球前後徑過長或水晶體過凸。"}, {"num": 24, "content": "陽光下樹蔭的形成，主要與光的哪一項性質有關？ (Ａ)色散 (Ｂ)直線前進 (Ｃ)聲光轉換 (Ｄ)蒸發。", "ans": "B", "topic": "光的直進", "analysis": "光沿直線前進，樹阻擋部分光線後，其後方形成光線較少的陰影區。", "ext": "影子、日食月食與針孔成像，都是光沿直線前進造成的現象。"}, {"num": 25, "content": "打開冰箱門後，冷空氣較容易往下流，主要因為冷空氣如何？ (Ａ)密度較小而上升 (Ｂ)完全沒有質量 (Ｃ)密度較大而下沉 (Ｄ)會變成真空。", "ans": "C", "topic": "空氣對流", "analysis": "相同壓力下冷空氣密度通常較大，因此受重力作用較易下沉，並與暖空氣形成對流。", "ext": "冷氣機裝高處、暖爐放低處，利用冷降暖升形成對流使室溫較均勻。"}, {"num": 26, "content": "太陽能熱水器的集熱板常塗成深色，主要為了什麼？ (Ａ)增加輻射熱吸收 (Ｂ)增加光的完全反射 (Ｃ)阻止所有熱傳導 (Ｄ)產生冷空氣。", "ans": "A", "topic": "熱輻射吸收", "analysis": "深色表面對輻射能的吸收能力較強，可使集熱板吸收更多太陽輻射以加熱水。", "ext": "深色粗糙表面吸熱與放熱皆較強；淺色光亮表面則善於反射輻射熱。"}, {"num": 27, "content": "沿海地區岩石縫中的海水蒸發後留下鹽晶，反覆作用使岩石裂開，屬於哪一種作用？ (Ａ)風化 (Ｂ)堆積 (Ｃ)搬運 (Ｄ)造山。", "ans": "A", "topic": "岩石風化", "analysis": "鹽晶在岩石縫中反覆生長並撐裂岩石，使岩石在原地破碎，屬物理風化。", "ext": "植物根部撐裂、水結冰膨脹也屬物理風化；岩石成分改變屬化學風化。"}, {"num": 28, "content": "發生土石流通常需要陡坡、鬆散土石與哪一項條件？ (Ａ)強烈月光 (Ｂ)大量水分 (Ｃ)穩定高氣壓 (Ｄ)低海水鹽度。", "ans": "B", "topic": "土石流", "analysis": "大量水分會使鬆散土石飽和、增加重量並降低穩定性，在陡坡上容易形成土石流。", "ext": "濫墾濫伐使坡地土石鬆動，颱風豪雨時更容易引發土石流災害。"}, {"num": 29, "content": "颱風登陸前，政府發布警報主要依據哪些觀測？ (Ａ)衛星、雷達與氣象站資料 (Ｂ)星座盤 (Ｃ)顯微鏡影像 (Ｄ)地層化石。", "ans": "A", "topic": "氣象觀測", "analysis": "衛星追蹤雲系、雷達量測降雨與風場，地面或海上氣象站提供氣壓風雨資料，共同支援颱風警報。", "ext": "氣象衛星俯瞰雲系分布，雷達偵測降雨強度，共同掌握颱風動態。"}, {"num": 30, "content": "天氣圖上冷鋒符號的三角形通常指向哪裡？ (Ａ)太陽方向 (Ｂ)冷鋒移動方向 (Ｃ)北極星方向 (Ｄ)海拔較高處。", "ans": "B", "topic": "天氣圖符號", "analysis": "冷鋒線上的三角形畫在冷氣團前進的一側，尖端指向鋒面移動方向。", "ext": "暖鋒以半圓表示且畫在移動方向側；滯留鋒的三角形與半圓則分列兩側。"}, {"num": 31, "content": "月球本身不發可見光，我們仍能看見它，主要因為什麼？ (Ａ)反射地震波 (Ｂ)自行燃燒 (Ｃ)反射太陽光 (Ｄ)吸收所有光。", "ans": "C", "topic": "月光來源", "analysis": "月球不自行發出可見光，我們看到的亮面是月球表面反射的太陽光。", "ext": "行星與衛星皆不自行發光，靠反射太陽光；恆星如太陽才會自行發光。"}, {"num": 32, "content": "同一天觀察月亮數小時，月亮大致由東向西移動，主要是哪一運動造成的視運動？ (Ａ)月球公轉 (Ｂ)地球自轉 (Ｃ)月球繞太陽自轉 (Ｄ)地球公轉。", "ans": "B", "topic": "月球視運動", "analysis": "地球由西向東自轉，使月亮在數小時內看似由東向西移動；月球公轉主要造成逐日位置和月相變化。", "ext": "月亮每天東升時刻約延後五十分鐘，這是月球繞地公轉造成的現象。"}, {"num": 33, "content": "春分時太陽直射哪一區域附近？ (Ａ)北回歸線 (Ｂ)南回歸線 (Ｃ)北極點 (Ｄ)赤道。", "ans": "D", "topic": "太陽直射點", "analysis": "春分與秋分時太陽直射赤道附近，全球晝夜長度大致相等。", "ext": "夏至直射北回歸線、冬至直射南回歸線，直射點在南北回歸線間移動。"}, {"num": 34, "content": "在臺灣，哪一季通常最容易在傍晚看見獵戶座？ (Ａ)春季 (Ｂ)夏季 (Ｃ)秋季 (Ｄ)冬季。", "ans": "D", "topic": "四季星座", "analysis": "獵戶座是臺灣冬季傍晚的代表星座，夏季傍晚多在太陽方向而不易看見。", "ext": "夏季代表星座為天蠍座；獵戶座腰帶三星與天狼星是冬季星空重要指標。"}, {"num": 35, "content": "量筒讀取液體體積時，視線應如何？ (Ａ)從正上方俯視 (Ｂ)與液面刻度保持水平 (Ｃ)從下方仰視 (Ｄ)隨意角度都相同。", "ans": "B", "topic": "量筒讀數", "analysis": "視線與液面刻度水平可避免視差；一般水溶液應讀凹液面最低處所對刻度。", "ext": "俯視會使讀值偏高、仰視偏低；水銀凸液面則應讀最高點刻度。"}, {"num": 36, "content": "哪一組蒸散作用最旺盛？ (Ａ)乙 (Ｂ)丙 (Ｃ)丁 (Ｄ)甲。", "ans": "D", "topic": "蒸散作用", "analysis": "水量減少最多表示蒸散最旺盛，甲未塗凡士林而減少 8 mL，為四組最大。", "ext": "蒸散主要經由氣孔散失水分，可促進根部吸水與水分向上運輸。", "gr": "第 36–40 題", "gi": "小恩在四片大小相近的同種葉片表面塗凡士林，插在裝有等量水的量筒中，24 小時後記錄水量減少值：\n\n組別｜葉片處理｜水量減少\n甲｜不塗凡士林｜8 mL\n乙｜只塗上表皮｜6 mL\n丙｜只塗下表皮｜3 mL\n丁｜上、下表皮都塗｜1 mL"}, {"num": 37, "content": "哪一組最能抑制葉片蒸散？ (Ａ)甲 (Ｂ)丁 (Ｃ)丙 (Ｄ)乙。", "ans": "B", "topic": "氣孔與蒸散", "analysis": "丁把上下表皮都封住，水量僅減少 1 mL，顯示氣孔通道受阻最多、蒸散抑制最強。", "ext": "凡士林封住氣孔可阻斷水氣散失；氣孔開閉由保衛細胞控制。"}, {"num": 38, "content": "比較乙與丙，最能支持哪一項推論？ (Ａ)上表皮一定沒有細胞 (Ｂ)凡士林能增加蒸散 (Ｃ)此種葉片下表皮可能有較多氣孔 (Ｄ)葉片不會吸收光。", "ans": "C", "topic": "對照實驗推論", "analysis": "乙只封上表皮仍減少 6 mL，丙封下表皮僅減少 3 mL，表示封住下表皮影響較大，推測下表皮氣孔較多。", "ext": "多數陸生植物下表皮氣孔較多，可減少日照直射導致的水分散失。"}, {"num": 39, "content": "若量筒口未封住，水也會直接蒸發，這會造成什麼問題？ (Ａ)低估所有水量 (Ｂ)高估葉片造成的水分散失 (Ｃ)不影響測量 (Ｄ)水量必定增加。", "ans": "B", "topic": "實驗誤差", "analysis": "量筒口未封時，量筒內水面也會直接蒸發，測得的總減少量會把這部分誤算成葉片蒸散而高估。", "ext": "常在水面加一層油或封住筒口防止直接蒸發，使減少量只反映蒸散。"}, {"num": 40, "content": "為提高實驗可信度，下列何者最適當？ (Ａ)四組放在不同溫度 (Ｂ)每組使用不同植物 (Ｃ)只記錄結果最大的一次 (Ｄ)每組使用多片葉重複測量。", "ans": "D", "topic": "重複測量", "analysis": "每組使用多片條件相近的葉重複測量並取平均，可減少個體差異與偶然誤差，提高可信度。", "ext": "增加樣本數與重複次數可降低個體差異影響，使結果更具代表性。"}, {"num": 41, "content": "颱風中心最可能在何時最接近測站？ (Ａ)08:00 (Ｂ)12:00 (Ｃ)20:00 (Ｄ)16:00。", "ans": "D", "topic": "颱風結構", "analysis": "颱風中心為低氣壓，16:00 氣壓最低且風雨最強，綜合判斷此時最接近測站。", "ext": "颱風眼內短暫風平雨歇，眼牆附近風雨最強，勿誤判颱風已經離開。", "gr": "第 41–45 題", "gi": "某颱風接近期間，一測站紀錄如下：\n\n時間｜氣壓（hPa）｜平均風速（m/s）｜雨量（mm/h）\n08:00｜1004｜8｜2\n12:00｜990｜18｜15\n16:00｜972｜30｜28\n20:00｜986｜20｜10"}, {"num": 42, "content": "從 08:00 到 16:00，氣壓與風速呈現什麼趨勢？ (Ａ)氣壓上升、風速下降 (Ｂ)氣壓下降、風速上升 (Ｃ)兩者都下降 (Ｄ)兩者都不變。", "ans": "B", "topic": "氣壓與風速", "analysis": "08:00 至 16:00 氣壓由 1004 降至 972 hPa，風速由 8 升至 30 m/s，呈氣壓下降、風速上升。", "ext": "颱風愈接近氣壓愈低、風速愈大；中心氣壓愈低通常颱風強度愈強。"}, {"num": 43, "content": "20:00 的氣壓回升，最合理的解釋為何？ (Ａ)颱風可能逐漸遠離 (Ｂ)測站進入外太空 (Ｃ)所有雲層消失 (Ｄ)地球停止自轉。", "ans": "A", "topic": "颱風動態判讀", "analysis": "20:00 氣壓由最低值回升且風雨轉弱，最合理的是颱風中心已通過並逐漸遠離。", "ext": "颱風遠離後西南氣流常帶來豪雨，警報解除仍須防範致災性降雨。"}, {"num": 44, "content": "哪個時段每小時雨量最大？ (Ａ)16:00 (Ｂ)12:00 (Ｃ)08:00 (Ｄ)20:00。", "ans": "A", "topic": "雨量判讀", "analysis": "表中最大每小時雨量為 16:00 的 28 mm/h，高於其餘三時段。", "ext": "雨量以毫米表示累積水深；時雨量與累積雨量是防災警戒重要指標。"}, {"num": 45, "content": "只根據表格，哪一項無法確定？ (Ａ)16:00 氣壓最低 (Ｂ)16:00 風速最大 (Ｃ)颱風中心移動的確切路徑 (Ｄ)08:00 雨量最小。", "ans": "C", "topic": "資料限制", "analysis": "單一測站四個時刻的氣壓、風雨資料不足以重建颱風中心的確切移動路徑；其餘三項都能直接讀表確認。", "ext": "單一測站資料無法定位颱風路徑，需多測站與衛星雷達資料綜合研判。"}], "33": [{"num": 1, "content": "鯨魚生活在海中卻必須定期浮出水面，主要原因為何？ (Ａ)用肺呼吸空氣 (Ｂ)用鰓吸收海水中的氧 (Ｃ)需要曬乾魚鱗 (Ｄ)需要到水面產生葉綠素。", "ans": "A", "topic": "哺乳類呼吸", "analysis": "鯨魚是哺乳類，以肺呼吸，無法從水中以鰓取得氧氣，因此必須定期浮出水面換氣。", "ext": "鯨豚為海洋哺乳類，胎生哺乳且恆溫；魚類用鰓呼吸，鯨魚頭頂噴氣孔便於浮出換氣。"}, {"num": 2, "content": "鳥卵中的胚胎發育，主要利用哪一部分儲存的養分？ (Ａ)卵黃 (Ｂ)卵殼 (Ｃ)氣室 (Ｄ)繫帶。", "ans": "A", "topic": "鳥卵構造", "analysis": "卵黃含豐富養分，供胚胎發育使用；卵殼主要保護，氣室提供氣體交換空間。", "ext": "卵白提供水分與部分養分並具緩衝保護；氣室供氣體交換，繫帶固定卵黃位置。"}, {"num": 3, "content": "根據共同特徵將生物分類，最主要的好處是什麼？ (Ａ)使所有生物外形相同 (Ｂ)讓生物改變基因 (Ｃ)便於比較與了解生物間關係 (Ｄ)決定每隻動物的名字。", "ans": "C", "topic": "生物分類", "analysis": "依共同與差異特徵分類，可有系統地辨識、比較生物，並理解彼此可能的親緣關係。", "ext": "分類階層由大到小為界門綱目科屬種，同種生物可交配並產下具生殖能力的後代。"}, {"num": 4, "content": "松樹與杜鵑最主要的差異之一為何？ (Ａ)杜鵑利用胞子繁殖 (Ｂ)杜鵑不會產生種子 (Ｃ)松樹沒有維管束 (Ｄ)松樹種子外沒有果實包覆。", "ans": "D", "topic": "裸子與被子", "analysis": "松樹為裸子植物，種子裸露於毬果鱗片上，沒有果實包覆；杜鵑為開花的被子植物。", "ext": "裸子植物如松杉柏以毬果結籽；被子植物種子有果實包覆，蕨類則以孢子繁殖不產種子。"}, {"num": 5, "content": "食物鏈中的箭頭通常由食物指向取食者，主要表示什麼？ (Ａ)水流方向 (Ｂ)動物逃跑方向 (Ｃ)能量傳遞方向 (Ｄ)生物體型大小。", "ans": "C", "topic": "食物鏈", "analysis": "箭頭由被吃者指向取食者，表示食物中的物質與能量傳向消費者，並非逃跑方向。", "ext": "箭頭由被食者指向捕食者，表示物質與能量流向；能量逐級遞減，箭頭畫反是常見錯誤。"}, {"num": 6, "content": "同一棲地中兩種鳥都以相同昆蟲為食，牠們之間最可能有哪種關係？ (Ａ)光合作用 (Ｂ)競爭 (Ｃ)分解 (Ｄ)蒸散。", "ans": "B", "topic": "種間關係", "analysis": "兩種鳥利用同一種有限食物資源，需求重疊時會發生種間競爭。", "ext": "競爭發生於資源需求重疊時；掠食、寄生、互利共生為不同種間關係，需求愈相似競爭愈烈。"}, {"num": 7, "content": "保護區內若只保護單一明星物種而破壞其棲地，保育效果可能不佳，主要原因為何？ (Ａ)棲地只由石頭構成 (Ｂ)明星物種不需要食物 (Ｃ)生物生存依賴棲地與其他生物 (Ｄ)保護區不能有植物。", "ans": "C", "topic": "棲地保育", "analysis": "物種需要棲地提供食物、繁殖場所與其他生物關係；棲地被破壞時只保護個體難以維持族群。", "ext": "保育以整個棲地與生態系為單位較有效；明星物種常用來喚起大眾對棲地保護的關注。"}, {"num": 8, "content": "人體流血時，哪一種血球成分與凝血最直接相關？ (Ａ)紅血球 (Ｂ)血小板 (Ｃ)白血球 (Ｄ)血紅素。", "ans": "B", "topic": "血液成分", "analysis": "血小板會聚集於傷口並參與凝血反應，形成血塊以減少失血。", "ext": "紅血球含血紅素運送氧，白血球吞噬病原負責免疫，血漿運輸養分與廢物，功能勿混淆。"}, {"num": 9, "content": "澱粉遇碘液通常呈現什麼顏色？ (Ａ)橘紅色 (Ｂ)無色 (Ｃ)螢光綠 (Ｄ)藍黑色。", "ans": "D", "topic": "澱粉檢驗", "analysis": "碘液與澱粉形成藍黑色反應，可用來檢驗食物中是否含澱粉。", "ext": "碘液遇澱粉呈藍黑色；本氏液需加熱檢驗葡萄糖呈磚紅色，兩種試劑常考對照。"}, {"num": 10, "content": "將雞蛋殼放入白醋中會冒泡且逐漸變薄，主要因為蛋殼中的成分與酸反應。這屬於哪種變化？ (Ａ)凝固 (Ｂ)化學變化 (Ｃ)只有形狀改變 (Ｄ)物理變化。", "ans": "B", "topic": "化學變化", "analysis": "蛋殼中的碳酸鈣與醋酸反應，生成二氧化碳氣泡並使蛋殼變薄，因有新物質形成而屬化學變化。", "ext": "判斷關鍵是否生成新物質；蛋殼碳酸鈣遇酸產生二氧化碳屬化學變化，溶解與狀態改變屬物理變化。"}, {"num": 11, "content": "下列哪一項做法能使冰塊較慢融化？ (Ａ)用厚毛巾包住 (Ｂ)放在金屬盤上 (Ｃ)吹暖風 (Ｄ)切成許多小塊。", "ans": "A", "topic": "熱的傳導", "analysis": "厚毛巾內含不易導熱的空氣，能減少外界熱傳入冰塊；切小或吹暖風會加快融化。", "ext": "空氣是不良導體，毛巾隔熱減緩外界熱傳入；金屬導熱快會加速融化，勿誤以為毛巾會生熱。"}, {"num": 12, "content": "將相同質量、相同初溫的水與食用油，以相同電熱器加熱相同時間，油溫上升較多。最合理的推論為何？ (Ａ)水完全不吸熱 (Ｂ)油不具質量 (Ｃ)油較容易升溫 (Ｄ)兩者獲得熱量必不同。", "ans": "C", "topic": "比熱概念", "analysis": "在質量、初溫、加熱器與時間相同時，油的升溫較多，表示油在此條件下比水容易升溫。", "ext": "水的比熱大，升溫降溫皆較慢，故可調節氣候並作冷卻劑；油比熱小，同熱量下升溫較快。"}, {"num": 13, "content": "乾冰在常溫下直接由固體變成氣體，稱為什麼？ (Ａ)昇華 (Ｂ)熔化 (Ｃ)凝華 (Ｄ)凝結。", "ans": "A", "topic": "昇華現象", "analysis": "乾冰由固態二氧化碳直接轉為氣態，未經液態，這種狀態變化稱為昇華。", "ext": "昇華是固態直接變氣態，如乾冰、樟腦丸；凝華相反，如霜的形成，兩者方向常被混淆。"}, {"num": 14, "content": "一瓶冷飲外出現水珠，若周圍空氣較乾燥，水珠形成速度通常如何？ (Ａ)較快 (Ｂ)完全不受影響 (Ｃ)水珠會向上飄 (Ｄ)較慢。", "ans": "D", "topic": "凝結現象", "analysis": "空氣較乾燥表示水蒸氣較少，到達冷飲表面後可凝結的水較少，因此水珠形成較慢。", "ext": "瓶外水珠來自空氣中水蒸氣遇冷凝結，並非瓶內滲出；空氣溼度愈高，凝結愈快愈多。"}, {"num": 15, "content": "電池、燈泡與導線接成閉合通路，燈泡才會發亮。下列何者會造成斷路？ (Ａ)開關打開 (Ｂ)導線兩端接妥 (Ｃ)開關閉合 (Ｄ)電池接入電池座。", "ans": "A", "topic": "電路通斷", "analysis": "開關打開會使導線通路中斷而形成斷路；開關閉合與各元件接妥才構成閉合通路。", "ext": "「開關打開」是斷路、「閉合」才通路，用語與日常開燈相反，是選項判讀常見陷阱。"}, {"num": 16, "content": "兩顆相同電池同向串聯後接燈泡，與只接一顆相比，燈泡通常如何？ (Ａ)較暗 (Ｂ)一定不亮 (Ｃ)較亮 (Ｄ)亮度完全不可能改變。", "ans": "C", "topic": "電池串聯", "analysis": "兩顆同向串聯電池提供較大的電壓，通常使燈泡電流增加、亮度提高，但也可能縮短壽命。", "ext": "串聯增加電壓使燈泡較亮；並聯亮度接近一顆但可用較久，兩種接法特性常互相對照。"}, {"num": 17, "content": "電磁鐵吸起迴紋針後切斷電流，迴紋針多半掉落。此特性有何應用優點？ (Ａ)永遠不需電源 (Ｂ)只能吸引木材 (Ｃ)磁極永遠固定 (Ｄ)磁性可用開關控制。", "ans": "D", "topic": "電磁鐵", "analysis": "電磁鐵通電有磁性、斷電大多失去磁性，能用開關控制吸放，適合起重或分類裝置。", "ext": "電磁鐵磁力可由電流大小與線圈圈數調整，磁極方向隨電流方向改變，皆與永久磁鐵不同。"}, {"num": 18, "content": "將鐵釘靠近磁鐵的一端，鐵釘被吸引，這與哪一現象最相關？ (Ａ)磁感應 (Ｂ)光折射 (Ｃ)熱對流 (Ｄ)水凝結。", "ans": "A", "topic": "磁化現象", "analysis": "鐵釘靠近磁鐵時被磁化，靠近端形成與磁鐵相反的磁極而受吸引，稱為磁感應。", "ext": "鐵、鈷、鎳等可被磁化；鐵釘靠近磁鐵的一端感應出異名磁極，因此異名相吸而被吸引。"}, {"num": 19, "content": "跳傘者張開降落傘後下降速度減慢，主要是增加哪一種力？ (Ａ)重力 (Ｂ)磁力 (Ｃ)空氣阻力 (Ｄ)浮力至完全無重。", "ans": "C", "topic": "空氣阻力", "analysis": "張開降落傘增加迎風面積，使向上的空氣阻力大增，淨向下力減小而下降速度降低。", "ext": "阻力隨迎風面積與速度增大；下落時阻力增至與重力平衡即等速下降，稱為終端速度。"}, {"num": 20, "content": "物體受到大小相等、方向相反且作用在同一直線上的兩力，物體可能如何？ (Ａ)一定加速向左 (Ｂ)靜止或做等速直線運動 (Ｃ)必定旋轉 (Ｄ)一定加速向右。", "ans": "B", "topic": "二力平衡", "analysis": "兩力等大反向且共線，合力為零，因此物體可保持靜止，也可維持原有等速直線運動。", "ext": "平衡二力作用在同一物體；作用力與反作用力分別作用在兩個物體上，兩者概念勿混淆。"}, {"num": 21, "content": "用筷子夾菜時，手指施力處位在支點與菜之間，這種槓桿有何特性？ (Ａ)通常費力但操作靈活 (Ｂ)沒有抗力點 (Ｃ)一定省力 (Ｄ)只能改變熱量。", "ans": "A", "topic": "槓桿原理", "analysis": "筷子為第三類槓桿，施力臂小於抗力臂，通常費力，但可使夾取端移動快速、操作靈活。", "ext": "施力點在中間為費力槓桿如筷子、掃帚；抗力點在中間為省力槓桿如開罐器、獨輪車。"}, {"num": 22, "content": "兩面鏡子相交形成夾角，物體可能出現多個像，主要是光發生什麼？ (Ａ)蒸發 (Ｂ)凝固 (Ｃ)多次反射 (Ｄ)聲波共振。", "ans": "C", "topic": "光的反射", "analysis": "光在兩面鏡子間反覆反射，每次反射都可能形成一個像，因此會看到多個像。", "ext": "兩鏡夾角愈小成像數愈多，90度夾角成三個像；潛望鏡利用兩面45度平面鏡反射原理。"}, {"num": 23, "content": "水中筷子看起來彎折，是由於什麼？ (Ａ)筷子真的折斷 (Ｂ)水產生磁場 (Ｃ)光在水與空氣交界處折射 (Ｄ)眼睛發出光線。", "ans": "C", "topic": "光的折射", "analysis": "來自水中筷子的光在水與空氣界面折射，進入眼睛的方向改變，造成筷子位置錯覺。", "ext": "光由水進入空氣時偏折，使水中物體看來位置變淺；水中硬幣變淺、魚的視深皆同理。"}, {"num": 24, "content": "冷氣機裝在房間較高處，有助於全室降溫，主要利用哪一原理？ (Ａ)熱空氣下沉 (Ｂ)冷空氣下沉形成對流 (Ｃ)金屬熱脹冷縮 (Ｄ)光的反射。", "ans": "B", "topic": "熱對流", "analysis": "冷空氣密度較大會下降，房內暖空氣上升補充，形成對流而使冷氣較均勻分布。", "ext": "對流只發生於液體與氣體；暖氣或電暖器宜放低處，熱空氣上升冷空氣下沉形成循環。"}, {"num": 25, "content": "火山噴出的岩漿冷卻凝固後可形成哪一類岩石？ (Ａ)火成岩 (Ｂ)沉積岩 (Ｃ)變質岩 (Ｄ)化石。", "ans": "A", "topic": "火成岩", "analysis": "岩漿或熔岩冷卻凝固形成火成岩；沉積岩由沉積物固結，變質岩由原岩變質形成。", "ext": "岩漿地下慢冷成花岡岩結晶大，噴出地表快冷成玄武岩結晶小，冷卻速率決定晶粒大小。"}, {"num": 26, "content": "石灰岩受高溫高壓作用後可變成大理岩，這是什麼作用？ (Ａ)侵蝕作用 (Ｂ)變質作用 (Ｃ)光合作用 (Ｄ)蒸發作用。", "ans": "B", "topic": "變質作用", "analysis": "石灰岩在高溫高壓下礦物重新結晶為大理岩，過程稱為變質作用。", "ext": "常考配對：石灰岩變大理岩、頁岩變板岩、砂岩變石英岩，皆由高溫高壓變質而成。"}, {"num": 27, "content": "化石最常保存在下列哪一類岩石中？ (Ａ)岩漿 (Ｂ)金屬礦物 (Ｃ)新鮮熔岩 (Ｄ)沉積岩。", "ans": "D", "topic": "化石形成", "analysis": "沉積物能逐層掩埋生物遺骸，且形成時通常沒有熔岩高溫破壞，因此沉積岩最常保存化石。", "ext": "火成岩高溫使遺骸難保存；化石可指示地層年代與古環境，如珊瑚化石代表溫暖淺海。"}, {"num": 28, "content": "臺灣山脈大致呈南北走向，主要與板塊的哪一作用有關？ (Ａ)完全遠離 (Ｂ)月球引力 (Ｃ)碰撞擠壓 (Ｄ)季風吹拂。", "ans": "C", "topic": "板塊運動", "analysis": "菲律賓海板塊與歐亞板塊碰撞擠壓造成地殼隆起，是臺灣山脈形成與走向的重要因素。", "ext": "臺灣位於歐亞板塊與菲律賓海板塊聚合帶，地震頻繁且持續造山，花東縱谷為板塊交界。"}, {"num": 29, "content": "露通常在晴朗、風弱的夜晚較易形成，其成因為何？ (Ａ)地下水噴出 (Ｂ)雨滴在空中結冰 (Ｃ)霜受熱昇華 (Ｄ)近地面水蒸氣遇冷凝結。", "ans": "D", "topic": "露與霜", "analysis": "晴朗風弱夜晚地表輻射冷卻明顯，近地面空氣中的水蒸氣在物體表面凝結成露。", "ext": "露是水蒸氣凝結成的液態小水滴；近地面溫度低於0°C時水蒸氣凝華成霜，成因需分清。"}, {"num": 30, "content": "氣象氣球主要用來收集什麼資料？ (Ａ)高空氣溫、氣壓、溼度與風 (Ｂ)月球土壤 (Ｃ)海底岩層 (Ｄ)人體細胞。", "ans": "A", "topic": "氣象觀測", "analysis": "氣象氣球攜帶探空儀升空，量測高空氣溫、氣壓、溼度與風等大氣資料。", "ext": "氣象衛星拍雲圖、雷達測降雨強度、地面測站量溫度雨量，各觀測工具功能常考搭配。"}, {"num": 31, "content": "面向南方觀察太陽，上午竿影通常偏向哪一側？ (Ａ)西側 (Ｂ)東側 (Ｃ)正南且不變 (Ｄ)正上方。", "ans": "A", "topic": "太陽視運動", "analysis": "上午太陽位在東南側，竿影與太陽方向相反，因此偏向西側。", "ext": "竿影方向與太陽相反；臺灣正午影最短且指向北方，影長與方向可判斷時刻與方位。"}, {"num": 32, "content": "農曆二十二、二十三前後常見哪一種月相？ (Ａ)上弦月 (Ｂ)滿月 (Ｃ)新月 (Ｄ)下弦月。", "ans": "D", "topic": "月相變化", "analysis": "農曆二十二、二十三前後約為下弦月，常在午夜前後升起並於上午可見。", "ext": "農曆初七、初八為上弦月，十五、十六為滿月；下弦月約午夜升起，清晨懸於南方天空。"}, {"num": 33, "content": "月球繞地球公轉一周與月相盈虧的週期大約接近多久？ (Ａ)一天 (Ｂ)一週 (Ｃ)一個月 (Ｄ)一年。", "ans": "C", "topic": "月相週期", "analysis": "相同月相再出現的朔望月約 29.5 天，接近一個月。", "ext": "朔望月約29.5天，比月球公轉的恆星月27.3天長，因地球同時繞太陽公轉前進。"}, {"num": 34, "content": "北斗七星在一夜中看似繞北極星轉動，主要是什麼造成的？ (Ａ)地球自轉 (Ｂ)北極星繞地球 (Ｃ)月球遮掩 (Ｄ)地球停止運動。", "ans": "A", "topic": "星空視運動", "analysis": "地球自轉使北天星空產生繞北天極轉動的視運動，北極星因靠近北天極而看似較固定。", "ext": "北極星位於地球自轉軸延伸方向故看似不動；星空每小時約轉15度，一日轉一圈。"}, {"num": 35, "content": "小組實驗結果與預測不符時，最合適的做法為何？ (Ａ)直接刪除不符資料 (Ｂ)檢查步驟、重複實驗並如實記錄 (Ｃ)修改數值符合預測 (Ｄ)只保留最好看的一次。", "ans": "B", "topic": "科學態度", "analysis": "科學研究應保留原始結果，檢查步驟與控制條件並重複實驗，不能為符合預測而刪改資料。", "ext": "誠實記錄是科學倫理核心；異常數據應檢討變因控制與操作誤差，重複實驗提高可信度。"}, {"num": 36, "content": "在 60°C、100 g 水中，最多約可溶解多少該物質？ (Ａ)32 g (Ｂ)40 g (Ｃ)68 g (Ｄ)52 g。", "ans": "D", "topic": "溶解度", "analysis": "直接查表可知 60°C、每 100 g 水的最大溶解量為 52 g。", "ext": "溶解度通常以每100克水可溶的最大量表示；達最大溶解量的溶液稱為飽和溶液。", "gr": "第 36–40 題", "gi": "某物質在不同水溫下，每 100 g 水最多可溶解的質量如下：\n\n水溫｜20°C｜40°C｜60°C｜80°C\n最大溶解量｜32 g｜40 g｜52 g｜68 g"}, {"num": 37, "content": "在 20°C、100 g 水中加入 40 g 該物質並充分攪拌，杯底約剩多少未溶？ (Ａ)0 g (Ｂ)8 g (Ｃ)20 g (Ｄ)32 g。", "ans": "B", "topic": "飽和溶液", "analysis": "20°C 時最多溶 32 g，加入 40 g 後未溶量為 40－32＝8 g。", "ext": "杯底留有未溶溶質表示溶液已飽和，再攪拌也不會多溶，需升溫或加水才能續溶。"}, {"num": 38, "content": "將 80°C 的飽和溶液冷卻到 40°C，且水量近似不變，約有多少物質結晶析出？ (Ａ)12 g (Ｂ)20 g (Ｃ)40 g (Ｄ)28 g。", "ans": "D", "topic": "結晶析出", "analysis": "依題組溶解度表皆以 100 克水為基準；若此飽和溶液也是以 100 克水配製，80°C 可溶 68克，降至 40°C 只溶 40 克，故析出 68－40＝28 克。", "ext": "冷卻熱飽和溶液是常見結晶法；若同時有水分蒸發，析出量會更多，計算需注意水量。"}, {"num": 39, "content": "根據表格，此物質的溶解量與水溫有何關係？ (Ａ)水溫愈高，溶解量愈大 (Ｂ)完全無關 (Ｃ)40°C 時一定最小 (Ｄ)水溫愈高，溶解量愈小。", "ans": "A", "topic": "溶解度與溫度", "analysis": "水溫由 20°C 升至 80°C 時，最大溶解量由 32 g 逐步增至 68 g，顯示溫度愈高溶解量愈大。", "ext": "多數固體溶解度隨溫度升高而增大；氣體恰相反，汽水加溫時氣泡逸出更快。"}, {"num": 40, "content": "要研究水溫對最大溶解量的影響，哪一項應保持相同？ (Ａ)各杯水溫 (Ｂ)每杯水的質量 (Ｃ)每杯最大溶解量 (Ｄ)結果數值。", "ans": "B", "topic": "變因控制", "analysis": "操作變因是水溫，為公平比較必須讓每杯水的質量相同；最大溶解量是應變變因。", "ext": "操作變因一次只能一個，其餘控制變因須相同；應變變因是觀測記錄的實驗結果。"}, {"num": 41, "content": "此食物網中，鷹可能同時扮演幾級消費者？ (Ａ)只可能初級 (Ｂ)只可能生產者 (Ｃ)只可能分解者 (Ｄ)可為二級或三級。", "ans": "D", "topic": "消費者層級", "analysis": "鷹吃鼠或兔時為二級消費者；沿「草→鼠→蛇→鷹」則為三級消費者。", "ext": "同一生物在食物網可屬不同營養層級；層級愈高能量損耗愈多，個體數通常愈少。", "gr": "第 41–45 題", "gi": "某島上有草、鼠、兔、蛇與鷹，已知草被鼠與兔吃；鼠被蛇與鷹吃；兔被鷹吃；蛇也被鷹吃。"}, {"num": 42, "content": "若蛇數量增加，其他條件暫時不變，鼠數量最可能如何？ (Ａ)增加 (Ｂ)變成兔 (Ｃ)完全固定 (Ｄ)減少。", "ans": "D", "topic": "族群消長", "analysis": "蛇以鼠為食，蛇數量增加會提高鼠的捕食壓力，其他條件不變時鼠可能減少。", "ext": "掠食者增加使獵物減少，之後掠食者也可能因食物不足回落，族群數量常呈週期波動。"}, {"num": 43, "content": "若兔大量減少，最直接可能造成什麼？ (Ａ)鼠一定立即滅絕 (Ｂ)草受啃食壓力降低 (Ｃ)蛇失去所有食物 (Ｄ)鷹變成生產者。", "ans": "B", "topic": "食物網影響", "analysis": "兔直接啃食草，兔大量減少會先使草受到的啃食壓力降低；蛇本來不以兔為食。", "ext": "兔減少也可能使鷹改多捕鼠與蛇，間接影響其他族群，食物網中牽一髮而動全身。"}, {"num": 44, "content": "若草受到長期乾旱而大量減少，最合理的長期影響為何？ (Ａ)所有消費者都增加 (Ｂ)食物網中多種消費者可能減少 (Ｃ)分解作用停止 (Ｄ)能量來源增加。", "ans": "B", "topic": "生產者角色", "analysis": "草是食物網的主要生產者，長期減少會先限制鼠、兔，再影響蛇與鷹，故多種消費者可能減少。", "ext": "生產者是生態系能量入口，以光合作用將太陽能轉為化學能，其量決定生態系承載力。"}, {"num": 45, "content": "要使對島上族群變化的推論更可靠，最需要哪一項資料？ (Ａ)島的名字 (Ｂ)研究者鞋子顏色 (Ｃ)各族群長期數量與環境變化紀錄 (Ｄ)鷹的單張照片。", "ans": "C", "topic": "科學證據", "analysis": "族群會隨時間與環境波動，需長期記錄各族群數量及環境變化，才能檢驗推論而非依靠單張照片。", "ext": "長期監測才能區分自然波動與真正趨勢；單次觀察易受偶然影響，證據需可重複檢驗。"}], "34": [{"num": 1, "content": "企鵝具有厚脂肪與緊密羽毛，最主要有助於什麼？ (Ａ)用鰓呼吸 (Ｂ)在沙漠儲水 (Ｃ)在寒冷環境中保溫 (Ｄ)進行光合作用。", "ans": "C", "topic": "保溫適應", "analysis": "厚脂肪與緊密羽毛能減少身體熱量散失，幫助企鵝在寒冷環境維持體溫。", "ext": "寒帶動物體型大、耳小以減少散熱；沙漠動物如駱駝以駝峰脂肪與耐渴適應乾熱環境。"}, {"num": 2, "content": "長頸鹿與相思樹之間的取食關係中，長頸鹿屬於什麼？ (Ａ)初級消費者 (Ｂ)生產者 (Ｃ)分解者 (Ｄ)非生物因子。", "ans": "A", "topic": "消費者層級", "analysis": "相思樹是生產者，長頸鹿直接取食植物，因此是初級消費者。", "ext": "吃植物者為初級消費者，捕食初級消費者的為二級；分解者將遺體殘骸分解回歸環境。"}, {"num": 3, "content": "植物向光彎曲生長，最能說明生物具有哪一種特性？ (Ａ)只能無性繁殖 (Ｂ)一定會移動位置 (Ｃ)不需要能量 (Ｄ)對刺激產生反應。", "ans": "D", "topic": "感應性", "analysis": "光是外界刺激，植物朝光源彎曲生長是向光性，顯示生物能對刺激產生反應。", "ext": "向光性、根的向地性、捕蠅草閉合皆是對刺激的反應；植物多以改變生長方向來回應。"}, {"num": 4, "content": "將枝條插入水中長出根與新芽，這屬於哪一種繁殖？ (Ａ)有性繁殖 (Ｂ)胎生 (Ｃ)無性繁殖 (Ｄ)孢子生殖。", "ans": "C", "topic": "無性繁殖", "analysis": "枝條不經配子結合便長成新植株，屬利用營養器官的無性繁殖，也稱扦插繁殖。", "ext": "扦插、壓條、分株與馬鈴薯塊莖皆屬無性繁殖，後代性狀與親代幾乎完全相同。"}, {"num": 5, "content": "種植兩盆同種植物，一盆放暗處、一盆放亮處，其他條件相同，主要可研究什麼？ (Ａ)水對植物生長的影響 (Ｂ)光對植物生長的影響 (Ｃ)土壤種類的影響 (Ｄ)花盆大小的影響。", "ans": "B", "topic": "對照實驗", "analysis": "兩盆唯一主動改變的是光照條件，水、土壤與花盆等維持相同，因此研究光對植物生長的影響。", "ext": "一次只改變一個變因，其餘條件須相同；兩盆互為對照，差異才能歸因於光照條件。"}, {"num": 6, "content": "植物在光下消耗二氧化碳並釋放氧氣，主要是哪一作用？ (Ａ)呼吸作用 (Ｂ)蒸散作用 (Ｃ)光合作用 (Ｄ)分解作用。", "ans": "C", "topic": "光合作用", "analysis": "光合作用利用光能、二氧化碳和水製造養分，並釋放氧氣；呼吸作用則會消耗氧氣。", "ext": "光合作用以二氧化碳和水為原料產生養分與氧；呼吸作用晝夜都進行，勿誤為只在夜間。"}, {"num": 7, "content": "人體腎臟主要參與哪一項功能？ (Ａ)過濾血液並形成尿液 (Ｂ)吸入氧氣 (Ｃ)消化澱粉 (Ｄ)製造骨骼。", "ans": "A", "topic": "排泄器官", "analysis": "腎臟過濾血液，調節水分與溶質並排除含氮廢物，最後形成尿液。", "ext": "皮膚排汗、肺呼出二氧化碳也是排除廢物途徑；膀胱僅儲存尿液，並不負責製造尿液。"}, {"num": 8, "content": "發燒時醫師不一定立即使用抗生素，因為抗生素主要針對哪一類病原？ (Ａ)所有病毒 (Ｂ)所有真菌 (Ｃ)過敏原 (Ｄ)細菌。", "ans": "D", "topic": "抗生素使用", "analysis": "抗生素主要用來抑制或殺死細菌，對病毒感染通常無效，因此發燒不必然適用抗生素。", "ext": "感冒多由病毒引起，抗生素無效；濫用會篩選出抗藥性細菌，用藥須遵醫囑完成療程。"}, {"num": 9, "content": "將紅色石蕊試紙放入石灰水，試紙最可能如何變化？ (Ａ)變紅 (Ｂ)變藍 (Ｃ)變黑 (Ｄ)完全溶解。", "ans": "B", "topic": "酸鹼指示劑", "analysis": "石灰水呈鹼性，會使紅色石蕊試紙變藍；酸性溶液才使藍色石蕊變紅。", "ext": "石蕊遇酸變紅、遇鹼變藍；紫色高麗菜汁遇酸變紅、遇鹼變綠，為常用天然指示劑。"}, {"num": 10, "content": "酸性與鹼性溶液以適當比例混合後，酸鹼性可能趨近中性。這種反應稱為什麼？ (Ａ)燃燒 (Ｂ)蒸發 (Ｃ)中和 (Ｄ)凝固。", "ans": "C", "topic": "中和反應", "analysis": "酸與鹼適量反應，使氫離子與氫氧根離子形成水並使酸鹼性趨近中性，稱為中和。", "ext": "中和生成鹽類與水並放熱；胃藥制酸劑、以熟石灰改良酸性土壤都是中和的生活應用。"}, {"num": 11, "content": "汽水開瓶後冒出氣泡，主要是因為哪一種氣體逸出？ (Ａ)二氧化碳 (Ｂ)氧氣 (Ｃ)氮氣 (Ｄ)氫氣。", "ans": "A", "topic": "氣體溶解度", "analysis": "汽水在高壓下溶入二氧化碳，開瓶後壓力降低，二氧化碳溶解度下降而形成氣泡逸出。", "ext": "氣體溶解度隨壓力增大、溫度降低而增加；搖晃或加溫汽水都會使氣泡加速逸出。"}, {"num": 12, "content": "小明用排水集氣法收集氣體，最適合收集哪一類氣體？ (Ａ)極易溶於水 (Ｂ)一接觸水就爆炸 (Ｃ)一定比水重的固體 (Ｄ)不易溶於水且不與水反應。", "ans": "D", "topic": "氣體收集", "analysis": "排水集氣需氣體不易溶於水且不與水反應，才能把水排開並留在集氣瓶中。", "ext": "氧氣、氫氣難溶於水適用排水集氣法；二氧化碳可溶於水且較空氣重，改用向上排空氣法。"}, {"num": 13, "content": "一杯鹽水的水分完全蒸發後，鹽仍留下，最能說明什麼？ (Ａ)鹽沒有隨水一起蒸發 (Ｂ)水變成鹽 (Ｃ)鹽變成氧氣 (Ｄ)蒸發是化學變化。", "ans": "A", "topic": "蒸發分離", "analysis": "蒸發時水變成水蒸氣逸出，不易揮發的鹽仍留在容器中；這並不代表水變成鹽。", "ext": "蒸發結晶可取出溶於水中的鹽；過濾只能分離不溶性固體，兩種分離法適用對象不同。"}, {"num": 14, "content": "下列哪一項能加快固體溶於水的速度，但不一定增加其最終最大溶解量？ (Ａ)攪拌 (Ｂ)增加溶質顆粒大小 (Ｃ)降低接觸面積 (Ｄ)靜置。", "ans": "A", "topic": "溶解速率", "analysis": "攪拌會帶走溶質表面較濃的溶液，使新鮮水持續接觸溶質而加快溶解，但在固定溫度下不必然改變溶解度。", "ext": "攪拌、加溫、磨碎增加接觸面積皆加快溶解；但固定溫度下最大溶解量不因攪拌而改變。"}, {"num": 15, "content": "飛行中的球受到重力作用，重力方向通常指向哪裡？ (Ａ)球前進方向 (Ｂ)正上方 (Ｃ)地心方向 (Ｄ)水平方向。", "ans": "C", "topic": "重力方向", "analysis": "地球附近物體所受重力方向指向地球中心，與球當時的飛行方向無關。", "ext": "重力即地球引力，方向恆指向地心；拋出的球飛行中持續受重力，軌跡因而呈拋物線。"}, {"num": 16, "content": "桌面上的書靜止不動，向下重力與桌面向上的支持力關係為何？ (Ａ)都向下 (Ｂ)重力較大所以書加速 (Ｃ)支持力不存在 (Ｄ)大小相等、方向相反。", "ans": "D", "topic": "二力平衡", "analysis": "書靜止表示合力為零，向下重力與向上支持力大小相等、方向相反。", "ext": "平衡二力作用於同一物體（書）；書壓桌面與桌面撐書才是作用力與反作用力，勿混淆。"}, {"num": 17, "content": "使用長柄扳手比短柄扳手較容易轉動螺帽，主要因為什麼？ (Ａ)抗力臂較長 (Ｂ)摩擦力完全消失 (Ｃ)螺帽質量變小 (Ｄ)施力臂較長。", "ans": "D", "topic": "力矩槓桿", "analysis": "扳手以螺帽為轉軸，長柄增加施力臂，同樣施力可產生較大力矩，所以較易轉動。", "ext": "力矩等於施力乘施力臂，施力臂愈長愈省力；門把裝在離門軸最遠處即同一原理。"}, {"num": 18, "content": "升降旗時使用定滑輪，手向下拉繩而旗子向上升，表示定滑輪可以什麼？ (Ａ)使所需力變為零 (Ｂ)改變旗子質量 (Ｃ)改變施力方向 (Ｄ)儲存電能。", "ans": "C", "topic": "滑輪原理", "analysis": "定滑輪使繩子一端向下時另一端向上，能改變施力方向，但理想情況不省力。", "ext": "定滑輪只改變施力方向不省力；動滑輪省一半力但繩需拉更長，滑輪組兼具兩者優點。"}, {"num": 19, "content": "腳踏車前齒輪 48 齒、後齒輪 16 齒，前齒輪轉 1 圈，鏈條帶動後齒輪約轉幾圈？ (Ａ)1/3 圈 (Ｂ)1圈 (Ｃ)3 圈 (Ｄ)16 圈。", "ans": "C", "topic": "齒輪傳動", "analysis": "鏈條移動的齒數相同，前齒輪轉一圈帶過 48 齒，後齒輪每圈 16 齒，因此轉 48÷16＝3 圈。", "ext": "嚙合或鏈條傳動齒數比為轉速反比，大輪帶小輪轉速變快；後齒輪愈小車速愈快但愈費力。"}, {"num": 20, "content": "拔河時鞋底刻紋有助於不滑倒，主要是增加哪裡的摩擦力？ (Ａ)手與空氣之間 (Ｂ)鞋底與地面之間 (Ｃ)繩與天空之間 (Ｄ)身體內部。", "ans": "B", "topic": "摩擦力", "analysis": "鞋底刻紋增加鞋底與地面的抓地與摩擦，使人受到足夠水平作用力而不易滑倒。", "ext": "增加接觸面粗糙度可增大摩擦；輪胎胎紋兼能排水防滑，機件加潤滑油則為減少摩擦。"}, {"num": 21, "content": "在同一介質中，聲音的響度較大通常表示聲源振動的什麼較大？ (Ａ)振幅 (Ｂ)波速 (Ｃ)頻率 (Ｄ)音色。", "ans": "A", "topic": "聲音三要素", "analysis": "聲源振幅愈大，傳遞的能量通常愈多，聽到的響度愈大；頻率主要決定音調。", "ext": "響度由振幅決定、音調由頻率決定、音色由波形決定可辨樂器，三要素對應勿混淆。"}, {"num": 22, "content": "把耳朵貼在門板上，可清楚聽到他人敲擊門板另一面的聲音，最能說明聲音可以如何？ (Ａ)只能在真空傳播 (Ｂ)經固體傳播 (Ｃ)轉變成磁力穿門 (Ｄ)完全不需介質。", "ans": "B", "topic": "聲音傳播", "analysis": "門板受敲擊後振動並把聲波傳到另一側，證明聲音能經固體傳播，並非不需要介質。", "ext": "聲音傳播速率固體大於液體大於氣體，真空不能傳聲；太空中無介質故無法直接交談。"}, {"num": 23, "content": "用凸透鏡把陽光聚在紙上可能使紙升溫，主要是因為凸透鏡能使平行光如何？ (Ａ)完全平行不變 (Ｂ)會聚 (Ｃ)全部吸收 (Ｄ)變成聲音。", "ans": "B", "topic": "凸透鏡", "analysis": "凸透鏡能使近似平行的太陽光會聚到焦點附近，能量集中使紙張升溫。", "ext": "凸透鏡會聚光線，可作放大鏡與老花眼鏡；凹透鏡使光發散，用於矯正近視眼。"}, {"num": 24, "content": "平面鏡成像時，人向鏡面前進 1 公尺，人與像的距離會減少多少？ (Ａ)0.5 公尺 (Ｂ)1 公尺 (Ｃ)4 公尺 (Ｄ)2 公尺。", "ans": "D", "topic": "平面鏡成像", "analysis": "人向鏡面前進 1 公尺時，像也在鏡後向鏡面前進 1 公尺，因此人與像的距離共減少 2 公尺。", "ext": "平面鏡成正立等大的虛像且左右相反；像與物到鏡面的距離永遠相等，故距離變化加倍。"}, {"num": 25, "content": "夏天穿淺色衣服通常較不易吸熱，主要因為淺色表面如何？ (Ａ)反射較多輻射 (Ｂ)導熱一定最快 (Ｃ)吸收所有輻射 (Ｄ)不受太陽照射。", "ans": "A", "topic": "熱輻射", "analysis": "淺色表面對太陽輻射的反射比例較高、吸收較少，因此通常較不易升溫。", "ext": "深色表面吸收與放出輻射熱的能力都強；太陽能熱水器集熱板漆成黑色即為加強吸熱。"}, {"num": 26, "content": "在密閉房間只開電風扇，人會感到涼快，主要是因為什麼？ (Ａ)電風扇降低房內所有物體溫度至零 (Ｂ)空氣流動加快汗液蒸發與散熱 (Ｃ)空氣停止對流 (Ｄ)風把熱轉成光。", "ans": "B", "topic": "蒸發散熱", "analysis": "風加速汗液蒸發並帶走皮膚附近的熱和潮溼空氣，所以人感到涼快；它不會把整間房降至零度。", "ext": "蒸發吸熱故酒精擦拭覺涼；電風扇不會降低氣溫，密閉房久吹馬達放熱反使室溫略升。"}, {"num": 27, "content": "一瓶水結冰後體積變大，最可能造成哪一現象？ (Ａ)水的質量變為零 (Ｂ)瓶內氣壓必變成真空 (Ｃ)冰一定沉入水底 (Ｄ)裝太滿的密閉玻璃瓶可能破裂。", "ans": "D", "topic": "水的特性", "analysis": "水結冰會膨脹，若密閉玻璃瓶裝得太滿，冰對瓶壁施加壓力，可能使瓶子破裂。", "ext": "水結冰體積約增加十分之一，密度變小故冰浮於水面；寒流時水管凍裂為同一原理。"}, {"num": 28, "content": "砂岩中可見一層一層的構造，最可能與哪一過程有關？ (Ａ)岩漿快速噴出 (Ｂ)沉積物分層堆積 (Ｃ)金屬熔化 (Ｄ)生物呼吸。", "ans": "B", "topic": "沉積岩", "analysis": "砂粒等沉積物在不同時期逐層堆積、壓密膠結，會在砂岩中留下層理。", "ext": "沉積岩常見層理與化石；依顆粒由大到小分為礫岩、砂岩、頁岩，是分類的常考依據。"}, {"num": 29, "content": "山崩後裸露坡地種植深根植物，主要有何作用？ (Ａ)增加土石鬆動 (Ｂ)阻止所有降雨 (Ｃ)使坡度變陡 (Ｄ)根系固定土壤、減少侵蝕。", "ans": "D", "topic": "水土保持", "analysis": "深根植物的根系能抓住土壤並減緩地表逕流沖刷，降低坡面侵蝕和土石滑動風險。", "ext": "植被可截留雨水、根系抓緊土壤；陡坡濫墾濫伐使土壤裸露，豪雨時易引發土石流。"}, {"num": 30, "content": "海嘯多由海底哪一種事件引起？ (Ａ)每日潮汐 (Ｂ)強烈地震造成海床突然位移 (Ｃ)海風吹拂 (Ｄ)月相改變。", "ans": "B", "topic": "海嘯成因", "analysis": "海底強震若造成海床突然上下位移，會推動大量海水形成長波，傳到岸邊可能成為海嘯。", "ext": "海嘯在外海波高不明顯，近岸因水變淺而急遽增高；海水異常退去是來襲前兆應速避難。"}, {"num": 31, "content": "冷鋒通過臺灣時，常見哪一種天氣變化？ (Ａ)氣溫持續上升且無雲 (Ｂ)氣溫下降並可能降雨 (Ｃ)完全無風 (Ｄ)日照時間立刻增加數小時。", "ans": "B", "topic": "鋒面天氣", "analysis": "冷鋒通過時冷空氣取代暖空氣，常伴隨雲雨、風向改變與氣溫下降。", "ext": "冷鋒過境後氣溫驟降轉晴；滯留鋒徘徊造成五、六月梅雨，各鋒面天氣特徵需分清。"}, {"num": 32, "content": "相同大小的月亮有時看起來特別大，可能與地景造成的視覺錯覺有關；下列哪一說法正確？ (Ａ)肉眼感覺大小不等於月球真的突然變大 (Ｂ)地球停止自轉 (Ｃ)月球會吸收地景 (Ｄ)月球每晚質量劇增。", "ans": "A", "topic": "月亮錯覺", "analysis": "月亮靠近地平線時常受周遭地景比較而產生月亮錯覺，視覺上變大不代表月球體積或質量突然改變。", "ext": "月球軌道為橢圓，近地點滿月確實稍大稱超級月亮，與地平線附近的視覺錯覺成因不同。"}, {"num": 33, "content": "若晚上 8 時看到某星在東方低空，數小時後通常會往哪一方向移動？ (Ａ)更向東且永不升高 (Ｂ)向西側天空移動 (Ｃ)固定原處 (Ｄ)直線落向地面。", "ans": "B", "topic": "星空視運動", "analysis": "地球自轉造成星空由東向西的視運動，因此東方低空的星數小時後會升高並移向西側天空。", "ext": "地球自轉使星星每小時約西移15度；同一星座每天提早約4分鐘升起，隨季節更替。"}, {"num": 34, "content": "從新月到下一次新月大約經過多久？ (Ａ)24 小時 (Ｂ)7 天 (Ｃ)29.5 天 (Ｄ)15 天。", "ans": "C", "topic": "朔望月", "analysis": "從一次新月到下一次新月是一個朔望月，平均約 29.5 天。", "ext": "農曆依朔望月制定，初一為朔、十五前後為望；恆星月27.3天與朔望月29.5天不同。"}, {"num": 35, "content": "繪製實驗圖表時，應變變因通常適合放在哪一軸？ (Ａ)橫軸 (Ｂ)圖外不標示 (Ｃ)縱軸 (Ｄ)任意且不需單位。", "ans": "C", "topic": "圖表繪製", "analysis": "圖表通常把主動改變的操作變因放橫軸，把量測結果即應變變因放縱軸，且兩軸都應標示名稱與單位。", "ext": "橫軸放操作變因、縱軸放應變變因並標單位；連續資料用折線圖，分類比較用長條圖。"}, {"num": 36, "content": "在本實驗條件下，哪一組產氣最多？ (Ａ)甲 (Ｂ)丁 (Ｃ)丙 (Ｄ)乙。", "ans": "D", "topic": "酵母發酵", "analysis": "氣球周長可作為產氣量指標，乙組周長 14 cm 最大，因此在本條件下產氣最多。", "ext": "酵母菌分解糖產生二氧化碳與酒精；麵團膨脹、釀酒皆為發酵應用，產氣使氣球脹大。", "gr": "第 36–40 題", "gi": "學生把等量酵母菌與糖水放入相同瓶中，套上氣球，20 分鐘後量氣球周長：\n\n組別｜溫度｜糖水濃度｜氣球周長\n甲｜10°C｜5%｜3 cm\n乙｜30°C｜5%｜14 cm\n丙｜50°C｜5%｜2 cm\n丁｜30°C｜0%（清水）｜1 cm"}, {"num": 37, "content": "比較甲、乙、丙，主要研究哪一因素？ (Ａ)酵母菌種類 (Ｂ)糖水濃度 (Ｃ)氣球材質 (Ｄ)溫度。", "ans": "D", "topic": "變因控制", "analysis": "甲、乙、丙的酵母量、糖水濃度與時間相同，只有溫度為 10、30、50°C 不同，故研究溫度因素。", "ext": "一組比較只探討一個操作變因；若同時改變溫度與糖水濃度，便無法判斷差異的原因。"}, {"num": 38, "content": "乙與丁的結果可支持哪一項推論？ (Ａ)在 30°C 時，糖可供酵母菌利用並產氣 (Ｂ)糖會殺死所有酵母菌 (Ｃ)清水能產生最多氣體 (Ｄ)氣球周長與產氣量無關。", "ans": "A", "topic": "對照組設計", "analysis": "乙與丁皆為 30°C，差別是乙有 5% 糖水而丁為清水；乙產氣明顯較多，支持糖可供酵母利用產氣。", "ext": "丁組清水為對照組，可排除無糖也產氣的可能，凸顯糖是酵母大量產氣的必要條件。"}, {"num": 39, "content": "丙的氣球較小，最合理的解釋為何？ (Ａ)50°C 可能不利酵母菌活性 (Ｂ)糖水在 50°C 變成氧氣 (Ｃ)氣球質量消失 (Ｄ)50°C 一定沒有熱能。", "ans": "A", "topic": "酵素活性", "analysis": "丙與乙同為 5% 糖水，但 50°C 時產氣大幅減少，合理推測高溫抑制酵母酵素活性或傷害細胞。", "ext": "酵素有最適溫度，高溫使酵素變性失效且無法恢復；低溫僅活性降低，回溫後可恢復。"}, {"num": 40, "content": "若要確認結果穩定，最適當的做法為何？ (Ａ)只保留乙組 (Ｂ)各組重複數次並取平均 (Ｃ)每組改用不同大小氣球 (Ｄ)同時改變酵母量與時間。", "ans": "B", "topic": "實驗信度", "analysis": "各組依相同步驟重複數次並取平均，可降低瓶子、氣球與操作造成的偶然差異。", "ext": "重複實驗取平均可降低偶然誤差；異常值應追查原因而非直接刪除，次數愈多愈可信。"}, {"num": 41, "content": "哪一支吸管笛音調最高？ (Ａ)乙 (Ｂ)丁 (Ｃ)丙 (Ｄ)甲。", "ans": "D", "topic": "音調與頻率", "analysis": "音調隨頻率升高而升高，甲的 800 Hz 為四支最高，因此音調最高。", "ext": "頻率愈高音調愈高；人耳可聽約20至20000赫茲，蝙蝠與狗能聽見更高頻的超聲波。", "gr": "第 41–45 題", "gi": "小傑製作四支吸管笛，材質與管徑相同，只改變有效空氣柱長度；吹奏結果如下：\n\n吸管笛｜空氣柱長度｜測得頻率\n甲｜8 cm｜800 Hz\n乙｜12 cm｜540 Hz\n丙｜16 cm｜400 Hz\n丁｜20 cm｜320 Hz"}, {"num": 42, "content": "空氣柱長度與頻率大致有何關係？ (Ａ)愈長，頻率愈低 (Ｂ)完全無關 (Ｃ)長度加倍，頻率也一定加倍 (Ｄ)愈長，頻率愈高。", "ans": "A", "topic": "空氣柱振動", "analysis": "表中空氣柱由 8 cm 增至 20 cm 時，頻率由 800 Hz 降至 320 Hz，顯示愈長頻率愈低。", "ext": "管樂器以按孔改變空氣柱長度變音調；弦樂器則由弦的長短、粗細與鬆緊決定音調。"}, {"num": 43, "content": "丙與丁相比，哪一支音調較低？ (Ａ)甲 (Ｂ)乙 (Ｃ)丁 (Ｄ)丙。", "ans": "C", "topic": "音調比較", "analysis": "丁的頻率 320 Hz 低於丙的 400 Hz，因此丁的音調較低。", "ext": "長管音低、短管音高，排笛依長短排列；敲水杯水多音低，吹瓶口水多音高，振動主體不同。"}, {"num": 44, "content": "若製作一支空氣柱長 10 cm 的吸管笛，其頻率最可能介於哪兩者之間？ (Ａ)乙與丙 (Ｂ)丙與丁 (Ｃ)甲與乙 (Ｄ)不可能估計。", "ans": "C", "topic": "內插估計", "analysis": "10 cm 介於甲的 8 cm 與乙的 12 cm 之間，依趨勢其頻率應介於 800 Hz 與 540 Hz，即甲、乙之間。", "ext": "在資料範圍內依趨勢估計稱內插，較可靠；超出範圍的外推風險大，估計值僅為近似。"}, {"num": 45, "content": "若改用更大的力吹同一支吸管笛，最直接、明顯的變化通常是什麼？ (Ａ)空氣柱長度自動增加 (Ｂ)聲音無法傳播 (Ｃ)頻率必降為一半 (Ｄ)響度增大。", "ans": "D", "topic": "響度與振幅", "analysis": "對同一吸管笛更用力吹，主要增加振動振幅與聲音能量，所以響度變大；空氣柱長度未變，基本頻率通常近似不變。", "ext": "用力吹使振幅增大、響度變大；響度以分貝表示，長期處於高分貝環境會損害聽力。"}], "35": [{"num": 1, "content": "仙人掌的葉退化成刺後，主要由哪一個部位進行光合作用？ (Ａ)根 (Ｂ)花 (Ｃ)綠色莖 (Ｄ)果實。", "ans": "C", "topic": "植物適應", "analysis": "仙人掌的葉退化成刺可減少水分散失；含葉綠素的綠色莖接替葉片進行光合作用。", "ext": "仙人掌的刺可減少蒸散並防止動物啃食；儲水組織位於肥厚的綠色莖中。"}, {"num": 2, "content": "將一段帶葉芹菜插入紅色水中，數小時後葉脈出現紅色。紅色水主要經由哪個構造向上運輸？ (Ａ)木質部 (Ｂ)韌皮部 (Ｃ)氣孔 (Ｄ)表皮。", "ans": "A", "topic": "維管束運輸", "analysis": "根吸收的水和礦物質會經木質部向上運送，因此紅色水會染紅葉脈中的木質部。", "ext": "木質部將水和礦物質向上運送；韌皮部運送葉片製造的養分，可向上或向下。"}, {"num": 3, "content": "下列哪一組動物都屬於完全變態？ (Ａ)蟬、蟋蟀 (Ｂ)蝴蝶、蚊子 (Ｃ)蜻蜓、螳螂 (Ｄ)蟑螂、蝗蟲。", "ans": "B", "topic": "昆蟲變態", "analysis": "蝴蝶和蚊子的生活史都有卵、幼蟲、蛹、成蟲四個階段，屬於完全變態；其餘各組沒有蛹期。", "ext": "完全變態有蛹期，如蝶、蛾、蚊、蠅、甲蟲；蟬、蝗蟲、蟑螂為不完全變態。"}, {"num": 4, "content": "某農田食物鏈為「稻米→蝗蟲→青蛙→蛇→鷹」。若難分解的農藥會在生物體內累積，通常哪種生物體內濃度最高？ (Ａ)鷹 (Ｂ)蝗蟲 (Ｃ)青蛙 (Ｄ)稻米。", "ans": "A", "topic": "生物放大", "analysis": "難分解的農藥會沿食物鏈產生生物放大，營養階層最高的鷹累積濃度通常最高。", "ext": "營養階層越高，難分解毒物累積濃度越高；能量傳遞則越往高階層越少。"}, {"num": 5, "content": "顯微鏡視野中的草履蟲正向左下方游動。若要讓牠留在視野中央，玻片應往哪個方向移？ (Ａ)右上 (Ｂ)右下 (Ｃ)左下 (Ｄ)左上。", "ans": "C", "topic": "顯微鏡操作", "analysis": "顯微鏡成像上下、左右相反；玻片往左下移，視野中的像會往右上移，可抵銷草履蟲向左下的位移。", "ext": "複式顯微鏡成上下左右相反的像；像偏向哪一方，玻片就往哪一方移動。"}, {"num": 6, "content": "要研究「光照時間是否影響豆苗高度」，下列哪一項最適合作為操作變因？ (Ａ)每次澆水量 (Ｂ)豆苗品種 (Ｃ)每日光照時數 (Ｄ)栽培土壤。", "ans": "C", "topic": "操作變因", "analysis": "研究光照時間的影響時，應主動改變每日光照時數，並控制品種、澆水量與土壤相同。", "ext": "操作變因是實驗中唯一主動改變的條件；其餘須保持相同的稱為控制變因。"}, {"num": 7, "content": "甲、乙為體積相同的實心物體，甲質量80克、乙質量120克。放入密度介於兩者之間的液體，最可能出現哪種情形？ (Ａ)甲、乙都浮 (Ｂ)甲、乙都沉 (Ｃ)甲沉、乙浮 (Ｄ)甲浮、乙沉。", "ans": "D", "topic": "浮沉與密度", "analysis": "同體積下甲質量較小、密度較低，乙密度較高；液體密度介於兩者之間時，甲浮而乙沉。", "ext": "物體密度小於液體密度會浮，大於則沉；同體積時質量較大者密度較大。"}, {"num": 8, "content": "四個相同盤子各裝50毫升水，下列哪一盤的水通常蒸發最快？ (Ａ)陰涼無風處 (Ｂ)溫暖有風處 (Ｃ)陰涼有風處 (Ｄ)溫暖無風處。", "ans": "B", "topic": "蒸發快慢", "analysis": "溫度高可使水分子較易逸出，風又能帶走水面附近的水蒸氣，因此溫暖有風時蒸發最快。", "ext": "溫度高、有風、表面積大都能加快蒸發；蒸發在任何溫度下皆可發生。"}, {"num": 9, "content": "鐵製品生鏽通常需要同時接觸哪兩種物質？ (Ａ)氮氣、陽光 (Ｂ)二氧化碳、鹽 (Ｃ)氧氣、油 (Ｄ)氧氣、水。", "ans": "D", "topic": "鐵生鏽", "analysis": "鐵生鏽需同時有氧氣和水；隔絕其中任一項即可明顯減慢鏽蝕。", "ext": "塗漆、上油或鍍鋅可隔絕氧氣與水而防鏽；鹽水環境會加速鐵生鏽。"}, {"num": 10, "content": "將呼出的氣體持續吹入澄清石灰水，石灰水變混濁，主要用來檢驗哪種氣體？ (Ａ)氧氣 (Ｂ)二氧化碳 (Ｃ)氮氣 (Ｄ)水蒸氣。", "ans": "B", "topic": "氣體檢驗", "analysis": "二氧化碳與石灰水反應會生成白色沉澱，使溶液混濁，所以可用此現象檢驗二氧化碳。", "ext": "氧氣可使餘燼復燃來檢驗；二氧化碳使澄清石灰水混濁且不助燃。"}, {"num": 11, "content": "某無色溶液會使藍色石蕊試紙變紅，該溶液最可能是 (Ａ)檸檬汁 (Ｂ)小蘇打水 (Ｃ)肥皂水 (Ｄ)石灰水。", "ans": "A", "topic": "酸鹼指示劑", "analysis": "藍色石蕊變紅表示溶液呈酸性；檸檬汁含酸，而小蘇打水、肥皂水和石灰水偏鹼性。", "ext": "酸使藍色石蕊變紅，鹼使紅色石蕊變藍；中性溶液不使石蕊變色。"}, {"num": 12, "content": "一杯水中同時混有食鹽與細砂，要分別取回細砂和食鹽，最合適的順序為 (Ａ)蒸發→過濾 (Ｂ)靜置→磁吸 (Ｃ)冷凍→過濾 (Ｄ)過濾→蒸發。", "ans": "D", "topic": "混合物分離", "analysis": "先過濾可讓細砂留在濾紙上，再蒸發濾液中的水，即可取回溶解的食鹽。", "ext": "過濾分離不溶的固體，蒸發取回已溶解的溶質；順序顛倒會使鹽砂混雜。"}, {"num": 13, "content": "兩顆相同電池串聯接一顆燈泡，通常比只接一顆電池時更亮，主要因為 (Ａ)燈泡變大 (Ｂ)導線變短 (Ｃ)電池提供的電壓增加 (Ｄ)燈絲變粗。", "ans": "C", "topic": "電池串聯", "analysis": "相同電池串聯時總電壓增加，使燈泡中的電流通常增大，亮度因而提高。", "ext": "電池串聯總電壓相加使燈更亮；電池並聯電壓不變但可供電較久。"}, {"num": 14, "content": "兩顆相同燈泡並聯接在電池上，其中一顆燒壞後，另一顆通常會 (Ａ)一定熄滅 (Ｂ)變成串聯 (Ｃ)使電池立刻失效 (Ｄ)仍可發亮。", "ans": "D", "topic": "並聯電路", "analysis": "並聯電路各支路彼此獨立，一個支路斷路不會切斷另一支路，所以另一顆仍可發亮。", "ext": "串聯電路一處斷路全部熄滅；並聯各支路獨立，一路斷不影響他路。"}, {"num": 15, "content": "使用相同鐵釘、電池與導線，要增強電磁鐵磁力，最合理的方法是 (Ａ)減少線圈圈數 (Ｂ)增加線圈圈數 (Ｃ)改用木棒 (Ｄ)拔掉電池。", "ans": "B", "topic": "電磁鐵", "analysis": "在鐵芯、電池和導線相同時，增加線圈圈數可增強線圈產生的磁場，使電磁鐵磁力變強。", "ext": "增加線圈圈數、加大電流或插入鐵芯，都能使電磁鐵磁力增強。"}, {"num": 16, "content": "一根輕桿以支點為中心保持平衡。左側距支點10公分處掛20公克重物，右側距支點40公分處應掛多少公克重物？ (Ａ)5 (Ｂ)2 (Ｃ)10 (Ｄ)80。", "ans": "A", "topic": "槓桿原理", "analysis": "槓桿平衡時兩側力矩相等，20×10＝m×40，得m＝5公克。", "ext": "槓桿平衡時施力×施力臂＝抗力×抗力臂；距支點越遠施力越省力。"}, {"num": 17, "content": "雨鞋鞋底做成凹凸紋，主要作用是 (Ａ)減少重力 (Ｂ)增加浮力 (Ｃ)增加摩擦力 (Ｄ)減少質量。", "ans": "C", "topic": "摩擦力應用", "analysis": "鞋底凹凸紋可增加接觸面的粗糙程度與排水效果，因而提高鞋底和地面的摩擦力。", "ext": "輪胎與鞋底刻紋是增加摩擦防滑；加潤滑油、裝滾輪則是減少摩擦。"}, {"num": 18, "content": "在抽成近似真空的玻璃罩內放置響鈴，即使看見鈴槌振動，聲音也會變得很小，最能說明 (Ａ)聲音只能在固體傳播 (Ｂ)聲音傳播需要介質 (Ｃ)真空使音調降低 (Ｄ)振動不會產生聲音。", "ans": "B", "topic": "聲音傳播", "analysis": "鈴槌仍振動卻幾乎聽不到聲音，表示聲音不能有效穿過近似真空，傳播需要物質介質。", "ext": "聲音可在固、液、氣體中傳播，固體中通常最快；真空完全不能傳聲。"}, {"num": 19, "content": "撥動同材質、同粗細且鬆緊相同的兩條弦，較短的弦發出的聲音通常 (Ａ)較低 (Ｂ)較小 (Ｃ)傳得較慢 (Ｄ)較高。", "ans": "D", "topic": "音調與頻率", "analysis": "材質、粗細和鬆緊相同時，短弦振動頻率較高，因此音調較高；音量則主要和振幅有關。", "ext": "弦越短、越細、越緊，振動頻率越高音調越高；音量大小取決於振幅。"}, {"num": 20, "content": "冬天開暖氣後，房間上方空氣通常較暖，主要因為 (Ａ)暖空氣密度小而上升 (Ｂ)暖空氣密度大而下沉 (Ｃ)冷空氣不會流動 (Ｄ)熱只向上傳導。", "ans": "A", "topic": "熱對流", "analysis": "空氣受熱後膨脹、密度變小而上升，較冷且密度較大的空氣下沉，形成對流。", "ext": "對流只發生於液體和氣體；冷氣裝高處、暖爐放低處可促進對流循環。"}, {"num": 21, "content": "夏天在陽光下，深色衣服通常比淺色衣服更熱，主要因為深色表面 (Ａ)反射較多輻射 (Ｂ)不會散熱 (Ｃ)吸收較多輻射 (Ｄ)能製造熱量。", "ans": "C", "topic": "熱輻射吸收", "analysis": "深色表面通常吸收較多太陽輻射、反射較少，因此在相同日照下升溫較明顯。", "ext": "深色粗糙面吸熱與放熱都較強；淺色光滑面反射多，適合夏天穿著。"}, {"num": 22, "content": "筷子斜插入水中，看起來像在水面處折彎，主要是光的哪種現象？ (Ａ)直線前進 (Ｂ)反射 (Ｃ)折射 (Ｄ)色散。", "ans": "C", "topic": "光的折射", "analysis": "光由水進入空氣時傳播方向改變，眼睛看到的是折射後光線的延長位置，所以筷子像折彎。", "ext": "光進出不同介質時速度改變而偏折；水中物體看起來變淺也是折射所致。"}, {"num": 23, "content": "從一次滿月到下一次滿月，平均約需 (Ａ)1日 (Ｂ)29.5日 (Ｃ)14.8日 (Ｄ)7日。", "ans": "B", "topic": "月相週期", "analysis": "月相盈虧的一個完整週期稱朔望月，平均約29.5日，因此相鄰兩次滿月也約隔29.5日。", "ext": "朔望月約29.5日是月相變化週期；月球繞地球公轉一圈約27.3日。"}, {"num": 24, "content": "地球上日夜交替的主要原因是 (Ａ)地球公轉 (Ｂ)太陽自轉 (Ｃ)月球公轉 (Ｄ)地球自轉。", "ans": "D", "topic": "晝夜成因", "analysis": "地球自轉使同一地點輪流面向和背向太陽，形成日夜交替；公轉主要與季節變化有關。", "ext": "自轉造成晝夜交替與太陽東升西落；公轉配合地軸傾斜造成四季變化。"}, {"num": 25, "content": "在北半球觀察北極星，北極星仰角大致可用來估計觀察地的 (Ａ)經度 (Ｂ)氣溫 (Ｃ)海拔 (Ｄ)緯度。", "ans": "D", "topic": "北極星定位", "analysis": "在北半球，北極星的仰角約等於當地北緯度，因此可用來估計緯度。", "ext": "北極星位於地軸延伸方向，整夜幾乎不動；觀察地緯度越高仰角越大。"}, {"num": 26, "content": "颱風中心附近常有「颱風眼」。下列敘述何者正確？ (Ａ)颱風眼一定無雲 (Ｂ)通過颱風眼後風雨可能再度增強 (Ｃ)颱風眼附近永遠無風雨 (Ｄ)進入颱風眼表示颱風已離開。", "ans": "B", "topic": "颱風結構", "analysis": "颱風眼內風雨可暫時較弱，但另一側眼牆隨後到達，風向改變且強風豪雨可能再度出現。", "ext": "颱風眼內氣流下沉、風雨暫歇；眼牆風雨最強，眼過後風向轉變再轉強。"}, {"num": 27, "content": "臺灣地震頻繁，最主要與哪項因素有關？ (Ａ)位於赤道 (Ｂ)四面環海 (Ｃ)河川短急 (Ｄ)位於板塊交界附近。", "ans": "D", "topic": "板塊運動", "analysis": "臺灣位於歐亞板塊與菲律賓海板塊交界附近，板塊運動頻繁釋放能量，因而地震多。", "ext": "臺灣位於歐亞板塊與菲律賓海板塊交界；地震、溫泉與地熱皆與此相關。"}, {"num": 28, "content": "在岩層中發現完整貝殼化石，該岩層最可能屬於 (Ａ)火成岩 (Ｂ)岩漿 (Ｃ)變質岩 (Ｄ)沉積岩。", "ans": "D", "topic": "岩石分類", "analysis": "沉積物能在較低溫、壓下掩埋生物遺骸並形成沉積岩，完整化石通常不易保存在熔融或強烈變質環境中。", "ext": "化石多保存於砂岩、頁岩、石灰岩等沉積岩；火成岩由岩漿冷卻形成。"}, {"num": 29, "content": "海水受太陽加熱成為水蒸氣，這個過程稱為 (Ａ)蒸發 (Ｂ)凝固 (Ｃ)凝結 (Ｄ)融化。", "ans": "A", "topic": "蒸發現象", "analysis": "液態海水在未達沸點時由表面變成水蒸氣，稱為蒸發。", "ext": "蒸發只在液面進行且任何溫度皆可發生；沸騰達沸點時整體劇烈汽化。"}, {"num": 30, "content": "海水潮汐週期性升降，主要受到 (Ａ)地球磁力 (Ｂ)海水鹽分 (Ｃ)月球引力 (Ｄ)海底火山。", "ans": "C", "topic": "潮汐成因", "analysis": "潮汐主要由月球引力造成，太陽引力也有影響，但月球是主要因素。", "ext": "一天約有兩次滿潮與兩次乾潮；農曆初一、十五前後常出現大潮。"}, {"num": 31, "content": "公平測試最重要的原則是 (Ａ)每次同時改變多項條件 (Ｂ)不必重複實驗 (Ｃ)除操作變因外盡量保持其他條件相同 (Ｄ)只記錄符合預期的結果。", "ans": "C", "topic": "公平測試", "analysis": "公平測試應只改變一項操作變因，其餘可能影響結果的條件盡量固定，才能判斷因果。", "ext": "一次只改變一項變因、其餘條件相同，結果差異才能歸因於操作變因。"}, {"num": 32, "content": "四株同品種豆苗分別每天照光0、4、8、12小時，兩週後平均高度為12、15、18、18公分。依資料最合理的結論是 (Ａ)光照越久一定越高 (Ｂ)0小時最適合生長 (Ｃ)光照與高度毫無關係 (Ｄ)8小時後增加光照未使高度再增加。", "ans": "D", "topic": "資料判讀", "analysis": "8小時和12小時組平均高度同為18公分，資料只支持在此範圍內增加到8小時後再延長光照沒有增高。", "ext": "結論只能限於實驗測試的範圍內，不能過度推論到未測試的條件。"}, {"num": 33, "content": "測試肥料對小白菜生長的影響時，設置「不加肥料、其他條件相同」的一組，主要功能是 (Ａ)增加操作變因 (Ｂ)減少樣本 (Ｃ)作為對照 (Ｄ)改變土壤種類。", "ans": "C", "topic": "對照組", "analysis": "不加肥料組是對照組，可與加肥料組比較，排除其他相同栽培條件造成的影響。", "ext": "對照組不施加實驗處理，作為比較基準，用以確認結果確由操作變因造成。"}, {"num": 34, "content": "同一實驗重複五次並取平均值，主要可 (Ａ)保證假設正確 (Ｂ)消除所有誤差 (Ｃ)降低偶然誤差的影響 (Ｄ)讓操作變因增加。", "ans": "C", "topic": "實驗誤差", "analysis": "多次重複並取平均可讓偶然偏高或偏低互相抵銷，降低偶然誤差，但不能保證假設正確或消除系統誤差。", "ext": "重複測量取平均可降低偶然誤差；儀器不準的系統誤差無法藉平均消除。"}, {"num": 35, "content": "加熱100毫升水，每分鐘記錄溫度：0分25℃、1分32℃、2分39℃、3分46℃。在這段時間，水溫平均每分鐘上升約 (Ａ)5℃ (Ｂ)7℃ (Ｃ)14℃ (Ｄ)21℃。", "ans": "B", "topic": "平均變化率", "analysis": "3分鐘內溫度由25℃升到46℃，平均升溫率＝(46－25)÷3＝7℃／分。", "ext": "平均升溫率＝總溫差÷總時間；水達沸點後持續加熱，溫度維持不變。"}, {"num": 36, "content": "清晨草葉上出現露珠，主要因為 (Ａ)草葉排出液態水 (Ｂ)氧氣凝固 (Ｃ)地下水滲出 (Ｄ)空氣中水蒸氣遇冷凝結。", "ans": "D", "topic": "凝結現象", "analysis": "清晨草葉溫度較低，空氣中的水蒸氣遇冷凝結成液態小水滴，形成露珠。", "ext": "露是水蒸氣遇冷凝結成小水滴；氣溫低於0℃時水蒸氣凝華成霜。"}, {"num": 37, "content": "比較甲、乙，可探討哪項因素對溶解速率的影響？ (Ａ)水量 (Ｂ)顆粒大小 (Ｃ)水溫 (Ｄ)攪拌速度。", "ans": "B", "topic": "溶解速率", "analysis": "甲、乙只有方糖顆粒大小不同，水溫、水量、糖量和是否攪拌均相同，因此可探討顆粒大小。", "ext": "磨碎增加與水的接觸面積可加快溶解；公平比較須只有一項條件不同。", "gr": "第 37–39 題", "gi": "小安將5克同種方糖分別放入四杯100毫升的水中，其他操作如下：\n\n杯別｜水溫｜方糖處理｜攪拌｜完全溶解時間\n甲｜20℃｜整顆｜無｜420秒\n乙｜20℃｜磨碎｜無｜180秒\n丙｜20℃｜整顆｜有｜150秒\n丁｜60℃｜整顆｜無｜90秒"}, {"num": 38, "content": "要探討攪拌的影響，應比較 (Ａ)甲、丙 (Ｂ)甲、乙 (Ｃ)甲、丁 (Ｄ)乙、丁。", "ans": "A", "topic": "變因控制", "analysis": "甲、丙只有「是否攪拌」不同，其餘條件相同，是檢驗攪拌影響的公平比較。", "ext": "甲丁只差水溫可探討溫度影響；若兩組同時有兩項條件不同便無法比較。"}, {"num": 39, "content": "依資料可確定下列哪項結論？ (Ａ)水溫越高溶解量一定越多 (Ｂ)磨碎、攪拌或升溫都可能縮短溶解時間 (Ｃ)方糖質量越小溶解越慢 (Ｄ)攪拌會使糖消失。", "ans": "B", "topic": "溶解結論", "analysis": "相對於甲的420秒，磨碎、攪拌和升溫各組的溶解時間都較短；資料測的是速率，不能推論最終溶解量。", "ext": "溶解速率與溶解度不同；速率實驗不能推論最終能溶解的總量多寡。"}, {"num": 40, "content": "白天溶氧量上升，主要因為水草進行 (Ａ)光合作用 (Ｂ)呼吸作用 (Ｃ)蒸散作用 (Ｄ)消化作用。", "ans": "A", "topic": "光合作用", "analysis": "水草白天進行光合作用並釋放氧氣，當產氧量超過生物呼吸耗氧量時，箱內溶氧上升。", "ext": "光合作用需光，吸收二氧化碳並釋出氧氣；呼吸作用則日夜持續進行。", "gr": "第 40–42 題", "gi": "密閉透明箱中有水草、小魚、底砂與水。白天置於適量光線下，箱內溶氧量先上升；夜間則逐漸下降。"}, {"num": 41, "content": "夜間溶氧量下降的主要原因是 (Ａ)小魚停止游動 (Ｂ)水草停止吸水 (Ｃ)生物呼吸消耗氧氣 (Ｄ)底砂製造二氧化碳。", "ans": "C", "topic": "呼吸作用", "analysis": "夜間沒有光，水草無法進行光合作用，但水草、小魚及其他生物仍呼吸而消耗氧氣。", "ext": "動植物日夜皆行呼吸消耗氧氣；夜間光合作用停止，水中溶氧因而下降。"}, {"num": 42, "content": "若把箱子長期放在完全黑暗處，最可能先出現哪種變化？ (Ａ)溶氧量下降 (Ｂ)水草光合作用增強 (Ｃ)溶氧量持續增加 (Ｄ)小魚製造氧氣。", "ans": "A", "topic": "生態平衡", "analysis": "長期黑暗會使光合作用停止，卻仍有呼吸耗氧，因此溶氧量會先下降。", "ext": "長期黑暗使生產者停止產氧與造養分，生物終將因缺氧、缺食物死亡。"}, {"num": 43, "content": "單顆燈泡通常最亮的是 (Ａ)甲 (Ｂ)乙 (Ｃ)丙 (Ｄ)三者必相同。", "ans": "B", "topic": "串聯電壓", "analysis": "乙由兩顆電池串聯，總電壓通常高於甲與丙的一顆電池，因此乙的單顆燈泡通常最亮。", "ext": "兩電池串聯電壓加倍、燈較亮，但耗電較快且燈絲較易燒毀。", "gr": "第 43–45 題", "gi": "小庭把相同燈泡接成三種電路：甲為一顆電池接一顆燈泡；乙為兩顆電池串聯接一顆燈泡；丙為一顆電池接兩顆並聯燈泡。電池、燈泡均正常。"}, {"num": 44, "content": "丙電路若其中一顆燈泡燒壞，另一顆通常 (Ａ)仍可亮 (Ｂ)立即熄滅 (Ｃ)使電池反接 (Ｄ)變成電磁鐵。", "ans": "A", "topic": "並聯特性", "analysis": "丙的兩顆燈泡並聯，各有獨立支路；一支路因燈泡燒壞而斷路，另一支路仍是通路。", "ext": "家庭電器採並聯連接，各支路獨立，單一電器故障不影響其他電器。"}, {"num": 45, "content": "比較甲、乙兩電路時，本實驗的操作變因是 (Ａ)串聯電池顆數 (Ｂ)燈泡規格 (Ｃ)導線顏色 (Ｄ)燈泡外殼顏色。", "ans": "A", "topic": "操作變因", "analysis": "甲、乙比較時燈泡規格不變，主動改變的是串聯電池顆數，因此它是操作變因。", "ext": "兩組比較時唯一不同的條件是操作變因；被測量的結果是應變變因。"}], "36": [{"num": 1, "content": "人體吸收大部分養分的主要場所是 (Ａ)口腔 (Ｂ)胃 (Ｃ)小腸 (Ｄ)大腸。", "ans": "C", "topic": "消化吸收", "analysis": "小腸內壁有大量絨毛，可大幅增加吸收面積，是消化後養分進入血液的主要場所。", "ext": "小腸絨毛大幅增加吸收面積；大腸主要吸收水分，不吸收大部分養分。"}, {"num": 2, "content": "運動後心跳與呼吸加快，最主要是為了 (Ａ)讓身體降到冰點 (Ｂ)減少血液流動 (Ｃ)停止能量產生 (Ｄ)供應細胞更多氧氣並排出二氧化碳。", "ans": "D", "topic": "循環呼吸", "analysis": "運動時細胞呼吸加強，需要更多氧氣並產生較多二氧化碳，心跳與呼吸加快有助運送和排除氣體。", "ext": "運動時細胞呼吸加強，需氧與排碳增加；心跳恢復快慢可反映體能好壞。"}, {"num": 3, "content": "血液中能吞噬病菌、參與防禦的主要成分是 (Ａ)紅血球 (Ｂ)血小板 (Ｃ)白血球 (Ｄ)血漿中的水。", "ans": "C", "topic": "血液組成", "analysis": "白血球能吞噬病原或參與免疫反應；紅血球主要運氧，血小板主要協助凝血。", "ext": "紅血球含血紅素負責運氧，血小板協助凝血，血漿運送養分與廢物。"}, {"num": 4, "content": "鳥類具有中空骨骼，對飛行最直接的好處是 (Ａ)增加體重 (Ｂ)防止羽毛脫落 (Ｃ)增加體溫 (Ｄ)減輕身體重量。", "ans": "D", "topic": "鳥類適應", "analysis": "中空骨骼能在保有一定強度下減輕體重，降低飛行所需的能量。", "ext": "鳥另有氣囊輔助呼吸、胸肌發達、身體流線形，皆為適應飛行的特徵。"}, {"num": 5, "content": "種子萌發初期，在尚未長出綠葉前，主要利用 (Ａ)空氣中的礦物質 (Ｂ)葉片製造的澱粉 (Ｃ)子葉或胚乳儲存的養分 (Ｄ)花粉中的水。", "ans": "C", "topic": "種子萌發", "analysis": "萌發初期尚無綠葉可充分行光合作用，胚會消耗子葉或胚乳預先儲存的養分。", "ext": "種子萌發需水分、空氣與適當溫度；光照和土壤並非萌發必要條件。"}, {"num": 6, "content": "植物向光彎曲生長，這種反應最能幫助植物 (Ａ)避免根吸水 (Ｂ)增加光合作用機會 (Ｃ)停止蒸散 (Ｄ)減少二氧化碳吸收。", "ans": "B", "topic": "向光性", "analysis": "莖葉向光彎曲能讓葉片獲得較多光線，增加進行光合作用的機會。", "ext": "莖具向光性、根具向地性，皆是植物對環境刺激的生長反應。"}, {"num": 7, "content": "同一物種的親代與子代外形相似卻不完全相同，最合理的說法是 (Ａ)生物具有遺傳與變異 (Ｂ)生物只有遺傳沒有變異 (Ｃ)子代特徵全由環境決定 (Ｄ)所有差異都不能遺傳。", "ans": "A", "topic": "遺傳變異", "analysis": "子代與親代相似是遺傳，相同物種個體仍有差異是變異，兩者會同時存在。", "ext": "遺傳使親子相似，變異使個體間不同；變異提供天擇與演化的材料。"}, {"num": 8, "
