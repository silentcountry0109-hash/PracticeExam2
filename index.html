content": "生態池中的浮游植物大量減少，最先直接受影響的通常是 (Ａ)以浮游植物為食的動物 (Ｂ)池邊岩石 (Ｃ)水中的鹽類 (Ｄ)太陽光。", "ans": "A", "topic": "食物鏈", "analysis": "浮游植物是生產者，數量減少會先使直接以它為食的初級消費者失去食物來源。", "ext": "生產者減少會先衝擊初級消費者，影響再沿食物鏈逐級向上傳遞。"}, {"num": 9, "content": "乾電池的能量使小馬達轉動，主要能量轉換為 (Ａ)動能→化學能→光能 (Ｂ)化學能→電能→動能 (Ｃ)熱能→電能→化學能 (Ｄ)光能→聲能→動能。", "ans": "B", "topic": "能量轉換", "analysis": "電池儲存的化學能先轉換成電能，馬達再把電能主要轉成轉動的動能。", "ext": "電扇是電能轉動能、電燈轉光能；能量轉換過程常伴隨熱能散失。"}, {"num": 10, "content": "磁鐵靠近一枚未磁化鐵釘時能吸引鐵釘，這種力屬於 (Ａ)接觸力 (Ｂ)超距力 (Ｃ)摩擦力 (Ｄ)彈力。", "ans": "B", "topic": "超距力", "analysis": "磁鐵不必接觸鐵釘就能施力，因此磁力屬於超距力，而不是摩擦力或彈力。", "ext": "磁力、重力、靜電力皆為不需接觸的超距力；摩擦力、彈力屬接觸力。"}, {"num": 11, "content": "將指南針放在通電導線旁，指針偏轉；切斷電流後恢復。最能支持 (Ａ)電池內沒有能量 (Ｂ)磁場會產生陽光 (Ｃ)導線一定是磁鐵 (Ｄ)電流會產生磁場。", "ans": "D", "topic": "電流磁效應", "analysis": "只有通電時指南針偏轉，表示導線周圍因電流而產生磁場；斷電後磁場消失。", "ext": "厄斯特發現通電導線使磁針偏轉；電流方向相反時磁針偏轉方向也相反。"}, {"num": 12, "content": "用相同力量推木塊，木塊在磁磚上比在地毯上滑得遠，主要因為磁磚對木塊的 (Ａ)摩擦力較小 (Ｂ)重力較小 (Ｃ)浮力較大 (Ｄ)磁力較大。", "ans": "A", "topic": "摩擦力", "analysis": "在相同推力下，木塊於磁磚滑得較遠，表示阻礙運動的摩擦力較小。", "ext": "接觸面越粗糙、正向壓力越大，摩擦力越大；摩擦力方向與運動相反。"}, {"num": 13, "content": "物體做等速直線運動時，若水平方向受力互相平衡，物體會 (Ａ)維持原運動狀態 (Ｂ)逐漸加速 (Ｃ)立刻停止 (Ｄ)一定轉彎。", "ans": "A", "topic": "慣性定律", "analysis": "水平方向合力為零時，依慣性定律，物體會維持原來的等速直線運動狀態。", "ext": "合力為零時靜者恆靜、動者維持等速直線運動，即牛頓第一運動定律。"}, {"num": 14, "content": "斜面越長且高度相同，將物體推上去通常 (Ａ)越費力且距離較長 (Ｂ)越省力但移動距離較長 (Ｃ)越省力且距離較短 (Ｄ)不影響施力。", "ans": "B", "topic": "斜面省力", "analysis": "相同高度下，斜面越長可用較小的力克服重力，但物體需要移動較長距離。", "ext": "斜面、槓桿等簡單機械可省力但不省功；省力必定多費移動距離。"}, {"num": 15, "content": "理想定滑輪的主要功能是 (Ａ)改變施力方向 (Ｂ)省一半力 (Ｃ)增加物體重量 (Ｄ)減少繩長。", "ans": "A", "topic": "滑輪", "analysis": "理想定滑輪不省力，主要讓人能改變拉力方向，例如向下拉繩即可提升重物。", "ext": "定滑輪只改變施力方向不省力；動滑輪可省一半力但不改變方向。"}, {"num": 16, "content": "齒數10與30的兩齒輪互相咬合，小齒輪轉3圈時，大齒輪轉 (Ａ)1圈且方向相反 (Ｂ)1圈且方向相同 (Ｃ)9圈且方向相反 (Ｄ)9圈且方向相同。", "ans": "A", "topic": "齒輪傳動", "analysis": "齒輪轉數與齒數成反比，10×3＝30×1，所以大齒輪轉1圈；相互咬合的齒輪方向相反。", "ext": "咬合齒輪轉速與齒數成反比且轉向相反；皮帶連接的兩輪轉向相同。"}, {"num": 17, "content": "同一音叉敲得更用力，主要改變聲音的 (Ａ)音調 (Ｂ)頻率 (Ｃ)傳播速度 (Ｄ)音量。", "ans": "D", "topic": "音量振幅", "analysis": "敲得更用力使音叉振幅較大，所以音量增大；音叉本身頻率及音調大致不變。", "ext": "音量由振幅決定，音調由頻率決定，音色則可分辨不同的發聲體。"}, {"num": 18, "content": "閃電發生後先看見光、後聽到雷聲，主要因為 (Ａ)雷聲較晚產生 (Ｂ)光速比聲速快 (Ｃ)聲音不能在空氣傳播 (Ｄ)眼睛比耳朵靠近天空。", "ans": "B", "topic": "光速聲速", "analysis": "光在空氣中的速度遠高於聲音，所以同一次放電產生的閃光會先被看見。", "ext": "空氣中聲速約每秒340公尺；見閃電後計秒數可估算閃電的距離。"}, {"num": 19, "content": "平面鏡中的像與物體相比，正確的是 (Ａ)像距等於物距 (Ｂ)上下顛倒 (Ｃ)一定放大 (Ｄ)可投影在白紙上。", "ans": "A", "topic": "平面鏡成像", "analysis": "平面鏡成正立、等大虛像，像在鏡後的距離等於物體在鏡前的距離，不能投影到白紙上。", "ext": "平面鏡成正立、等大、左右相反的虛像；虛像無法投影在屏幕上。"}, {"num": 20, "content": "白光通過三稜鏡形成色帶時，下列哪一種色光通常偏折較大？ (Ａ)紅光 (Ｂ)白光完全不偏折 (Ｃ)所有色光偏折相同 (Ｄ)紫光。", "ans": "D", "topic": "光的色散", "analysis": "不同色光折射程度不同，通常紫光偏折較大、紅光較小，因而形成色帶。", "ext": "白光經稜鏡分成紅到紫的色帶；紅光偏折最小、紫光最大，彩虹同理。"}, {"num": 21, "content": "保溫瓶的真空夾層主要減少哪兩種熱傳方式？ (Ａ)輻射與蒸發 (Ｂ)傳導與對流 (Ｃ)凝固與熔化 (Ｄ)折射與反射。", "ans": "B", "topic": "保溫原理", "analysis": "真空中缺少粒子，可大幅抑制需要物質傳遞的傳導與對流；輻射仍可穿過真空。", "ext": "真空夾層阻隔傳導與對流；內壁鍍銀光亮面可反射輻射減少散熱。"}, {"num": 22, "content": "100克、20℃的水與100克、60℃的水混合，忽略散熱，平衡溫度最接近 (Ａ)20℃ (Ｂ)30℃ (Ｃ)40℃ (Ｄ)60℃。", "ans": "C", "topic": "熱量平衡", "analysis": "兩份水質量及比熱相同且忽略散熱，平衡溫度為加權平均：(20＋60)÷2＝40℃。", "ext": "等質量同種液體混合末溫為兩者平均；質量不等時末溫偏向質量大者。"}, {"num": 23, "content": "密閉罐內冰塊融化成水後，整罐總質量會 (Ａ)增加 (Ｂ)不變 (Ｃ)減少 (Ｄ)先增後減。", "ans": "B", "topic": "質量守恆", "analysis": "罐子密閉，冰只是由固態變成液態，物質沒有進出，因此整罐總質量不變。", "ext": "密閉系統內物態變化與化學反應總質量都不變；冰融成水後體積變小。"}, {"num": 24, "content": "一杯飽和食鹽水底部已有未溶食鹽。若只加入少量清水並充分攪拌，最可能 (Ａ)更多食鹽析出 (Ｂ)部分食鹽繼續溶解 (Ｃ)食鹽全部變氣體 (Ｄ)水立刻沸騰。", "ans": "B", "topic": "飽和溶液", "analysis": "加水使原飽和溶液被稀釋，水量增加後可再溶解部分底部食鹽，直到重新達到飽和。", "ext": "飽和溶液無法再溶解同種溶質；加水或升溫多可使食鹽類固體續溶。"}, {"num": 25, "content": "蠟燭燃燒屬於化學變化，最有力的證據是 (Ａ)蠟受熱熔化 (Ｂ)燭芯變短 (Ｃ)產生性質不同的新物質 (Ｄ)火焰會發光。", "ans": "C", "topic": "化學變化", "analysis": "化學變化的核心證據是產生性質不同的新物質；熔化只是蠟的物態改變。", "ext": "化學變化產生新物質，如燃燒、生鏽；物理變化只改變形態，如熔化。"}, {"num": 26, "content": "山區迎風坡常比背風坡多雨，主要因為潮濕空氣 (Ａ)被岩石吸收 (Ｂ)下沉升溫凝結 (Ｃ)沿山坡上升冷卻凝結 (Ｄ)失去氧氣。", "ans": "C", "topic": "地形雨", "analysis": "潮濕空氣受山地抬升後膨脹冷卻，水蒸氣凝結成雲雨，因此迎風坡降雨較多。", "ext": "背風坡空氣下沉增溫、水氣少而乾燥，形成雨影區與類似焚風現象。"}, {"num": 27, "content": "天氣圖上等壓線越密集的區域，通常表示 (Ａ)氣壓差較小、風弱 (Ｂ)氣壓差較大、風強 (Ｃ)絕對不下雨 (Ｄ)溫度必為0℃。", "ans": "B", "topic": "等壓線", "analysis": "等壓線越密代表相同距離內氣壓差越大，氣壓梯度較強，風速通常較大。", "ext": "風由高壓吹向低壓，氣壓梯度越大風越強；颱風附近等壓線最密集。"}, {"num": 28, "content": "冷鋒通過臺灣時，較常見的變化是 (Ａ)冷空氣推進、氣溫下降 (Ｂ)暖空氣停留、氣溫持續上升 (Ｃ)完全無雲 (Ｄ)潮汐停止。", "ans": "A", "topic": "鋒面天氣", "analysis": "冷鋒是冷空氣推進並抬升暖空氣，通過時常伴隨雲雨、風向改變及氣溫下降。", "ext": "冷鋒過境常有短暫強降雨且氣溫驟降；五、六月梅雨則由滯留鋒造成。"}, {"num": 29, "content": "月食發生時，三個天體由光源方向依序大致為 (Ａ)太陽－月球－地球 (Ｂ)月球－太陽－地球 (Ｃ)地球－太陽－月球 (Ｄ)太陽－地球－月球。", "ans": "D", "topic": "月食成因", "analysis": "月食發生時地球位於太陽與月球之間，月球進入地球影子，所以順序為太陽－地球－月球。", "ext": "月食發生於農曆十五前後的滿月；日食則發生於初一朔月時。"}, {"num": 30, "content": "四季變化的主要原因是地球 (Ａ)自轉速度改變 (Ｂ)與太陽距離每天大幅改變 (Ｃ)公轉且地軸傾斜 (Ｄ)月球遮光。", "ans": "C", "topic": "四季成因", "analysis": "地球公轉時地軸維持傾斜，使各半球一年中接受太陽照射角度與日照時間改變，形成四季。", "ext": "地軸傾斜約23.5度使太陽直射點南北移動；日地距離並非四季主因。"}, {"num": 31, "content": "海邊白天常吹海風，主要因為 (Ａ)海洋升溫比陸地快 (Ｂ)海水不吸熱 (Ｃ)陸地上方暖空氣上升，海上較冷空氣補入 (Ｄ)月球把風拉向陸地。", "ans": "C", "topic": "海陸風", "analysis": "白天陸地升溫快，陸地上方暖空氣上升，較涼的海上空氣流向陸地補充，形成海風。", "ext": "海陸風源於海陸比熱差異；夜晚陸地降溫較快，風向改吹陸風。"}, {"num": 32, "content": "河川上游多V形谷、下游較多曲流，主要反映 (Ａ)下游從不沉積 (Ｂ)上游侵蝕作用通常較強 (Ｃ)上游水完全靜止 (Ｄ)河水由下游流向上游。", "ans": "B", "topic": "河流作用", "analysis": "上游坡陡流急，向下侵蝕作用較強，易形成V形谷；下游坡緩，側蝕與沉積較明顯而形成曲流。", "ext": "上游以侵蝕為主、中游搬運、下游沉積；曲流外側侵蝕、內側堆積。"}, {"num": 33, "content": "岩石受到日夜溫差而反覆熱脹冷縮、逐漸碎裂，屬於 (Ａ)搬運 (Ｂ)沉積 (Ｃ)風化 (Ｄ)凝結。", "ans": "C", "topic": "風化作用", "analysis": "岩石在原地因反覆熱脹冷縮而碎裂，屬於物理風化，尚未必發生搬運。", "ext": "風化是岩石在原地崩解或分解；侵蝕則有水、風、冰川等外力搬移。"}, {"num": 34, "content": "地震規模與震度的比較，何者正確？ (Ａ)規模描述各地搖晃程度 (Ｂ)同一地震各地規模不同 (Ｃ)震度只和震源能量有關 (Ｄ)同一地震只有一個規模，但各地震度可不同。", "ans": "D", "topic": "規模震度", "analysis": "規模表示地震釋放的能量，同一地震只有一個主要規模；震度表示各地搖晃程度，會因距離與地質而異。", "ext": "規模以小數表示地震釋放能量；震度分級表示搖晃，通常離震央近者大。"}, {"num": 35, "content": "一份實驗紀錄只寫「植物長得很好」，最大的問題是 (Ａ)缺乏可量化的觀察指標 (Ｂ)沒有使用放大鏡 (Ｃ)植物不能做實驗 (Ｄ)觀察時間太長。", "ans": "A", "topic": "科學紀錄", "analysis": "「長得很好」沒有明確尺度，無法客觀比較；應記錄高度、葉片數或質量等可量化指標。", "ext": "觀察紀錄應量化，如株高、葉片數；避免主觀形容詞才能客觀比較。"}, {"num": 36, "content": "測量擺長對擺動週期的影響時，下列何者應控制相同？ (Ａ)每次計時的擺動次數 (Ｂ)擺長 (Ｃ)實驗日期必須不同 (Ｄ)每組使用不同重力環境。", "ans": "A", "topic": "控制變因", "analysis": "擺長是操作變因時不可固定，計時的擺動次數等測量程序則應相同，才可公平比較週期。", "ext": "單擺週期主要受擺長影響；擺錘重量與擺動角度應控制相同。"}, {"num": 37, "content": "在此範圍內，每增加20克，彈簧伸長約 (Ａ)0.5公分 (Ｂ)1.0公分 (Ｃ)2.0公分 (Ｄ)10公分。", "ans": "B", "topic": "虎克定律", "analysis": "未掛時長10.0公分，掛20、40、60、80克依序每次增加1.0公分，因此每增20克伸長1.0公分。", "ext": "彈性限度內彈簧伸長量與外力成正比，這是彈簧秤測重的原理。", "gr": "第 37–39 題", "gi": "小文測量相同彈簧掛不同砝碼後的總長：未掛砝碼時10.0公分；掛20、40、60、80克時，總長分別為11.0、12.0、13.0、14.0公分，且都在彈性限度內。"}, {"num": 38, "content": "若掛50克，總長最可能約為 (Ａ)10.5公分 (Ｂ)11.5公分 (Ｃ)15.0公分 (Ｄ)12.5公分。", "ans": "D", "topic": "內插估計", "analysis": "50克介於40與60克之間，在線性且彈性限度內可內插：總長＝10＋50÷20×1＝12.5公分。", "ext": "線性關係可用內插法估中間值；超出實驗範圍外插的結果較不可靠。"}, {"num": 39, "content": "若取下80克砝碼後彈簧仍長14公分，最可能表示 (Ａ)尺刻度改變 (Ｂ)重力消失 (Ｃ)彈簧質量變零 (Ｄ)彈簧已超過彈性限度。", "ans": "D", "topic": "彈性限度", "analysis": "若取下外力後仍維持伸長，表示已產生永久形變；這項新觀察也表示「80克仍在彈性限度內」的原判斷不成立，實際上已超過彈性限度。", "ext": "超過彈性限度會產生永久形變無法復原，伸長量與外力也不再成正比。"}, {"num": 40, "content": "空氣最接近水蒸氣飽和的是 (Ａ)甲 (Ｂ)乙 (Ｃ)丁 (Ｄ)丙。", "ans": "C", "topic": "相對濕度", "analysis": "相對濕度越接近100%，空氣越接近水蒸氣飽和；四地中丁的95%最高。", "ext": "相對濕度100%表示空氣達飽和；氣溫下降可使未飽和空氣凝結成露霧。", "gr": "第 40–42 題", "gi": "四地同日觀測如下：甲25℃、濕度90%、陰雨；乙31℃、濕度55%、晴；丙18℃、濕度70%、晴；丁27℃、濕度95%、大雨。"}, {"num": 41, "content": "若只依表中資料，最不適合把衣服放戶外晾乾的是 (Ａ)甲 (Ｂ)乙 (Ｃ)丙 (Ｄ)丁。", "ans": "D", "topic": "蒸發條件", "analysis": "丁地濕度最高且正下大雨，空氣帶走水分的能力差，衣服也會被雨淋濕，最不利晾乾。", "ext": "濕度低、氣溫高、有風有日照利於晾衣；雨天濕度高，水分蒸發慢。"}, {"num": 42, "content": "乙地雖氣溫最高卻未必最悶濕，因為「悶濕感」還與哪項資料密切相關？ (Ａ)地震規模 (Ｂ)經度 (Ｃ)濕度 (Ｄ)月相。", "ans": "C", "topic": "體感悶熱", "analysis": "悶濕感不只受氣溫影響，也和濕度密切相關；濕度高會使汗液較難蒸發散熱。", "ext": "高溫高濕時汗水不易蒸發、散熱困難而覺悶熱；乾燥環境較易散熱。"}, {"num": 43, "content": "第二年草減少最可能與哪項變化直接相關？ (Ａ)月相改變 (Ｂ)狐增加2隻 (Ｃ)海水蒸發 (Ｄ)兔增加。", "ans": "D", "topic": "族群消長", "analysis": "第二年兔由100隻增至160隻，對草的取食量可能增加，最能直接解釋草量下降。", "ext": "草食動物增加會使植物減少；族群數量沿食物鏈互相牽動、往復波動。", "gr": "第 43–45 題", "gi": "某島上原有大量草、兔與狐。連續三年調查數量如下：第一年草多、兔100隻、狐20隻；第二年草減少、兔160隻、狐22隻；第三年草回升、兔80隻、狐35隻。"}, {"num": 44, "content": "第三年兔數下降，可能與哪項因素共同有關？ (Ａ)食物曾減少且狐增加 (Ｂ)草回升且狐減少 (Ｃ)兔不再呼吸 (Ｄ)植物不需陽光。", "ans": "A", "topic": "捕食關係", "analysis": "兔在第二年大量增加並消耗草，加上第三年狐增至35隻，食物短缺與捕食壓力都可能使兔數下降。", "ext": "食物短缺與掠食者增加常使獵物減少；其後掠食者也可能隨之減少。"}, {"num": 45, "content": "這份三年資料最適合支持哪項說法？ (Ａ)生物間數量可能互相影響 (Ｂ)狐只吃草 (Ｃ)兔越多草一定越多 (Ｄ)三年資料可證明所有生態系規律。", "ans": "A", "topic": "科學推論", "analysis": "三年資料顯示草、兔與狐的數量隨食物與捕食關係共同變動，因此只能支持「生物間數量可能互相影響」；不能推論狐只吃草，也不能把三年資料擴大成所有生態系的定律。", "ext": "結論不可超出資料支持的範圍；單一生態系觀察不能推及所有生態系。"}], "37": [{"num": 1, "content": "葉片中的葉綠素最主要能吸收光能，用於哪一項作用？ (Ａ)消化作用 (Ｂ)發酵作用 (Ｃ)排泄作用 (Ｄ)光合作用。", "ans": "D", "topic": "光合作用", "analysis": "葉綠素吸收光能，將二氧化碳和水合成養分並釋放氧氣，這個作用稱為光合作用。", "ext": "葉綠素主要吸收紅光與藍紫光，綠光多被反射，因此葉片外觀呈現綠色。"}, {"num": 2, "content": "多數陸生植物的氣孔主要功能是 (Ａ)固定植株 (Ｂ)運送花粉 (Ｃ)氣體交換與調節水分散失 (Ｄ)儲存種子。", "ans": "C", "topic": "氣孔功能", "analysis": "氣孔是葉片與外界交換二氧化碳、氧氣和水蒸氣的主要通道，開閉也能調節水分散失。", "ext": "氣孔由成對保衛細胞控制開閉；多數陸生植物下表皮氣孔較多，可減少水分散失。"}, {"num": 3, "content": "在葉片正面塗凡士林、背面不塗，與兩面都不塗的葉片相比，前者蒸散量稍減；若兩面都塗，蒸散量大減。最合理推論是 (Ａ)氣孔只在葉片正面 (Ｂ)兩面都有氣孔，背面可能較多 (Ｃ)凡士林會製造水 (Ｄ)葉脈不運水。", "ans": "B", "topic": "蒸散作用", "analysis": "塗凡士林會封住氣孔；只塗正面影響小、兩面都塗影響大，支持兩面均有氣孔且背面可能較多。", "ext": "凡士林封住氣孔可阻斷蒸散；由各組蒸散量差異可推知氣孔分布，下表皮通常較多。"}, {"num": 4, "content": "森林中的蕈類與細菌常被稱為分解者，因為它們能 (Ａ)製造陽光 (Ｂ)捕捉所有動物 (Ｃ)將遺體分解，使物質回到環境 (Ｄ)阻止植物生長。", "ans": "C", "topic": "分解者", "analysis": "蕈類和細菌能把生物遺體、排遺中的有機物分解，使養分回到環境再被利用。", "ext": "分解者把有機物分解成無機養分回歸環境；蕈類屬真菌，不能行光合作用。"}, {"num": 5, "content": "青蛙幼體主要用鰓呼吸，成體可用肺與皮膚呼吸，顯示青蛙屬於 (Ａ)魚類 (Ｂ)爬蟲類 (Ｃ)兩生類 (Ｄ)鳥類。", "ans": "C", "topic": "兩生類", "analysis": "幼體多生活水中以鰓呼吸，成體可用肺與皮膚呼吸，是兩生類適應水陸生活的特徵。", "ext": "兩生類體外受精，卵無硬殼須產在水中；變態時呼吸構造由鰓轉為肺與皮膚。"}, {"num": 6, "content": "蚯蚓對土壤常有益處，主要是牠鑽洞與取食能 (Ａ)增加通氣並促進有機物分解 (Ｂ)使土壤更緊密 (Ｃ)消除所有微生物 (Ｄ)使土壤完全乾燥。", "ans": "A", "topic": "土壤生物", "analysis": "蚯蚓鑽洞使土壤疏鬆、增加通氣與水分滲透，取食有機碎屑也有助分解與養分循環。", "ext": "蚯蚓排遺富含養分可改良土壤；牠屬環節動物，靠濕潤皮膚呼吸，怕乾燥。"}, {"num": 7, "content": "若島上外來種幾乎沒有天敵且大量繁殖，最可能造成 (Ａ)原生種資源增加 (Ｂ)生態平衡受干擾 (Ｃ)物種永遠不變 (Ｄ)食物網變得完全簡單且穩定。", "ans": "B", "topic": "外來種影響", "analysis": "外來種缺少天敵時可能快速繁殖，與原生種競爭食物和棲地，甚至捕食原生種，因而干擾生態平衡。", "ext": "外來種可能與原生種競爭、捕食原生種或傳播疾病；防治重點在避免引入與擴散。"}, {"num": 8, "content": "人體吸氣時，橫膈通常 (Ａ)上升，胸腔變小 (Ｂ)不動，肺變小 (Ｃ)下降，胸腔變大 (Ｄ)上升，肺內空氣增加。", "ans": "C", "topic": "呼吸運動", "analysis": "吸氣時橫膈收縮並下降，使胸腔體積增大、肺內壓降低，外界空氣因此進入肺部。", "ext": "呼氣時橫膈舒張上升、胸腔縮小；肺本身無肌肉，靠胸腔體積改變使空氣進出。"}, {"num": 9, "content": "腎臟的主要功能之一是 (Ａ)製造膽汁 (Ｂ)交換氧氣 (Ｃ)消化蛋白質 (Ｄ)過濾血液並形成尿液。", "ans": "D", "topic": "泌尿系統", "analysis": "腎臟能過濾血液，調節水分與鹽類，將尿素等廢物形成尿液排出。", "ext": "尿液由腎臟形成，經輸尿管送至膀胱儲存再排出；膽汁由肝臟製造，勿混淆。"}, {"num": 10, "content": "打預防針能降低特定傳染病風險，主要是使人體 (Ａ)產生免疫記憶 (Ｂ)失去白血球 (Ｃ)不再需要呼吸 (Ｄ)體溫永遠固定。", "ans": "A", "topic": "免疫接種", "analysis": "疫苗讓免疫系統先辨認特定病原並形成記憶細胞，再次遇到時能較快、較強地反應。", "ext": "疫苗屬預防而非治療；接種後靠記憶細胞快速產生抗體，對抗同種病原體。"}, {"num": 11, "content": "同體積的木塊與鐵塊，鐵塊質量較大，表示鐵的 (Ａ)體積較大 (Ｂ)密度較大 (Ｃ)浮力一定較大 (Ｄ)溫度較高。", "ans": "B", "topic": "密度比較", "analysis": "密度＝質量÷體積；體積相同而鐵塊質量較大，表示鐵的密度較大。", "ext": "密度＝質量÷體積，是物質特性；同一物質不論大小密度相同，可用來辨識物質。"}, {"num": 12, "content": "一物體完全浸入水中後，水面上升量等於物體的 (Ａ)質量 (Ｂ)重量 (Ｃ)密度 (Ｄ)體積。", "ans": "D", "topic": "排水法測體積", "analysis": "物體完全浸沒時排開水的體積等於物體體積，因此水面上升所對應的排水量可量出體積。", "ext": "排水法只適用不溶於水且完全沉沒的物體；漂浮物排開的水重才等於物重。"}, {"num": 13, "content": "鋁箔揉成實心球會沉，做成空心船形卻可能浮，主要因為船形 (Ａ)鋁的密度改變 (Ｂ)排開較多水，使平均密度降低 (Ｃ)質量消失 (Ｄ)不受重力。", "ans": "B", "topic": "浮力原理", "analysis": "船形包含空氣、整體體積增大，可排開較多水，使「鋁箔加空氣」的平均密度低於水而浮起。", "ext": "物體平均密度小於水就能浮；鋼鐵船同理，靠中空結構增大體積降低平均密度。"}, {"num": 14, "content": "兩人分別在月球與地球用同一把彈簧秤測同一物體，月球讀數較小，主要因為物體在月球上的 (Ａ)質量較小 (Ｂ)所受重力較小 (Ｃ)體積較小 (Ｄ)密度為零。", "ans": "B", "topic": "質量與重量", "analysis": "物體質量不因地點改變，但月球重力場較弱，所以彈簧秤量到的重量較小。", "ext": "質量用天平測，不隨地點改變；重量用彈簧秤測，在月球約為地球的六分之一。"}, {"num": 15, "content": "一顆球由靜止自由落下，忽略空氣阻力，下降過程中 (Ａ)質量增加 (Ｂ)速度保持不變 (Ｃ)重力消失 (Ｄ)速度逐漸增加。", "ans": "D", "topic": "自由落體", "analysis": "忽略空氣阻力時，球持續受向下重力而產生加速度，因此下落速度逐漸增加。", "ext": "自由落體是等加速運動，速度每秒約增加9.8公尺；質量不影響下落快慢。"}, {"num": 16, "content": "用吸管吸飲料時，飲料上升的直接原因主要是 (Ａ)杯外大氣壓把液體推入低壓處 (Ｂ)嘴巴把液體拉上來 (Ｃ)重力向上 (Ｄ)吸管產生磁力。", "ans": "A", "topic": "大氣壓力", "analysis": "吸氣使吸管內氣壓下降，杯外較大的大氣壓便把液體壓入吸管並向上推。", "ext": "真空中沒有大氣壓，吸管吸不起飲料；馬德堡半球實驗也證明大氣壓力存在。"}, {"num": 17, "content": "氣球在寒冷戶外變小，回到溫暖室內又變大，主要顯示氣體 (Ａ)不受溫度影響 (Ｂ)冷脹熱縮 (Ｃ)熱脹冷縮 (Ｄ)會變成固體。", "ans": "C", "topic": "熱脹冷縮", "analysis": "氣球內氣體遇冷收縮、體積變小，回暖後膨脹，顯示氣體具有熱脹冷縮性質。", "ext": "氣體熱脹冷縮最明顯，液體次之，固體最小；溫度計就是利用液體熱脹冷縮。"}, {"num": 18, "content": "開啟汽水瓶蓋後產生大量氣泡，主要因為瓶內壓力降低，使二氧化碳 (Ａ)溶解度下降而逸出 (Ｂ)變成氧氣 (Ｃ)溶解度上升 (Ｄ)質量增加。", "ans": "A", "topic": "氣體溶解度", "analysis": "開瓶後壓力下降，二氧化碳在液體中的溶解度降低，原先溶解的氣體便形成氣泡逸出。", "ext": "氣體溶解度隨溫度升高而降低、隨壓力增大而升高，與多數固體的趨勢相反。"}, {"num": 19, "content": "將紫色高麗菜汁加入某溶液後呈藍綠色，該溶液最可能是 (Ａ)白醋 (Ｂ)檸檬汁 (Ｃ)純水 (Ｄ)小蘇打水。", "ans": "D", "topic": "酸鹼指示劑", "analysis": "紫色高麗菜汁在鹼性溶液中偏藍綠；小蘇打水呈弱鹼性，醋與檸檬汁則呈酸性。", "ext": "紫高麗菜汁遇酸變紅、遇鹼變藍綠或黃綠；藍色石蕊試紙遇酸性溶液會變紅。"}, {"num": 20, "content": "稀鹽酸與小蘇打混合產生氣泡，若要證明是化學變化，最佳證據是 (Ａ)容器仍透明 (Ｂ)形成性質不同的氣體 (Ｃ)兩者都含水 (Ｄ)液面上升。", "ans": "B", "topic": "化學變化", "analysis": "反應產生原本沒有、性質不同的氣體，是生成新物質的證據，因此屬於化學變化。", "ext": "化學變化生成新物質，常伴隨變色、產氣或沉澱；物理變化只改變外形或狀態。"}, {"num": 21, "content": "先倒入少量熱水並輕輕轉動玻璃杯，再加入其餘熱水，可降低杯子破裂的風險，主要因為 (Ａ)阻止水傳熱 (Ｂ)增加杯壁各處溫差 (Ｃ)讓杯壁較均勻且較緩慢升溫，減少各處熱脹差異 (Ｄ)使玻璃變薄。", "ans": "C", "topic": "熱應力", "analysis": "先用少量熱水預熱可讓杯壁各處較緩慢、均勻膨脹，減少內外溫差造成的熱應力。", "ext": "玻璃導熱慢，急遽溫差使內外膨脹不均而破裂；耐熱玻璃膨脹係數小較不易裂。"}, {"num": 22, "content": "金屬鍋柄常包覆塑膠或木材，主要利用它們 (Ａ)導熱快 (Ｂ)導熱慢 (Ｃ)能製冷 (Ｄ)能反射所有光。", "ans": "B", "topic": "熱的傳導", "analysis": "塑膠和木材導熱慢，能減少鍋中熱量快速傳到手部，降低燙傷風險。", "ext": "金屬是熱的良導體，木材與塑膠是不良導體；保溫器材與散熱器選材原理相反。"}, {"num": 23, "content": "冰塊在0℃融化時持續吸熱，若尚未完全融化，溫度通常 (Ａ)持續快速上升 (Ｂ)降到－100℃ (Ｃ)大致維持0℃ (Ｄ)無法測量。", "ans": "C", "topic": "熔化吸熱", "analysis": "冰在熔點融化時，吸收的熱主要用於物態改變；在冰水共存期間溫度大致維持0℃。", "ext": "純物質熔化時溫度維持在熔點不變，吸收的熱稱熔化熱，全用於改變物態。"}, {"num": 24, "content": "水沸騰後繼續穩定加熱，在氣壓不變下水溫通常 (Ａ)大致維持沸點 (Ｂ)每分鐘升高100℃ (Ｃ)立刻降溫 (Ｄ)變成冰。", "ans": "A", "topic": "沸點特性", "analysis": "氣壓固定且仍有液態水時，沸騰吸收的熱主要供汽化使用，水溫大致維持在沸點。", "ext": "加大火力只加快汽化速率，不會升高沸點；高山氣壓低，水的沸點低於100℃。"}, {"num": 25, "content": "下列哪個現象主要是聲音反射？ (Ａ)磁鐵吸鐵釘 (Ｂ)彩虹 (Ｃ)水中筷子彎折 (Ｄ)山谷回聲。", "ans": "D", "topic": "聲音反射", "analysis": "山谷回聲是聲波遇障礙物反射後再回到耳中；彩虹與折射、色散及反射有關。", "ext": "回聲須與原聲相隔約0.1秒以上才能分辨；水中筷子彎折則是光的折射現象。"}, {"num": 26, "content": "太空人若直接在月球表面敲擊金屬，遠處同伴無法由空氣聽見，主要因為月球表面 (Ａ)幾乎沒有可傳聲的空氣 (Ｂ)沒有重力 (Ｃ)沒有光 (Ｄ)溫度太低使金屬不振動。", "ans": "A", "topic": "聲音傳播介質", "analysis": "聲音是機械波，需要介質傳播；月球表面近似真空，缺少可傳遞振動的空氣。", "ext": "聲音可在固、液、氣體中傳播，真空不能；太空人靠無線電或接觸傳導溝通。"}, {"num": 27, "content": "同一根直立竹竿在正午的影子越短，表示當時太陽高度角 (Ａ)越小 (Ｂ)越大 (Ｃ)等於0度 (Ｄ)無法比較。", "ans": "B", "topic": "太陽高度角", "analysis": "太陽高度角越大，光線越接近直射，同一根直立竹竿在水平地面的影子就越短。", "ext": "太陽高度角越大，影子越短；台灣正午太陽多偏南方，影子常指向北方。"}, {"num": 28, "content": "北半球夏至附近，臺灣通常 (Ａ)太陽從西方升起 (Ｂ)黑夜較長 (Ｃ)晝夜一定各12小時 (Ｄ)白晝較長。", "ans": "D", "topic": "晝夜長短", "analysis": "北半球夏至附近朝向太陽傾斜，太陽在地平線上的時間較長，因此臺灣白晝長於黑夜。", "ext": "夏至白晝最長、冬至最短；春分秋分晝夜約等長，成因是地軸傾斜與公轉。"}, {"num": 29, "content": "月球總以近似同一面朝向地球，主要因為月球 (Ａ)不自轉 (Ｂ)被雲遮住 (Ｃ)沒有背面 (Ｄ)自轉週期約等於公轉週期。", "ans": "D", "topic": "同步自轉", "analysis": "月球自轉一圈的時間約等於繞地球公轉一圈的時間，所以同一面大致持續朝向地球。", "ext": "月球自轉與公轉週期皆約27.3天，因此在地球上永遠看不到完整的月球背面。"}, {"num": 30, "content": "看到上弦月時，明亮部分在臺灣通常朝向 (Ａ)西側 (Ｂ)東側 (Ｃ)北側 (Ｄ)下方。", "ans": "A", "topic": "月相觀測", "analysis": "臺灣所見上弦月約在正午升起、傍晚位於南方，亮面朝向已西落的太陽，通常為西側亮。", "ext": "上弦月約農曆初七八、傍晚見於南方天空；下弦月亮面朝東，清晨才易觀察。"}, {"num": 31, "content": "星座在同一夜由東向西移動，主要是地球 (Ａ)自西向東自轉 (Ｂ)自東向西公轉 (Ｃ)磁場改變 (Ｄ)被月球推動。", "ans": "A", "topic": "周日運動", "analysis": "地球自西向東自轉，使天空中的日月星辰呈現由東向西的周日視運動。", "ext": "星星每小時約向西移動15度；北極星位在地軸延伸方向，位置幾乎不動。"}, {"num": 32, "content": "太陽系中行星繞太陽公轉，軌道大致為 (Ａ)完美正方形 (Ｂ)任意折線 (Ｃ)橢圓形 (Ｄ)螺旋直線。", "ans": "C", "topic": "行星軌道", "analysis": "行星在太陽引力下繞行，其軌道依克卜勒第一定律大致為以太陽位於焦點之一的橢圓。", "ext": "克卜勒定律指出行星走橢圓軌道、太陽位於焦點之一；近日點附近速度較快。"}, {"num": 33, "content": "同一地震中，通常距震央越遠的測站 (Ａ)震度一定越大 (Ｂ)震源越深 (Ｃ)規模越大 (Ｄ)震波到達較晚。", "ans": "D", "topic": "地震波傳播", "analysis": "震波從震源向外傳播需要時間，測站距震央通常越遠，接收到震波的時間越晚。", "ext": "規模代表地震釋放的能量，每次地震僅一個；震度隨測站遠近與地質而不同。"}, {"num": 34, "content": "海嘯到達淺海區時浪高可能增大，海邊遇強震後最安全的作法是 (Ａ)到沙灘觀浪 (Ｂ)立即往高處或內陸疏散 (Ｃ)躲在橋下 (Ｄ)等看到巨浪再跑。", "ans": "B", "topic": "海嘯防災", "analysis": "近海強震可能引發海嘯，海浪抵岸前未必明顯；應立即往高處或內陸疏散，不可停留觀浪。", "ext": "海水異常快速後退可能是海嘯前兆；海嘯行進速度快，切勿等看到浪才逃離。"}, {"num": 35, "content": "地下水長期溶蝕石灰岩，可能形成 (Ａ)沙丘 (Ｂ)火山口 (Ｃ)洞穴與鐘乳石 (Ｄ)冰河。", "ans": "C", "topic": "石灰岩地形", "analysis": "含二氧化碳的地下水可緩慢溶蝕石灰岩，形成洞穴，洞內沉澱的碳酸鈣可形成鐘乳石。", "ext": "鐘乳石自洞頂向下生長，石筍由地面向上堆積，兩者相接便形成石柱。"}, {"num": 36, "content": "將不同土壤各裝等量於漏斗，倒入等量水並量測流出量，是在比較土壤的 (Ａ)導電性 (Ｂ)磁性 (Ｃ)透水或保水性 (Ｄ)燃燒性。", "ans": "C", "topic": "土壤透水性", "analysis": "土壤、裝填量和加水量相同時，比較流出水量可判斷透水性，也可由保留水量推測保水性。", "ext": "砂質土顆粒大透水快、保水差；黏質土顆粒小透水慢、保水佳；壤土介於其間。"}, {"num": 37, "content": "本實驗的操作變因是 (Ａ)溫度 (Ｂ)糖水濃度 (Ｃ)酵母量 (Ｄ)產氣量。", "ans": "A", "topic": "實驗變因", "analysis": "實驗主動設定10、25、40、60℃四種條件，故溫度是操作變因；產氣量是應變變因。", "ext": "操作變因是刻意改變的條件，應變變因是觀測結果，其餘條件須全部控制相同。", "gr": "第 37–39 題", "gi": "某組測試酵母菌在不同溫度糖水中的產氣量。10分鐘後氣體體積如下：10℃為2毫升、25℃為12毫升、40℃為20毫升、60℃為0毫升；各組糖水濃度、酵母量均相同。"}, {"num": 38, "content": "依資料，四組中酵母產氣最快的是 (Ａ)10℃ (Ｂ)25℃ (Ｃ)40℃ (Ｄ)60℃。", "ans": "C", "topic": "資料判讀", "analysis": "相同10分鐘內，40℃組產氣20毫升為四組最多，表示在測試條件中產氣最快。", "ext": "酵母發酵產生二氧化碳，可使澄清石灰水混濁；約30～40℃時活性最佳。"}, {"num": 39, "content": "60℃組未產氣，最合理的可能原因是 (Ａ)糖在60℃不存在 (Ｂ)酵母活性受高溫破壞 (Ｃ)氣體變成固體 (Ｄ)溫度越高反應一定越慢。", "ans": "B", "topic": "酵素特性", "analysis": "酵母中的酵素可能在60℃高溫下變性、細胞活性受破壞，因此無法正常代謝產氣。", "ext": "酵素是蛋白質，高溫變性後活性無法恢復；低溫只是活性降低，回溫可恢復。"}, {"num": 40, "content": "最接近低壓中心或天氣系統通過的時段是 (Ａ)清晨 (Ｂ)傍晚 (Ｃ)中午 (Ｄ)深夜。", "ans": "B", "topic": "低氣壓天氣", "analysis": "傍晚氣壓降至最低998百帕且雨勢增強，最符合低壓中心或主要天氣系統接近、通過的時段。", "ext": "低壓中心氣流上升，易成雲致雨；高壓區氣流下沉，天氣多晴朗穩定。", "gr": "第 40–42 題", "gi": "某地一天氣壓與風向紀錄：清晨1008百帕、東北風；中午1004百帕、北風；傍晚998百帕、西北風且雨勢增強；深夜1002百帕、雨勢轉小。"}, {"num": 41, "content": "從清晨到傍晚，氣壓趨勢為 (Ａ)持續下降 (Ｂ)持續上升 (Ｃ)完全不變 (Ｄ)先升後降。", "ans": "A", "topic": "氣壓變化判讀", "analysis": "氣壓由清晨1008降至中午1004，再降至傍晚998百帕，呈持續下降趨勢。", "ext": "氣壓持續下降常預示天氣轉壞；北半球低壓的氣流呈逆時針方向向內旋入。"}, {"num": 42, "content": "深夜雨勢轉小且氣壓回升，最合理推論是 (Ａ)天氣系統可能逐漸遠離 (Ｂ)海水停止蒸發 (Ｃ)地球停止自轉 (Ｄ)濕度必為0%。", "ans": "A", "topic": "天氣系統移動", "analysis": "深夜氣壓由998回升至1002百帕且雨勢轉小，顯示低壓或天氣系統可能已通過並逐漸遠離。", "ext": "鋒面或低壓通過後氣壓回升、天氣漸好轉；台灣的天氣系統大多由西向東移動。"}, {"num": 43, "content": "最後平衡溫度一定最低的是 (Ａ)乙、丙相同 (Ｂ)乙 (Ｃ)丙 (Ｄ)甲。", "ans": "D", "topic": "熱平衡", "analysis": "甲沒有加入高溫金屬，也沒有其他熱源，水維持約20℃；乙、丙會由80℃金屬獲得熱而升溫。", "ext": "熱由高溫物體流向低溫物體，直到兩者同溫；平衡溫度必介於兩初溫之間。", "gr": "第 43–45 題", "gi": "三個相同燒杯各裝100克、20℃的水。甲不加物質；乙加入20克、80℃的銅塊；丙加入20克、80℃的鋁塊。已知同質量鋁降低1℃放出的熱比銅多，且忽略散熱。"}, {"num": 44, "content": "乙、丙相比，平衡溫度較高的預期是 (Ａ)丙 (Ｂ)乙 (Ｃ)必相同 (Ｄ)無法依題意推論。", "ans": "A", "topic": "比熱比較", "analysis": "同質量、同初溫下降相同溫度時鋁放熱較多，表示鋁比熱較大，能使丙杯水達到較高平衡溫度。", "ext": "比熱大的物質儲熱多；同質量同溫差下鋁放熱約為銅的兩倍以上，故水溫升較高。"}, {"num": 45, "content": "若要讓結論可靠，下列哪項最應控制相同？ (Ａ)金屬種類 (Ｂ)金屬比熱 (Ｃ)平衡溫度 (Ｄ)金屬初溫與質量。", "ans": "D", "topic": "控制變因", "analysis": "比較金屬種類的影響時，金屬初溫與質量必須相同；平衡溫度是要測量的應變變因。", "ext": "公平測試一次只改變一個變因，其餘條件皆須相同，結果才有比較意義。"}], "38": [{"num": 1, "content": "植物根毛數量多，最主要的好處是 (Ａ)增加吸收水與礦物質的表面積 (Ｂ)製造花粉 (Ｃ)減少固定力 (Ｄ)反射陽光。", "ans": "A", "topic": "根毛吸收", "analysis": "大量細長根毛能增加根與土壤接觸的表面積，提高水和礦物質的吸收效率。", "ext": "根毛是表皮細胞的突起，壽命短；移植時傷及根毛會暫時降低吸水力而易枯萎。"}, {"num": 2, "content": "在植物莖的韌皮部進行環狀剝皮，時間久後剝皮處上方膨大，主要因為 (Ａ)水無法由木質部上升 (Ｂ)氣孔全部關閉 (Ｃ)根不再呼吸 (Ｄ)葉製造的養分向下運輸受阻。", "ans": "D", "topic": "韌皮部運輸", "analysis": "韌皮部負責運輸葉片製造的有機養分；環狀剝皮切斷向下運輸，使養分累積在剝皮處上方。", "ext": "木質部運水和礦物質、只向上；韌皮部運養分、可雙向，環剝過久植株會死亡。"}, {"num": 3, "content": "花粉落在同種花的柱頭後，通常會長出花粉管通往 (Ａ)萼片 (Ｂ)胚珠 (Ｃ)花瓣 (Ｄ)花藥。", "ans": "B", "topic": "植物受精", "analysis": "花粉在柱頭萌發後形成花粉管，沿花柱通往子房內的胚珠，使精細胞有機會完成受精。", "ext": "花粉管內的精細胞與胚珠內的卵細胞結合完成受精；受精後胚珠發育成種子。"}, {"num": 4, "content": "果實通常由花的哪個構造發育而來？ (Ａ)柱頭 (Ｂ)花絲 (Ｃ)子房 (Ｄ)萼片。", "ans": "C", "topic": "果實形成", "analysis": "受精後子房通常發育成果實，子房內的胚珠則發育成種子。", "ext": "子房壁發育成果皮，胚珠發育成種子；蘋果食用部位主要由花托發育，屬假果。"}, {"num": 5, "content": "「海藻→小魚→大魚→海鳥」中，若小魚突然大量減少，短期最可能 (Ａ)海藻增加、大魚減少 (Ｂ)海藻減少、大魚增加 (Ｃ)海藻與大魚都增加 (Ｄ)完全無影響。", "ans": "A", "topic": "食物鏈平衡", "analysis": "小魚減少後，海藻被取食的壓力降低而可能增加；大魚失去主要食物，數量短期可能下降。", "ext": "食物鏈某環節變動會連鎖影響上下層生物數量；生產者是能量流動的起點。"}, {"num": 6, "content": "紅樹林植物具有支柱根或呼吸根，主要是適應 (Ａ)潮間帶鬆軟缺氧泥地 (Ｂ)乾燥高山 (Ｃ)極地冰原 (Ｄ)淡水深湖。", "ans": "A", "topic": "紅樹林適應", "analysis": "潮間帶泥地鬆軟且土壤缺氧，支柱根可協助固定，突出泥面的呼吸根有助氣體交換。", "ext": "紅樹林植物如水筆仔具胎生苗，可漂浮定植；呼吸根突出泥面利於取得氧氣。"}, {"num": 7, "content": "冬眠動物在冬季降低活動與代謝，主要可 (Ａ)增加食物需求 (Ｂ)提高體溫到沸點 (Ｃ)加快生長 (Ｄ)節省能量。", "ans": "D", "topic": "冬眠", "analysis": "冬季食物較少時降低活動與代謝，可減少能量消耗，讓動物依靠儲存能量度過不利季節。", "ext": "冬眠時體溫、心跳與呼吸都大幅下降；蛙、蛇等變溫動物也以蟄伏方式過冬。"}, {"num": 8, "content": "病毒必須在活細胞內才能大量複製，因此抗生素通常 (Ａ)可治所有病毒病 (Ｂ)能增加病毒繁殖 (Ｃ)能取代疫苗 (Ｄ)不能直接殺死病毒。", "ans": "D", "topic": "病毒與抗生素", "analysis": "病毒沒有可獨立運作的完整細胞構造，須利用活細胞複製；針對細菌結構或代謝的抗生素通常對病毒無效。", "ext": "濫用抗生素易篩選出抗藥性細菌；病毒感染多靠疫苗預防或抗病毒藥物治療。"}, {"num": 9, "content": "牙齒中的臼齒主要適合 (Ａ)切斷 (Ｂ)撕裂 (Ｃ)磨碎食物 (Ｄ)感受味道。", "ans": "C", "topic": "牙齒功能", "analysis": "臼齒表面較寬、有凹凸，適合把食物壓碎和磨細；門齒主要切斷，犬齒主要撕裂。", "ext": "門齒切斷、犬齒撕裂、臼齒磨碎；草食動物臼齒發達，肉食動物犬齒特別尖銳。"}, {"num": 10, "content": "膽汁能協助脂肪形成小油滴，主要有助於 (Ａ)製造澱粉 (Ｂ)把脂肪變成蛋白質 (Ｃ)增加脂肪與消化液接觸面積 (Ｄ)吸收氧氣。", "ans": "C", "topic": "膽汁乳化", "analysis": "膽汁把大脂肪滴乳化成小油滴，增加總表面積，使脂肪酶能更有效作用。", "ext": "膽汁由肝臟製造、膽囊儲存，不含消化酵素；乳化屬物理作用而非化學分解。"}, {"num": 11, "content": "將相同橡皮筋分別拉長1、2、3公分後放開，在彈性限度內，拉得越長通常 (Ａ)密度變零 (Ｂ)質量越小 (Ｃ)重力消失 (Ｄ)儲存的彈性位能越多。", "ans": "D", "topic": "彈性位能", "analysis": "在彈性限度內，橡皮筋拉伸越長，對抗彈力做功越多，儲存的彈性位能通常越多。", "ext": "拉長橡皮筋所作的功轉為彈性位能；超過彈性限度會永久變形，無法恢復原狀。"}, {"num": 12, "content": "腳踏車突然煞車，騎士身體容易向前傾，主要因為 (Ａ)浮力 (Ｂ)蒸發 (Ｃ)磁力 (Ｄ)慣性。", "ans": "D", "topic": "慣性", "analysis": "車突然減速時，騎士身體仍傾向維持原先向前運動的狀態，因此會向前傾。", "ext": "慣性是物體維持原運動狀態的性質，質量越大慣性越大；繫安全帶可防止前衝。"}, {"num": 13, "content": "手推牆壁而牆未移動，下列何者正確？ (Ａ)手沒有施力 (Ｂ)牆對手也有反作用力 (Ｃ)只有牆對手施力 (Ｄ)重力消失。", "ans": "B", "topic": "作用與反作用", "analysis": "依作用力與反作用力，手推牆時牆也以大小相等、方向相反的力推手，即使牆沒有移動仍有受力。", "ext": "作用力與反作用力大小相等、方向相反，分別作用在不同物體上，不能抵消。"}, {"num": 14, "content": "兩個互相接觸的齒輪轉動時 (Ａ)方向相反 (Ｂ)方向相同 (Ｃ)大小齒輪轉速必相同 (Ｄ)齒數越多轉越快。", "ans": "A", "topic": "齒輪傳動", "analysis": "兩齒輪接觸處的齒互相推動，所以轉向相反；齒數較多者通常轉得較慢。", "ext": "外接齒輪轉向相反，齒數多者轉速慢；用皮帶連接的兩輪轉向則相同。"}, {"num": 15, "content": "使用輪軸提重物，若在較大的輪上施力、重物掛在較小的軸上，通常可 (Ａ)增加重物質量 (Ｂ)省距離且省力 (Ｃ)省力 (Ｄ)消除摩擦。", "ans": "C", "topic": "輪軸原理", "analysis": "在半徑較大的輪上施力可產生較大力矩，帶動較小的軸提升重物，因此能省力但需移動較長距離。", "ext": "輪軸如同可連續旋轉的槓桿；輪上施力省力費距離，方向盤、螺絲起子皆是。"}, {"num": 16, "content": "一槓桿左側距支點20公分掛30公克，右側距支點10公分掛多少公克可平衡？ (Ａ)15 (Ｂ)30 (Ｃ)60 (Ｄ)90。", "ans": "C", "topic": "槓桿原理", "analysis": "平衡時兩側力矩相等，30×20＝m×10，得m＝60公克。", "ext": "力矩＝力×力臂；施力臂大於抗力臂則省力費距離，反之則費力省距離。"}, {"num": 17, "content": "相同球從同一高度分別落在磁磚與厚地毯，磁磚上通常反彈較高，表示碰撞時 (Ａ)重力較小 (Ｂ)能量損失較少 (Ｃ)球質量增加 (Ｄ)地毯沒有彈性。", "ans": "B", "topic": "碰撞能量", "analysis": "厚地毯形變較大，較多機械能轉成內能與聲能；磁磚上能量損失較少，所以球反彈較高。", "ext": "反彈高度反映保留的機械能多寡；地毯形變吸收能量，緩衝包材保護物品同理。"}, {"num": 18, "content": "擊鼓時鼓面振幅越大，聲音通常 (Ａ)越大聲 (Ｂ)音調越高 (Ｃ)傳得越慢 (Ｄ)不能傳播。", "ans": "A", "topic": "聲音響度", "analysis": "鼓面振幅越大，推動周圍空氣振動的幅度也越大，因此聲音通常越大聲。", "ext": "響度由振幅決定，音調由頻率決定，音色由波形決定；此三者為聲音三要素。"}, {"num": 19, "content": "聲音由空氣進入水中時 (Ａ)完全不能傳播 (Ｂ)頻率一定變成零 (Ｃ)立刻成為光 (Ｄ)仍可傳播但速度可能不同。", "ans": "D", "topic": "聲速與介質", "analysis": "水也是可傳聲的介質，聲音可由空氣傳入水中；因介質性質改變，聲速可能不同。", "ext": "聲速通常固體＞液體＞氣體；水中聲速約每秒1500公尺，比空氣中快四倍多。"}, {"num": 20, "content": "使用凸透鏡在紙屏上形成遠處景物的清晰像，此像通常是 (Ａ)正立虛像 (Ｂ)倒立虛像 (Ｃ)正立實像 (Ｄ)倒立實像。", "ans": "D", "topic": "凸透鏡成像", "analysis": "遠處物體位於凸透鏡焦距外，透鏡在另一側形成可投影到紙屏上的倒立實像。", "ext": "物在兩倍焦距外成縮小倒立實像；物在焦距內成放大正立虛像，如放大鏡。"}, {"num": 21, "content": "從紅色透明玻璃紙的另一側觀看白光，玻璃紙看起來紅，主要因為它 (Ａ)較容易讓紅光通過，並吸收其他多數色光 (Ｂ)自行製造紅光 (Ｃ)只吸收紅光 (Ｄ)讓所有色光等量通過。", "ans": "A", "topic": "光與顏色", "analysis": "紅色透明玻璃紙選擇性透過紅光，吸收大部分其他色光，因此白光通過後主要剩紅光。", "ext": "不透明物體的顏色取決於反射的色光；紅紙反射紅光並吸收其他多數色光。"}, {"num": 22, "content": "月亮本身不發可見光，我們能看見月亮主要因為 (Ａ)月球反射太陽光 (Ｂ)月球燃燒 (Ｃ)地球發光 (Ｄ)星星照亮月球。", "ans": "A", "topic": "月光來源", "analysis": "月球不自行發出可見光，我們看見的是月球表面反射到地球的太陽光。", "ext": "行星與衛星都靠反射太陽光發亮；太陽這類恆星才能自行發光發熱。"}, {"num": 23, "content": "電路中串聯兩顆相同燈泡，和只接一顆相比，每顆通常較暗，主要因為 (Ａ)電池不存在 (Ｂ)總電阻增加、電流減小 (Ｃ)燈泡質量變小 (Ｄ)導線停止導電。", "ans": "B", "topic": "串聯電路", "analysis": "相同燈泡串聯使總電阻增加，在固定電池電壓下電流減小，因此每顆燈泡通常較暗。", "ext": "串聯電流處處相等，一燈損壞全部熄滅；家庭電路採並聯，各電器可獨立開關。"}, {"num": 24, "content": "保險絲使用熔點較低的金屬，是為了電流過大時 (Ａ)增加電流 (Ｂ)自動熔斷電路 (Ｃ)使電器更亮 (Ｄ)儲存電能。", "ans": "B", "topic": "保險絲安全", "analysis": "電流過大時保險絲因發熱而先熔斷，切開電路，避免導線或電器過熱引發危險。", "ext": "保險絲須串聯在電路中才能斷電保護；無熔絲開關跳脫後可排除故障再復歸。"}, {"num": 25, "content": "發電機主要把 (Ａ)電能轉成動能 (Ｂ)化學能轉成核能 (Ｃ)動能轉成電能 (Ｄ)光能轉成聲能。", "ans": "C", "topic": "電磁感應", "analysis": "發電機利用電磁感應，把轉軸的機械動能轉換成電能。", "ext": "發電機與馬達構造相似但能量轉換方向相反；馬達是把電能轉換成動能。"}, {"num": 26, "content": "太陽能板運作時主要把太陽的 (Ａ)聲能轉成熱能 (Ｂ)光能轉成電能 (Ｃ)磁能轉成化學能 (Ｄ)重力位能轉成光能。", "ans": "B", "topic": "太陽能發電", "analysis": "太陽能板中的光電材料吸收光能並產生電流，主要完成光能到電能的轉換。", "ext": "太陽能熱水器把光能轉為熱能，與太陽能電池的光電轉換不同，兩者勿混淆。"}, {"num": 27, "content": "把相同質量的食鹽分別加入20℃與60℃水中並充分攪拌，若都完全溶解，只能確定 (Ａ)兩杯溶解量上限相同 (Ｂ)低溫水沒有溶解 (Ｃ)高溫水一定先飽和 (Ｄ)兩杯都至少能溶解這些食鹽。", "ans": "D", "topic": "溶解度判讀", "analysis": "兩杯都完全溶解只表示各杯的溶解量上限至少不小於加入量，不能據此比較兩溫度的溶解度上限。", "ext": "多數固體溶解度隨溫度升高而增大，但食鹽變化很小；氣體則隨溫度升高減小。"}, {"num": 28, "content": "將水分解成氫氣與氧氣，需要通電；這項變化屬於 (Ａ)化學變化 (Ｂ)物理變化 (Ｃ)蒸發 (Ｄ)凝結。", "ans": "A", "topic": "電解水", "analysis": "水分解後生成性質不同的氫氣和氧氣，化學組成發生改變，所以是化學變化。", "ext": "電解水產生的氫氣與氧氣體積比約2:1；氫氣本身可燃，氧氣能幫助燃燒。"}, {"num": 29, "content": "密閉容器內反應前後總質量不變，符合 (Ａ)熱脹冷縮 (Ｂ)質量守恆 (Ｃ)光的反射 (Ｄ)慣性定律。", "ans": "B", "topic": "質量守恆", "analysis": "密閉系統中物質雖重新組合，反應前後所有物質總質量相同，符合質量守恆定律。", "ext": "開放容器中氣體逸出會使秤得質量變小，但參與反應的物質總質量仍然守恆。"}, {"num": 30, "content": "沿海地區冬夏溫差常小於內陸，主要因為水 (Ａ)沒有質量 (Ｂ)不吸收熱 (Ｃ)升降溫較慢 (Ｄ)永不蒸發。", "ans": "C", "topic": "水的比熱", "analysis": "水的比熱較大，吸收或放出同樣熱量時溫度變化較小，因此海洋能調節沿海溫度。", "ext": "水比熱大使海洋能調節氣候；白天陸地增溫快吹海風，夜晚陸地降溫快吹陸風。"}, {"num": 31, "content": "雲形成的必要過程之一是水蒸氣 (Ａ)受熱凝固 (Ｂ)被陽光消滅 (Ｃ)直接變成氧氣 (Ｄ)冷卻凝結成小水滴或冰晶。", "ans": "D", "topic": "雲的形成", "analysis": "潮濕空氣上升冷卻至飽和後，水蒸氣凝結成小水滴或凝華成冰晶，聚集形成雲。", "ext": "空氣上升膨脹冷卻至飽和後水氣才凝結；凝結還需塵粒等凝結核的協助。"}, {"num": 32, "content": "空氣中水氣含量不變時，氣溫下降會使相對濕度通常 (Ａ)不變 (Ｂ)下降 (Ｃ)上升 (Ｄ)變成負值。", "ans": "C", "topic": "相對濕度", "analysis": "水氣含量不變而氣溫下降時，空氣可容納的水蒸氣量減少，實際含量占飽和值的比例因而上升。", "ext": "相對濕度是實際水氣量佔該溫度飽和量的比例；清晨氣溫最低時常達最高值。"}, {"num": 33, "content": "地表岩石被河水帶走屬於 (Ａ)侵蝕與搬運 (Ｂ)風化 (Ｃ)凝固 (Ｄ)結晶。", "ans": "A", "topic": "侵蝕搬運", "analysis": "河水把地表岩石或土壤刮蝕並帶離原處，包含侵蝕與搬運作用；風化主要指原地崩解。", "ext": "風化使岩石在原地崩解，侵蝕則把物質移走；河川上游侵蝕、下游堆積為主。"}, {"num": 34, "content": "火山岩漿冷卻凝固形成的岩石屬於 (Ａ)化石 (Ｂ)沉積岩 (Ｃ)變質岩 (Ｄ)火成岩。", "ans": "D", "topic": "火成岩", "analysis": "岩漿或熔岩冷卻凝固後形成火成岩；沉積岩由沉積物壓密膠結形成。", "ext": "岩漿在地下慢冷成花崗岩等深成岩；在地表快冷成玄武岩等火山岩，晶粒較小。"}, {"num": 35, "content": "同一天同一地點，日出後竹竿影子通常先變短、正午後再變長，原因是 (Ａ)竹竿長度改變 (Ｂ)地球停止自轉 (Ｃ)太陽高度角先增後減 (Ｄ)光速改變。", "ans": "C", "topic": "影長變化", "analysis": "日出後太陽高度角逐漸增大，影子變短；過正午後高度角下降，影子再變長。", "ext": "一天中正午影子最短，台灣多指向北方；影長與方位變化可用來製作日晷。"}, {"num": 36, "content": "要判斷「某藥是否抑制細菌生長」，最適合比較 (Ａ)只看一個有藥培養皿 (Ｂ)不同細菌且不同溫度 (Ｃ)有藥與無藥、其他條件相同的培養皿 (Ｄ)改變所有條件。", "ans": "C", "topic": "對照實驗", "analysis": "應以有藥組和無藥對照組比較，並保持細菌種類、溫度、培養時間等相同，才可判斷藥物效果。", "ext": "對照組不施加處理，作為比較基準；單一變因設計才能確認因果關係。"}, {"num": 37, "content": "保溫效果最好的是 (Ａ)鋁箔 (Ｂ)棉布 (Ｃ)報紙 (Ｄ)無包覆。", "ans": "B", "topic": "隔熱保溫", "analysis": "30分鐘後棉布組剩52克冰，四組中最多，代表融化最少、隔熱保溫效果最好。", "ext": "棉布與報紙夾有空氣，空氣是熱的不良導體；鋁箔金屬導熱快，隔熱效果較差。", "gr": "第 37–39 題", "gi": "小晴記錄四種材料包住相同冰塊30分鐘後的剩餘質量：鋁箔35克、棉布52克、報紙48克、無包覆20克；起始均為60克，環境相同。"}, {"num": 38, "content": "本實驗的應變變因是 (Ａ)30分鐘後冰塊剩餘質量 (Ｂ)冰塊起始質量 (Ｃ)包覆材料 (Ｄ)環境溫度。", "ans": "A", "topic": "應變變因", "analysis": "隨包覆材料改變而測量的結果是30分鐘後冰塊剩餘質量，因此它是應變變因。", "ext": "應變變因是隨操作變因改變而測量的結果；本實驗的操作變因是包覆材料種類。"}, {"num": 39, "content": "若要提高可靠性，最合適的是 (Ａ)任意改變時間 (Ｂ)每組用不同大小冰塊 (Ｃ)每種材料重複多次取平均 (Ｄ)只保留最符合預期的數據。", "ans": "C", "topic": "重複實驗", "analysis": "每種材料重複多次並取平均，可降低單次測量與個別冰塊差異造成的偶然誤差。", "ext": "重複測量取平均可降低偶然誤差；刻意剔除不合預期的數據違反科學誠信。"}, {"num": 40, "content": "依資料，水質最可能最好的是 (Ａ)無法比較 (Ｂ)中游 (Ｃ)下游 (Ｄ)上游。", "ans": "D", "topic": "水質指標", "analysis": "上游溶氧最高且生物種類最多，與污染較少、水質較佳的情形相符。", "ext": "溶氧越高通常水質越佳；水溫升高會使溶氧降低，優養化也會使溶氧下降。", "gr": "第 40–42 題", "gi": "某河川三處水質資料如下：上游溶氧8.5 mg/L、生物種類18種；中游溶氧6.0 mg/L、生物12種；下游溶氧3.2 mg/L、生物5種，且有大量生活污水排入口。"}, {"num": 41, "content": "下游生物種類較少，最合理的可能原因是 (Ａ)河水完全沒有水 (Ｂ)污水使溶氧降低 (Ｃ)太陽停止照射 (Ｄ)上游生物不呼吸。", "ans": "B", "topic": "水污染影響", "analysis": "生活污水中的有機物被微生物分解時會消耗氧氣，溶氧降到3.2 mg/L後，能適應的物種較少。", "ext": "有機污染使微生物分解時大量耗氧，魚類缺氧死亡；優養化常伴隨藻類暴增。"}, {"num": 42, "content": "要確認污水是否為主要原因，還應優先 (Ａ)追蹤排放前後水質並重複採樣 (Ｂ)只問一位路人 (Ｃ)刪除上游資料 (Ｄ)改用不同單位混記。", "ans": "A", "topic": "科學驗證", "analysis": "應在污水排放點上、下游固定位置多次採樣，比較排放前後與不同時間的水質，才能檢驗污水的影響。", "ext": "結論須有多次、多地點採樣的證據支持；單一樣本或口述證言不足以確立因果。"}, {"num": 43, "content": "該行星的一個「日」約為 (Ａ)8小時 (Ｂ)400小時 (Ｃ)25小時 (Ｄ)16小時。", "ans": "D", "topic": "自轉與日", "analysis": "行星自轉一圈定義為一個自轉日，題目給定為16小時。", "ext": "地球自轉一圈約24小時定義為一日；太陽日與恆星日因公轉而略有差異。", "gr": "第 43–45 題", "gi": "某行星自轉一圈為16小時，繞恆星公轉一圈為400個地球日，自轉軸傾斜約25度，且有大氣。"}, {"num": 44, "content": "該行星的一個「年」約為 (Ａ)16個地球日 (Ｂ)400個地球日 (Ｃ)25個地球日 (Ｄ)無法定義。", "ans": "B", "topic": "公轉與年", "analysis": "行星繞恆星公轉一圈定義為一年，題目給定其週期為400個地球日。", "ext": "地球公轉一圈約365.25日，因此每四年設置一次閏年；公轉軌道為橢圓形。"}, {"num": 45, "content": "僅依題目資料，下列何者最合理？ (Ａ)一定沒有天氣 (Ｂ)可能因地軸傾斜產生季節差異 (Ｃ)一定沒有生命 (Ｄ)每日長度等於一年。", "ans": "B", "topic": "季節成因", "analysis": "約25度的地軸傾斜配合公轉，可能使不同季節接受的日照角度與時間改變；其餘結論無法由資料推出。", "ext": "季節主因是地軸傾斜改變日照角度與晝長，並非地球與太陽距離的遠近變化。"}], "39": [{"num": 1, "content": "把斑葉植物先放黑暗處一晚，再用黑紙遮住部分葉片並照光；脫色後滴碘液，只有未遮且原本綠色處變藍黑。此結果最能支持製造澱粉需要 (Ａ)花與果實 (Ｂ)氧氣與根毛 (Ｃ)光與葉綠素 (Ｄ)黑紙與酒精。", "ans": "C", "topic": "光合作用", "analysis": "只有同時具葉綠素且接受光照的部分產生澱粉而遇碘變藍黑，支持光和葉綠素都是製造澱粉的必要條件。", "ext": "碘液遇澱粉呈藍黑色；斑葉白色處缺葉綠素、遮光處缺光皆不變色，一次實驗同時驗證兩條件。"}, {"num": 2, "content": "水耕植物若長期只給純水而不補充礦物質，生長可能不良，顯示植物除水和二氧化碳外還需要 (Ａ)土壤顆粒本身 (Ｂ)食鹽結晶 (Ｃ)動物蛋白 (Ｄ)適量礦物質。", "ans": "D", "topic": "植物養分", "analysis": "植物還需由根吸收氮、磷、鉀等適量礦物質，長期只供純水可能造成缺乏症而生長不良。", "ext": "氮磷鉀為植物三要素：缺氮葉片黃化、缺磷開花結果不良、缺鉀莖稈細弱，皆由根隨水吸收。"}, {"num": 3, "content": "乾燥種子放入密閉瓶中幾乎不萌發，加入適量水後開始萌發，說明種子萌發需要 (Ａ)土壤 (Ｂ)水 (Ｃ)肥料 (Ｄ)強光。", "ans": "B", "topic": "種子萌發", "analysis": "乾燥種子加水後才萌發，且其他條件相同，表示水是啟動種子萌發所需的條件之一。", "ext": "種子萌發三條件為水、空氣與適當溫度；陽光與土壤並非必要，初期養分來自子葉或胚乳。"}, {"num": 4, "content": "相同種子分別置於5℃、25℃和60℃且水、空氣充足的環境，25℃組萌發最多，最合理結論是 (Ａ)低溫一定殺死種子 (Ｂ)溫度越高萌發越多 (Ｃ)種子不需水 (Ｄ)溫度會影響萌發。", "ans": "D", "topic": "實驗推論", "analysis": "三組水和空氣相同而溫度不同，萌發數有差異，支持溫度會影響萌發；單次資料不能推論越高越好。", "ext": "此實驗只能推論溫度有影響；60℃組萌發少顯示高溫反而不利，不可說溫度越高萌發越多。"}, {"num": 5, "content": "蝙蝠是哺乳類而不是鳥類，最關鍵的依據是蝙蝠 (Ａ)會飛 (Ｂ)有毛並以乳汁哺育幼兒 (Ｃ)夜間活動 (Ｄ)具有翅膀。", "ans": "B", "topic": "動物分類", "analysis": "哺乳類的關鍵特徵包括有毛及以乳汁哺育幼兒；會飛或有翅膀並非鳥類獨有。", "ext": "哺乳類特徵為體表有毛、乳汁哺育；鯨豚與蝙蝠外形特殊仍是哺乳類，會飛不等於鳥類。"}, {"num": 6, "content": "鯨魚雖生活在水中仍需浮出水面，主要因為牠以 (Ａ)鰓呼吸 (Ｂ)鰭呼吸 (Ｃ)皮膚呼吸 (Ｄ)肺呼吸。", "ans": "D", "topic": "動物呼吸", "analysis": "鯨魚是哺乳類，用肺與空氣交換氣體，因此必須浮到水面呼吸，並不用鰓。", "ext": "魚以鰓呼吸、哺乳類以肺呼吸；鯨的鼻孔位於頭頂，浮出水面換氣時噴出白色水氣柱。"}, {"num": 7, "content": "沙漠狐具有較大的耳朵，除聽覺外也利於散熱；北極狐耳朵較小，利於減少散熱。這是生物對 (Ａ)不同環境的適應 (Ｂ)同一季節的遷徙 (Ｃ)食物的分解 (Ｄ)人工選擇的必然結果。", "ans": "A", "topic": "生物適應", "analysis": "大耳有利沙漠散熱，小耳有利極地保溫，顯示不同環境壓力可形成相應的適應特徵。", "ext": "寒帶動物體型較大、耳鼻等突出部位較小利保溫；熱帶相反利散熱，是長期天擇的結果。"}, {"num": 8, "content": "一片森林可同時容納鷹、蛇、鼠、昆蟲與植物，食物關係形成網狀，是因為 (Ａ)每種生物通常只吃一種食物 (Ｂ)分解者沒有作用 (Ｃ)生產者不會被吃 (Ｄ)多條食物鏈彼此交錯。", "ans": "D", "topic": "食物網", "analysis": "一種生物可能吃多種食物，也可能被多種生物取食，多條食物鏈互相連結便形成食物網。", "ext": "食物鏈起點為生產者；同一生物在不同食物鏈中可居不同位置，彼此交錯連結成食物網。"}, {"num": 9, "content": "人體血液由心臟輸送到全身，再回到心臟，心臟主要像 (Ａ)過濾器 (Ｂ)消化袋 (Ｃ)幫浦 (Ｄ)感覺器官。", "ans": "C", "topic": "循環系統", "analysis": "心臟反覆收縮和舒張，產生壓力推動血液流經肺部與全身，功能類似幫浦。", "ext": "心臟分四腔，左心室壁最厚以推動全身血液；瓣膜可防止血液逆流，維持單向流動。"}, {"num": 10, "content": "小腸內壁具有大量絨毛，主要作用是 (Ａ)儲存糞便 (Ｂ)減少血流 (Ｃ)增加養分吸收面積 (Ｄ)製造牙齒。", "ans": "C", "topic": "消化吸收", "analysis": "大量絨毛使小腸內表面積增大，並有豐富微血管，有助消化後養分迅速被吸收。", "ext": "絨毛內有微血管與乳糜管；葡萄糖、胺基酸進入微血管，脂溶性養分則進入乳糜管。"}, {"num": 11, "content": "人在炎熱環境出汗，汗液蒸發時會 (Ａ)從皮膚吸收熱量，有助降溫 (Ｂ)放出大量熱使體溫上升 (Ｃ)使血液凝固 (Ｄ)停止呼吸。", "ans": "A", "topic": "蒸發吸熱", "analysis": "汗液蒸發需吸收汽化所需能量，熱量由皮膚移走，因此可幫助體溫下降。", "ext": "蒸發屬汽化須吸熱；酒精擦皮膚覺涼、狗吐舌喘氣、灑水降溫皆為蒸發吸熱的應用。"}, {"num": 12, "content": "手摸金屬桌腳比木桌面感覺冷，即使兩者室溫相同，主要因為金屬 (Ａ)溫度一定較低 (Ｂ)導熱較快 (Ｃ)不含能量 (Ｄ)會吸收光。", "ans": "B", "topic": "熱傳導", "analysis": "金屬導熱比木材快，會較迅速把手的熱帶走，所以即使初溫相同也感覺較冷。", "ext": "冷熱感覺取決於熱流失快慢而非物體溫度；金屬導熱快，冬天摸起來冷、曝曬後摸起來燙。"}, {"num": 13, "content": "一杯熱水放室內後降溫，最後接近室溫，是因為 (Ａ)溫度無法測量 (Ｂ)冷由空氣流入水中 (Ｃ)水的質量消失 (Ｄ)熱由熱水傳向較冷環境。", "ans": "D", "topic": "熱平衡", "analysis": "熱會自較高溫的熱水傳向較低溫的空氣和容器，直到彼此溫度接近平衡。", "ext": "熱自高溫物體流向低溫物體，直到兩者溫度相同達熱平衡；冷不是實體，不會流動。"}, {"num": 14, "content": "相同質量、初溫相同的水與砂土接受相同加熱，砂土升溫較快；停止加熱後也降溫較快，顯示水 (Ａ)不會蒸發 (Ｂ)不吸熱 (Ｃ)質量較小 (Ｄ)升降溫較慢。", "ans": "D", "topic": "比熱", "analysis": "相同質量接受相同熱量時，水溫變化比砂土小；散熱時也較慢，表示水升降溫較慢。", "ext": "水的比熱大、升降溫皆慢，故沿海晝夜溫差小、沙漠溫差大；海陸風成因也與此有關。"}, {"num": 15, "content": "以相同火力加熱不同水量，哪一杯通常最快達到60℃？ (Ａ)150毫升水 (Ｂ)100毫升水 (Ｃ)50毫升水 (Ｄ)200毫升水。", "ans": "C", "topic": "熱量計算", "analysis": "若各杯初溫相同，所需熱量Q＝mcΔT；水量越少，升到60℃所需熱量越少，因此50毫升最快。", "ext": "所需熱量與水量成正比（Q=mcΔT）；相同火力下水量加倍，升到同溫度的時間約加倍。"}, {"num": 16, "content": "在密閉針筒中封住空氣並推壓活塞，空氣體積變小，顯示氣體 (Ａ)完全不可壓縮 (Ｂ)可被壓縮 (Ｃ)沒有質量 (Ｄ)變成真空。", "ans": "B", "topic": "氣體壓縮", "analysis": "推壓密閉空氣時，同量氣體可占較小體積，顯示氣體粒子間空隙大而可被壓縮。", "ext": "氣體粒子間距大故易壓縮，放手後體積回彈；打氣筒、球內充氣皆利用此性質。"}, {"num": 17, "content": "注射筒裝滿水、封住出口後很難再推動活塞，與裝空氣相比，表示液體 (Ａ)會燃燒 (Ｂ)較易壓縮 (Ｃ)沒有體積 (Ｄ)較難壓縮。", "ans": "D", "topic": "液體壓縮性", "analysis": "液體粒子間空隙小，體積不易再縮小，因此封住水的注射筒比封住空氣更難推動。", "ext": "液體幾乎不可壓縮，能有效傳遞壓力，油壓機與汽車液壓煞車即應用此性質。"}, {"num": 18, "content": "物體在水中看似變輕，是因為水對物體施加 (Ａ)向下的磁力 (Ｂ)向上的浮力 (Ｃ)水平摩擦力 (Ｄ)向上的重力。", "ans": "B", "topic": "浮力", "analysis": "浸在水中的物體受到水向上的浮力，抵銷部分向下的重力，所以測得的視重量變小。", "ext": "浮力等於物體排開液體的重量（阿基米德原理）；水中視重＝實重－浮力，故覺得變輕。"}, {"num": 19, "content": "一艘船從淡水駛入密度較大的海水，載重不變時通常會 (Ａ)沉得更深 (Ｂ)浮得較高一些 (Ｃ)失去浮力 (Ｄ)質量變小。", "ans": "B", "topic": "浮力與密度", "analysis": "漂浮時浮力等於船重；海水密度較大，船只需排開較小體積就能得到相同浮力，因此浮得較高。", "ext": "漂浮時浮力恆等於物重；液體密度越大所需排開體積越小，吃水越淺，死海易漂浮同理。"}, {"num": 20, "content": "潛水艇排出水艙中的水並充入空氣，平均密度下降，通常會 (Ａ)下沉 (Ｂ)停止受力 (Ｃ)上浮 (Ｄ)變成固體。", "ans": "C", "topic": "浮沉控制", "analysis": "排出水並充入空氣使潛水艇總質量及平均密度下降；浮力大於重力時便會上浮。", "ext": "潛水艇靠水艙進出水改變平均密度控制浮沉；魚類則以鰾脹縮調整，原理相似。"}, {"num": 21, "content": "將鐵釘、鋁片、塑膠尺靠近磁鐵，只有鐵釘明顯被吸引，顯示磁鐵 (Ａ)能吸引所有金屬 (Ｂ)只吸引塑膠 (Ｃ)能明顯吸引鐵、鎳、鈷等特定材料，並非所有金屬 (Ｄ)必須接觸才有力。", "ans": "C", "topic": "磁性材料", "analysis": "磁鐵能明顯吸引鐵、鎳、鈷等鐵磁性材料，但鋁等金屬不會像鐵釘般被明顯吸引。", "ext": "磁鐵可吸引鐵、鈷、鎳；金銀銅鋁不被吸引，「磁鐵吸所有金屬」是常見迷思。"}, {"num": 22, "content": "把條形磁鐵折成兩段後，每一段通常 (Ａ)只剩N極 (Ｂ)只剩S極 (Ｃ)完全失去磁性 (Ｄ)都各有N、S兩極。", "ans": "D", "topic": "磁極成對", "analysis": "磁極總是成對存在，磁鐵折斷後每段的磁畴仍形成新的N、S兩極，不會得到單一磁極。", "ext": "磁極必成對出現，無論切成幾段每段皆有N、S極；磁鐵兩端磁力最強、中間最弱。"}, {"num": 23, "content": "電磁鐵吸起迴紋針後切斷電流，迴紋針大多掉落，顯示電磁鐵的優點是 (Ａ)不需鐵芯 (Ｂ)永遠有固定磁力 (Ｃ)不需線圈 (Ｄ)磁力可用電流控制。", "ans": "D", "topic": "電磁鐵", "analysis": "線圈通電時產生磁場、斷電時磁力大幅減弱，顯示電磁鐵可用電流控制開關。", "ext": "電磁鐵磁力可由電流大小與線圈圈數調整，磁極方向隨電流方向改變，應用於電磁起重機。"}, {"num": 24, "content": "乾電池若正負極直接以導線相接，容易發熱並耗電，這種情況稱為 (Ａ)短路 (Ｂ)並聯 (Ｃ)絕緣 (Ｄ)發電。", "ans": "A", "topic": "短路", "analysis": "正負極以低電阻導線直接相接形成短路，電流過大而使電池與導線發熱、快速耗電。", "ext": "短路時電阻極小、電流過大易發熱起火；保險絲與無熔絲開關可在過載時自動切斷電路。"}, {"num": 25, "content": "雷射光射到平面鏡，入射角為30度，反射角為 (Ａ)0度 (Ｂ)15度 (Ｃ)30度 (Ｄ)60度。", "ans": "C", "topic": "反射定律", "analysis": "反射定律指出入射角等於反射角，兩者都以法線為基準，所以反射角為30度。", "ext": "入射角與反射角皆自法線量起；光垂直射向鏡面時入射角為0度，沿原路反射回去。"}, {"num": 26, "content": "潛望鏡常利用兩面互相平行且傾斜45度的平面鏡，主要應用光的 (Ａ)折射 (Ｂ)反射 (Ｃ)色散 (Ｄ)吸收。", "ans": "B", "topic": "平面鏡應用", "analysis": "潛望鏡利用兩面鏡各反射一次，改變光的傳播方向，使低處眼睛能看見高處或障礙物外景物。", "ext": "平面鏡成正立等大的虛像；潛望鏡兩鏡各使光轉90度，出射光與原入射方向平行。"}, {"num": 27, "content": "紅、綠、藍三色光適當混合可形成白光，這屬於 (Ａ)色光加法混合 (Ｂ)顏料減法混合 (Ｃ)聲音共鳴 (Ｄ)磁極作用。", "ans": "A", "topic": "色光混合", "analysis": "紅、綠、藍是色光三原色，適當比例疊加可刺激視覺形成白光，稱為加法混合。", "ext": "色光三原色紅綠藍疊加越混越亮；顏料三原色（洋紅、黃、青）越混越暗，兩者勿混淆。"}, {"num": 28, "content": "太陽光照到黑色柏油路後路面升溫，能量主要由 (Ａ)熱能轉為光能 (Ｂ)光能轉為熱能 (Ｃ)電能轉為聲能 (Ｄ)化學能轉為核能。", "ans": "B", "topic": "能量轉換", "analysis": "柏油吸收太陽輻射後內能增加、溫度升高，主要是光能轉換成熱能。", "ext": "深色表面吸光多、升溫快，淺色反光多；夏天穿淺色較涼，太陽能集熱板多為黑色。"}, {"num": 29, "content": "晝夜長短在一年中改變，主要與 (Ａ)地軸傾斜及地球公轉 (Ｂ)月球自轉 (Ｃ)每日潮汐 (Ｄ)地磁反轉。", "ans": "A", "topic": "四季成因", "analysis": "地軸傾斜且地球公轉，使一年中太陽直射位置及各地日照時間改變，造成晝夜長短變化。", "ext": "地軸傾斜約23.5度；夏至太陽直射北回歸線，北半球晝最長夜最短，冬至相反。"}, {"num": 30, "content": "春分與秋分附近，全球多數地點 (Ａ)永晝 (Ｂ)晝夜長度接近相等 (Ｃ)永夜 (Ｄ)正午太陽都在頭頂。", "ans": "B", "topic": "晝夜長短", "analysis": "春分、秋分時晨昏線大致通過兩極，全球多數地點白晝與黑夜都接近12小時。", "ext": "春秋分太陽直射赤道，日出正東、日落正西；夏至日出方位偏北，冬至偏南。"}, {"num": 31, "content": "農曆初一附近不易看見月球，主要因為 (Ａ)月球不存在 (Ｂ)地球沒有自轉 (Ｃ)月球亮面大多背向地球且接近太陽方向 (Ｄ)月球被北極星遮住。", "ans": "C", "topic": "月相", "analysis": "朔月時月球大致位於地球與太陽之間，朝地球的一面較暗，且角距太陽近而不易觀察。", "ext": "朔為初一、望為十五；上弦月約初七八，黃昏出現於南方天空，亮面朝西邊。"}, {"num": 32, "content": "流星多是小天體進入大氣層後發光；我們看到的光跡主要發生在 (Ａ)海底 (Ｂ)太陽內部 (Ｃ)月球背面 (Ｄ)地球大氣中。", "ans": "D", "topic": "流星", "analysis": "小天體高速進入地球大氣後壓縮、加熱周圍氣體並燒蝕發光，光跡主要出現在大氣層中。", "ext": "流星體多在高空約八十至一百多公里處與大氣作用發光；未燒盡而落地者稱為隕石。"}, {"num": 33, "content": "高氣壓中心附近空氣通常 (Ａ)上升，易形成厚雲雨 (Ｂ)必有颱風 (Ｃ)完全靜止 (Ｄ)下沉，天氣較穩定。", "ans": "D", "topic": "高低氣壓", "analysis": "高壓中心空氣通常下沉，下降時增溫使相對濕度降低、雲較難發展，所以天氣常較穩定。", "ext": "低壓中心空氣上升易成雲致雨；北半球高壓氣流順時針向外旋出、低壓逆時針向內旋入。"}, {"num": 34, "content": "颱風的能量主要來自溫暖海面提供的 (Ａ)月光 (Ｂ)地震波 (Ｃ)水氣凝結釋放的能量 (Ｄ)海鹽結晶。", "ans": "C", "topic": "颱風", "analysis": "溫暖海水蒸發供應大量水氣，水氣上升凝結時釋放潛熱，成為颱風的重要能量來源。", "ext": "颱風登陸後失去暖海水氣供應且摩擦增大而減弱；颱風眼內盛行下沉氣流，天氣暫時平靜。"}, {"num": 35, "content": "夏季午後山區易出現雷陣雨，常因地表加熱使暖濕空氣 (Ａ)上升冷卻凝結 (Ｂ)下沉並升溫 (Ｃ)變成固體 (Ｄ)停止流動。", "ans": "A", "topic": "對流雨", "analysis": "午後地表受熱使暖濕空氣上升，上升後膨脹冷卻並凝結，容易形成積雨雲和雷陣雨。", "ext": "空氣上升膨脹冷卻才會凝結成雲；雷陣雨範圍小、強度大、時間短，常伴隨閃電雷聲。"}, {"num": 36, "content": "同一河段彎道外側通常水流較快、侵蝕較強，內側較慢、易 (Ａ)火山噴發 (Ｂ)沉積 (Ｃ)地震 (Ｄ)形成冰河。", "ans": "B", "topic": "河流作用", "analysis": "彎道內側流速較慢，攜帶沉積物的能力降低，泥沙容易沉積；外側流快而侵蝕較強。", "ext": "曲流外側為凹岸，侵蝕強、水較深；內側為凸岸，易堆積成沙洲淺灘，河道因而漸彎。"}, {"num": 37, "content": "比較甲、乙，主要探討 (Ａ)溫度 (Ｂ)酸鹼性 (Ｃ)酵素量 (Ｄ)蛋白液量。", "ans": "B", "topic": "實驗變因", "analysis": "甲、乙的溫度、酵素量和蛋白液量相同，只有酸鹼性不同，因此主要探討酸鹼性。", "ext": "對照實驗中兩組僅操作變因不同，其餘皆須相同；一次只改變一個變因結果才能歸因。", "gr": "第 37–39 題", "gi": "學生把等量胃蛋白酶與蛋白液分成四組，反應20分鐘。甲：37℃、酸性，蛋白分解多；乙：37℃、中性，分解少；丙：5℃、酸性，分解少；丁：80℃、酸性，沒有分解。"}, {"num": 38, "content": "比較甲、丙，可推論在題設範圍內 (Ａ)37℃比5℃較利胃蛋白酶作用 (Ｂ)低溫一定破壞酵素 (Ｃ)酸性會停止反應 (Ｄ)溫度不影響反應。", "ans": "A", "topic": "酵素與溫度", "analysis": "甲、丙同為酸性且材料量相同，37℃組分解多、5℃組分解少，顯示題設範圍內37℃較利酵素作用。", "ext": "酵素有最適溫度，人體酵素約37℃；低溫只是活性降低可回復，高溫變性通常不可回復。"}, {"num": 39, "content": "丁組無分解，最合理原因是 (Ａ)高溫可能破壞酵素活性 (Ｂ)蛋白質在高溫消失 (Ｃ)酸性不存在 (Ｄ)水變成氧氣。", "ans": "A", "topic": "酵素變性", "analysis": "酵素多為蛋白質，80℃高溫可能破壞其立體構造而失去活性，因此無法分解蛋白液。", "ext": "酵素主要成分為蛋白質，高溫破壞其立體結構稱變性，如蛋白煮熟後無法恢復透明。"}, {"num": 40, "content": "本實驗操作變因是 (Ａ)電池種類 (Ｂ)燈泡規格 (Ｃ)導線材料 (Ｄ)導線長度。", "ans": "C", "topic": "操作變因", "analysis": "電池、燈泡及導線長度和粗細都相同，主動更換的是導線材料，所以材料是操作變因。", "ext": "操作變因是研究者主動改變的條件，應變變因是隨之測量的結果，其餘為控制變因。", "gr": "第 40–42 題", "gi": "某電路以相同電池測試導線材料，燈泡亮度紀錄：銅線亮、鋁線亮、鐵線微亮、塑膠線不亮；各線長度與粗細相同。"}, {"num": 41, "content": "依結果，最適合當絕緣材料的是 (Ａ)塑膠 (Ｂ)鋁 (Ｃ)鐵 (Ｄ)銅。", "ans": "A", "topic": "導體絕緣體", "analysis": "接塑膠線時燈泡不亮，表示塑膠在此條件下幾乎不導電，最適合作絕緣材料。", "ext": "塑膠、橡膠、玻璃為常見絕緣體，用作電線外皮防觸電；石墨雖非金屬卻能導電是例外。"}, {"num": 42, "content": "鐵線使燈泡微亮，最合理說明是鐵線 (Ａ)能導電但電阻可能較大 (Ｂ)完全不導電 (Ｃ)能發電 (Ｄ)會吸收燈泡。", "ans": "A", "topic": "電阻", "analysis": "鐵線能使燈泡微亮，表示它仍可導電；亮度較低可能因其電阻較銅、鋁線大，使電流較小。", "ext": "導線電阻與長度成正比、與粗細（截面積）成反比；電阻越大電流越小，燈泡越暗。"}, {"num": 43, "content": "依地層疊置原理，四層中通常最老的是 (Ａ)丙 (Ｂ)乙 (Ｃ)甲 (Ｄ)丁。", "ans": "C", "topic": "疊置原理", "analysis": "未受翻轉的沉積岩層通常下老上新，因此位於最下方的甲層最老。", "ext": "疊置原理僅適用於未翻轉的地層；若曾倒轉，須靠化石或沉積構造判斷原來的上下。", "gr": "第 43–45 題", "gi": "某地岩層由下而上為甲、乙、丙、丁。乙層含三葉蟲化石，丙層含魚化石；一條岩脈穿過甲、乙、丙，岩脈頂端被丁層完整覆蓋，接觸面未受擾動。"}, {"num": 44, "content": "岩脈與丙層相比，岩脈通常 (Ａ)較新 (Ｂ)較老 (Ｃ)同時形成 (Ｄ)無法依穿切關係判斷。", "ans": "A", "topic": "穿切關係", "analysis": "岩脈穿過丙層，依穿切關係，造成穿切的岩脈形成時間晚於被穿過的丙層。", "ext": "侵入的岩脈或斷層必晚於被它穿切的地層形成，是判斷地質事件先後的重要原則。"}, {"num": 45, "content": "岩脈頂端被丁層完整覆蓋，最合理推論是 (Ａ)岩脈屬於化石 (Ｂ)丁層一定最老 (Ｃ)丁層可能在岩脈形成後才沉積 (Ｄ)甲層最年輕。", "ans": "C", "topic": "地質事件順序", "analysis": "岩脈先穿過甲至丙並在頂端被截切，之後丁層再完整覆蓋其上，所以丁層可能在岩脈後沉積。", "ext": "事件順序為甲乙丙沉積、岩脈侵入、丁層覆蓋；覆蓋在上者必晚於其下被覆蓋的構造。"}], "40": [{"num": 1, "content": "植物白天同時進行光合作用與呼吸作用。若光合作用速率大於呼吸作用速率，周圍空氣中通常 (Ａ)氧氣淨增加 (Ｂ)氧氣淨減少 (Ｃ)二氧化碳淨增加 (Ｄ)兩種氣體必完全不變。", "ans": "A", "topic": "光合與呼吸", "analysis": "光合作用消耗二氧化碳、釋放氧氣；當其速率大於呼吸作用時，總效果是氧氣淨增加。", "ext": "呼吸作用全天進行，光合作用僅在有光時進行；夜間植物只釋出二氧化碳、消耗氧氣。"}, {"num": 2, "content": "把同株植物一片葉裝入透明袋，數小時後袋內出現水珠；若排除外部漏水，水主要來自 (Ａ)空氣中的氧氣融化 (Ｂ)塑膠製造水 (Ｃ)光合作用只產生液態水 (Ｄ)葉片蒸散出的水蒸氣凝結。", "ans": "D", "topic": "蒸散作用", "analysis": "葉片由氣孔散失水蒸氣，水氣在袋內遇較冷表面凝結，形成可見水珠。", "ext": "蒸散經氣孔散失水分，產生拉力幫助根部吸水運輸，並能帶走熱量降低葉片溫度。"}, {"num": 3, "content": "植物根部長期積水可能腐爛，主要因為土壤缺氧，使根細胞 (Ａ)產生太多葉綠素 (Ｂ)光合作用過強 (Ｃ)呼吸作用受影響 (Ｄ)無法接受月光。", "ans": "C", "topic": "根的呼吸", "analysis": "積水填滿土壤孔隙使氧氣不足，根細胞無法正常進行有氧呼吸，長期會受損腐爛。", "ext": "根細胞行呼吸作用需要氧氣；鬆土可增加土壤空隙助根呼吸，水耕栽培則須打氣供氧。"}, {"num": 4, "content": "豆科植物根瘤菌能協助固定氮，植物提供糖分，這種關係可視為 (Ａ)競爭 (Ｂ)捕食 (Ｃ)互利共生 (Ｄ)寄生。", "ans": "C", "topic": "互利共生", "analysis": "根瘤菌由植物取得糖，植物則取得根瘤菌固定的含氮物質，雙方均獲益，屬互利共生。", "ext": "互利共生尚有小丑魚與海葵、螞蟻與蚜蟲；地衣則是藻類與真菌的共生組合。"}, {"num": 5, "content": "杜鵑把卵產在其他鳥巢中，讓宿主代為育幼，杜鵑獲益而宿主受害，屬於 (Ａ)分解作用 (Ｂ)互利關係 (Ｃ)生產者關係 (Ｄ)寄生關係。", "ans": "D", "topic": "寄生關係", "analysis": "杜鵑將育幼成本轉嫁給宿主，杜鵑獲益而宿主耗費資源甚至損失自身後代，屬寄生關係。", "ext": "杜鵑托卵稱巢寄生；蛔蟲為體內寄生、跳蚤為體外寄生，皆寄生者獲益、宿主受害。"}, {"num": 6, "content": "一地區物種種類多、食物網複雜，受到單一物種減少時通常比簡單生態系 (Ａ)沒有能量流動 (Ｂ)一定立刻崩潰 (Ｃ)完全不受影響 (Ｄ)更可能有替代食物途徑。", "ans": "D", "topic": "生態穩定性", "analysis": "複雜食物網常有多條能量傳遞路徑，單一物種減少時，消費者較可能改用其他食物來源。", "ext": "生物多樣性越高，生態系抵抗干擾與復原的能力通常越強；單一作物農田較為脆弱。"}, {"num": 7, "content": "人體紅血球中央凹陷且沒有細胞核，主要有利於 (Ａ)吞噬細菌 (Ｂ)攜帶氧氣 (Ｃ)形成尿液 (Ｄ)分泌消化液。", "ans": "B", "topic": "紅血球", "analysis": "中央凹陷增加紅血球表面積，無核可容納更多血紅素，均有利於氧氣的攜帶與交換。", "ext": "紅血球含血紅素與氧結合故呈紅色；白血球有細胞核，能吞噬病菌負責防禦。"}, {"num": 8, "content": "運動員高山訓練一段時間後紅血球可能增加，主要是適應高山 (Ａ)大氣壓及氧分壓較低 (Ｂ)重力消失 (Ｃ)沒有水 (Ｄ)氣壓較高。", "ans": "A", "topic": "高山適應", "analysis": "高山大氣壓和氧分壓較低，增加紅血球可提高血液攜氧能力，是對低氧環境的適應。", "ext": "高山空氣稀薄易缺氧引發高山症；紅血球增多可提高攜氧能力，是對低氧環境的調節。"}, {"num": 9, "content": "皮膚受傷流血後，血小板主要協助 (Ａ)運送氧氣 (Ｂ)產生尿素 (Ｃ)消化脂肪 (Ｄ)凝血止血。", "ans": "D", "topic": "血液凝固", "analysis": "血小板會在傷口聚集並啟動凝血反應，形成血塊以減少失血。", "ext": "血液成分分工：紅血球攜氧、白血球禦敵、血小板凝血、血漿運送養分與廢物。"}, {"num": 10, "content": "食物中的澱粉最早在哪裡開始被化學消化？ (Ａ)口腔 (Ｂ)胃 (Ｃ)大腸 (Ｄ)肝臟。", "ans": "A", "topic": "澱粉消化", "analysis": "唾液中的澱粉酶在口腔開始分解澱粉，所以化學消化最早發生在口腔。", "ext": "唾液澱粉酶把澱粉分解成麥芽糖，白飯久嚼變甜即因此；蛋白質的化學消化始於胃。"}, {"num": 11, "content": "學生把手掌互相快速摩擦後感到變熱，主要是 (Ａ)熱能轉成重力位能 (Ｂ)動能經摩擦轉成熱能 (Ｃ)磁能轉成核能 (Ｄ)質量轉成空氣。", "ans": "B", "topic": "摩擦生熱", "analysis": "摩擦力使手掌相對運動的動能轉成微觀粒子運動的內能，表面溫度因而上升。", "ext": "摩擦使動能轉為熱能，如鑽木取火、太空船返回大氣層時表面產生高溫皆是實例。"}, {"num": 12, "content": "球被向上拋出，到達最高點的瞬間，忽略空氣阻力，球 (Ａ)速度為零但仍受重力 (Ｂ)速度與重力都為零 (Ｃ)不受任何力 (Ｄ)質量變零。", "ans": "A", "topic": "拋體運動", "analysis": "最高點瞬間球的速度為零，但地球重力仍向下作用，因此隨後會向下加速。", "ext": "最高點速度為零但重力仍作用，加速度不為零；「速度為零就不受力」是常見迷思。"}, {"num": 13, "content": "兩物體相撞時，甲對乙的作用力與乙對甲的作用力 (Ａ)大小相等、方向相反 (Ｂ)甲一定較大 (Ｃ)乙一定較大 (Ｄ)方向相同。", "ans": "A", "topic": "牛頓第三定律", "analysis": "依牛頓第三定律，甲、乙間的作用力與反作用力大小相等、方向相反，且同時作用在不同物體上。", "ext": "作用力與反作用力分別作用在不同物體上，不能互相抵銷；走路靠腳蹬地、地反推人。"}, {"num": 14, "content": "在水平地面用10牛頓向右拉箱子，箱子仍靜止，表示地面對箱子的靜摩擦力約為 (Ａ)0牛頓 (Ｂ)5牛頓向左 (Ｃ)10牛頓向左 (Ｄ)10牛頓向右。", "ans": "C", "topic": "靜摩擦力", "analysis": "箱子靜止表示水平合力為零，靜摩擦力必與10牛頓拉力等大反向，即10牛頓向左。", "ext": "靜摩擦力會隨外力大小調整，達最大靜摩擦前物體不動；動摩擦通常小於最大靜摩擦。"}, {"num": 15, "content": "乘坐等速向前行駛的車，在車內垂直向上拋球，若忽略空氣影響，球會 (Ａ)落到車後方很遠 (Ｂ)落回手附近 (Ｃ)落到車前方很遠 (Ｄ)停在空中。", "ans": "B", "topic": "慣性", "analysis": "球離手時已具有與車相同的水平速度，且忽略空氣時水平速度維持，因此相對車廂落回手附近。", "ext": "球離手後仍保有與車相同的水平速度，此即慣性；急煞車時乘客前傾也是慣性現象。"}, {"num": 16, "content": "同一彈簧在彈性限度內，掛50克伸長2公分；掛100克預計伸長 (Ａ)1公分 (Ｂ)2公分 (Ｃ)10公分 (Ｄ)4公分。", "ans": "D", "topic": "虎克定律", "analysis": "彈性限度內伸長量與負重成正比；100克是50克的2倍，伸長為2×2＝4公分。", "ext": "彈簧伸長量與外力成正比僅限彈性限度內；超過限度彈簧變形後便無法恢復原長。"}, {"num": 17, "content": "用理想動滑輪吊起重物，忽略摩擦及動滑輪重量，若有兩段繩支撐重物，所需拉力約為物重的 (Ａ)四倍 (Ｂ)一半 (Ｃ)兩倍 (Ｄ)相同。", "ans": "B", "topic": "滑輪", "analysis": "兩段繩平均支撐重物時，2T＝W，所以理想情況下拉力T＝W÷2。", "ext": "動滑輪省一半力但拉繩距離加倍；定滑輪不省力，只改變施力方向，兩者常組合使用。"}, {"num": 18, "content": "長柄扳手比短柄扳手容易轉動緊螺帽，因為相同施力下長柄產生較大的 (Ａ)密度 (Ｂ)質量 (Ｃ)力矩 (Ｄ)電流。", "ans": "C", "topic": "力矩", "analysis": "力矩＝力×力臂；長柄增加作用線到轉軸的距離，相同施力可產生較大力矩。", "ext": "力矩＝力×力臂；門把裝在遠離門軸處、老虎鉗柄長刃短，皆以加大力臂來省力。"}, {"num": 19, "content": "電風扇轉速加快時，馬達的電能主要轉成更多 (Ａ)動能 (Ｂ)化學能 (Ｃ)核能 (Ｄ)重力位能。", "ans": "A", "topic": "能量轉換", "analysis": "馬達把電能轉為扇葉轉動的動能；轉速提高時扇葉動能通常增加。", "ext": "馬達運轉時部分電能因線圈與摩擦轉為熱能，故電器用久會發燙，能量並未消失。"}, {"num": 20, "content": "一顆燈泡接電池不亮，確認燈泡與電池正常，最可能原因是 (Ａ)電池有正負極 (Ｂ)燈泡太透明 (Ｃ)導線有顏色 (Ｄ)電路未形成通路。", "ans": "D", "topic": "電路通路", "analysis": "燈泡與電池正常卻不亮，最可能是導線接點鬆脫等原因使電路斷開，無法形成持續電流。", "ext": "通路才有電流，斷路無電流，短路則電流過大危險；檢查電路先確認接點是否鬆脫。"}, {"num": 21, "content": "家庭電路採並聯的主要好處是 (Ａ)一個電器關閉全部熄滅 (Ｂ)各電器可獨立開關 (Ｃ)電流永遠為零 (Ｄ)不需保險裝置。", "ans": "B", "topic": "串並聯電路", "analysis": "並聯支路彼此獨立，各電器可分別開關；一個支路關閉或故障通常不會使其他電器全部停止。", "ext": "串聯電路一處斷路則全部熄滅；並聯各支路電壓相同，一燈損壞其餘仍可正常亮。"}, {"num": 22, "content": "兩顆電池並排但正負極未接入閉合電路時 (Ａ)不會有持續電流 (Ｂ)一定大量放電 (Ｃ)會產生火焰 (Ｄ)自動變成磁鐵。", "ans": "A", "topic": "電流條件", "analysis": "持續電流需有電位差並形成閉合通路；電池未接入閉合電路時沒有持續電流。", "ext": "持續電流需電池提供電位差且電路閉合缺一不可；電池久放未用仍會緩慢自放電。"}, {"num": 23, "content": "影子的形成最能說明光在均勻介質中 (Ａ)沒有能量 (Ｂ)只能反射 (Ｃ)沿直線前進 (Ｄ)會產生聲音。", "ans": "C", "topic": "光直線傳播", "analysis": "不透明物遮住光線後方形成影子，顯示光在均勻介質中大致沿直線傳播。", "ext": "日食月食、針孔成像皆因光沿直線前進；影子可分為全暗的本影與半暗的半影。"}, {"num": 24, "content": "小孔成像形成的影像通常 (Ａ)一定放大 (Ｂ)正立 (Ｃ)倒立 (Ｄ)不隨物距改變。", "ans": "C", "topic": "針孔成像", "analysis": "來自物體各點的光穿過小孔後交叉投射，因此屏上形成上下、左右相反的倒立影像。", "ext": "針孔成像上下左右皆顛倒且為實像；孔變大像變亮但模糊，物體靠近則像變大。"}, {"num": 25, "content": "放大鏡看近距離文字得到放大正立像，此像通常 (Ａ)可投影的實像 (Ｂ)與透鏡無關 (Ｃ)倒立實像 (Ｄ)不可投影的虛像。", "ans": "D", "topic": "凸透鏡成像", "analysis": "物體位於凸透鏡焦距內時，眼睛看到放大、正立的虛像；光線並未真正會聚，所以不能投影。", "ext": "物在焦點外成倒立實像可投影於屏；物在焦點內成正立放大虛像，即放大鏡的用法。"}, {"num": 26, "content": "藍色物體在只含紅光的房間中看起來偏黑，主要因為它 (Ａ)溫度下降 (Ｂ)會製造黑光 (Ｃ)反射所有紅光 (Ｄ)不易反射紅光。", "ans": "D", "topic": "物體顏色", "analysis": "藍色物體主要反射藍光；環境只有紅光而它不易反射紅光，進入眼睛的光很少，所以顯得黑暗。", "ext": "物體顏色取決於它反射的色光；白色物反射所有色光，黑色物幾乎吸收全部色光。"}, {"num": 27, "content": "加熱碳酸氫鈉產生性質不同的物質，屬於 (Ａ)凝結 (Ｂ)物理變化 (Ｃ)化學變化 (Ｄ)溶解。", "ans": "C", "topic": "化學變化", "analysis": "碳酸氫鈉受熱分解，產生化學性質不同的新物質，因此是化學變化。", "ext": "化學變化有新物質生成，如燃燒、鐵生鏽、發酵；物理變化僅形狀或狀態改變，如熔化。"}, {"num": 28, "content": "糖溶於水後看不見糖粒，但糖仍存在，最直接的證據是 (Ａ)水變透明 (Ｂ)蒸發水後可得到糖 (Ｃ)杯子仍有重量 (Ｄ)用磁鐵可吸出糖。", "ans": "B", "topic": "溶解", "analysis": "糖只是均勻分散於水中；把水蒸發後可重新取得糖，直接證明糖並未消失。", "ext": "溶解屬物理變化，糖粒分散成肉眼不可見的小粒子；溶液總質量＝溶質＋溶劑質量。"}, {"num": 29, "content": "要提高固體在水中的溶解速率而不改變最終溶質質量，可 (Ａ)封住杯口 (Ｂ)加入更多同種固體 (Ｃ)磨碎並攪拌 (Ｄ)降低接觸面積。", "ans": "C", "topic": "溶解速率", "analysis": "磨碎增加固液接觸面積，攪拌使未飽和溶液持續接觸固體，都能加快溶解但不改變加入的溶質總質量。", "ext": "加快溶解三法為攪拌、磨碎、提高水溫；溶解速率變快不代表該溫度溶解度上限改變。"}, {"num": 30, "content": "相同體積的水結冰後體積變大，因此冰的密度通常 (Ａ)大於液態水 (Ｂ)小於液態水 (Ｃ)等於水蒸氣 (Ｄ)無法比較。", "ans": "B", "topic": "水的密度", "analysis": "同質量的水結冰後體積變大，依密度＝質量÷體積，冰的密度小於液態水。", "ext": "水結冰體積約增加十分之一，故玻璃瓶裝滿水冷凍易脹破；水在4℃時密度最大。"}, {"num": 31, "content": "冬季水面結冰而底層仍有液態水，對水生生物有利，主要因為冰 (Ａ)使水全部沸騰 (Ｂ)沉到底部 (Ｃ)會製造氧氣 (Ｄ)浮在水面並具隔熱作用。", "ans": "D", "topic": "冰浮隔熱", "analysis": "密度較小的冰浮在水面，並減少底層水與冷空氣間的熱傳，使水下較能保持液態。", "ext": "湖水降溫時4℃的水最重沉底，表層先結冰；底層水維持液態，讓水生生物得以過冬。"}, {"num": 32, "content": "太陽系中，距太陽越遠的行星，其公轉週期通常 (Ａ)越長 (Ｂ)越短 (Ｃ)都相同 (Ｄ)為零。", "ans": "A", "topic": "行星公轉", "analysis": "行星距太陽越遠，軌道通常越大、平均公轉速度也較慢，完成一圈所需時間較長。", "ext": "水星公轉一圈約88天最短，海王星約165年最長；距離越遠軌道越大、速度越慢。"}, {"num": 33, "content": "日食不會每個朔月都發生，主要因為月球公轉軌道面與地球公轉軌道面 (Ａ)完全重合 (Ｂ)完全垂直 (Ｃ)有些傾斜 (Ｄ)每月消失。", "ans": "C", "topic": "日食條件", "analysis": "月球軌道面與黃道面約有傾角，多數朔月時月球影子從地球上方或下方掠過，只有接近交點才會日食。", "ext": "月球軌道面與黃道面約傾斜5度；日食必發生在朔（初一），月食必發生在望（十五）。"}, {"num": 34, "content": "某地北極星仰角約25度，該地緯度約為 (Ａ)南緯25度 (Ｂ)北緯25度 (Ｃ)東經25度 (Ｄ)西經25度。", "ans": "B", "topic": "北極星仰角", "analysis": "北半球可見的北極星仰角約等於當地北緯度，因此仰角25度對應約北緯25度。", "ext": "北極星仰角約等於當地緯度：赤道處仰角近0度貼近地平，北極點則位於頭頂正上方。"}, {"num": 35, "content": "地震P波比S波傳得快，因此地震儀通常 (Ａ)先記錄到S波 (Ｂ)先記錄到P波 (Ｃ)同時只記一種波 (Ｄ)無法記錄P波。", "ans": "B", "topic": "地震波", "analysis": "P波速度比S波快，從同一震源出發後會先到測站，所以地震儀先記錄到P波。", "ext": "P波為縱波可穿過固液氣三態；S波為橫波只能通過固體，無法穿過液態外地核。"}, {"num": 36, "content": "同一地震在甲站P、S波到時差2秒，乙站到時差8秒。通常哪站距震央較遠？ (Ａ)乙站 (Ｂ)甲站 (Ｃ)一樣遠 (Ｄ)無法由到時差判斷。", "ans": "A", "topic": "震央距離", "analysis": "測站離震源越遠，快慢不同的P、S波累積的到時差通常越大；8秒的乙站較2秒的甲站遠。", "ext": "P、S波到時差越大代表距離越遠；利用三個測站的距離畫圓交會可求出震央位置。"}, {"num": 37, "content": "實驗的應變變因是 (Ａ)氣泡數 (Ｂ)光色 (Ｃ)水草種類 (Ｄ)照射時間。", "ans": "A", "topic": "實驗變因", "analysis": "隨光色改變而被測量的是10分鐘的氣泡數，因此氣泡數是應變變因，光色是操作變因。", "ext": "操作變因為光色、應變變因為氣泡數；光強、距離、水溫是必須相同的控制變因。", "gr": "第 37–39 題", "gi": "某班研究不同光色對水草產氣的影響。相同水草照射10分鐘，氣泡數：紅光48、藍光44、綠光12、黑暗2；各組光強、距離與水溫相同。"}, {"num": 38, "content": "依資料，哪兩種光較能促進水草產氣？ (Ａ)綠、黑暗 (Ｂ)紅、綠 (Ｃ)藍、綠 (Ｄ)紅、藍。", "ans": "D", "topic": "光色與光合", "analysis": "紅光與藍光組分別有48、44個氣泡，明顯高於綠光與黑暗組，顯示兩者較能促進產氣。", "ext": "葉綠素主要吸收紅光與藍紫光，綠光大多被反射，故葉呈綠色且綠光下光合效率低。"}, {"num": 39, "content": "設置黑暗組的主要用途是 (Ａ)改變水草種類 (Ｂ)增加光強 (Ｃ)作為無光條件的對照 (Ｄ)證明氣泡一定是氮氣。", "ans": "C", "topic": "對照組", "analysis": "黑暗組提供無光基準，可判斷有光各組的產氣增加是否與照光有關，是對照組。", "ext": "對照組不接受實驗處理作為比較基準；缺少對照便難確認結果是否由操作變因造成。"}, {"num": 40, "content": "原溫度下，至少有多少克X溶於水？ (Ａ)5克 (Ｂ)100克 (Ｃ)25克 (Ｄ)20克。", "ans": "D", "topic": "溶解度計算", "analysis": "加入25克後尚有5克未溶，至少已溶解25－5＝20克；因此原溫度下溶入水中的量為20克。", "ext": "仍有未溶固體表示溶液已飽和；該溫度下100克水約溶20克X，即其溶解度約20克。", "gr": "第 40–42 題", "gi": "某學生把25克物質X加入100克水，充分攪拌後過濾，得到5克未溶固體；把水溫提高並再攪拌後，未溶固體全部消失。"}, {"num": 41, "content": "升溫後固體全消失，最合理推論是X在水中的溶解度 (Ａ)永遠是0 (Ｂ)隨溫度上升而減少 (Ｃ)隨溫度上升而增加 (Ｄ)與水量無關。", "ans": "C", "topic": "溶解度與溫度", "analysis": "原溫度充分攪拌仍有固體，升溫後同量水卻能使其全溶，表示X的溶解度隨此溫度上升而增加。", "ext": "多數固體溶解度隨溫度升高而增加；氣體相反，汽水加溫時溶入的氣體更快逸出。"}, {"num": 42, "content": "若將升溫後的溶液慢慢冷卻，最可能觀察到 (Ａ)X變成氧氣 (Ｂ)X可能重新結晶 (Ｃ)水變成金屬 (Ｄ)質量憑空消失。", "ans": "B", "topic": "再結晶", "analysis": "若降溫使溶解度下降，溶液可容納的X變少，多出的X便可能以晶體形式析出。", "ext": "冷卻飽和溶液使溶質析出稱結晶；粗鹽純化與明礬大晶體製作皆利用再結晶原理。"}, {"num": 43, "content": "這種環境最接近 (Ａ)高山針葉林 (Ｂ)潮間帶溼地 (Ｃ)沙漠 (Ｄ)深海海溝。", "ans": "B", "topic": "潮間帶", "analysis": "泥灘隨漲退潮交替淹水與露出，並有招潮蟹、彈塗魚等生物，是典型潮間帶溼地。", "ext": "潮間帶生物須耐乾溼、溫度與鹽度劇變；招潮蟹退潮時外出覓食，漲潮時躲回洞穴。", "gr": "第 43–45 題", "gi": "某海岸退潮時露出寬廣泥灘，有招潮蟹、彈塗魚與水鳥；漲潮時泥灘被海水覆蓋。附近開發案計畫填平部分泥灘。"}, {"num": 44, "content": "填平泥灘最直接可能造成 (Ａ)生物棲地減少 (Ｂ)潮汐停止 (Ｃ)海水鹽分變零 (Ｄ)地球停止公轉。", "ans": "A", "topic": "棲地破壞", "analysis": "填平泥灘會直接減少覓食、躲藏和繁殖空間，使依賴此環境的生物失去棲地。", "ext": "棲地破壞是生物多樣性喪失的主因；溼地兼具滯洪與淨化水質功能，被稱為大地之腎。"}, {"num": 45, "content": "評估開發影響最科學的方法是 (Ａ)只觀察一天 (Ｂ)開發前後定期調查物種與數量 (Ｃ)只記錄最大生物 (Ｄ)不設固定範圍。", "ans": "B", "topic": "生態調查", "analysis": "在固定樣區於開發前後定期調查物種與數量，可建立基準、觀察時間變化並比較開發影響。", "ext": "科學調查須設固定樣區、定期長期記錄，並於開發前先建立基準資料以供前後比較。"}]}</script>
<script>
let DATA = null;
const menuEl = document.getElementById('menu');
const mainEl = document.getElementById('main');

// 建立選單
for (let i = 21; i <= 40; i++) {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.dataset.round = i;
  a.textContent = `第 ${i} 回`;
  li.appendChild(a);
  menuEl.appendChild(li);
}

// 載入嵌入的資料
try {
  DATA = JSON.parse(document.getElementById('embedded-data').textContent);
  showHome();
  document.querySelectorAll('.menu a').forEach(a => {
      a.addEventListener('click', (e) => {
        document.querySelectorAll('.menu a').forEach(x => x.classList.remove('active'));
        a.classList.add('active');
        const r = parseInt(a.dataset.round);
        if (r === 0) showHome();
        else showRound(r);
        window.scrollTo(0, 0);
      });
    });
} catch(err) {
  mainEl.innerHTML = `<div class="loading">資料載入失敗：${err.message}</div>`;
}

function showHome() {
  const totalQ = Object.values(DATA).reduce((s, arr) => s + arr.length, 0);
  mainEl.innerHTML = `
    <div class="round-header">
      <h2>自然資優模擬試題解析</h2>
      <div class="meta">Comprehensive Analysis · Rounds 21–40</div>
    </div>
    <div class="home-card">
      <h2>使用說明</h2>
      <p>本文件收錄 20 回自然資優模擬試題，每題提供：</p>
      <p style="padding-left:1.5rem; margin-top:0.75rem;">· 正確答案</p>
      <p style="padding-left:1.5rem;">· 詳細解析（為何正確、其他選項錯在哪）</p>
      <p style="padding-left:1.5rem;">· 延伸考點提醒（相關知識與常見陷阱）</p>
      <p style="margin-top:1rem;">請點選左側選單切換各回內容。</p>
      <div class="home-stats">
        <div class="stat-item">
          <div class="stat-num">20</div>
          <div class="stat-label">回次</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">${totalQ}</div>
          <div class="stat-label">題目</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">${totalQ}</div>
          <div class="stat-label">解析</div>
        </div>
      </div>
    </div>
    <footer>自然資優模擬試題解析 · 解析內容供教學參考使用</footer>
  `;
}

function showRound(r) {
  const questions = DATA[r];
  if (!questions) {
    mainEl.innerHTML = `<div class="loading">找不到第 ${r} 回資料</div>`;
    return;
  }
  let html = `
    <div class="round-header">
      <h2>第 ${r} 回 · 試題解析</h2>
      <div class="meta">Round ${r} · ${questions.length} Questions</div>
    </div>
  `;
  questions.forEach(q => {
    const ansDisplay = (q.ans && q.ans !== 'X') ? q.ans : '—';
    if (q.gi) {
      html += `
        <div class="group-intro">
          <div class="gi-label">題組說明 · ${escapeHtml(q.gr || '')}共用</div>
          <div class="gi-text">${escapeHtml(q.gi)}</div>
        </div>
      `;
    }
    html += `
      <div class="question">
        <div class="q-header">
          <span class="q-number">Q${q.num}.</span>
          ${q.topic ? `<span class="q-topic">${escapeHtml(q.topic)}</span>` : ''}
        </div>
        <div class="q-content">${escapeHtml(q.content)}</div>
        <div class="analysis-box">
          <div class="ans-line"><span class="ans-letter">${ansDisplay}</span>答案</div>
          <div class="analysis-text">${escapeHtml(q.analysis || '（解析略）')}</div>
          ${q.ext ? `<div class="ext-text">${escapeHtml(q.ext)}</div>` : ''}
        </div>
      </div>
    `;
  });
  html += '<footer>第 ' + r + ' 回 · 解析結束</footer>';
  mainEl.innerHTML = html;
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
</script>
</body>
</html>
