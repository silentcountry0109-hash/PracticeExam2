<head>

<title>自然資優模擬試題解析｜21-40回</title>
<style>
  :root {
    --bg: #fafaf7;
    --panel: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e4e0d6;
    --accent: #7a4d3b;
    --accent-soft: #f4ede2;
    --correct: #2c5d3f;
    --serif: 'Noto Serif TC', 'Source Han Serif TC', 'Songti TC', 'PMingLiU', Georgia, serif;
    --sans: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: var(--serif);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.75;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
    width: 100%;
  }

  /* 側邊選單 */
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 2rem 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  aside h1 {
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    padding: 0 1.5rem 1.5rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 1rem;
    font-weight: 600;
    color: var(--accent);
  }

  aside h1 small {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.3rem;
    letter-spacing: 0.05em;
    font-weight: 400;
  }

  .menu {
    list-style: none;
  }

  .menu li a {
    display: block;
    padding: 0.6rem 1.5rem;
    text-decoration: none;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 0.92rem;
    border-left: 3px solid transparent;
    transition: all 0.15s ease;
    cursor: pointer;
  }

  .menu li a:hover {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .menu li a.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  /* 主內容區：滿版自動適應頁寬，但加入舒適閱讀寬度限制 */
  main {
    padding: 3rem clamp(1rem, 4vw, 4rem);
    width: 100%;
    min-width: 0; /* grid 容器內避免 overflow */
  }

  main > * {
    max-width: 960px;
    margin-left: auto;
    margin-right: auto;
  }

  .round-header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 1rem;
    margin-bottom: 2rem;
  }

  .round-header h2 {
    font-size: 2rem;
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  .round-header .meta {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 0.5rem;
    font-family: var(--sans);
  }

  .question {
    margin-bottom: 2.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px dashed var(--line);
  }

  .group-intro {
    background: var(--accent-soft);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    padding: 1rem 1.25rem;
    margin: 0 0 1.75rem 0;
  }

  .gi-label {
    font-family: var(--sans);
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
  }

  .gi-text {
    white-space: pre-line;
    color: var(--ink);
    text-align: justify;
    white-space: pre-wrap;
  }

  .q-header {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .q-number {
    font-family: var(--sans);
    font-weight: 600;
    color: var(--accent);
    font-size: 0.95rem;
    flex-shrink: 0;
    min-width: 2.5rem;
  }

  .q-topic {
    font-family: var(--sans);
    font-size: 0.78rem;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 0.15rem 0.6rem;
    border-radius: 2px;
    letter-spacing: 0.05em;
  }

  .q-content {
    margin: 0.5rem 0 1rem 0;
    color: var(--ink);
    text-align: justify;
  }

  .analysis-box {
    background: var(--panel);
    border-left: 3px solid var(--accent);
    padding: 1rem 1.25rem;
    margin-top: 0.75rem;
    font-size: 0.95rem;
  }

  .ans-line {
    font-family: var(--sans);
    font-weight: 600;
    color: var(--correct);
    margin-bottom: 0.5rem;
    font-size: 0.95rem;
  }

  .ans-letter {
    display: inline-block;
    background: var(--correct);
    color: white;
    padding: 0.1rem 0.6rem;
    border-radius: 2px;
    margin-right: 0.5rem;
    font-size: 0.85rem;
  }

  .analysis-text {
    color: var(--ink);
    margin-bottom: 0.5rem;
  }

  .ext-text {
    font-size: 0.88rem;
    color: var(--muted);
    padding-top: 0.5rem;
    border-top: 1px dotted var(--line);
    margin-top: 0.5rem;
    font-family: var(--sans);
  }

  .ext-text::before {
    content: "✻ ";
    color: var(--accent);
  }

  footer {
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid var(--line);
    text-align: center;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 0.85rem;
  }

  /* 載入中狀態 */
  .loading {
    text-align: center;
    color: var(--muted);
    padding: 4rem 0;
    font-family: var(--sans);
  }

  /* 首頁 */
  .home-card {
    background: var(--panel);
    padding: 3rem;
    border-left: 4px solid var(--accent);
    margin-bottom: 2rem;
  }

  .home-card h2 {
    font-size: 1.8rem;
    margin-bottom: 1rem;
    letter-spacing: 0.05em;
  }

  .home-card p {
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .home-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-top: 2rem;
    padding: 1.5rem;
    background: var(--accent-soft);
    border-radius: 4px;
  }

  .stat-item {
    text-align: center;
  }

  .stat-num {
    font-size: 2rem;
    font-weight: 600;
    color: var(--accent);
    font-family: var(--sans);
  }

  .stat-label {
    font-size: 0.85rem;
    color: var(--muted);
    font-family: var(--sans);
    letter-spacing: 0.05em;
  }

  /* 響應式：選單始終保持在左側，僅縮窄 */
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 200px 1fr; }
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 170px 1fr; }
    aside { padding: 1.5rem 0; }
    aside h1 { font-size: 0.95rem; padding: 0 1rem 1rem; }
    .menu li a { padding: 0.5rem 1rem; font-size: 0.85rem; }
    .home-card { padding: 2rem; }
    .home-stats { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    .layout { grid-template-columns: 110px 1fr; }
    aside h1 { font-size: 0.8rem; padding: 0 0.6rem 0.75rem; letter-spacing: 0.02em; }
    aside h1 small { font-size: 0.65rem; }
    .menu li a { padding: 0.4rem 0.6rem; font-size: 0.75rem; }
    .round-header h2 { font-size: 1.4rem; }
    .home-card { padding: 1.25rem; }
    .home-stats { grid-template-columns: 1fr 1fr; padding: 1rem; }
    .analysis-box { padding: 0.85rem 1rem; }
    .q-topic { font-size: 0.7rem; padding: 0.1rem 0.5rem; }
    body { font-size: 15px; }
  }
  @media (max-width: 400px) {
    .layout { grid-template-columns: 90px 1fr; }
    .menu li a { padding: 0.35rem 0.5rem; font-size: 0.7rem; }
  }

  /* 列印樣式 */
  @media print {
    aside { display: none; }
    .layout { grid-template-columns: 1fr; }
  }
</style>

<script id="embedded-data" type="application/json">{"21": [{"num": 1, "content": "小安把一盆向日葵放在窗邊數日，莖逐漸朝窗外彎曲。最能解釋此現象的是？ (Ａ)莖的向光性 (Ｂ)花的授粉作用 (Ｃ)根的向地性 (Ｄ)葉的蒸散作用。", "ans": "A", "topic": "向光性", "analysis": "莖會朝光源方向生長，屬於植物的向光性；授粉、根的向地性及蒸散都不能解釋莖朝窗外彎曲。", "ext": "背光側生長素較多使該側生長較快，莖因而彎向光源；根則表現向地性。"}, {"num": 2, "content": "下列哪一組生物在池塘食物鏈中的順序最合理？ (Ａ)水草→水鳥→蝌蚪 (Ｂ)蝌蚪→水草→水鳥 (Ｃ)水草→蝌蚪→水鳥 (Ｄ)水鳥→蝌蚪→水草。", "ans": "C", "topic": "食物鏈", "analysis": "水草是生產者，蝌蚪可取食水草，水鳥再捕食蝌蚪，因此合理順序為水草→蝌蚪→水鳥。", "ext": "食物鏈由生產者開始，箭頭指向捕食者；能量沿食物鏈傳遞會逐級遞減。"}, {"num": 3, "content": "觀察洋蔥表皮細胞時，在載玻片上滴一滴水再蓋上蓋玻片，主要目的為何？ (Ａ)提高放大倍率 (Ｂ)使材料平展並減少乾燥 (Ｃ)讓細胞自行移動 (Ｄ)使細胞產生葉綠體。", "ans": "B", "topic": "玻片標本", "analysis": "滴水可使薄而柔軟的洋蔥表皮平展、保持溼潤，蓋玻片也可減少水分散失；這不會改變倍率或使細胞產生葉綠體。", "ext": "常以碘液染色使細胞核更明顯；蓋玻片應斜放慢蓋以避免產生氣泡。"}, {"num": 4, "content": "人體吸氣時，下列變化何者正確？ (Ａ)橫膈上升、胸腔變小 (Ｂ)肋骨下降、胸腔變大 (Ｃ)肺主動把胸腔撐小 (Ｄ)橫膈下降、胸腔變大。", "ans": "D", "topic": "呼吸運動", "analysis": "吸氣時橫膈收縮下降、肋骨上提，使胸腔體積增大、胸腔內壓力降低，空氣因而進入肺部。", "ext": "呼氣時橫膈舒張上升、肋骨下降，胸腔縮小使空氣排出，與吸氣相反。"}, {"num": 5, "content": "一株鳳仙花只有雄蕊成熟，雌蕊尚未成熟。此時雄蕊最可能進行哪一項功能？ (Ａ)製造花粉 (Ｂ)萌發成幼苗 (Ｃ)吸收水分 (Ｄ)形成果實。", "ans": "A", "topic": "花的構造", "analysis": "雄蕊的花藥負責形成花粉；果實由受精後的子房發育，萌發與吸水也不是雄蕊的功能。", "ext": "雌蕊由柱頭、花柱與子房組成；受精後子房發育為果實、胚珠發育成種子。"}, {"num": 6, "content": "保育臺灣原生蛙類，最有效的長期作法是？ (Ａ)保留溼地並減少農藥流入 (Ｂ)捕捉後帶回家飼養 (Ｃ)清除池邊所有植物 (Ｄ)大量放生外來蛙類。", "ans": "A", "topic": "生態保育", "analysis": "保留溼地及減少農藥污染能長期維持原生蛙類所需的棲地、食物與繁殖環境；捕捉或放生外來種反而可能危害族群。", "ext": "棲地破壞與外來種入侵是本土物種減少主因；放生外來種恐破壞生態平衡。"}, {"num": 7, "content": "一塊0℃的冰持續吸熱，直到完全融化成0℃的水；這段過程吸收的熱主要用來？ (Ａ)使水分子消失 (Ｂ)改變物質狀態 (Ｃ)產生新的物質 (Ｄ)降低周圍氣壓。", "ans": "B", "topic": "熔化吸熱", "analysis": "冰在0℃融化時吸收潛熱，用於改變分子排列與物態，因此溫度可暫時維持0℃，也不會產生新物質。", "ext": "冰熔化與水沸騰時吸熱但溫度不變，此熱稱潛熱，用於改變物態而非升溫。"}, {"num": 8, "content": "四杯等量水分別加入10克物質並攪拌，靜置後杯底殘留量如下：甲0克、乙2克、丙6克、丁10克。相同條件下，溶解量最大的是？ (Ａ)甲 (Ｂ)丙 (Ｃ)丁 (Ｄ)乙。", "ans": "A", "topic": "溶解現象", "analysis": "各杯原先都加入10克物質，甲沒有殘留，表示10克全數溶解，溶解量最大。", "ext": "杯底有殘留表示該溫度下溶液已達飽和；多數固體溶解量隨溫度升高而增加。"}, {"num": 9, "content": "將紅色石蕊試紙放入未知溶液後不變色，再將藍色石蕊試紙放入後變紅。此溶液屬於？ (Ａ)酸性 (Ｂ)無法判斷 (Ｃ)中性 (Ｄ)鹼性。", "ans": "A", "topic": "酸鹼指示劑", "analysis": "酸性溶液不改變紅色石蕊，卻會使藍色石蕊變紅；兩項結果共同指向酸性。", "ext": "鹼性溶液會使紅色石蕊試紙變藍；紅、藍試紙皆不變色時為中性溶液。"}, {"num": 10, "content": "下列何者是化學變化？ (Ａ)玻璃破裂 (Ｂ)砂糖溶於水 (Ｃ)酒精揮發 (Ｄ)鐵釘生鏽。", "ans": "D", "topic": "化學變化", "analysis": "鐵釘生鏽會形成性質不同的氧化鐵，是化學變化；破裂、溶解與揮發都未產生新物質。", "ext": "化學變化會產生新物質，如燃燒、生鏽；溶解、揮發僅狀態改變屬物理變化。"}, {"num": 11, "content": "在密閉夾鏈袋中混合小蘇打與醋，袋子逐漸鼓起。最適合用來檢驗產生氣體的方法是？ (Ａ)通入澄清石灰水 (Ｂ)靠近鼻子深吸 (Ｃ)用手直接觸摸 (Ｄ)倒入藍色墨水。", "ans": "A", "topic": "氣體檢驗", "analysis": "小蘇打與醋反應產生的二氧化碳可使澄清石灰水變混濁；深吸未知氣體並不安全，也不能作為可靠檢驗。", "ext": "二氧化碳使澄清石灰水變混濁；氧氣可使餘燼復燃，是常見的氣體檢驗法。"}, {"num": 12, "content": "想比較食鹽在20℃與50℃水中的溶解快慢，下列哪一項應保持相同？ (Ａ)使用不同種類溶質 (Ｂ)攪拌次數可以任意 (Ｃ)食鹽顆粒大小 (Ｄ)水溫。", "ans": "C", "topic": "控制變因", "analysis": "要只研究水溫對溶解快慢的影響，食鹽種類、用量、顆粒大小及攪拌方式都應相同；水溫才是操作變因。", "ext": "實驗一次只能改變一個操作變因，其餘條件須相同，差異才能歸因於它。"}, {"num": 13, "content": "同一物體在木板上以2牛頓的力恰能等速前進，改放在砂紙上需4牛頓才等速前進。可推論？ (Ａ)物體重量改變 (Ｂ)砂紙沒有摩擦力 (Ｃ)木板摩擦力較大 (Ｄ)砂紙摩擦力較大。", "ans": "D", "topic": "摩擦力", "analysis": "物體等速時合力為零，所以所需推力大小等於摩擦力；砂紙上需4牛頓而木板只需2牛頓，表示砂紙摩擦力較大。", "ext": "摩擦力大小與接觸面粗糙程度及正向力有關，與接觸面積大小關係不大。"}, {"num": 14, "content": "槓桿左側距支點3格處掛4個相同砝碼，右側距支點6格處應掛幾個砝碼才能平衡？ (Ａ)8個 (Ｂ)1個 (Ｃ)4個 (Ｄ)2個。", "ans": "D", "topic": "槓桿原理", "analysis": "槓桿平衡須滿足力矩相等：左側4×3＝12，右側砝碼數×6＝12，因此需2個砝碼。", "ext": "槓桿平衡條件為施力×施力臂＝抗力×抗力臂；力臂愈長所需的力愈小。"}, {"num": 15, "content": "理想定滑輪最主要的作用是？ (Ａ)省一半的力 (Ｂ)改變施力方向 (Ｃ)省一半的距離 (Ｄ)增加重物重量。", "ans": "B", "topic": "定滑輪", "analysis": "理想定滑輪不省力，拉力約等於物重，但能把向上抬物改成向下拉，主要功能是改變施力方向。", "ext": "動滑輪可省一半力但費距離；定滑輪不省力也不省距離，只改變施力方向。"}, {"num": 16, "content": "甲車10秒走50公尺，乙車8秒走48公尺。哪一輛平均速度較快？ (Ａ)資料不足 (Ｂ)一樣快 (Ｃ)乙車 (Ｄ)甲車。", "ans": "C", "topic": "平均速率", "analysis": "甲速率＝50÷10＝5公尺/秒，乙速率＝48÷8＝6公尺/秒，所以乙車較快。", "ext": "平均速率＝總路程÷總時間；比較快慢須先將距離與時間化成相同單位。"}, {"num": 17, "content": "用相同力量撥動長短、粗細相同但鬆緊不同的橡皮筋，最緊的橡皮筋發出的聲音通常？ (Ａ)音量一定最大 (Ｂ)音調較高 (Ｃ)完全沒有聲音 (Ｄ)音調較低。", "ans": "B", "topic": "音調高低", "analysis": "長度與粗細相同時，橡皮筋越緊，振動頻率通常越高，因此音調較高；音量主要與振幅有關。", "ext": "音調由振動頻率決定，音量由振幅決定；弦愈短、愈細、愈緊音調愈高。"}, {"num": 18, "content": "手電筒照向平面鏡，光線與鏡面法線夾30°，反射光線與法線的夾角為？ (Ａ)90° (Ｂ)15° (Ｃ)30° (Ｄ)60°。", "ans": "C", "topic": "光的反射", "analysis": "反射定律指出反射角等於入射角，且兩者都以法線為基準，因此反射光與法線也夾30°。", "ext": "入射角與反射角皆自法線起算；光線垂直射向鏡面時入射角為0度。"}, {"num": 19, "content": "兩顆相同電池串聯接在相同小燈泡上，與只接一顆電池相比，通常會？ (Ａ)燈泡亮度不可能改變 (Ｂ)燈泡一定較暗 (Ｃ)電池完全沒有作用 (Ｄ)燈泡較亮但應避免過大電流。", "ans": "D", "topic": "電池串聯", "analysis": "相同電池串聯會提高總電壓，使燈泡電流通常增加而較亮；若超過燈泡額定值，過大電流可能損壞燈泡。", "ext": "電池串聯總電壓相加使燈更亮；並聯電壓不變但可延長供電時間。"}, {"num": 20, "content": "電磁鐵吸起迴紋針數量由8枚增加至14枚，若只改變一項條件，最可能是？ (Ａ)切斷電路 (Ｂ)改用木棒作鐵芯 (Ｃ)增加電池數 (Ｄ)減少線圈圈數。", "ans": "C", "topic": "電磁鐵", "analysis": "增加電池數通常會增加線圈電流，使電磁鐵磁力增強並吸起更多迴紋針；切斷電路、木芯或減少圈數都會使磁力減弱。", "ext": "電磁鐵磁力隨電流增大、線圈圈數增多而增強，加入鐵芯可大幅增強磁力。"}, {"num": 21, "content": "臺灣夏季午後雷陣雨常形成，主要與地面受熱使空氣發生何種運動有關？ (Ａ)空氣停止流動 (Ｂ)水蒸氣直接凝固 (Ｃ)冷空氣快速下沉 (Ｄ)暖溼空氣上升。", "ans": "D", "topic": "對流作用", "analysis": "夏季午後地面受熱後使近地面暖溼空氣上升，上升時冷卻凝結，容易形成積雨雲與雷陣雨。", "ext": "暖溼空氣上升冷卻，水氣凝結成積雨雲；對流旺盛時常伴隨閃電與強陣雨。"}, {"num": 22, "content": "某日氣壓持續下降、雲量增多且風力增強，最合理的推測是？ (Ａ)季節必為冬季 (Ｂ)穩定高氣壓正在中心附近 (Ｃ)天氣系統可能接近 (Ｄ)一定不會降雨。", "ans": "C", "topic": "氣壓與天氣", "analysis": "氣壓下降、雲量與風力增加常是低壓或鋒面等天氣系統接近的訊號；不能據此斷定季節或一定是否下雨。", "ext": "高氣壓區空氣下沉，天氣多晴朗；低氣壓區空氣上升，容易成雲降雨。"}, {"num": 23, "content": "河川由上游流到下游，河床沉積物通常有何趨勢？ (Ａ)顆粒愈大、稜角愈多 (Ｂ)顆粒愈小、較圓滑 (Ｃ)顆粒大小完全不變 (Ｄ)只剩完整岩塊。", "ans": "B", "topic": "河流作用", "analysis": "石塊在搬運途中不斷碰撞、磨蝕，較小顆粒也較容易被帶往下游，因此沉積物通常變小且較圓滑。", "ext": "河流上游以侵蝕為主、中游搬運、下游堆積；洪水時搬運力會大增。"}, {"num": 24, "content": "月球每天約比前一天晚50分鐘升起，主要與月球的哪種運動有關？ (Ａ)繞地球公轉 (Ｂ)停止自轉 (Ｃ)繞北極星運動 (Ｄ)自東向西繞太陽。", "ans": "A", "topic": "月球運動", "analysis": "月球向東繞地球公轉，使地球每天需再自轉約50分鐘才能看到月球升起，故月出時間逐日延後。", "ext": "月球公轉與自轉週期相同，故永遠以同一面朝向地球，背面無法直接看見。"}, {"num": 25, "content": "在臺灣同一地點觀察直立竿影，一年中正午影子通常最短的季節是？ (Ａ)秋季 (Ｂ)冬季 (Ｃ)夏季 (Ｄ)春季。", "ans": "C", "topic": "太陽高度角", "analysis": "臺灣夏季正午太陽高度角較大，直立竿的影子因而通常較短；冬季太陽高度角較小，影子較長。", "ext": "夏至正午太陽高度角最大、白晝最長；冬至太陽高度角小，竿影最長。"}, {"num": 26, "content": "北極星看起來幾乎不動，是因為它的位置接近？ (Ａ)月球軌道 (Ｂ)黃道面 (Ｃ)天頂正中央 (Ｄ)北天極。", "ans": "D", "topic": "北極星", "analysis": "北極星位在地球自轉軸向北延伸所指的北天極附近，所以其他星體似乎繞它旋轉，而它看來幾乎不動。", "ext": "北斗七星勺口前兩星連線延長約五倍距離可找到北極星，用以辨認北方。"}, {"num": 27, "content": "地震發生時人在室內，較適當的第一步是？ (Ａ)趴下、掩護、穩住 (Ｂ)搭電梯下樓 (Ｃ)站到玻璃窗旁 (Ｄ)立即點火照明。", "ans": "A", "topic": "地震防災", "analysis": "室內遇強震應先「趴下、掩護、穩住」，避免被掉落物擊中；震動中搭電梯或靠近玻璃都很危險。", "ext": "地震時應遠離窗戶與掉落物，躲堅固桌下護住頭頸，切勿搭電梯逃生。"}, {"num": 28, "content": "某地連續三天氣象資料如下：第一天28℃晴、第二天27℃多雲、第三天21℃雨且風強。最可能有何系統通過？ (Ａ)暖氣團中心 (Ｂ)冷鋒 (Ｃ)焚風 (Ｄ)穩定高壓。", "ans": "B", "topic": "冷鋒過境", "analysis": "第三天氣溫驟降、降雨且風強，符合冷鋒通過時冷空氣推進、天氣轉壞的典型變化。", "ext": "冷鋒過境常短時強降雨後氣溫驟降；暖鋒降雨較持續和緩，過後回暖。"}, {"num": 29, "content": "要比較不同土壤的保水能力，最適合的操作是？ (Ａ)只摸土壤表面 (Ｂ)各選不同天氣測量 (Ｃ)用不同大小容器、倒入不同水量 (Ｄ)取等量乾土、倒入等量水，比較流出水量。", "ans": "D", "topic": "土壤保水", "analysis": "公平比較不同土壤的保水能力，土壤量、初始乾燥程度、容器與加水量都要相同，再以流出水量間接比較保留水量。", "ext": "黏質土顆粒細、孔隙小保水佳；砂質土顆粒粗、排水快而保水差。"}, {"num": 30, "content": "研究光照是否影響綠豆幼苗生長，實驗組放光下、對照組放暗處。除光照外，應如何處理？ (Ａ)使用不同土量 (Ｂ)實驗組多澆水 (Ｃ)水量、溫度、幼苗大小盡量相同 (Ｄ)對照組改種紅豆。", "ans": "C", "topic": "對照實驗", "analysis": "光照是操作變因，因此水量、溫度、植物種類與幼苗起始大小等條件應盡量相同，才能把差異歸因於光照。", "ext": "對照組與實驗組僅操作變因不同；每組多株取平均可減少個體差異影響。"}, {"num": 31, "content": "四組紙飛機資料如下：甲翼長10公分飛8公尺；乙翼長12公分飛11公尺；丙翼長14公分飛10公尺；丁翼長16公分飛7公尺。若其他條件相同，哪一敘述最合理？ (Ａ)翼愈長一定飛愈遠 (Ｂ)本次12公分翼飛最遠 (Ｃ)翼長不影響飛行 (Ｄ)16公分翼一定最佳。", "ans": "B", "topic": "數據判讀", "analysis": "資料中乙組12公分翼飛11公尺，是本次最遠；結果不支持「翼越長一定越遠」，也不能外推16公分一定最佳。", "ext": "實驗結論僅能依據測得的資料範圍，不可任意外推到未測試的條件。"}, {"num": 32, "content": "量筒原有35毫升水，放入石塊後讀數為52毫升，石塊體積為？ (Ａ)35立方公分 (Ｂ)52立方公分 (Ｃ)17立方公分 (Ｄ)87立方公分。", "ans": "C", "topic": "排水測體積", "analysis": "排開水的體積等於石塊體積，所以石塊體積＝52－35＝17毫升＝17立方公分。", "ext": "排水法適用於不溶於水且沉入水中的物體；1毫升即等於1立方公分。"}, {"num": 33, "content": "一物體質量60克、體積20立方公分，其密度為？ (Ａ)40克/立方公分 (Ｂ)3克/立方公分 (Ｃ)0.3克/立方公分 (Ｄ)80克/立方公分。", "ans": "B", "topic": "密度計算", "analysis": "密度＝質量÷體積＝60÷20＝3克/立方公分。", "ext": "密度是物質特性，同種物質密度相同；物體密度大於液體則沉、小於則浮。"}, {"num": 34, "content": "把相同冰塊分別放在金屬盤與木盤上，室溫相同，金屬盤上的冰較快融化。主要原因是？ (Ａ)木頭會吸收冰塊 (Ｂ)金屬導熱較快 (Ｃ)木頭會自行降溫 (Ｄ)金屬密度一定較小。", "ans": "B", "topic": "熱的傳導", "analysis": "金屬的導熱性通常比木材好，能更快把周圍熱量傳給冰塊，因此金屬盤上的冰較快融化。", "ext": "熱由高溫處傳向低溫處；金屬是熱的良導體，木頭、塑膠則傳熱較慢。"}, {"num": 35, "content": "熱水上方常看到「白煙」，主要是？ (Ａ)水蒸氣遇冷凝結成小水滴 (Ｂ)水蒸氣本身可見 (Ｃ)氧氣燃燒 (Ｄ)灰塵熔化。", "ans": "A", "topic": "凝結現象", "analysis": "真正的水蒸氣是無色不可見的；熱水上方的白霧是水蒸氣遇較冷空氣後凝結形成的細小水滴。", "ext": "冬天呵氣成白霧、冰飲杯外的水珠，都是水蒸氣遇冷凝結成的小水滴。"}, {"num": 36, "content": "一杯水中放入馬鈴薯塊會下沉，逐漸加鹽並攪拌後浮起。最合理的解釋是？ (Ａ)重力方向改變 (Ｂ)水的體積變成零 (Ｃ)鹽水密度增大，浮力增大 (Ｄ)馬鈴薯質量消失。", "ans": "C", "topic": "浮力與密度", "analysis": "加鹽使水溶液密度增加，同一馬鈴薯排開液體所得浮力增大，當浮力足以平衡重量時便浮起。", "ext": "物體密度小於液體則浮、大於則沉；死海鹽度極高，人體容易漂浮。"}, {"num": 37, "content": "用三支相同蠟燭罩上容量不同但都密閉的透明杯，哪一杯中的蠟燭通常燃燒最久？ (Ａ)容量最大的杯 (Ｂ)與杯內空氣量無關 (Ｃ)都立刻熄滅 (Ｄ)容量最小的杯。", "ans": "A", "topic": "燃燒條件", "analysis": "較大杯中含有較多空氣與氧氣，在其他條件相同下可支持燃燒較久；氧氣消耗到不足時蠟燭才熄滅。", "ext": "燃燒需可燃物、助燃物與溫度達燃點三條件，移除任一條件即可滅火。"}, {"num": 38, "content": "葉片上下表面塗凡士林後，哪一處理最可能使蒸散量減少最多？ (Ａ)完全不塗 (Ｂ)只塗上表面 (Ｃ)只塗下表面 (Ｄ)上下表面都塗。", "ans": "D", "topic": "蒸散作用", "analysis": "凡士林會封住氣孔並減少水分散失，上下表面都塗可同時阻隔兩面蒸散，因此減少最多。", "ext": "多數植物氣孔集中於葉的下表皮，只塗下表面通常比只塗上表面減少更多。"}, {"num": 39, "content": "某植物白天氣孔開啟、夜晚關閉。白天氣孔開啟最直接有助於？ (Ａ)吸收土壤礦物 (Ｂ)製造種子外殼 (Ｃ)氣體交換 (Ｄ)固定根部。", "ans": "C", "topic": "氣孔功能", "analysis": "氣孔開啟可讓二氧化碳進入、氧氣與水蒸氣排出，最直接有助於葉片的氣體交換。", "ext": "氣孔由兩個保衛細胞控制開閉；蒸散可幫助植物散熱並促進水分上升。"}, {"num": 40, "content": "小腸內壁有許多絨毛，這種構造主要有何優點？ (Ａ)增加養分吸收面積 (Ｂ)磨碎食物 (Ｃ)儲存糞便 (Ｄ)減少接觸面積。", "ans": "A", "topic": "小腸吸收", "analysis": "大量絨毛能增加小腸內壁與養分接觸的表面積，使消化後的小分子養分更有效率地吸收進血液。", "ext": "胃主要初步消化蛋白質；小腸是消化與吸收的主要場所，大腸吸收水分。"}, {"num": 41, "content": "接種疫苗的主要目的為何？ (Ａ)讓免疫系統建立辨識與防禦能力 (Ｂ)使體溫永遠不變 (Ｃ)立刻殺死所有微生物 (Ｄ)取代均衡飲食。", "ans": "A", "topic": "疫苗免疫", "analysis": "疫苗讓免疫系統先接觸安全形式的抗原並形成免疫記憶，日後遇到相同病原可較快防禦。", "ext": "疫苗屬預防措施，使身體產生抗體與免疫記憶；生病後投藥則屬治療。"}, {"num": 42, "content": "把一條食物鏈中的蛇大量移除，短期內最可能發生？草→鼠→蛇→鷹。 (Ａ)所有生物數量不變 (Ｂ)鼠增加 (Ｃ)草增加 (Ｄ)鷹增加且食物更多。", "ans": "B", "topic": "生態平衡", "analysis": "蛇大量減少後，鼠受到的捕食壓力降低，所以短期內鼠數量最可能增加；草可能因此減少，鷹的食物也未必增加。", "ext": "鼠增加會使草被大量取食而減少；鷹因缺少蛇，數量短期內可能下降。"}, {"num": 43, "content": "同一星座在晚上8時與10時觀察，位置向西移動，主要原因是？ (Ａ)雲層推動星星 (Ｂ)地球公轉 (Ｃ)星座一天內繞月球 (Ｄ)地球自轉。", "ans": "D", "topic": "周日運動", "analysis": "地球由西向東自轉，使星空產生由東向西的周日運動，因此星座在兩小時後看來向西移動。", "ext": "因地球自轉，星空每小時約西移15度；季節不同可見星座則因公轉而異。"}, {"num": 44, "content": "若想證明空氣占有空間，可將杯口朝下垂直壓入水中，杯內紙團不溼。最合理的解釋是？ (Ａ)水沒有重量 (Ｂ)杯內空氣阻止水進入 (Ｃ)杯子吸收了水 (Ｄ)紙團能防水。", "ans": "B", "topic": "空氣佔空間", "analysis": "杯口朝下時，杯內空氣占有空間並被困住，阻止水進入杯中，所以杯內紙團不會溼。", "ext": "將杯子傾斜使氣泡逸出後，水進入杯中紙團變溼，可對照證明空氣佔空間。"}, {"num": 45, "content": "實驗測得彈簧掛1、2、3個砝碼時分別伸長2、4、6公分；掛4個時伸長9公分。最合理的判斷是？ (Ａ)4個時應縮短 (Ｂ)所有數據都證明彈簧沒有彈性 (Ｃ)伸長與砝碼數完全無關 (Ｄ)前3次呈規律，4個砝碼可能超出原線性範圍或有誤差。", "ans": "D", "topic": "虎克定律", "analysis": "前3次每增加1個砝碼便多伸長2公分，掛4個若在線性範圍應約伸長8公分；實測9公分可能表示超出原線性範圍或存在測量誤差。", "ext": "彈性限度內伸長量與外力成正比；超過彈性限度後彈簧無法恢復原長。"}], "22": [{"num": 1, "content": "種子萌發時最先突破種皮的構造通常是？ (Ａ)花粉管 (Ｂ)胚根 (Ｃ)胚芽 (Ｄ)子葉。", "ans": "B", "topic": "種子萌發", "analysis": "種子吸水萌發後，胚根通常最先突破種皮並向下生長，以固定幼苗及吸收水分。", "ext": "種子萌發需水分、空氣與適宜溫度，光非必要條件；胚芽日後發育成莖和葉。"}, {"num": 2, "content": "將同一植株上兩段相似枝條分別套上透明乾燥袋，甲枝保留葉片，乙枝摘除葉片，其餘條件相同。數小時後甲袋水珠較多，主要顯示？ (Ａ)葉片會蒸散水分 (Ｂ)袋子製造水 (Ｃ)土壤直接穿過袋子 (Ｄ)葉片吸收塑膠。", "ans": "A", "topic": "蒸散作用", "analysis": "兩枝條主要差別是有無葉片，而保留葉片的袋中水珠較多，顯示葉片蒸散出的水氣在袋內凝結。", "ext": "蒸散主要經氣孔散失水分，產生向上拉力，幫助根部吸收的水分上升。"}, {"num": 3, "content": "下列何者屬於胎生動物？ (Ａ)青蛙 (Ｂ)蝙蝠 (Ｃ)蝴蝶 (Ｄ)烏龜。", "ans": "B", "topic": "胎生卵生", "analysis": "蝙蝠是哺乳類，胚胎在母體內發育並產下幼體，屬胎生；青蛙、蝴蝶和烏龜主要為卵生。", "ext": "鯨、海豚與蝙蝠皆為胎生哺乳類；鴨嘴獸則是卵生哺乳類的特例。"}, {"num": 4, "content": "蚯蚓常在雨後爬到地面，最合理的原因之一是？ (Ａ)雨水使牠長出翅膀 (Ｂ)土壤孔隙充水、氧氣較少 (Ｃ)地面一定比土中乾燥 (Ｄ)陽光可讓牠行光合作用。", "ans": "B", "topic": "蚯蚓習性", "analysis": "大雨使土壤孔隙充滿水、可供呼吸的氧氣變少，蚯蚓因此可能爬到地面尋找氧氣較充足處。", "ext": "蚯蚓以溼潤皮膚呼吸，屬環節動物；日曬使皮膚乾燥會妨礙呼吸而死亡。"}, {"num": 5, "content": "抗生素不適合用來治療一般病毒性感冒，主要因為？ (Ａ)抗生素只能降低體溫 (Ｂ)抗生素只對所有植物有效 (Ｃ)感冒時人體沒有免疫系統 (Ｄ)病毒與細菌的構造、生存方式不同。", "ans": "D", "topic": "病毒與細菌", "analysis": "抗生素針對細菌的特定構造或生理作用，病毒沒有相同構造且須利用宿主細胞增殖，因此一般病毒性感冒不適用抗生素。", "ext": "抗生素濫用會篩選出抗藥性細菌；病毒須寄生在活細胞內才能增殖。"}, {"num": 6, "content": "將同種幼苗分成四組，每組10株，分別施0、1、2、4克肥料，兩週後平均高度為8、12、15、9公分。下列結論何者合理？ (Ａ)肥料愈多長得愈高 (Ｂ)本實驗2克組平均最高 (Ｃ)不施肥一定死亡 (Ｄ)4克最適量。", "ans": "B", "topic": "實驗結論", "analysis": "四組中2克組平均高度15公分，確為本次最高；4克組反而降至9公分，所以不能說肥料越多越好或斷言最佳量。", "ext": "適量施肥促進生長，過量造成肥傷反而抑制；結論不可超出實驗數據範圍。"}, {"num": 7, "content": "以相同體積的熱水分裝在四種杯中，杯外分別包紙、鋁箔、棉花、未包覆。若要公平比較保溫效果，應測量？ (Ａ)杯子的顏色 (Ｂ)包材價格 (Ｃ)倒水時的聲音 (Ｄ)相同時間後各杯水溫。", "ans": "D", "topic": "保溫實驗", "analysis": "保溫效果應以熱量散失程度判斷，因此在相同初溫、體積、容器及經過時間下，比較各杯最後水溫最合理。", "ext": "棉花等多孔材料因含大量空氣而不易導熱，保溫效果通常較佳。"}, {"num": 8, "content": "鋁罐壓扁後仍是鋁，下列敘述何者正確？ (Ａ)只發生形狀改變 (Ｂ)變成氣體 (Ｃ)鋁的質量一定歸零 (Ｄ)產生新物質。", "ans": "A", "topic": "物理變化", "analysis": "壓扁只改變鋁罐的形狀，物質仍是鋁，沒有新物質生成，屬物理變化。", "ext": "物理變化只改變形狀或狀態且質量不變；有無新物質生成是判斷關鍵。"}, {"num": 9, "content": "食鹽水放在陽光下數日，水逐漸減少並留下食鹽晶體，此過程主要包含？ (Ａ)蒸發與結晶 (Ｂ)燃燒與凝固 (Ｃ)發酵與溶解 (Ｄ)生鏽與熔化。", "ans": "A", "topic": "蒸發結晶", "analysis": "日照使水分蒸發，溶液濃度增加至食鹽析出並形成晶體，因此包含蒸發與結晶。", "ext": "蒸發僅在液面進行、任何溫度皆可發生；沸騰需達沸點且液體內部也汽化。"}, {"num": 10, "content": "甲溶液使紫色高麗菜汁變紅，乙溶液使其變藍綠。甲、乙最可能分別是？ (Ａ)糖水、食鹽水 (Ｂ)石灰水、白醋 (Ｃ)白醋、石灰水 (Ｄ)食鹽水、糖水。", "ans": "C", "topic": "酸鹼指示劑", "analysis": "高麗菜汁遇酸通常轉紅、遇鹼轉藍綠，因此甲可為酸性的白醋，乙可為鹼性的石灰水。", "ext": "紫色高麗菜汁遇中性溶液大致維持紫色；石灰水呈鹼性、白醋呈酸性。"}, {"num": 11, "content": "將等量砂糖分別加入100毫升冷水與熱水並同樣攪拌，熱水中較快消失。能直接支持的結論是？ (Ａ)熱水一定能溶解無限多砂糖 (Ｂ)砂糖遇熱成新物質 (Ｃ)溫度會影響溶解速率 (Ｄ)冷水沒有水分子。", "ans": "C", "topic": "溶解速率", "analysis": "控制糖量、水量與攪拌方式後，熱水中較快溶解，直接顯示溫度會影響溶解速率；不能據此說溶解量無限。", "ext": "溫度、攪拌與顆粒大小會影響溶解速率；溶解量多寡則主要與溫度有關。"}, {"num": 12, "content": "密閉容器內有100克水與10克完全溶解的鹽，若無物質進出，總質量為？ (Ａ)100克 (Ｂ)資料不足 (Ｃ)90克 (Ｄ)110克。", "ans": "D", "topic": "質量守恆", "analysis": "密閉系統沒有物質進出，溶解也不改變總質量，因此總質量＝100＋10＝110克。", "ext": "溶解前後總質量不變；開放容器中若有氣體或水氣逸出，質量才會減少。"}, {"num": 13, "content": "用剪刀剪硬紙板時，把紙板放得較靠近剪刀軸心會較省力，原因是？ (Ａ)摩擦力必為零 (Ｂ)紙板質量消失 (Ｃ)施力臂變短 (Ｄ)抗力臂變短。", "ans": "D", "topic": "槓桿應用", "analysis": "剪刀軸心是支點，紙板靠近軸心會縮短抗力臂；在施力臂不變時，所需施力因力矩條件而減少。", "ext": "剪刀、老虎鉗屬省力工具；鑷子、筷子施力點在中間，費力但省移動距離。"}, {"num": 14, "content": "以20牛頓水平力推箱子，箱子仍靜止。此時水平方向的摩擦力大小最可能是？ (Ａ)0牛頓 (Ｂ)20牛頓且方向相反 (Ｃ)10牛頓 (Ｄ)大於20牛頓且方向相同。", "ans": "B", "topic": "靜摩擦力", "analysis": "箱子靜止表示水平方向合力為零，靜摩擦力會與推力平衡，因此大小為20牛頓、方向相反。", "ext": "靜摩擦力隨推力增大而增大，超過最大靜摩擦力後物體才開始滑動。"}, {"num": 15, "content": "甲、乙兩球同時自相同高度由靜止落下，若忽略空氣阻力，且甲質量較大，則？ (Ａ)乙先落地 (Ｂ)甲先落地 (Ｃ)質量較大的會上升 (Ｄ)兩球同時落地。", "ans": "D", "topic": "自由落體", "analysis": "忽略空氣阻力時，各物體的自由落體加速度相同，與質量無關，所以兩球由同高同時釋放會同時落地。", "ext": "忽略空氣阻力時所有物體落下加速度相同；真空中羽毛與鐵球同時落地。"}, {"num": 16, "content": "一個人站在平面鏡前2公尺，鏡中像與人的距離為？ (Ａ)1公尺 (Ｂ)8公尺 (Ｃ)4公尺 (Ｄ)2公尺。", "ans": "C", "topic": "平面鏡成像", "analysis": "平面鏡成像時像距等於物距，人距鏡2公尺、像在鏡後2公尺，因此人與像相距4公尺。", "ext": "平面鏡成正立、等大、左右相反的虛像；人走近鏡子，像也同速靠近。"}, {"num": 17, "content": "聲音無法在真空中傳播，主要因為？ (Ａ)聲音只能在水中傳播 (Ｂ)真空溫度一定為0℃ (Ｃ)真空沒有可傳遞振動的介質 (Ｄ)真空中沒有光。", "ans": "C", "topic": "聲音傳播", "analysis": "聲音是介質粒子振動的傳遞，真空中沒有粒子可傳遞振動，所以聲音無法傳播。", "ext": "聲音在固體中傳播通常最快、氣體最慢；太空人在艙外須靠無線電通話。"}, {"num": 18, "content": "兩個相同燈泡串聯在同一電池上，其中一個燈泡的燈絲斷裂，另一個通常會？ (Ａ)熄滅 (Ｂ)仍同樣亮 (Ｃ)更亮 (Ｄ)閃爍但永不熄滅。", "ans": "A", "topic": "串並聯電路", "analysis": "串聯電路只有一條電流路徑，一顆燈絲斷裂就形成斷路，另一顆也沒有電流而熄滅。", "ext": "並聯電路各支路獨立，一燈損壞其餘仍亮；家庭用電即採並聯接法。"}, {"num": 19, "content": "將磁鐵N極靠近另一根可自由轉動磁鐵的一端，兩者相斥。被靠近的一端是？ (Ａ)N極 (Ｂ)沒有磁極 (Ｃ)可能是任意一端 (Ｄ)S極。", "ans": "A", "topic": "磁極作用", "analysis": "磁鐵同極相斥，已知拿N極靠近且發生相斥，另一磁鐵被靠近的一端也必為N極。", "ext": "同極相斥、異極相吸；磁鐵吸引鐵器不能判定磁極，出現相斥才能確認。"}, {"num": 20, "content": "相同小球分別從兩個光滑直斜面的同一垂直高度由靜止釋放；忽略摩擦時，較陡斜面上的小球通常？ (Ａ)質量增加 (Ｂ)重力消失 (Ｃ)到達底端時速度必為零 (Ｄ)較早到達底端。", "ans": "D", "topic": "斜面運動", "analysis": "兩球落差相同，底端速率理想上相同；較陡斜面沿斜面方向的重力分量較大且路程較短，通常較早到達底端。", "ext": "忽略摩擦時底端速率只與高度有關；斜面愈緩愈省力但施力距離愈長。"}, {"num": 21, "content": "海風通常在白天由海面吹向陸地，主要因為？ (Ａ)陸地升溫較快，陸上暖空氣上升 (Ｂ)地球停止自轉 (Ｃ)海面升溫較快 (Ｄ)陸地氣壓一定最高。", "ans": "A", "topic": "海陸風", "analysis": "白天陸地升溫比海面快，陸上暖空氣上升形成較低氣壓，較涼的海上空氣便吹向陸地。", "ext": "夜晚陸地降溫較快，風改由陸地吹向海面形成陸風，與白天海風相反。"}, {"num": 22, "content": "暖鋒接近時，常見雲層逐漸增厚並出現較持續性降雨。鋒面是指？ (Ａ)地殼與地函的交界 (Ｂ)海水與河水的交界 (Ｃ)白天與夜晚的交界 (Ｄ)兩個性質不同氣團的交界。", "ans": "D", "topic": "鋒面天氣", "analysis": "鋒面是冷、暖等性質不同的兩個氣團相遇所形成的交界面，常伴隨雲與降水。", "ext": "冷鋒移速較快、過境天氣劇變；滯留鋒徘徊不前，常造成五、六月梅雨。"}, {"num": 23, "content": "颱風中心附近的「颱風眼」常較平靜，但最安全的做法是？ (Ａ)仍留在安全處，防備另一側強風 (Ｂ)到海邊觀浪 (Ｃ)打開所有門窗 (Ｄ)立刻外出活動。", "ans": "A", "topic": "颱風防災", "analysis": "颱風眼短暫平靜後，眼牆另一側可能很快帶來方向相反的強風，因此仍應留在安全處並持續防備。", "ext": "颱風眼區短暫無風雨，眼牆通過後風向反轉、風雨再起，不可外出查看。"}, {"num": 24, "content": "砂岩經高溫高壓變成石英岩，屬於哪一類岩石形成方式？ (Ａ)變質岩 (Ｂ)隕石 (Ｃ)沉積岩 (Ｄ)火成岩。", "ans": "A", "topic": "岩石分類", "analysis": "砂岩在地下經高溫、高壓使礦物重結晶成石英岩，這是變質作用，石英岩屬變質岩。", "ext": "火成岩由岩漿冷凝而成；沉積岩常具層理與化石；大理岩由石灰岩變質。"}, {"num": 25, "content": "月食發生時，三個天體的位置關係為？ (Ａ)月球－太陽－地球 (Ｂ)太陽－月球－地球 (Ｃ)地球－太陽－月球 (Ｄ)太陽－地球－月球。", "ans": "D", "topic": "月食成因", "analysis": "月食時地球位於太陽與月球之間，月球進入地球影子，因此排列為太陽－地球－月球。", "ext": "日食時月球位於太陽與地球之間，發生於農曆初一；月食必在滿月前後。"}, {"num": 26, "content": "同一地點連續觀察月相，從上弦月到滿月大約需？ (Ａ)1天 (Ｂ)30天 (Ｃ)15天 (Ｄ)7天。", "ans": "D", "topic": "月相變化", "analysis": "月相完整週期約29.5天，上弦月到滿月約為四分之一週期，約7天。", "ext": "新月到滿月約15天；上弦月約農曆初七、初八，傍晚出現在南方天空。"}, {"num": 27, "content": "春分時，全球晝夜長短大致？ (Ａ)晝短夜長 (Ｂ)只有北半球有白天 (Ｃ)晝夜約等長 (Ｄ)晝長夜短。", "ans": "C", "topic": "晝夜長短", "analysis": "春分時太陽直射赤道，地球各地白晝與黑夜大致各12小時，約等長。", "ext": "晝夜長短變化源於地軸傾斜與公轉；夏至北半球晝最長、冬至夜最長。"}, {"num": 28, "content": "化石最常形成於沉積岩中，主要原因是沉積作用通常？ (Ａ)必須在真空進行 (Ｂ)會把所有遺骸燃燒 (Ｃ)較可能逐層掩埋生物遺骸 (Ｄ)溫度高到完全熔化遺骸。", "ans": "C", "topic": "化石形成", "analysis": "沉積物可逐層覆蓋、掩埋生物遺骸，且形成環境通常不像岩漿般高溫，因此較有利於保存化石。", "ext": "化石可推測古代環境，如發現珊瑚化石表示當地曾是溫暖的淺海。"}, {"num": 29, "content": "土石流警戒發布且大雨持續時，住在山谷溪流旁的居民應？ (Ａ)等待看到土石流再離開 (Ｂ)留在地下室 (Ｃ)到溪床拍照 (Ｄ)前往預定避難處。", "ans": "D", "topic": "土石流防災", "analysis": "土石流警戒且大雨持續表示風險已升高，山谷溪流旁居民應依防災規畫及早前往預定避難處，而非等待災害出現。", "ext": "土石流常發生於豪雨後的陡峭溪谷；逃生應朝垂直於流向的兩側高處。"}, {"num": 30, "content": "想比較四種洗碗精去油效果，最合理的設計是？ (Ａ)各用不同油量 (Ｂ)用相同材質盤子、等量油汙與等量洗碗精 (Ｃ)以氣味判定 (Ｄ)每種使用不同水溫且不記錄。", "ans": "B", "topic": "公平測試", "analysis": "洗碗精種類是操作變因，盤子材質、油量、洗碗精用量、水溫與清洗方式等應相同，再比較去油效果。", "ext": "公平測試須只改變操作變因並將結果量化記錄；重複實驗可提高可信度。"}, {"num": 31, "content": "測量水沸騰時的溫度，每分鐘記錄：90、95、99、100、100、100℃。最合理的解釋是？ (Ａ)水在100℃停止吸熱 (Ｂ)溫度計一定壞掉 (Ｃ)水已全部結冰 (Ｄ)沸騰後持續加熱時溫度可在沸點附近維持。", "ans": "D", "topic": "沸點特性", "analysis": "水達沸點後仍吸熱，但能量主要用於液態變氣態的相變，因此溫度可維持在約100℃，直到大量水汽化。", "ext": "氣壓愈低沸點愈低，高山上水未達100℃即沸騰，食物較不易煮熟。"}, {"num": 32, "content": "用量筒測液體體積時，正確讀數方法為？ (Ａ)拿起量筒邊走邊讀 (Ｂ)只看刻度最大值 (Ｃ)眼睛與液面同高，讀凹液面最低處 (Ｄ)由上向下斜看。", "ans": "C", "topic": "量筒讀數", "analysis": "量筒應放平並使視線與液面同高，以避免視差；一般水溶液形成凹液面，讀其最低處。", "ext": "俯視讀數會偏大、仰視會偏小；水銀面呈凸形，應讀凸液面最高處。"}, {"num": 33, "content": "同一支彈簧掛砝碼紀錄：0個長10公分、1個12公分、2個14公分、3個16公分。若仍在彈性限度內，掛4個時預測長度為？ (Ａ)20公分 (Ｂ)16公分 (Ｃ)18公分 (Ｄ)17公分。", "ans": "C", "topic": "彈簧伸長", "analysis": "每增加1個砝碼，彈簧長度增加2公分；由3個時16公分推得4個時為18公分。", "ext": "彈簧原長須先扣除，伸長量才與所掛重量成正比；超出彈性限度則失準。"}, {"num": 34, "content": "以放大鏡觀察報紙文字，當報紙位於焦距內，看到的像通常是？ (Ａ)完全看不到 (Ｂ)倒立縮小的實像 (Ｃ)正立等大的實像 (Ｄ)正立放大的虛像。", "ans": "D", "topic": "凸透鏡成像", "analysis": "物體放在凸透鏡焦距內時，透過透鏡看到同側的正立、放大虛像，這正是放大鏡的使用方式。", "ext": "物體在凸透鏡焦距外可成倒立實像；相機與人眼成像即利用此原理。"}, {"num": 35, "content": "冬天金屬椅摸起來比木椅冷，但兩者放在同一室內很久。最合理的解釋是？ (Ａ)金屬實際溫度一定低20℃ (Ｂ)金屬傳熱較快，手的熱較快傳出 (Ｃ)金屬不含熱能 (Ｄ)木頭自行發熱。", "ans": "B", "topic": "熱傳導", "analysis": "兩椅久置後溫度可相同，但金屬導熱較快，會讓手的熱較快流走，所以感覺較冷。", "ext": "手的冷熱感覺反映熱量流動快慢，並非物體真實溫度；測溫應用溫度計。"}, {"num": 36, "content": "把裝滿水並封口的塑膠瓶放入冷凍庫可能脹裂，主要因為水結冰時？ (Ａ)體積增大 (Ｂ)產生氧氣 (Ｃ)密度一定增大 (Ｄ)質量消失。", "ans": "A", "topic": "結冰膨脹", "analysis": "水結冰形成較疏鬆的晶格，體積約增加而密度減小；密閉且裝滿的瓶子因此受壓而可能脹裂。", "ext": "冰密度比水小故浮於水面；寒流時水管破裂也是水結冰膨脹所造成。"}, {"num": 37, "content": "植物根毛數量多且細長，主要有助於？ (Ａ)增加吸收水分與礦物質的面積 (Ｂ)反射陽光 (Ｃ)吸引昆蟲授粉 (Ｄ)製造花粉。", "ans": "A", "topic": "根毛吸收", "analysis": "大量細長根毛可增加根與土壤接觸的表面積，提升水分和溶解礦物質的吸收效率。", "ext": "根毛是根部表皮細胞的突起；移植植物時保留土團可避免根毛受損。"}, {"num": 38, "content": "血液流經肺部後，與流入肺部前相比通常？ (Ａ)氧較少、二氧化碳較多 (Ｂ)氧較多、二氧化碳較少 (Ｃ)氧與二氧化碳都為零 (Ｄ)只剩血小板。", "ans": "B", "topic": "氣體交換", "analysis": "血液在肺部進行氣體交換，獲得氧氣並排出二氧化碳，因此流出肺部的血通常氧較多、二氧化碳較少。", "ext": "肺泡數量多、壁薄且密布微血管，增大表面積利於氧與二氧化碳擴散。"}, {"num": 39, "content": "運動後心跳與呼吸加快，主要是為了？ (Ａ)使骨骼變短 (Ｂ)供應細胞更多氧並排出二氧化碳 (Ｃ)降低肌肉血流 (Ｄ)停止養分運送。", "ans": "B", "topic": "循環與呼吸", "analysis": "運動時細胞呼吸加強，需要更多氧與養分並產生較多二氧化碳；心跳和呼吸加快可加速運送與排除。", "ext": "含氧血由左心室送往全身；規律運動可強化心肺，使安靜時心率較低。"}, {"num": 40, "content": "菌類與綠色植物的主要差異之一是多數菌類？ (Ａ)沒有葉綠素，不能行光合作用 (Ｂ)只能生活在海中 (Ｃ)都會主動奔跑 (Ｄ)沒有細胞。", "ans": "A", "topic": "菌類特性", "analysis": "多數菌類沒有葉綠素，無法自行光合作用，須由環境中的有機物獲得養分；但它們仍由細胞構成。", "ext": "黴菌、蕈類屬真菌，多以孢子繁殖，在生態系中擔任分解者的角色。"}, {"num": 41, "content": "兩種鳥吃相同昆蟲，當昆蟲數量減少時，兩種鳥之間可能出現？ (Ａ)立刻形成新物種 (Ｂ)互不影響 (Ｃ)競爭加劇 (Ｄ)都成為生產者。", "ans": "C", "topic": "種間競爭", "analysis": "兩種鳥利用相同且正在減少的昆蟲資源，食物重疊使種間競爭可能加劇。", "ext": "生物間關係還有掠食、寄生與互利共生；競爭在資源有限時最明顯。"}, {"num": 42, "content": "豆科植物根部的根瘤菌能協助固定氮，這是兩者互利的例子。根瘤菌可從植物獲得？ (Ａ)翅膀 (Ｂ)陽光 (Ｃ)有機養分與棲所 (Ｄ)葉綠體。", "ans": "C", "topic": "互利共生", "analysis": "根瘤菌固定氮供植物利用，植物則以光合作用產生的有機養分並提供根瘤棲所，形成互利關係。", "ext": "小丑魚與海葵、蜜蜂與開花植物皆互利共生；寄生則一方得利一方受害。"}, {"num": 43, "content": "若森林被大量砍伐，最直接可能造成？ (Ａ)土壤固定能力增加 (Ｂ)水土流失增加 (Ｃ)空氣中二氧化碳立即歸零 (Ｄ)生物棲地增加。", "ans": "B", "topic": "水土保持", "analysis": "砍伐會使樹根固定土壤及樹冠緩衝雨水的作用減弱，因此逕流、沖蝕與水土流失增加。", "ext": "森林能涵養水源、保持水土並調節氣候；山坡地濫墾濫伐易引發土石流。"}, {"num": 44, "content": "一顆煮熟雞蛋在清水中下沉，在濃鹽水中浮起。實驗中改變的主要變因是？ (Ａ)重力方向 (Ｂ)容器材質 (Ｃ)液體密度 (Ｄ)雞蛋質量。", "ans": "C", "topic": "浮力實驗", "analysis": "同一雞蛋、容器與重力條件下，清水改為濃鹽水主要改變液體密度，進而改變浮力。", "ext": "浮在液面的物體所受浮力等於自身重量；液體密度愈大浮出部分愈多。"}, {"num": 45, "content": "某同學測四次脈搏為每分鐘78、80、79、121下，最後一次是在相同安靜狀態下測得。較合理的處理是？ (Ａ)宣稱所有人脈搏皆121下 (Ｂ)檢查測量方法並重測異常值 (Ｃ)直接取最大值 (Ｄ)刪除前三次。", "ans": "B", "topic": "誤差處理", "analysis": "前三次集中在78～80下，而121下明顯偏離；應先檢查計時、計數或當時狀態並重測，不宜任意刪除或只取最大值。", "ext": "多次測量取平均可減少誤差，但明顯異常的數據應先查明原因再處理。"}], "23": [{"num": 1, "content": "花粉落到同種花的柱頭後，花粉管通常向哪裡生長？ (Ａ)根毛 (Ｂ)花瓣頂端 (Ｃ)葉脈 (Ｄ)胚珠方向。", "ans": "D", "topic": "植物受精", "analysis": "同種花粉在柱頭萌發後，花粉管會沿花柱朝子房內的胚珠生長，以便輸送雄性生殖細胞完成受精。", "ext": "受精後胚珠發育成種子，子房發育成果實；柱頭常分泌黏液幫助花粉附著萌發。"}, {"num": 2, "content": "馬鈴薯塊莖可長出新植株，此方式屬於？ (Ａ)孢子繁殖 (Ｂ)營養繁殖 (Ｃ)授粉 (Ｄ)胎生。", "ans": "B", "topic": "無性生殖", "analysis": "馬鈴薯塊莖是營養器官，能由芽眼長出新植株，不經配子結合，屬無性生殖中的營養繁殖。", "ext": "營養繁殖後代與親代遺傳特徵相同；甘藷用塊根、草莓用匍匐莖繁殖。"}, {"num": 3, "content": "魚類的鰓絲多而薄，且有豐富微血管，主要有利於？ (Ａ)保持體溫恆定 (Ｂ)感受光線 (Ｃ)增加氣體交換面積 (Ｄ)磨碎食物。", "ans": "C", "topic": "呼吸構造", "analysis": "多而薄的鰓絲提供大表面積與短擴散距離，豐富微血管則維持氣體濃度差，有利氧、二氧化碳交換。", "ext": "魚離水後鰓絲黏合失去表面積而缺氧；兩生類幼體用鰓、成體用肺與皮膚呼吸。"}, {"num": 4, "content": "蝴蝶的完全變態順序為？ (Ａ)卵→幼蟲→蛹→成蟲 (Ｂ)卵→若蟲→成蟲→蛹 (Ｃ)卵→蛹→幼蟲→成蟲 (Ｄ)幼蟲→卵→成蟲→蛹。", "ans": "A", "topic": "昆蟲變態", "analysis": "蝴蝶屬完全變態昆蟲，生活史依序為卵、幼蟲、蛹、成蟲，幼蟲與成蟲外形差異明顯。", "ext": "蝗蟲、蟬為不完全變態，無蛹期，若蟲與成蟲外形相似。"}, {"num": 5, "content": "某昆蟲外形與枯葉相似，最可能有何生存優勢？ (Ａ)提高體溫到100℃ (Ｂ)降低被天敵發現的機會 (Ｃ)不需攝食 (Ｄ)能在真空生活。", "ans": "B", "topic": "擬態保護", "analysis": "外形像枯葉是一種保護色或擬態，可讓昆蟲融入環境，降低被天敵發現和捕食的機會。", "ext": "保護色如青蛙的綠色；警戒色如毒蛾鮮豔體色，警告天敵有毒不可食。"}, {"num": 6, "content": "下列哪一項屬於後天學習行為？ (Ａ)嬰兒吸吮 (Ｂ)蠶吐絲結繭 (Ｃ)狗聽口令坐下 (Ｄ)蜘蛛結網。", "ans": "C", "topic": "先天與學習", "analysis": "狗經訓練後聽口令坐下，是由經驗形成的後天學習行為；吸吮、結繭與結網多屬先天本能。", "ext": "先天行為由遺傳決定，同種個體皆會；學習行為需經驗累積，個體間有差異。"}, {"num": 7, "content": "把食用油倒入水中並攪拌，靜置後油浮在上層，主要因為油？ (Ａ)不易溶於水且密度較小 (Ｂ)變成固體 (Ｃ)與水產生氣體 (Ｄ)一定比水重。", "ans": "A", "topic": "密度與溶解", "analysis": "食用油與水不互溶，靜置後又因油的密度小於水而浮在上層。", "ext": "冰浮於水因密度較小；油水互不相溶，可利用此特性分離油與水。"}, {"num": 8, "content": "要從混有細砂的食鹽中回收食鹽，較適當的順序是？ (Ａ)冷凍→燃燒 (Ｂ)直接用磁鐵吸 (Ｃ)過濾→加水→磁選 (Ｄ)加水溶解→過濾→蒸發。", "ans": "D", "topic": "混合物分離", "analysis": "先加水使食鹽溶解，再過濾除去不溶的細砂，最後蒸發濾液中的水即可回收食鹽晶體。", "ext": "過濾分離不溶固體，蒸發取回溶質；含鐵粉的混合物才適合用磁鐵分離。"}, {"num": 9, "content": "碘液滴在白飯上呈藍黑色，表示白飯含較多？ (Ａ)蛋白質 (Ｂ)脂肪 (Ｃ)澱粉 (Ｄ)維生素C。", "ans": "C", "topic": "澱粉檢驗", "analysis": "碘液遇澱粉會呈藍黑色，白飯出現此顏色表示含有澱粉。", "ext": "本氏液遇葡萄糖加熱變紅橙色；碘液遇澱粉變藍黑，是常用食物成分檢驗。"}, {"num": 10, "content": "將氣球套在空瓶口，空瓶浸入熱水後氣球鼓起，移到冰水後縮小。最合理的結論是？ (Ａ)瓶內氣體會熱脹冷縮 (Ｂ)氣球遇冷產生新氣體 (Ｃ)空瓶內原本沒有空氣 (Ｄ)熱水進入氣球。", "ans": "A", "topic": "熱脹冷縮", "analysis": "空瓶內原有空氣，受熱膨脹而撐大氣球，移至冰水後冷縮使氣球縮小，顯示氣體會熱脹冷縮。", "ext": "氣體熱脹冷縮最明顯，液體次之，固體最小；溫度計利用液體熱脹冷縮原理。"}, {"num": 11, "content": "糖水在室溫下放置，水分蒸發一部分但尚未析出晶體，此時糖水濃度通常？ (Ａ)不變 (Ｂ)增加 (Ｃ)變成純水 (Ｄ)減少。", "ans": "B", "topic": "溶液濃度", "analysis": "水分蒸發使溶劑量減少，而糖尚未析出、溶質量近似不變，所以糖所占比例上升，濃度增加。", "ext": "濃度＝溶質量除以溶液量；蒸發只減少溶劑，達飽和後才會析出晶體。"}, {"num": 12, "content": "下列哪一作法能減慢鐵釘生鏽？ (Ａ)放在潮溼處 (Ｂ)刮去保護漆 (Ｃ)同時接觸鹽水與空氣 (Ｄ)表面塗油。", "ans": "D", "topic": "防鏽方法", "analysis": "鐵生鏽需接觸水與氧，表面塗油可隔絕兩者而減慢生鏽；潮溼、刮漆或鹽水都會促進腐蝕。", "ext": "生鏽需水與氧同時存在；鍍鋅、上漆、塗油皆以隔絕水氣與氧氣防鏽。"}, {"num": 13, "content": "用開瓶器開瓶蓋時，開瓶器可視為槓桿。若施力點離支點越遠，通常？ (Ａ)越省力 (Ｂ)越費力 (Ｃ)完全不需支點 (Ｄ)抗力一定增加。", "ans": "A", "topic": "槓桿原理", "analysis": "槓桿力矩＝力×力臂，施力點離支點越遠，施力臂越長，產生相同力矩所需的力越小。", "ext": "省力槓桿施力臂大於抗力臂但費距離；鑷子為費力槓桿，利於精細動作。"}, {"num": 14, "content": "齒數10齒的小齒輪帶動20齒的大齒輪，小齒輪轉2圈，大齒輪轉幾圈？ (Ａ)4圈 (Ｂ)2圈 (Ｃ)1圈 (Ｄ)0.5圈。", "ans": "C", "topic": "齒輪傳動", "analysis": "齒輪轉數與齒數成反比；小齒輪2圈帶過齒數＝10×2＝20齒，20齒大齒輪正好轉1圈。", "ext": "齒輪轉速與齒數成反比；小齒輪帶動大齒輪減速省力，大帶小則加速。"}, {"num": 15, "content": "動滑輪承受總重120牛頓，忽略摩擦與滑輪重，兩段繩平均分擔，所需拉力約？ (Ａ)120牛頓 (Ｂ)60牛頓 (Ｃ)30牛頓 (Ｄ)240牛頓。", "ans": "B", "topic": "滑輪組", "analysis": "理想動滑輪由兩段繩共同承重，每段張力相同，所以2F＝120牛頓，F＝60牛頓。", "ext": "定滑輪只改變施力方向不省力；動滑輪省一半力但繩需拉兩倍距離。"}, {"num": 16, "content": "小明向東走30公尺再向西走10公尺，共花10秒。他的平均速率為？ (Ａ)5公尺/秒 (Ｂ)2公尺/秒 (Ｃ)3公尺/秒 (Ｄ)4公尺/秒。", "ans": "D", "topic": "速率計算", "analysis": "平均速率以總路程計算，總路程＝30＋10＝40公尺，平均速率＝40÷10＝4公尺/秒。", "ext": "平均速率用總路程，平均速度用位移；本題位移20公尺，速度為2公尺/秒。"}, {"num": 17, "content": "鼓面敲得越用力，聲音通常越大，主要因為鼓面？ (Ａ)停止振動 (Ｂ)振動頻率一定較低 (Ｃ)面積消失 (Ｄ)振幅較大。", "ans": "D", "topic": "聲音三要素", "analysis": "敲得越用力使鼓面振幅增大，推動空氣的幅度也較大，因此聲音較響；音調則主要由頻率決定。", "ext": "響度由振幅決定，音調由頻率決定，音色可分辨不同樂器與人聲。"}, {"num": 18, "content": "水中的吸管看起來彎折，主要是光的？ (Ａ)反射 (Ｂ)直線傳播且不改變方向 (Ｃ)折射 (Ｄ)吸收。", "ans": "C", "topic": "光的折射", "analysis": "光由空氣斜射入水、再由水進入空氣時傳播方向改變，這種折射使水中吸管的像看來錯位彎折。", "ext": "筷子入水似折斷、水池看來變淺皆折射；鏡子成像則屬光的反射。"}, {"num": 19, "content": "家庭用電將各電器並聯的主要優點是？ (Ａ)電線不會有電流 (Ｂ)各電器可獨立開關 (Ｃ)所有電器只能同時使用 (Ｄ)任一電器關閉則全部熄滅。", "ans": "B", "topic": "並聯電路", "analysis": "並聯時每個電器各有獨立支路，一個支路關閉不會切斷其他支路，因此各電器可獨立開關。", "ext": "串聯電路一處斷路全部熄滅；並聯各支路電壓相同，可獨立操作。"}, {"num": 20, "content": "指北針放在通電直導線旁會偏轉，這個現象說明？ (Ａ)指北針沒有磁性 (Ｂ)磁鐵能產生電流 (Ｃ)電流能產生磁場 (Ｄ)電流只會發熱。", "ans": "C", "topic": "電流磁效應", "analysis": "通電導線周圍會產生磁場，磁場對指北針磁針施力使其偏轉，這是電流磁效應。", "ext": "厄斯特發現電流磁效應；電磁鐵磁力隨電流增大與線圈圈數增多而增強。"}, {"num": 21, "content": "空氣由高氣壓處流向低氣壓處形成？ (Ａ)霜 (Ｂ)露 (Ｃ)風 (Ｄ)地震。", "ans": "C", "topic": "風的成因", "analysis": "氣壓差使空氣由高氣壓區流向低氣壓區，這種空氣的水平流動就是風。", "ext": "白天陸地增溫快形成海風，夜晚陸地降溫快形成陸風，皆因氣壓差異。"}, {"num": 22, "content": "山區迎風坡常比背風坡多雨，主要因為潮溼空氣在迎風坡？ (Ａ)上升冷卻凝結 (Ｂ)完全不移動 (Ｃ)受到地磁排斥 (Ｄ)下降增溫凝結。", "ans": "A", "topic": "地形雨", "analysis": "潮溼空氣遇山坡被迫抬升，隨高度增加而冷卻，水氣凝結成雲雨，所以迎風坡通常較多雨。", "ext": "背風坡氣流下沉增溫乾燥，形成雨影區；焚風即背風坡的乾熱風。"}, {"num": 23, "content": "某地一週氣溫由18℃逐日升到27℃，之後突然降到19℃並降雨。最可能是？ (Ａ)沒有任何天氣系統 (Ｂ)太陽熄滅 (Ｃ)穩定暖氣團持續控制 (Ｄ)冷鋒通過。", "ans": "D", "topic": "鋒面天氣", "analysis": "氣溫先升後突然下降且伴隨降雨，符合冷鋒前暖、冷鋒通過後冷空氣接替的變化。", "ext": "冷鋒過境常有雷雨且氣溫驟降；暖鋒移速較慢，多連續性降雨後回暖。"}, {"num": 24, "content": "岩石受到日夜溫差反覆熱脹冷縮而碎裂，屬於？ (Ａ)結晶作用 (Ｂ)風化作用 (Ｃ)侵蝕作用 (Ｄ)沉積作用。", "ans": "B", "topic": "風化作用", "analysis": "岩石在原地因溫差造成反覆膨脹收縮而破碎，是物理風化；尚未強調碎屑被搬走，故非侵蝕。", "ext": "風化在原地崩解，侵蝕伴隨搬運；植物根部撐裂岩石也屬物理風化。"}, {"num": 25, "content": "河流彎道通常哪一側流速較快、侵蝕較強？ (Ａ)河心一定無水 (Ｂ)內側 (Ｃ)兩側必相同 (Ｄ)外側。", "ans": "D", "topic": "河流作用", "analysis": "河流彎道外側水流通常較快，對河岸沖刷、侵蝕較強；內側流速較慢，較容易沉積。", "ext": "凹岸（外側）侵蝕成深潭，凸岸（內側）堆積成河灘，曲流因而愈彎。"}, {"num": 26, "content": "地球自轉一周約需？ (Ａ)24小時 (Ｂ)30天 (Ｃ)365天 (Ｄ)1小時。", "ans": "A", "topic": "地球自轉", "analysis": "地球繞自轉軸旋轉一周約需24小時，形成晝夜交替。", "ext": "自轉造成晝夜交替與天體東升西落；公轉一年一周造成四季變化。"}, {"num": 27, "content": "當月球位於地球與太陽之間且三者接近一直線，可能發生？ (Ａ)流星雨 (Ｂ)極光 (Ｃ)月食 (Ｄ)日食。", "ans": "D", "topic": "日月食", "analysis": "月球位在地球與太陽之間且接近一直線時，月球可能遮住部分太陽光而形成日食；月食則是地球位於中間。", "ext": "日食發生於朔（農曆初一），月食發生於望（十五）；月食時地球在中間。"}, {"num": 28, "content": "同一天在臺灣觀察太陽，上午9時竿影朝西北，表示太陽大致位於？ (Ａ)正西方 (Ｂ)西北方 (Ｃ)東南方 (Ｄ)正北方。", "ans": "C", "topic": "太陽視運動", "analysis": "影子方向與光源方向相反；竿影朝西北，表示太陽大致位於東南方。", "ext": "臺灣正午太陽大多偏南、竿影朝北最短；影長變化可判斷時刻與季節。"}, {"num": 29, "content": "製作簡易雨量器時，最適合放置的位置是？ (Ａ)大樹正下方 (Ｂ)空曠且上方無遮蔽物處 (Ｃ)屋簷下 (Ｄ)灑水器旁。", "ans": "B", "topic": "雨量觀測", "analysis": "雨量器應放在空曠且無遮蔽物處，避免樹葉、屋簷截流或灑水器干擾，才能量到較具代表性的降雨量。", "ext": "雨量以毫米為單位，表示承接雨水的深度；容器需直筒且開口保持水平。"}, {"num": 30, "content": "為測試「水溫是否影響方糖溶解時間」，哪組比較最合理？ (Ａ)冷水用小方糖、熱水用大方糖 (Ｂ)不同水量且攪拌速度不同 (Ｃ)只測一杯水 (Ｄ)相同方糖與水量，只改變水溫。", "ans": "D", "topic": "實驗設計", "analysis": "只把水溫作為操作變因，方糖大小、水量、容器與攪拌方式等皆相同，再比較溶解時間。", "ext": "一次實驗只改變一個操作變因，其餘控制變因須相同，結果才具比較性。"}, {"num": 31, "content": "甲、乙兩組種子各20顆；甲有光、乙無光，其餘相同。甲發芽18顆、乙發芽17顆。可合理推論？ (Ａ)本結果顯示光照對此種子發芽率影響不大 (Ｂ)乙組所有種子死亡 (Ｃ)光照使發芽率增加100% (Ｄ)沒有光一定不能發芽。", "ans": "A", "topic": "數據推論", "analysis": "甲發芽率90%，乙85%，差距很小，因此本次結果顯示光照對此種子發芽率影響不大；不能由單次差異判定必然因果。", "ext": "下結論前應考慮樣本數與重複次數；差異小可能來自個體差異或誤差。"}, {"num": 32, "content": "測量同一顆球滾動時間5次為4.1、4.0、4.2、4.1、4.0秒，平均最接近？ (Ａ)0.82秒 (Ｂ)4.8秒 (Ｃ)4.08秒 (Ｄ)20.4秒。", "ans": "C", "topic": "平均值計算", "analysis": "平均＝（4.1＋4.0＋4.2＋4.1＋4.0）÷5＝20.4÷5＝4.08秒。", "ext": "多次測量取平均可減少偶然誤差；明顯異常值應先查明原因再處理。"}, {"num": 33, "content": "天平左盤放物體，右盤放50克與20克砝碼時平衡，物體質量為？ (Ａ)30克 (Ｂ)50克 (Ｃ)70克 (Ｄ)1000克。", "ans": "C", "topic": "質量測量", "analysis": "等臂天平平衡時兩盤質量相等，物體質量＝50＋20＝70克。", "ext": "天平使用前需調整歸零；質量不隨地點改變，重量隨重力大小改變。"}, {"num": 34, "content": "一木塊浮在水面，約有3/4體積浸水。若不吸水，其密度約為水的？ (Ａ)1/2 (Ｂ)1/4 (Ｃ)4/3 (Ｄ)3/4。", "ans": "D", "topic": "浮力密度", "analysis": "漂浮平衡時，浸入體積比例約等於物體密度與液體密度之比；浸水3/4表示木塊密度約為水的3/4。", "ext": "浮體浸入體積比等於物體與液體密度比；密度大於液體者會下沉。"}, {"num": 35, "content": "保溫瓶內層做成光亮表面，主要可減少哪一種熱傳遞？ (Ａ)熱輻射 (Ｂ)凝固 (Ｃ)蒸發 (Ｄ)熱對流。", "ans": "A", "topic": "熱的傳播", "analysis": "光亮表面對紅外線的反射較強、放射率較低，可減少熱輻射；真空層則主要抑制傳導與對流。", "ext": "保溫瓶真空夾層阻隔傳導與對流，鍍銀光亮面反射輻射，三者兼顧。"}, {"num": 36, "content": "熱氣球加熱內部空氣後上升，主要因為內部空氣？ (Ａ)不再受重力 (Ｂ)密度變小 (Ｃ)質量無限增加 (Ｄ)變成固體。", "ans": "B", "topic": "浮力應用", "analysis": "熱氣球下方開口使內外氣壓近似相同；空氣受熱膨脹，部分空氣逸出後，球內熱空氣密度低於周圍冷空氣，因而產生足以使氣球上升的淨浮力。", "ext": "孔明燈同理升空；氣體受熱膨脹密度變小，浮力大於重力而上升。"}, {"num": 37, "content": "唾液可初步分解澱粉。若要檢驗溫度對唾液作用的影響，應保持相同的是？ (Ａ)反應時間必須不同 (Ｂ)溫度 (Ｃ)澱粉液與唾液的量 (Ｄ)每組使用不同指示劑。", "ans": "C", "topic": "對照實驗", "analysis": "研究溫度的影響時，溫度應改變，而澱粉液量、唾液量、反應時間及檢驗方法等應保持相同。", "ext": "可用碘液檢驗澱粉是否被分解；唾液酵素約在37℃時作用效果最佳。"}, {"num": 38, "content": "人體血液循環中，將血液由心臟送出的血管稱為？ (Ａ)動脈 (Ｂ)微血管 (Ｃ)淋巴管 (Ｄ)靜脈。", "ans": "A", "topic": "血液循環", "analysis": "動脈依血流方向定義，負責把血液由心臟送出；靜脈則把血液送回心臟。", "ext": "動脈管壁厚彈性大；靜脈有瓣膜防逆流；微血管壁薄利於物質交換。"}, {"num": 39, "content": "植物白天進行光合作用，直接需要的原料包括？ (Ａ)氮氣和食鹽 (Ｂ)蛋白質和脂肪 (Ｃ)氧氣和葡萄糖 (Ｄ)二氧化碳和水。", "ans": "D", "topic": "光合作用", "analysis": "光合作用利用光能，以二氧化碳與水為原料合成養分並釋放氧氣；氧氣和葡萄糖主要是產物或呼吸作用原料。", "ext": "光合作用產生葡萄糖與氧氣；呼吸作用消耗氧氣與養分，日夜皆進行。"}, {"num": 40, "content": "分解者在生態系中的主要角色是？ (Ａ)阻止物質循環 (Ｂ)將遺體與排遺分解，使物質回到環境 (Ｃ)製造所有陽光 (Ｄ)捕食所有消費者。", "ans": "B", "topic": "生態角色", "analysis": "分解者把遺體與排遺中的有機物分解為較簡單物質，使養分回到環境並參與物質循環。", "ext": "細菌與真菌為主要分解者；若無分解者，物質無法循環，遺體將堆積。"}, {"num": 41, "content": "若某湖泊因肥料流入造成藻類暴增，藻類死亡分解後可能使水中？ (Ａ)溫度永遠固定 (Ｂ)食鹽完全消失 (Ｃ)溶氧下降 (Ｄ)沒有微生物。", "ans": "C", "topic": "優養化", "analysis": "大量藻類死亡後，分解者分解遺體會消耗水中氧氣，可能造成溶氧下降，甚至使水生動物缺氧。", "ext": "優養化常因氮磷肥料與清潔劑流入水域；溶氧不足使魚蝦大量死亡。"}, {"num": 42, "content": "食物鏈「稻→蝗蟲→青蛙→蛇」中，青蛙屬於？ (Ａ)初級消費者 (Ｂ)次級消費者 (Ｃ)分解者 (Ｄ)生產者。", "ans": "B", "topic": "食物鏈", "analysis": "稻是生產者、蝗蟲是初級消費者，捕食蝗蟲的青蛙因此為次級消費者。", "ext": "能量沿食物鏈逐級遞減，愈高階消費者數量愈少；蛇為三級消費者。"}, {"num": 43, "content": "下列哪一項最能減少外來種入侵？ (Ａ)購買後在河川放生 (Ｂ)不任意棄養或野放寵物 (Ｃ)移除所有原生種 (Ｄ)把外國生物放進公園。", "ans": "B", "topic": "外來種防治", "analysis": "不任意棄養或野放寵物，可阻止外來生物進入自然環境並繁殖，是減少外來種入侵的重要作法。", "ext": "外來種缺天敵易大量繁殖，如福壽螺、小花蔓澤蘭危害本土生態。"}, {"num": 44, "content": "觀察細胞時，若物像在視野左上方，要移到中央，玻片應向哪裡移？ (Ａ)左上方 (Ｂ)右上方 (Ｃ)右下方 (Ｄ)左下方。", "ans": "A", "topic": "顯微鏡操作", "analysis": "顯微鏡下物像移動方向與玻片相反；物像在左上方，要使物像向右下移至中央，玻片應向左上移。", "ext": "顯微鏡成上下左右相反的倒像；換高倍鏡後視野變小變暗，用細調對焦。"}, {"num": 45, "content": "一實驗只做一次就宣稱結論適用所有情況，主要問題是？ (Ａ)樣本與重複次數不足 (Ｂ)一定沒有操作變因 (Ｃ)數據越少越準確 (Ｄ)單次結果必定錯誤。", "ans": "A", "topic": "科學方法", "analysis": "只做一次容易受偶然因素影響，且樣本代表性不足；增加樣本與重複次數才能評估結果是否穩定、可重現。", "ext": "結論僅適用於實驗條件範圍；重複實驗結果一致才具再現性與說服力。"}], "24": [{"num": 1, "content": "一朵花的花瓣鮮豔且有香味，最可能有助於哪項功能？ (Ａ)吸收土壤水分 (Ｂ)固定植株 (Ｃ)儲存糞便 (Ｄ)吸引動物傳粉。", "ans": "D", "topic": "傳粉方式", "analysis": "鮮豔花瓣與香味可吸引昆蟲、鳥類等動物訪花，幫助花粉在花朵間傳播。", "ext": "蟲媒花鮮豔具蜜與香氣；風媒花如水稻花小不顯眼，花粉量多而輕。"}, {"num": 2, "content": "蒲公英種子具有冠毛，主要有利於？ (Ａ)風力傳播 (Ｂ)自身彈射 (Ｃ)水力傳播 (Ｄ)動物吞食傳播。", "ans": "A", "topic": "種子傳播", "analysis": "冠毛質輕且能增加受風面積，使蒲公英種子容易被風吹離母株，屬風力傳播。", "ext": "鬼針草靠鉤刺附著動物，椰子靠海水漂流，鳳仙花果實成熟彈裂傳播。"}, {"num": 3, "content": "蕨類植物葉片背面常見褐色小點，其中可能含有？ (Ａ)胚乳 (Ｂ)孢子囊 (Ｃ)果實 (Ｄ)花粉。", "ans": "B", "topic": "蕨類繁殖", "analysis": "蕨類不開花、不結果，葉背褐色小點常是孢子囊群，其中產生可繁殖的孢子。", "ext": "蕨類以孢子繁殖且具維管束；苔蘚類無維管束，兩者皆不開花結果。"}, {"num": 4, "content": "植物根部吸收的水分，主要由哪一構造向上運送？ (Ａ)木質部 (Ｂ)花瓣 (Ｃ)氣孔 (Ｄ)種皮。", "ans": "A", "topic": "運輸構造", "analysis": "根部吸收的水和礦物質主要經木質部向上運送到莖、葉；韌皮部則以運送葉製造的養分為主。", "ext": "木質部運水向上；韌皮部運送葉製造的養分，環狀剝皮會阻斷養分運輸。"}, {"num": 5, "content": "人在炎熱天氣流汗後，皮膚感到涼爽，主要因為汗液？ (Ａ)沸騰生火 (Ｂ)蒸發吸熱 (Ｃ)溶解皮膚 (Ｄ)凝固放熱。", "ans": "B", "topic": "蒸發吸熱", "analysis": "汗液蒸發由液態變氣態時需要吸收熱量，熱取自皮膚，因而使人感到涼爽。", "ext": "酒精擦皮膚覺涼、狗伸舌散熱皆蒸發吸熱；蒸發在任何溫度皆可發生。"}, {"num": 6, "content": "吃飯時細嚼慢嚥有助消化，因為可使食物？ (Ａ)不經食道進入小腸 (Ｂ)完全不需胃消化 (Ｃ)表面積增加並與唾液充分混合 (Ｄ)直接變成血液。", "ans": "C", "topic": "消化作用", "analysis": "細嚼把食物分成小塊而增加表面積，也使其與含消化酵素的唾液充分混合，有利後續消化。", "ext": "咀嚼屬物理消化；唾液澱粉酶分解澱粉為化學消化，小腸是主要吸收場所。"}, {"num": 7, "content": "把紅血球放在顯微鏡下觀察，其主要生理功能為？ (Ａ)分解骨骼 (Ｂ)製造尿液 (Ｃ)使血液凝固 (Ｄ)運送氧氣。", "ans": "D", "topic": "血球功能", "analysis": "紅血球含血紅素，主要負責從肺部攜帶氧氣到各組織；血液凝固主要與血小板相關。", "ext": "白血球負責吞噬病原與免疫；血小板助凝血；紅血球含血紅素與鐵。"}, {"num": 8, "content": "食物冷藏可延長保存期限，主要是低溫能？ (Ａ)使空氣消失 (Ｂ)殺死所有微生物 (Ｃ)增加食物水分 (Ｄ)減緩多數微生物生長。", "ans": "D", "topic": "食物保存", "analysis": "低溫會減緩多數微生物的生長繁殖及酵素作用，所以可延緩食物腐敗；冷藏並不能殺死所有微生物。", "ext": "乾燥、鹽漬、糖漬皆減少可用水分抑菌；高溫加熱才能有效殺死微生物。"}, {"num": 9, "content": "一杯未飽和糖水再加入少量砂糖並攪拌，砂糖完全溶解後，與加糖前相比，糖水的質量會？ (Ａ)減少 (Ｂ)增加 (Ｃ)變成零 (Ｄ)不變。", "ans": "B", "topic": "質量守恆", "analysis": "糖完全進入糖水中且沒有物質逸出，糖水總質量等於原糖水加新增砂糖的質量，因此增加。", "ext": "溶解前後總質量不變，溶質未消失；濃度與甜度增加但總體積變化不大。"}, {"num": 10, "content": "將飽和食鹽水降溫後有晶體析出，表示在此情況下食鹽的溶解度？ (Ａ)無限大 (Ｂ)降低 (Ｃ)與溫度無關 (Ｄ)增加。", "ans": "B", "topic": "溶解度", "analysis": "降溫後原本能溶於水中的一部分食鹽析出，表示較低溫時食鹽的溶解度降低。", "ext": "硝酸鉀溶解度隨溫度變化大，適合降溫結晶；食鹽宜用蒸發結晶法回收。"}, {"num": 11, "content": "下列何者為物理變化？ (Ａ)鐵釘生鏽 (Ｂ)牛奶變酸 (Ｃ)蠟燭熔化 (Ｄ)木材燃燒。", "ans": "C", "topic": "物理變化", "analysis": "蠟燭熔化只是固態蠟變成液態蠟，沒有生成新物質，屬物理變化；生鏽、變酸與燃燒皆會產生新物質。", "ext": "物理變化無新物質生成，如熔化、蒸發；化學變化生成新物質，如燃燒。"}, {"num": 12, "content": "稀鹽酸與小蘇打反應後，若要證明產生二氧化碳，應觀察該氣體是否？ (Ａ)使帶火星木條復燃 (Ｂ)使澄清石灰水變混濁 (Ｃ)具有強烈香味 (Ｄ)能被磁鐵吸引。", "ans": "B", "topic": "氣體檢驗", "analysis": "二氧化碳通入澄清石灰水會生成碳酸鈣沉澱，使石灰水變混濁，可作為檢驗依據。", "ext": "氧氣使帶火星木條復燃；氫氣點燃有爆鳴聲；二氧化碳使石灰水混濁。"}, {"num": 13, "content": "相同體積的水與酒精，質量分別為100克與79克，可推論？ (Ａ)酒精密度較大 (Ｂ)水的密度較大 (Ｃ)無法比較密度 (Ｄ)兩者密度相同。", "ans": "B", "topic": "密度比較", "analysis": "兩者體積相同時，質量較大的物質密度較大；水100克大於酒精79克，所以水的密度較大。", "ext": "密度＝質量÷體積，是物質特性；同物質不論大小密度相同，可辨識物質。"}, {"num": 14, "content": "木塊漂浮時所受浮力與木塊重量的關係為？ (Ａ)浮力較大 (Ｂ)兩力方向相同 (Ｃ)大小相等、方向相反 (Ｄ)浮力較小。", "ans": "C", "topic": "浮力平衡", "analysis": "木塊靜止漂浮時合力為零，向上的浮力與向下的重量大小相等、方向相反。", "ext": "浮力等於排開液體的重量（阿基米德原理）；沉底物體浮力小於重量。"}, {"num": 15, "content": "腳踏車煞車時，煞車皮夾緊輪圈是利用？ (Ａ)消除慣性 (Ｂ)減少重力 (Ｃ)增加摩擦力 (Ｄ)增加浮力。", "ans": "C", "topic": "摩擦力", "analysis": "煞車皮夾緊輪圈會增加接觸面的正向力，進而增大摩擦力，使車輪減速。", "ext": "輪胎刻紋、鞋底花紋可增加摩擦；加潤滑油、裝滾輪則減少摩擦。"}, {"num": 16, "content": "在相同路面上，若要使空車與載重車由靜止產生相同加速度，載重車通常需要較大的推力，主要因為載重車？ (Ａ)質量較大，需要較大的合力 (Ｂ)沒有輪子 (Ｃ)不受重力 (Ｄ)質量較小。", "ans": "A", "topic": "力與運動", "analysis": "依牛頓第二定律F＝ma，要產生相同加速度，質量較大的載重車需要較大的合力。", "ext": "相同的力作用下，質量越大加速度越小；慣性大小僅與質量有關。"}, {"num": 17, "content": "用輪軸轉動水龍頭，手施力在較大的輪上通常可？ (Ａ)省距離且必省力 (Ｂ)省力 (Ｃ)消除摩擦 (Ｄ)改變水的密度。", "ans": "B", "topic": "輪軸原理", "analysis": "輪軸中在半徑較大的輪上施力可增加施力臂，以較小的力產生足夠力矩，因此省力但需移動較長距離。", "ext": "方向盤與螺絲起子皆輪軸應用；施力於小軸則費力但可省移動距離。"}, {"num": 18, "content": "同一條繩傳遞聲音時，把繩子拉緊比鬆弛更容易聽清楚，主要因為？ (Ａ)空氣完全消失 (Ｂ)聲音變成電流 (Ｃ)振動較能沿繩傳遞 (Ｄ)繩子會發光。", "ans": "C", "topic": "聲音傳播", "analysis": "繩子拉緊時，各部分連結較能有效傳遞機械振動，聲音較清楚；聲音仍是振動，不會變成電流。", "ext": "固體傳聲通常比液體、氣體快且有效；真空中完全不能傳聲。"}, {"num": 19, "content": "太陽能熱水器常用深色集熱板，是因為深色表面通常？ (Ａ)較易吸收輻射熱 (Ｂ)只吸收聲音 (Ｃ)完全反射光 (Ｄ)不會升溫。", "ans": "A", "topic": "輻射吸熱", "analysis": "深色、粗糙表面通常較容易吸收太陽的輻射能，因此集熱板能較有效升溫。", "ext": "深色粗糙面易吸熱也易放熱；淺色光亮面反射強，夏季衣物宜淺色。"}, {"num": 20, "content": "手機充電器在使用時微微發熱，表示電能有一部分轉換成？ (Ａ)重力位能 (Ｂ)熱能 (Ｃ)核能 (Ｄ)化學元素。", "ans": "B", "topic": "能量轉換", "analysis": "充電器發熱顯示部分電能因電阻等因素轉換為熱能，而非全部成為電池中的化學能。", "ext": "電燈將電能轉為光能與熱能；能量可轉換形式但總量守恆不會消失。"}, {"num": 21, "content": "並聯電路中取下一顆燈泡，另一顆仍發亮，原因是？ (Ａ)電池已消失 (Ｂ)電流只能流過斷路 (Ｃ)燈泡自己發電 (Ｄ)另一支路仍形成通路。", "ans": "D", "topic": "並聯電路", "analysis": "並聯電路各支路分開，取下一顆燈泡只使該支路斷路，另一支路仍與電源構成完整通路。", "ext": "串聯燈泡一顆損壞全串熄滅；家庭插座採並聯，各電器電壓相同。"}, {"num": 22, "content": "將電磁鐵線圈的電流方向反轉，最直接的結果是？ (Ａ)磁極互換 (Ｂ)線圈圈數增加 (Ｃ)鐵芯變成木頭 (Ｄ)磁性永久消失。", "ans": "A", "topic": "電磁鐵", "analysis": "電磁鐵磁極方向由線圈電流方向決定，反轉電流會使N、S極互換，但線圈圈數不變。", "ext": "電磁鐵可藉通斷電控制磁性；增加電流或線圈圈數可增強磁力。"}, {"num": 23, "content": "雲的形成主要是空氣中的水蒸氣？ (Ａ)被風吹成棉花 (Ｂ)遇冷凝結成小水滴或冰晶 (Ｃ)受熱凝固 (Ｄ)直接變成氧氣。", "ans": "B", "topic": "雲的形成", "analysis": "含水氣的空氣冷卻至飽和後，水蒸氣會凝結或凝華成微小水滴、冰晶，聚集形成雲。", "ext": "霧是近地面水氣凝結的小水滴；露為水氣凝結於物面，霜為凝華成冰晶。"}, {"num": 24, "content": "相對溼度很高、氣溫下降時，較容易發生？ (Ａ)海水全部蒸乾 (Ｂ)岩漿噴發 (Ｃ)地磁消失 (Ｄ)水氣凝結。", "ans": "D", "topic": "水氣凝結", "analysis": "相對溼度高表示空氣接近飽和，氣溫下降又會降低可容納的水氣量，因此更容易達到露點而凝結。", "ext": "露點是空氣達飽和開始凝結的溫度；相對溼度100%時易起霧或降水。"}, {"num": 25, "content": "高氣壓中心附近的空氣多下沉，通常較容易出現？ (Ａ)持續劇烈上升氣流 (Ｂ)颱風眼牆 (Ｃ)穩定晴朗天氣 (Ｄ)火山活動。", "ans": "C", "topic": "高低氣壓", "analysis": "高壓區空氣下沉時增溫，使相對溼度下降並抑制雲的發展，所以常見穩定晴朗天氣。", "ext": "低氣壓中心空氣上升，易成雲致雨；颱風即強烈的熱帶低氣壓系統。"}, {"num": 26, "content": "海水蒸發形成水蒸氣後，鹽分大多？ (Ａ)留在海中 (Ｂ)飛到太空 (Ｃ)變成氧氣 (Ｄ)一起成為水蒸氣。", "ans": "A", "topic": "水循環", "analysis": "蒸發時主要是水分子進入空氣，溶解在海水中的鹽類不易隨之汽化，因此大多留在海中。", "ext": "雨水是淡水正因蒸發不帶走鹽分；曬鹽即利用日照蒸發海水取鹽。"}, {"num": 27, "content": "地層中若下層岩層未受擾動，通常比上層岩層？ (Ａ)古老 (Ｂ)沒有礦物 (Ｃ)年輕 (Ｄ)同時形成且必相同。", "ans": "A", "topic": "地層疊置", "analysis": "依地層疊置原理，未受翻轉或擾動的沉積岩層通常下老上新，所以下層較古老。", "ext": "化石可判斷地層年代與古環境；地層受褶皺倒轉時上下順序可能顛倒。"}, {"num": 28, "content": "火山噴出的岩漿冷卻凝固後可形成？ (Ａ)化石燃料 (Ｂ)沉積岩 (Ｃ)火成岩 (Ｄ)土壤空氣。", "ans": "C", "topic": "岩石分類", "analysis": "岩漿或熔岩冷卻後礦物結晶、凝固，所形成的岩石稱為火成岩。", "ext": "岩漿地下慢冷成花崗岩晶粒粗；地表快冷成玄武岩晶粒細，皆火成岩。"}, {"num": 29, "content": "月球表面晝夜溫差大，主要原因之一是月球？ (Ａ)幾乎沒有大氣調節溫度 (Ｂ)沒有受到陽光 (Ｃ)完全由冰組成 (Ｄ)距太陽最近。", "ans": "A", "topic": "月球環境", "analysis": "月球大氣極稀薄，缺少能傳輸、儲存熱量的大氣層來調節溫度，因此日照與黑夜區溫差很大。", "ext": "月球無大氣故無風雨與聲音，隕石坑保存完整；晝夜各約14個地球日。"}, {"num": 30, "content": "一年中不同季節可見星座不同，主要與地球哪一運動有關？ (Ａ)地軸停止轉動 (Ｂ)繞太陽公轉 (Ｃ)海水漲退 (Ｄ)繞月球公轉。", "ans": "B", "topic": "星空觀測", "analysis": "地球繞太陽公轉時，夜晚背向太陽的方向隨季節改變，因此一年中不同季節可見不同星座。", "ext": "北極星位置終年幾乎不動可指北；星星每夜東升西落是因地球自轉。"}, {"num": 31, "content": "實驗比較四種紙巾吸水量，最適合的應變變因是？ (Ａ)浸水時間 (Ｂ)每張紙巾面積 (Ｃ)紙巾品牌 (Ｄ)紙巾吸收的水量。", "ans": "D", "topic": "變因辨識", "analysis": "紙巾品牌是操作變因，吸收的水量會隨品牌而變，是應變變因；紙巾面積、浸水時間等應控制相同。", "ext": "操作變因是刻意改變者，應變變因是觀測結果，控制變因須保持相同。"}, {"num": 32, "content": "同一溫度計連續測同杯水三次，讀數為25.0、25.1、35.0℃。應先？ (Ａ)只保留35.0℃ (Ｂ)檢查35.0℃是否為操作或讀值異常並重測 (Ｃ)全部相加當水溫 (Ｄ)宣稱水溫快速升高。", "ans": "B", "topic": "誤差處理", "analysis": "25.0、25.1℃相近，而35.0℃明顯異常，應先檢查是否有視差、操作或抄錄錯誤並重測，不能任意保留或刪除。", "ext": "異常值不可任意捨棄或保留，應先查明原因；測量宜重複多次取平均。"}, {"num": 33, "content": "想知道肥皂水是否為鹼性，可使用？ (Ａ)紅色石蕊試紙 (Ｂ)食鹽晶體 (Ｃ)放大鏡 (Ｄ)純水。", "ans": "A", "topic": "酸鹼檢驗", "analysis": "鹼性肥皂水能使紅色石蕊試紙變藍，因此紅色石蕊可用來判斷；放大鏡、食鹽與純水不能直接檢驗酸鹼性。", "ext": "藍色石蕊試紙遇酸變紅；紫色高麗菜汁遇酸變紅、遇鹼變綠也可檢驗。"}, {"num": 34, "content": "以手電筒照地球儀模擬晝夜，地球儀上背向手電筒的一面代表？ (Ａ)正午 (Ｂ)夏季 (Ｃ)白天 (Ｄ)黑夜。", "ans": "D", "topic": "晝夜成因", "analysis": "手電筒代表太陽，地球儀背光的一面沒有受到照射，代表夜晚。", "ext": "晝夜交替因地球自轉，週期約24小時；面向太陽為白天，背向為黑夜。"}, {"num": 35, "content": "同一地點同一天，太陽高度角由上午逐漸增大，到午後再減小，竿影長度通常？ (Ａ)只向北移動且長度為零 (Ｂ)先變短再變長 (Ｃ)先變長再變短 (Ｄ)完全不變。", "ans": "B", "topic": "竿影變化", "analysis": "太陽高度角越大，直立竿影越短；上午到正午高度角增加、午後下降，所以影長先變短再變長。", "ext": "正午竿影最短且在臺灣多朝北；夏季正午太陽高度角大於冬季，影較短。"}, {"num": 36, "content": "水循環中，植物將水分散失到空氣的過程稱為？ (Ａ)滲透 (Ｂ)凝結 (Ｃ)降水 (Ｄ)蒸散。", "ans": "D", "topic": "蒸散作用", "analysis": "植物體內水分主要由葉片氣孔以水蒸氣散失到空氣，此過程稱為蒸散作用。", "ext": "蒸散產生拉力幫助根部吸水向上；氣孔多分布於葉下表皮，白天開啟。"}, {"num": 37, "content": "若某地地下水抽取速度長期大於補注速度，可能造成？ (Ａ)山脈快速升高 (Ｂ)海水變淡 (Ｃ)地層下陷 (Ｄ)降雨永遠增加。", "ans": "C", "topic": "地下水", "analysis": "地下水被抽走後含水層孔隙壓力下降、土層可能壓密，長期便可能造成地層下陷。", "ext": "地層下陷後難以復原，沿海低地易海水倒灌淹水；應涵養補注地下水。"}, {"num": 38, "content": "一把湯匙一端浸在熱湯中，握柄逐漸變熱，主要是？ (Ａ)蒸發 (Ｂ)凝華 (Ｃ)熱對流 (Ｄ)熱傳導。", "ans": "D", "topic": "熱傳導", "analysis": "湯匙固體內相鄰粒子傳遞熱能，使熱由浸湯端傳到握柄，屬熱傳導。", "ext": "金屬是熱的良導體；木頭、塑膠為不良導體，故鍋柄常用塑膠或木製。"}, {"num": 39, "content": "打開冰箱門不能有效降低整個房間溫度，主要因為冰箱？ (Ａ)門打開後停止傳熱 (Ｂ)不消耗電能 (Ｃ)將內部熱排到室內且運轉也產熱 (Ｄ)會吸收所有空氣。", "ans": "C", "topic": "熱量流動", "analysis": "冰箱把箱內熱量排到房間，壓縮機運轉消耗電能又產生額外熱，因此開門後房間總熱量不會有效降低。", "ext": "冷氣機也是把室內熱搬到室外；機器運轉必伴隨廢熱，電能無法全變功。"}, {"num": 40, "content": "滅火時用鍋蓋蓋住著火油鍋，主要是？ (Ａ)隔絕氧氣 (Ｂ)增加可燃物 (Ｃ)提高燃點以上溫度 (Ｄ)加入更多油。", "ans": "A", "topic": "燃燒條件", "analysis": "用鍋蓋蓋住油鍋可隔絕空氣中的氧氣，使燃燒缺少必要條件而熄滅；向油鍋潑水反而危險。", "ext": "燃燒三要素為可燃物、助燃物與達到燃點；油鍋起火切勿潑水以免噴濺。"}, {"num": 41, "content": "本實驗的操作變因是？ (Ａ)綠豆數量 (Ｂ)水量 (Ｃ)溫度 (Ｄ)棉花種類。", "ans": "C", "topic": "操作變因", "analysis": "四組只有溫度被刻意改變，因此操作變因是溫度；綠豆數量、水量、棉花與時間均為控制條件。", "ext": "操作變因一次只能有一個，否則無法確定造成結果差異的原因。", "gr": "第 41–45 題", "gi": "小芸探討不同溫度對綠豆發芽的影響。每組各放20顆相同綠豆、使用相同棉花與水量，放置5天，結果如下：甲10℃發芽4顆；乙20℃發芽15顆；丙30℃發芽18顆；丁40℃發芽2顆。"}, {"num": 42, "content": "本實驗的應變變因是？ (Ａ)放置天數 (Ｂ)使用的容器 (Ｃ)每組綠豆20顆 (Ｄ)各組發芽顆數。", "ans": "D", "topic": "應變變因", "analysis": "實驗觀察不同溫度後各組有多少顆種子發芽，因此發芽顆數是隨操作變因改變而測得的應變變因。", "ext": "應變變因是實驗中觀察或測量的結果，會隨操作變因改變而改變。"}, {"num": 43, "content": "哪一組發芽率最高？ (Ａ)丁 (Ｂ)甲 (Ｃ)丙 (Ｄ)乙。", "ans": "C", "topic": "發芽率計算", "analysis": "各組皆20顆，丙組30℃有18顆發芽，發芽率18÷20＝90%，高於其他三組。", "ext": "發芽率＝發芽數÷總數×100%；各組總數相同時可直接比較發芽顆數。"}, {"num": 44, "content": "根據數據，下列何者最合理？ (Ａ)此範圍內30℃最有利發芽 (Ｂ)溫度越高發芽越多 (Ｃ)10℃所有種子皆死亡 (Ｄ)水量是造成差異的主要變因。", "ans": "A", "topic": "數據解讀", "analysis": "在所測10～40℃範圍中，30℃組發芽18顆最多，故可說30℃最有利；40℃僅2顆，顯示並非溫度越高越好。", "ext": "結論不可外推到未測範圍；未測的溫度區間不能斷定其發芽情形。"}, {"num": 45, "content": "若要提高結論可信度，最適合？ (Ａ)每組改用不同豆類 (Ｂ)只保留丙組 (Ｃ)把各組水量改成不同 (Ｄ)每種溫度增加重複組並取平均。", "ans": "D", "topic": "重複實驗", "analysis": "每個溫度設置多個相同重複組並取平均，可降低個別種子差異與偶然誤差，使結論更可靠。", "ext": "增加重複組與樣本數可降低偶然誤差影響，平均結果更具代表性。"}], "25": [{"num": 1, "content": "植物進行光合作用時，能量主要來自？ (Ａ)風力 (Ｂ)陽光 (Ｃ)月光反射 (Ｄ)土壤重量。", "ans": "B", "topic": "光合作用", "analysis": "植物以葉綠體吸收陽光能量，將二氧化碳和水合成養分，因此光合作用的主要能量來源是陽光。", "ext": "光合作用在葉綠體進行，原料為二氧化碳與水，產物是養分（葡萄糖）與氧氣。"}, {"num": 2, "content": "將植物放在黑暗處數日後，葉片澱粉量通常減少，主要因為？ (Ａ)黑暗會增加澱粉 (Ｂ)葉綠素變成氧氣 (Ｃ)根停止吸水且立刻死亡 (Ｄ)不能持續光合作用製造養分。", "ans": "D", "topic": "光合與呼吸", "analysis": "黑暗中缺乏光能，葉片不能持續光合作用補充澱粉，但細胞呼吸仍消耗儲存養分，所以澱粉量通常減少。", "ext": "呼吸作用日夜都進行，光合作用只在有光時進行；碘液可檢驗澱粉呈藍黑色。"}, {"num": 3, "content": "種子傳播對植物最主要的好處是？ (Ａ)減少幼苗與母株競爭資源 (Ｂ)讓所有種子留在原地 (Ｃ)使種子不需水 (Ｄ)保證每顆都發芽。", "ans": "A", "topic": "種子傳播", "analysis": "種子散布到較遠處可減少幼苗與母株爭奪光、水、空間及礦物質，也有利物種擴展分布。", "ext": "傳播方式有風力（蒲公英）、水流（椰子）、動物（鬼針草）與彈力（鳳仙花）等。"}, {"num": 4, "content": "青蛙幼體與成體呼吸器官不同，蝌蚪主要用？ (Ａ)肺 (Ｂ)氣管 (Ｃ)皮毛 (Ｄ)鰓。", "ans": "D", "topic": "青蛙變態", "analysis": "蝌蚪生活在水中，主要以鰓交換氣體；變態成青蛙後則主要使用肺並輔以皮膚呼吸。", "ext": "青蛙成體以肺呼吸並輔以皮膚，皮膚需保持濕潤才能協助交換氣體。"}, {"num": 5, "content": "鳥類骨骼部分中空，對飛行有何幫助？ (Ａ)只增加水中浮力 (Ｂ)停止肌肉收縮 (Ｃ)使身體完全沒有支撐 (Ｄ)減輕身體重量。", "ans": "D", "topic": "鳥類適應", "analysis": "部分骨骼中空能在維持支撐的同時減輕身體重量，降低飛行所需能量。", "ext": "鳥類另有流線體型、羽毛與強壯胸肌等飛行適應，並以氣囊輔助呼吸。"}, {"num": 6, "content": "白血球的主要功能為？ (Ａ)運送尿液 (Ｂ)攜帶大部分氧氣 (Ｃ)防禦病原體 (Ｄ)使血液凝固。", "ans": "C", "topic": "血液組成", "analysis": "白血球可辨識、吞噬病原體或參與免疫反應，是身體防禦的重要成分；紅血球運氧，血小板助凝血。", "ext": "紅血球含血紅素運送氧氣，血小板協助凝血，血漿負責運送養分與廢物。"}, {"num": 7, "content": "下列何者是健康的呼吸系統保健方式？ (Ａ)避免吸菸與二手菸 (Ｂ)長時間待在密閉煙霧中 (Ｃ)運動時憋氣 (Ｄ)用嘴吸入粉塵。", "ans": "A", "topic": "呼吸保健", "analysis": "菸及二手菸含有刺激物與有害物質，避免接觸可保護呼吸道與肺部；吸入粉塵或煙霧會增加傷害。", "ext": "鼻腔黏膜與鼻毛可過濾、溫暖並濕潤空氣，用鼻呼吸比用嘴呼吸更能保護呼吸道。"}, {"num": 8, "content": "食物鏈中能直接利用陽光製造養分的是？ (Ａ)消費者 (Ｂ)分解者 (Ｃ)生產者 (Ｄ)掠食者。", "ans": "C", "topic": "食物鏈", "analysis": "生產者如綠色植物能直接利用陽光行光合作用製造養分，消費者與分解者則由其他生物取得能量。", "ext": "能量沿食物鏈傳遞逐級遞減，生產者數量通常最多，位於能量塔的底層。"}, {"num": 9, "content": "把食鹽加入水中攪拌後看不見食鹽，但食鹽仍存在。最能證明的是？ (Ａ)蒸發水後可找回食鹽 (Ｂ)水的質量變小 (Ｃ)食鹽已變成光 (Ｄ)加入磁鐵可吸起食鹽。", "ans": "A", "topic": "溶解現象", "analysis": "溶解後食鹽粒子均勻分散於水中，將水蒸發便可使食鹽重新結晶，證明食鹽仍存在。", "ext": "溶解前後總質量不變；食鹽水無法用過濾分離食鹽，需用蒸發結晶法。"}, {"num": 10, "content": "100克、濃度10%的糖水含糖多少克？ (Ａ)90克 (Ｂ)5克 (Ｃ)50克 (Ｄ)10克。", "ans": "D", "topic": "濃度計算", "analysis": "糖的質量＝糖水總質量×濃度＝100×10%＝10克。", "ext": "濃度＝溶質質量÷溶液總質量×100%；加水稀釋後溶質質量不變、濃度變小。"}, {"num": 11, "content": "水在標準大氣壓下從20℃加熱至100℃，其體積一般會？ (Ａ)略為增加 (Ｂ)變成零 (Ｃ)質量增加一倍 (Ｄ)立刻結冰。", "ans": "A", "topic": "熱脹冷縮", "analysis": "水由20℃升至100℃時一般會熱膨脹，體積略增；若沒有水散失，質量不會因加熱而加倍。", "ext": "水在0～4℃間為例外，加熱反而收縮；4℃時密度最大，稱為水的異常膨脹。"}, {"num": 12, "content": "燒開水時壺蓋被水蒸氣頂起，顯示氣體？ (Ａ)沒有體積 (Ｂ)不受溫度影響 (Ｃ)不能運動 (Ｄ)會占有空間並可施力。", "ans": "D", "topic": "氣體性質", "analysis": "水形成蒸氣後占有空間，且大量快速移動的氣體粒子碰撞壺蓋可施力，將壺蓋頂起。", "ext": "氣體粒子間距大、可壓縮且會充滿整個容器；固體與液體則不易被壓縮。"}, {"num": 13, "content": "若不慎將酸性液體濺到皮膚，第一步通常應？ (Ａ)用嘴舔拭 (Ｂ)用布包住不處理 (Ｃ)用大量清水沖洗並告知師長 (Ｄ)直接塗強鹼。", "ans": "C", "topic": "實驗安全", "analysis": "酸液濺到皮膚應立即以大量流動清水沖洗稀釋、移除污染物並告知師長；直接加強鹼可能放熱並造成二次灼傷。", "ext": "稀釋濃酸時應把酸緩慢倒入水中，不可將水倒入濃酸，以免放熱噴濺傷人。"}, {"num": 14, "content": "等臂天平平衡後，把左盤物體移到右盤，砝碼移到左盤，天平將？ (Ａ)砝碼質量改變 (Ｂ)仍平衡 (Ｃ)一定左低右高 (Ｄ)一定右低左高。", "ans": "B", "topic": "天平原理", "analysis": "等臂天平兩臂長相同，原先平衡表示物體與砝碼質量相等；左右互換後兩側力矩仍相等，所以仍平衡。", "ext": "力矩＝力×力臂；若是不等臂天平，兩側互換後就不再平衡，可據此判斷臂長差異。"}, {"num": 15, "content": "物體受大小相等、方向相反且作用在同一直線上的兩力，可能？ (Ａ)一定加速 (Ｂ)維持靜止或等速直線運動 (Ｃ)一定轉彎 (Ｄ)質量變成零。", "ans": "B", "topic": "力的平衡", "analysis": "兩力大小相等、方向相反且共線時合力為零，物體不產生加速度，可保持靜止或原有的等速直線運動。", "ext": "二力平衡須大小相等、方向相反且共線；平衡時物體不一定靜止，也可能等速運動。"}, {"num": 16, "content": "球由斜坡滾下後在粗糙地面逐漸停止，動能主要轉換成？ (Ａ)熱能與聲能 (Ｂ)化學元素 (Ｃ)更多重力位能 (Ｄ)核能。", "ans": "A", "topic": "能量轉換", "analysis": "粗糙地面的摩擦力對球做負功，使球的動能主要轉成接觸處的熱能，並伴隨少量聲能，最後停下。", "ext": "能量守恆：能量不會消失只會轉換形式，摩擦使動能轉為熱能後難以回收利用。"}, {"num": 17, "content": "鉗子夾取物體可視為槓桿；若施力臂比抗力臂長，通常可？ (Ａ)完全不需施力 (Ｂ)省力 (Ｃ)使支點消失 (Ｄ)費力。", "ans": "B", "topic": "槓桿原理", "analysis": "施力臂長於抗力臂時，較小施力便能產生與抗力相等的力矩，因此具有省力效果。", "ext": "省力槓桿必費時費距離；鑷子、筷子施力臂短屬費力槓桿，但利於精細操作。"}, {"num": 18, "content": "同一音叉在空氣中與水中振動都可傳聲，表示聲音？ (Ａ)一定以光速前進 (Ｂ)只能在空氣中傳播 (Ｃ)可在不同介質中傳播 (Ｄ)不需介質。", "ans": "C", "topic": "聲音傳播", "analysis": "音叉振動可使空氣或水的粒子接力振動，顯示聲音能在不同介質中傳播，但不能在真空中傳播。", "ext": "聲速在固體中最快、液體次之、氣體最慢；真空中沒有介質，聲音無法傳播。"}, {"num": 19, "content": "白光通過三稜鏡後分成多種色光，稱為？ (Ａ)凝結 (Ｂ)蒸散 (Ｃ)繞射 (Ｄ)色散。", "ans": "D", "topic": "光的色散", "analysis": "白光中各色光在三稜鏡內折射程度不同而分開形成光譜，這種現象稱為色散。", "ext": "彩虹是陽光經水滴折射與反射形成的色散現象，紅光偏折最小、紫光偏折最大。"}, {"num": 20, "content": "潛望鏡利用兩面平面鏡改變光的方向，主要應用？ (Ａ)反射 (Ｂ)吸收 (Ｃ)發光 (Ｄ)折射。", "ans": "A", "topic": "光的反射", "analysis": "潛望鏡中的兩面平面鏡分別反射光線，改變光的行進方向，使觀察者能看到遮蔽物另一側。", "ext": "平面鏡成正立左右相反的虛像；反射時入射角恆等於反射角。"}, {"num": 21, "content": "小燈泡要發亮，電池、導線與燈泡必須形成？ (Ａ)絕緣層 (Ｂ)通路 (Ｃ)單一磁極 (Ｄ)斷路。", "ans": "B", "topic": "電路通路", "analysis": "電流必須沿電池、導線與燈泡形成閉合通路，才能通過燈絲使其發光；斷路時沒有持續電流。", "ext": "通路才有電流；短路是電流不經用電器直接流回電池，會發熱甚至起火，十分危險。"}, {"num": 22, "content": "保險絲在電流過大時熔斷，主要用途是？ (Ａ)保護電路避免過熱 (Ｂ)取代所有開關 (Ｃ)增加電流到無限大 (Ｄ)讓電器永久發熱。", "ans": "A", "topic": "用電安全", "analysis": "電流過大會使保險絲因熱效應熔斷而切斷電路，避免電線過熱、損壞或起火。", "ext": "保險絲以低熔點合金製成；不可用銅絲或鐵絲代替，否則失去斷電保護作用。"}, {"num": 23, "content": "冬季臺灣受東北季風影響時，北部通常比南部？ (Ａ)較炎熱乾燥 (Ｂ)較溼冷 (Ｃ)永遠無風 (Ｄ)日照一定較強。", "ans": "B", "topic": "季風氣候", "analysis": "冬季東北季風越過海面帶來水氣，迎向北部、東北部地形後容易降雨，因此北部通常較南部溼冷。", "ext": "夏季吹西南季風，南部迎風多雨；冬季東北季風使北部、東北部多雨溼冷。"}, {"num": 24, "content": "氣象圖上的等壓線越密集，通常表示？ (Ａ)風一定為零 (Ｂ)氣壓梯度較大、風可能較強 (Ｃ)沒有雲 (Ｄ)氣溫必相同。", "ans": "B", "topic": "等壓線判讀", "analysis": "等壓線越密代表相同距離內氣壓差越大，即氣壓梯度較大，推動空氣的作用較強，風速通常較大。", "ext": "風由高壓吹向低壓；北半球高壓區氣流順時針向外旋出，低壓區逆時針向內旋入。"}, {"num": 25, "content": "露與霜的主要差別是形成時？ (Ａ)霜是液態水 (Ｂ)兩者都由雨滴落下 (Ｃ)霜直接形成冰晶，溫度通常更低 (Ｄ)露只在白天形成。", "ans": "C", "topic": "露與霜", "analysis": "露是水蒸氣在物體表面凝結成液滴；霜則在表面溫度低於冰點時形成冰晶，所需溫度通常更低。", "ext": "露是凝結（氣變液），霜是凝華（氣直接變固）；霧則是近地面懸浮的小水滴。"}, {"num": 26, "content": "河川攜帶泥沙流入湖泊後流速下降，常發生？ (Ａ)沉積 (Ｂ)地震 (Ｃ)侵蝕加劇 (Ｄ)熔化。", "ans": "A", "topic": "沉積作用", "analysis": "河水進入湖泊後流速變慢、搬運能力下降，所攜泥沙便容易落下堆積，稱為沉積。", "ext": "流速快時侵蝕搬運強，流速慢時沉積；河口三角洲與沖積扇皆為沉積地形。"}, {"num": 27, "content": "土壤中的腐植質主要來自？ (Ａ)陽光凝固 (Ｂ)金屬熔化 (Ｃ)海水結晶 (Ｄ)生物遺體分解。", "ans": "D", "topic": "土壤形成", "analysis": "腐植質主要是動植物遺體與排遺經分解者作用後形成的有機物，可改善土壤性質。", "ext": "腐植質使土壤呈深色且保水保肥；細菌、真菌等分解者參與遺體分解。"}, {"num": 28, "content": "地震規模與震度的敘述何者正確？ (Ａ)每地規模不同且震度相同 (Ｂ)兩者完全相同 (Ｃ)同一地震只有一個規模，各地震度可不同 (Ｄ)規模只看天氣。", "ans": "C", "topic": "規模與震度", "analysis": "同一地震釋放的能量對應一個規模；各地因距震央、地質與建物等不同，搖晃程度即震度可不同。", "ext": "規模表示地震釋放能量大小，無單位；震度描述各地搖晃程度，通常離震央越近越大。"}, {"num": 29, "content": "北半球中緯度地區在夏至前後，白晝與黑夜相比通常？ (Ａ)永遠各12小時 (Ｂ)完全沒有夜晚 (Ｃ)白晝較長 (Ｄ)白晝較短。", "ans": "C", "topic": "晝夜長短", "analysis": "北半球夏至前後朝向太陽傾斜，太陽在地平線上停留時間較長，因此中緯度白晝長於黑夜。", "ext": "晝夜長短變化源自地軸傾斜23.5度；冬至白晝最短，春分秋分晝夜約等長。"}, {"num": 30, "content": "月球總以近似同一面朝向地球，因為月球？ (Ａ)只反射地球光 (Ｂ)自轉週期約等於公轉週期 (Ｃ)不自轉 (Ｄ)不公轉。", "ans": "B", "topic": "月球運動", "analysis": "月球自轉一周所需時間約等於繞地球公轉一周，因此每公轉一圈也恰好自轉一圈，總以近似同一面朝地球。", "ext": "月球自轉與公轉週期皆約27.3天，故恆以同一面朝地球，背面須靠太空船拍攝。"}, {"num": 31, "content": "小華要比較有無葉片對插枝生根的影響，兩組枝條除葉片外應？ (Ａ)長度、種類與環境盡量相同 (Ｂ)使用不同植物 (Ｃ)一組完全不澆水 (Ｄ)放在不同溫度且不記錄。", "ans": "A", "topic": "對照實驗", "analysis": "有無葉片是操作變因，枝條種類、長度、成熟度及光照、溫度、水分等環境條件應盡量相同。", "ext": "對照實驗一次只能改變一個變因，其餘條件須相同，差異才能歸因於操作變因。"}, {"num": 32, "content": "實驗數據用平均值表示，主要可？ (Ａ)保證假設一定正確 (Ｂ)降低單次測量偶然誤差的影響 (Ｃ)取代所有重複測量 (Ｄ)讓錯誤數據變真。", "ans": "B", "topic": "測量誤差", "analysis": "重複測量後取平均可使正、負方向的隨機波動部分抵銷，降低單次偶然誤差的影響，但不能消除系統誤差。", "ext": "取平均可減少偶然誤差，但儀器不準造成的系統誤差須靠校正儀器才能解決。"}, {"num": 33, "content": "若指示劑在pH 3呈紅色、pH 7呈紫色、pH 10呈綠色，未知液呈綠色，最可能？ (Ａ)中性 (Ｂ)偏鹼性 (Ｃ)純油脂 (Ｄ)偏酸性。", "ans": "B", "topic": "酸鹼指示劑", "analysis": "指示劑在pH 10呈綠色，未知液也呈綠色，表示其pH較可能接近10而偏鹼性。", "ext": "石蕊試紙遇酸變紅、遇鹼變藍；紫色高麗菜汁也可自製成酸鹼指示劑。"}, {"num": 34, "content": "滴管吸取液體後應？ (Ａ)用嘴吸取 (Ｂ)平放桌面 (Ｃ)保持滴管尖端朝下，避免液體流入膠頭 (Ｄ)尖端朝上甩動。", "ans": "C", "topic": "器材操作", "analysis": "滴管吸液後保持尖端朝下，可防止液體倒流進膠頭而污染或腐蝕；更不能用嘴吸取。", "ext": "量筒讀數時視線應與凹液面最低處水平齊，仰視或俯視都會造成讀值誤差。"}, {"num": 35, "content": "把兩個相同紙杯，一個包黑紙、一個包白紙置於陽光下，若比較吸熱效果，應測量？ (Ａ)水的顏色 (Ｂ)紙張價格 (Ｃ)杯子聲音 (Ｄ)相同時間後杯內水溫。", "ans": "D", "topic": "顏色與吸熱", "analysis": "黑、白紙是操作變因，應以相同初溫、水量、杯型與照射時間後的水溫比較兩者吸熱效果。", "ext": "深色物體吸熱與放熱能力較強，白色反射較多陽光，夏天穿淺色衣物較涼爽。"}, {"num": 36, "content": "電風扇吹人感到涼快，主要是加快皮膚表面汗水？ (Ａ)凝固 (Ｂ)凝結 (Ｃ)蒸發 (Ｄ)熔化。", "ans": "C", "topic": "蒸發散熱", "analysis": "風吹移走皮膚附近的飽和水氣，使汗水蒸發加快；蒸發吸收皮膚熱量，所以人感到涼快。", "ext": "蒸發在任何溫度都可發生且會吸熱；溫度、表面積與風速都會影響蒸發快慢。"}, {"num": 37, "content": "在密閉房間使用燃燒式爐具可能危險，主要應注意？ (Ａ)保持通風以避免缺氧與一氧化碳累積 (Ｂ)在旁邊堆放紙張 (Ｃ)用水潑爐火增加燃燒 (Ｄ)關閉所有通風口。", "ans": "A", "topic": "燃燒安全", "analysis": "燃燒會消耗氧氣，若不完全燃燒還可能產生有毒一氧化碳；保持通風可補充氧氣並排走廢氣。", "ext": "一氧化碳無色無味且與血紅素結合力強，易致中毒；燃燒三要素為可燃物、助燃物與燃點。"}, {"num": 38, "content": "瓶口吹氣發聲時，主要振動的是？ (Ａ)吹氣者的骨骼 (Ｂ)水分子停止運動 (Ｃ)瓶底玻璃一定破裂 (Ｄ)瓶內空氣柱。", "ans": "D", "topic": "聲音產生", "analysis": "吹過瓶口時會激發瓶內空氣柱振動並形成共鳴，因而產生聲音；瓶身本身並非主要振動源。", "ext": "空氣柱越短振動頻率越高、音調越高；吹奏樂器多靠空氣柱共鳴發聲。"}, {"num": 39, "content": "夏天電線常比冬天略下垂，主要因為金屬？ (Ａ)遇熱變成液體 (Ｂ)受熱縮短 (Ｃ)遇熱質量消失 (Ｄ)受熱伸長。", "ans": "D", "topic": "熱脹冷縮", "analysis": "金屬受熱通常膨脹，夏季溫度較高使電線伸長，所以在兩支點間看來較下垂。", "ext": "架設電線不可拉太緊，須預留熱脹冷縮的伸縮空間；鐵軌與橋梁也須留伸縮縫。"}, {"num": 40, "content": "人造衛星能繞地球運行，與地球提供的哪種力密切相關？ (Ａ)引力 (Ｂ)浮力 (Ｃ)彈力 (Ｄ)摩擦力。", "ans": "A", "topic": "萬有引力", "analysis": "地球引力提供人造衛星繞行所需的向心作用，使衛星持續改變速度方向而沿軌道運動。", "ext": "月球繞地球同樣靠引力提供向心力；重力隨距離增加而減弱，但不會消失。"}, {"num": 41, "content": "本實驗的操作變因是？ (Ａ)水平面材質 (Ｂ)小車釋放高度 (Ｃ)每組測量次數 (Ｄ)小車種類。", "ans": "B", "topic": "操作變因", "analysis": "實驗刻意改變小車的釋放高度，其他條件相同，因此釋放高度是操作變因。", "ext": "操作變因是實驗者刻意改變的因素，一次僅能改變一項，其餘條件為控制變因。", "gr": "第 41–45 題", "gi": "某班以相同小車在同一斜面由不同高度釋放，測量小車到達底端後在相同水平面上的滑行距離：甲高度10公分，滑行40公分；乙高度20公分，滑行75公分；丙高度30公分，滑行108公分。每種高度均測三次取平均。"}, {"num": 42, "content": "應變變因是？ (Ａ)地點 (Ｂ)斜面長度 (Ｃ)滑行距離 (Ｄ)小車質量。", "ans": "C", "topic": "應變變因", "analysis": "小車在水平面的滑行距離是受到釋放高度影響、且實際量測的結果，因此為應變變因。", "ext": "應變變因是隨操作變因改變而觀測記錄的結果；控制變因則須全程保持固定。"}, {"num": 43, "content": "根據資料，在測試範圍內可推論？ (Ａ)30公分組必可滑行無限遠 (Ｂ)高度越高滑行越短 (Ｃ)高度不影響結果 (Ｄ)釋放高度增加，滑行距離有增加趨勢。", "ans": "D", "topic": "數據推論", "analysis": "高度10、20、30公分時滑行距離依序40、75、108公分，顯示測試範圍內釋放高度增加，滑行距離有增加趨勢。", "ext": "結論僅適用於測試範圍內；外插到未測試的高度須再實驗驗證，不可過度推論。"}, {"num": 44, "content": "每種高度測三次取平均的主要目的為？ (Ａ)減少偶然誤差影響 (Ｂ)使小車變重 (Ｃ)讓斜面變陡 (Ｄ)改變操作變因。", "ans": "A", "topic": "重複測量", "analysis": "同一條件測三次取平均可降低個別釋放、計時或讀值造成的偶然誤差，使資料較穩定。", "ext": "重複測量可檢視數據一致性；若某次數值明顯異常，應查明原因或重新測量。"}, {"num": 45, "content": "若要研究水平面粗糙度的影響，應如何修改？ (Ａ)只測一次且不量距離 (Ｂ)每次使用不同斜面長度 (Ｃ)固定釋放高度，改變水平面材質 (Ｄ)同時改變小車與高度。", "ans": "C", "topic": "實驗設計", "analysis": "研究水平面粗糙度時，材質為操作變因，應固定小車、斜面及釋放高度，再比較不同水平材質上的滑行距離。", "ext": "改變研究主題時，原操作變因（高度）須改為控制變因，維持單一變因原則。"}], "26": [{"num": 1, "content": "一顆菜豆種子萌發初期，在長出綠葉前所需養分主要來自？ (Ａ)空氣中的氧氣轉成糖 (Ｂ)陽光直接進入胚根 (Ｃ)子葉儲存的養分 (Ｄ)土壤中的澱粉。", "ans": "C", "topic": "種子萌發", "analysis": "菜豆萌發初期尚未長出綠葉，不能充分行光合作用，生長所需養分主要來自子葉中原先儲存的物質。", "ext": "種子萌發需要水分、空氣與適當溫度；光照與土壤並非萌發的必要條件。"}, {"num": 2, "content": "植物莖內輸送葉片製造養分的構造，可將養分送往？ (Ａ)根、果實等需要部位 (Ｂ)只送到花瓣 (Ｃ)只送回葉片 (Ｄ)植物體外。", "ans": "A", "topic": "植物運輸", "analysis": "葉片製造的糖等有機養分經韌皮部運送到根、果實、生長點等消耗或儲存部位，而不只送往單一器官。", "ext": "木質部向上運送水分與礦物質，韌皮部運送養分；環狀剝皮會阻斷韌皮部運輸。"}, {"num": 3, "content": "仙人掌葉退化成刺，主要有助於？ (Ａ)增加葉片蒸散面積 (Ｂ)減少水分散失 (Ｃ)製造種子 (Ｄ)吸收更多雨水於葉片。", "ans": "B", "topic": "沙漠適應", "analysis": "仙人掌葉退化成刺能大幅減少葉面積與氣孔蒸散，降低乾燥環境中的水分散失。", "ext": "仙人掌以肥厚綠色的莖行光合作用並儲水，根系淺而廣可快速吸收短暫雨水。"}, {"num": 4, "content": "鴨的趾間有蹼，最主要有利於？ (Ａ)在樹皮鑽洞 (Ｂ)吸收氧氣 (Ｃ)划水游泳 (Ｄ)咀嚼食物。", "ans": "C", "topic": "動物適應", "analysis": "蹼能增加腳向後撥水的面積，使水對腳的反作用力增大，有利鴨在水中游泳。", "ext": "構造與功能相關：鷹爪利於抓握獵物、啄木鳥尖喙利於鑿木取蟲，皆為適應表現。"}, {"num": 5, "content": "生物的「適應」是指？ (Ａ)有助於在特定環境生存繁殖的特徵 (Ｂ)生物不受環境影響 (Ｃ)個體想要什麼就立刻長出什麼 (Ｄ)所有生物外形相同。", "ans": "A", "topic": "生物適應", "analysis": "適應是生物在特定環境中有利於生存與繁殖的構造、生理或行為特徵，並非個體因需要而立即產生。", "ext": "適應是族群長期天擇演化的結果，並非個體因需要而短時間改變遺傳特徵。"}, {"num": 6, "content": "人體吸收大部分消化後養分的器官是？ (Ａ)小腸 (Ｂ)食道 (Ｃ)大腸 (Ｄ)氣管。", "ans": "A", "topic": "消化吸收", "analysis": "食物消化成小分子後，大部分由具有大量絨毛的小腸吸收進血液或淋巴；大腸主要吸收水分。", "ext": "小腸內壁絨毛大幅增加吸收表面積；消化液包含唾液、胃液、腸液、胰液與膽汁。"}, {"num": 7, "content": "腎臟在人體中的主要功能之一是？ (Ａ)製造膽汁 (Ｂ)過濾血液形成尿液 (Ｃ)使骨骼運動 (Ｄ)交換肺泡氣體。", "ans": "B", "topic": "排泄系統", "analysis": "腎臟會過濾血液，排除含氮廢物並調節水分與鹽類，形成尿液。", "ext": "尿液經輸尿管送至膀胱儲存，再由尿道排出；流汗也能排除部分水分與廢物。"}, {"num": 8, "content": "傳染病流行時勤洗手，可主要減少？ (Ａ)地震發生 (Ｂ)食物中的養分 (Ｃ)所有遺傳疾病 (Ｄ)病原體經接觸傳播。", "ans": "D", "topic": "傳染病預防", "analysis": "正確洗手能把手上的病原體洗去，降低經接觸把病原帶入口、鼻、眼或他人的機會。", "ext": "傳染病須有病原體、傳播途徑與宿主；戴口罩主要阻斷飛沫傳播途徑。"}, {"num": 9, "content": "水、酒精與食用油混合後分層，要分離最上層油，可優先使用？ (Ａ)滴管或分液方式吸取 (Ｂ)加熱到全部燃燒 (Ｃ)磁鐵 (Ｄ)篩網篩固體。", "ans": "A", "topic": "混合物分離", "analysis": "油與水、酒精混合液分層後，可用滴管小心吸取上層，或用分液方式依密度分層放液；篩網與磁鐵不適合分離液體。", "ext": "酒精與水互溶不分層；油不溶於水且密度較小而浮於上層，互溶液體可用蒸餾分離。"}, {"num": 10, "content": "固態乾冰直接變成二氧化碳氣體，稱為？ (Ａ)凝固 (Ｂ)凝華 (Ｃ)熔化 (Ｄ)昇華。", "ans": "D", "topic": "昇華現象", "analysis": "乾冰由固態二氧化碳不經液態直接變成氣體，這種物態變化稱為昇華。", "ext": "樟腦丸變小、冰凍衣物直接變乾也是昇華；相反的氣變固過程稱凝華，如霜的形成。"}, {"num": 11, "content": "洗完澡後鏡面出現小水滴，這是水蒸氣？ (Ａ)遇熱沸騰 (Ｂ)凝固成冰 (Ｃ)遇冷凝結 (Ｄ)昇華。", "ans": "C", "topic": "凝結現象", "analysis": "洗澡產生的水蒸氣接觸較冷鏡面後失去熱量，由氣態變成液態小水滴，稱為凝結。", "ext": "冰飲料杯外的水珠是空氣中水蒸氣遇冷凝結而成，不是杯內的水滲出。"}, {"num": 12, "content": "等量熱水分別置於開口寬與開口窄的容器，其他相同。通常開口寬者水量減少較快，因為？ (Ａ)重力變小 (Ｂ)蒸發表面積較大 (Ｃ)容器會製造風 (Ｄ)水的沸點降低至0℃。", "ans": "B", "topic": "蒸發因素", "analysis": "開口較寬使液面與空氣接觸的表面積較大，單位時間內可離開液面的水分子較多，所以蒸發較快。", "ext": "溫度越高、表面積越大、空氣流動越快，蒸發越快；晒衣服攤開較快乾。"}, {"num": 13, "content": "為避免加熱試管時發生危險，試管口應？ (Ａ)貼近他人 (Ｂ)用塞子完全密封 (Ｃ)朝向自己眼睛 (Ｄ)朝向無人的方向。", "ans": "D", "topic": "加熱安全", "analysis": "加熱時試管內液體可能突沸噴出，試管口應朝向無人處，且不可密封，以避免燙傷或爆裂。", "ext": "加熱試管應用試管夾夾持並微傾斜、緩慢搖動，液體不超過試管容積三分之一。"}, {"num": 14, "content": "質量相同的銅塊與鋁塊吸收相同熱量後升溫不同，表示升溫情形還與物質的哪種性質有關？ (Ａ)比熱性質 (Ｂ)顏色名稱 (Ｃ)形狀名稱 (Ｄ)產地。", "ans": "A", "topic": "比熱概念", "analysis": "同質量物質吸收相同熱量時，溫升與比熱容有關，可用Q＝mcΔT表示；比熱不同會造成溫升不同。", "ext": "水的比熱大、升降溫較慢，因此沿海地區日夜溫差通常比內陸地區小。"}, {"num": 15, "content": "一個5牛頓的物體靜置桌面，桌面給它的支持力約為？ (Ａ)5牛頓向上 (Ｂ)0牛頓 (Ｃ)10牛頓向下 (Ｄ)5牛頓向下。", "ans": "A", "topic": "力的平衡", "analysis": "物體靜置表示垂直合力為零，桌面向上的支持力需平衡5牛頓向下的重力，所以支持力約5牛頓向上。", "ext": "支持力屬接觸力（正向力），與重力互相平衡；彈簧秤讀數即反映此平衡關係。"}, {"num": 16, "content": "用10牛頓向右推小車，同時受6牛頓向左阻力，合力為？ (Ａ)16牛頓向右 (Ｂ)0牛頓 (Ｃ)4牛頓向左 (Ｄ)4牛頓向右。", "ans": "D", "topic": "合力計算", "analysis": "取向右為正，合力＝10－6＝4牛頓，方向向右。", "ext": "同向兩力相加、反向相減且方向隨較大力；合力為零時物體保持原運動狀態。"}, {"num": 17, "content": "蹺蹺板左端距支點2公尺處坐300牛頓小孩；右端距支點3公尺處要平衡，右端小孩重量應為？ (Ａ)450牛頓 (Ｂ)150牛頓 (Ｃ)300牛頓 (Ｄ)200牛頓。", "ans": "D", "topic": "槓桿平衡", "analysis": "槓桿平衡需力矩相等：300×2＝W×3，所以W＝600÷3＝200牛頓。", "ext": "力矩＝力×力臂；距支點越遠所需力越小，蹺蹺板上較輕者應坐在離支點較遠處。"}, {"num": 18, "content": "腳踏車前齒輪轉一圈，透過鏈條帶動後齒輪。若後齒輪較小，後齒輪通常？ (Ａ)完全不轉 (Ｂ)轉不到一圈 (Ｃ)轉超過一圈 (Ｄ)反向且只轉半圈。", "ans": "C", "topic": "齒輪傳動", "analysis": "鏈條每次帶動相同齒數，較小後齒輪完成一圈所需齒數較少，因此前齒輪一圈可使後齒輪轉超過一圈。", "ext": "鏈條連接的兩齒輪轉向相同；轉速與齒數成反比，齒數少的齒輪轉得較快。"}, {"num": 19, "content": "音調主要與發聲體的哪一項有關？ (Ａ)只有振幅 (Ｂ)顏色 (Ｃ)振動頻率 (Ｄ)距離地面高度。", "ans": "C", "topic": "音調頻率", "analysis": "發聲體每秒振動次數即頻率，頻率越高，聽到的音調越高；振幅主要影響音量。", "ext": "弦越短、越細、越緊音調越高；頻率單位為赫茲，振幅則決定聲音大小。"}, {"num": 20, "content": "閃電後過幾秒才聽到雷聲，主要因為？ (Ａ)雷聲在真空最快 (Ｂ)光速遠大於聲速 (Ｃ)閃電不會發光 (Ｄ)聲速大於光速。", "ans": "B", "topic": "光速聲速", "analysis": "閃電的光與雷聲近乎同時產生，但光在空氣中的速度遠大於聲音，所以先看到閃電、後聽到雷聲。", "ext": "聲速在空氣中約每秒340公尺；閃電到雷聲的秒數除以3約等於雷擊距離公里數。"}, {"num": 21, "content": "透明玻璃讓大部分可見光通過，屬於？ (Ａ)磁性物體 (Ｂ)不透光物體 (Ｃ)發光體 (Ｄ)透明物體。", "ans": "D", "topic": "透光性質", "analysis": "大部分可見光能穿過透明玻璃，因此玻璃屬透明物體；它本身不必是發光體。", "ext": "半透明物體如毛玻璃只讓部分光通過；不透光物體受光照射會形成清楚影子。"}, {"num": 22, "content": "水力發電主要將水的重力位能先轉換為？ (Ａ)核能 (Ｂ)渦輪的動能再轉成電能 (Ｃ)食物中的化學能 (Ｄ)光合作用能。", "ans": "B", "topic": "能量轉換", "analysis": "高處的水具有重力位能，流下時先轉為水流與渦輪的動能，發電機再把機械能轉為電能。", "ext": "火力發電為化學能轉熱能再轉動能與電能；太陽能電池則直接把光能轉為電能。"}, {"num": 23, "content": "電池使用後不應任意丟棄，主要因為？ (Ａ)一定會立刻爆炸 (Ｂ)可作為食物 (Ｃ)可能含有需妥善回收的物質 (Ｄ)能使土壤更肥沃。", "ans": "C", "topic": "資源回收", "analysis": "廢電池可能含金屬、電解質等需妥善處理的物質，任意丟棄可能污染環境，因此應分類回收。", "ext": "廢電池含鋅、錳、汞等金屬，隨意棄置會污染土壤水源，並可能經食物鏈累積。"}, {"num": 24, "content": "冷鋒通過前後，常見哪種變化？ (Ａ)氣溫下降、風向或風力改變 (Ｂ)日照時數固定24小時 (Ｃ)完全無雲無風 (Ｄ)氣溫永久不變。", "ans": "A", "topic": "鋒面天氣", "analysis": "冷鋒通過後冷空氣取代暖空氣，氣溫常下降，氣壓、風向、風力與降雨也可能明顯改變。", "ext": "冷鋒過境常伴短時強降雨或雷雨；滯留鋒長期徘徊造成五、六月的梅雨。"}, {"num": 25, "content": "颱風的能量主要來自？ (Ａ)暖海面供應的水氣與熱 (Ｂ)地殼摩擦 (Ｃ)高山積雪 (Ｄ)月球表面。", "ans": "A", "topic": "颱風形成", "analysis": "熱帶海面蒸發提供大量水氣，水氣凝結釋放潛熱，持續供應颱風環流發展所需能量。", "ext": "颱風登陸後失去暖海面水氣供應並受地形摩擦，強度通常明顯減弱。"}, {"num": 26, "content": "百葉箱漆成白色且四周通風，主要為了？ (Ａ)收集雨水 (Ｂ)吸收最多陽光 (Ｃ)減少太陽輻射影響並讓空氣流通 (Ｄ)測地震。", "ans": "C", "topic": "氣象觀測", "analysis": "白漆可反射較多太陽輻射，通風百葉讓外界空氣流過，因而量到較接近實際氣溫的數值。", "ext": "百葉箱設於離地約1.2～1.5公尺的草地上，箱門朝北以免陽光直射溫度計。"}, {"num": 27, "content": "岩石被流水帶走的作用稱為？ (Ａ)侵蝕與搬運 (Ｂ)燃燒 (Ｃ)光合作用 (Ｄ)凝結。", "ans": "A", "topic": "侵蝕搬運", "analysis": "流水沖刷使岩土離開原處屬侵蝕，之後隨水流移動屬搬運；兩者會共同改變地表。", "ext": "河流上游以侵蝕為主、中游搬運、下游堆積，分別形成V形谷與沖積平原等地形。"}, {"num": 28, "content": "沿海地區超抽地下水可能使海水進入地下含水層，稱為？ (Ａ)潮汐鎖定 (Ｂ)板塊聚合 (Ｃ)海水入侵 (Ｄ)海嘯。", "ans": "C", "topic": "海水入侵", "analysis": "沿海地下水位因超抽而下降時，海水可能向含水層推進，造成地下水鹽化，稱為海水入侵。", "ext": "超抽地下水也會造成地層下陷，使沿海低窪地區易淹水且幾乎難以復原。"}, {"num": 29, "content": "臺灣位於板塊交界附近，因此常見？ (Ａ)永遠沒有火山岩 (Ｂ)全年無雨 (Ｃ)極晝現象 (Ｄ)地震與造山作用。", "ans": "D", "topic": "板塊運動", "analysis": "臺灣鄰近板塊聚合交界，板塊碰撞與隱沒造成地殼變動，因此地震頻繁且有造山作用。", "ext": "臺灣位於歐亞板塊與菲律賓海板塊交界，花東縱谷即為兩板塊的接觸帶。"}, {"num": 30, "content": "使用星座盤時，日期刻度應與什麼對準？ (Ａ)地震規模 (Ｂ)溫度刻度 (Ｃ)雨量刻度 (Ｄ)觀測時間刻度。", "ans": "D", "topic": "星座盤使用", "analysis": "星座盤需把欲觀測的日期刻度與觀測時間刻度對準，才能顯示該日期、時間可見的星空。", "ext": "觀測時面向欲觀察的方位，將星座盤上該方位文字朝下持拿對照星空。"}, {"num": 31, "content": "月亮由滿月逐日變小到下弦月，亮面在臺灣觀察通常主要朝？ (Ａ)右側 (Ｂ)左側 (Ｃ)完全無亮面 (Ｄ)只有上側。", "ans": "B", "topic": "月相變化", "analysis": "滿月後進入虧月階段，在臺灣等北半球地區觀察，下弦月的主要亮面在左側。", "ext": "月相週期約29.5天；上弦月約農曆初七、八出現，亮面朝右（西）。"}, {"num": 32, "content": "日晷不能在陰天準確計時，主要因為？ (Ａ)晷針質量變小 (Ｂ)北極星消失 (Ｃ)地球停止自轉 (Ｄ)缺乏清楚日影。", "ans": "D", "topic": "日晷計時", "analysis": "日晷利用太陽造成的晷針影子判讀時間，陰天雲層遮光而缺乏清楚日影，所以無法準確計時。", "ext": "日影隨太陽位置改變：上午影子在西側漸短，正午最短，下午轉東側漸長。"}, {"num": 33, "content": "想比較不同濃度鹽水對種子發芽的影響，哪項必須相同？ (Ａ)實驗結果 (Ｂ)鹽水濃度 (Ｃ)每組種子數與培養時間 (Ｄ)發芽顆數。", "ans": "C", "topic": "控制變因", "analysis": "鹽水濃度是操作變因，因此每組種子種類與數量、液量、溫度及培養時間等應相同，再比較發芽顆數。", "ext": "除操作變因（鹽水濃度）外，光照、溫度、種子品種與液量等條件皆須相同。"}, {"num": 34, "content": "實驗紀錄應寫下原始數據而非只寫「很多」「很快」，主要因為？ (Ａ)文字永遠不能使用 (Ｂ)量化資料較利於比較與檢驗 (Ｃ)數字一定沒有誤差 (Ｄ)原始數據可取代實驗設計。", "ans": "B", "topic": "數據紀錄", "analysis": "具單位的量化原始數據可計算、繪圖、比較及由他人檢驗，「很多」「很快」則缺少客觀尺度。", "ext": "紀錄應含單位與測量條件並忠實記載，異常值也應保留並註明，不可竄改。"}, {"num": 35, "content": "量測桌長時尺的零刻度磨損，應如何做？ (Ａ)仍把破損處當零 (Ｂ)估計即可 (Ｃ)只量一次且四捨五入到公尺 (Ｄ)從其他清楚刻度起量，再以兩端讀數相減。", "ans": "D", "topic": "測量技巧", "analysis": "零點損壞時可把尺的一個完整刻度對準物體起點，物長＝終點讀數－起點讀數，以避開錯誤零點。", "ext": "測長度時視線須垂直刻度避免視差；多次測量取平均可提高結果可靠性。"}, {"num": 36, "content": "一顆球在相同斜面由同一高度滾下，三次時間1.8、1.9、1.8秒。較適合報告？ (Ａ)三次相加為5.5秒當單次時間 (Ｂ)宣稱時間必為整數 (Ｃ)平均約1.83秒並保留測量條件 (Ｄ)只寫最快1.8秒且隱瞞其他數據。", "ans": "C", "topic": "數據處理", "analysis": "平均時間＝（1.8＋1.9＋1.8）÷3＝約1.83秒；同時保留測量條件與各次數據，結果才可檢驗。", "ext": "資料應誠實呈現全部數據，不可只挑對自己有利的數值，否則違反科學精神。"}, {"num": 37, "content": "利用顯微鏡觀察時，從低倍物鏡開始的優點是？ (Ａ)不需調焦 (Ｂ)視野較大，較容易找到標本 (Ｃ)視野最暗且範圍最小 (Ｄ)能直接看到原子。", "ans": "B", "topic": "顯微鏡操作", "analysis": "低倍物鏡的視野範圍較大，較容易找到標本並把目標移到中央，再換高倍觀察。", "ext": "先用粗調節輪對焦再用細調節輪；總放大倍率＝目鏡倍率×物鏡倍率。"}, {"num": 38, "content": "顯微鏡倍率由100倍換成400倍後，視野通常？ (Ａ)變小且較暗 (Ｂ)變大且更亮 (Ｃ)完全相同 (Ｄ)標本消失代表沒有細胞。", "ans": "A", "topic": "顯微鏡倍率", "analysis": "倍率提高時看到的實際範圍縮小，進入眼睛的總光量通常也較少，所以視野變小且較暗。", "ext": "換高倍鏡後應調大光圈或反光鏡增加亮度，且只能使用細調節輪對焦。"}, {"num": 39, "content": "生態系中蛇數量突然增加，牠的獵物數量短期可能？ (Ａ)增加到無限 (Ｂ)完全不受影響 (Ｃ)減少 (Ｄ)變成生產者。", "ans": "C", "topic": "族群消長", "analysis": "蛇增加會提高對獵物的捕食壓力，因此在其他條件不變的短期內，獵物數量可能減少。", "ext": "獵物減少後蛇會因食物不足而數量下降，捕食者與獵物常呈週期性消長。"}, {"num": 40, "content": "生物多樣性較高的生態系，面對單一環境擾動時通常？ (Ａ)沒有食物網 (Ｂ)可能有較多替代關係，穩定性較高 (Ｃ)物種數與穩定性永遠無關 (Ｄ)一定立刻崩潰。", "ans": "B", "topic": "生物多樣性", "analysis": "物種多、食物網複雜時，某一物種或資源受擾後可能有替代路徑，生態系功能通常較不易完全中斷。", "ext": "外來種入侵與棲地破壞會降低多樣性；保育應優先保護完整的棲地環境。"}, {"num": 41, "content": "本題直接測量的應變變因是？ (Ａ)水溫上升量 (Ｂ)水的質量 (Ｃ)固體種類 (Ｄ)加熱時間。", "ans": "A", "topic": "應變變因", "analysis": "三組固體種類不同，而實際量得並比較的是各杯水溫上升量，所以水溫上升量為應變變因。", "ext": "本實驗操作變因為固體種類；水量、水初溫、固體質量與初溫皆為控制變因。", "gr": "第 41–45 題", "gi": "小傑取相同質量的甲、乙、丙三種固體，把它們都加熱到80℃，再各自放入相同質量、相同初溫的水中。達到熱平衡後，三杯水的上升溫度分別為甲8℃、乙5℃、丙3℃；假設容器吸熱與對外散熱可忽略。"}, {"num": 42, "content": "哪種固體傳給水的熱量最多？ (Ａ)乙 (Ｂ)甲 (Ｃ)丙 (Ｄ)三者相同。", "ans": "B", "topic": "熱量傳遞", "analysis": "三杯水質量與初溫相同，水吸熱Q＝mcΔT；甲使水升溫8℃最大，表示甲傳給水的熱量最多。", "ext": "熱量自然由高溫物體流向低溫物體，直到兩者溫度相同達熱平衡為止。"}, {"num": 43, "content": "三種固體質量相同且起始溫度相同，依資料推論，哪一種固體的比熱容最大？ (Ａ)乙 (Ｂ)甲 (Ｃ)三者相同 (Ｄ)丙。", "ans": "B", "topic": "比熱比較", "analysis": "熱平衡時，固體放熱等於水吸熱，可寫成m固c固(80－T平衡)＝m水c水(T平衡－T水初)。各組固體與水的質量、初溫相同時，水升溫越多代表固體比熱越大，因此甲最大。", "ext": "比熱大代表升溫慢、降溫也慢；水是常見物質中比熱最大者之一，常用作冷卻劑。"}, {"num": 44, "content": "若重複同一組實驗時測得的水溫升幅略有差異，最合理的解釋是？ (Ａ)溫度計不需接觸水 (Ｂ)熱量可以憑空消失 (Ｃ)水沒有質量 (Ｄ)各次散熱或讀值可能有些差異。", "ans": "D", "topic": "實驗誤差", "analysis": "理想模型雖忽略散熱，但實際重複量測仍可能因攪拌均勻度、溫度計解析度或讀值視差而略有差異；四個選項中只有D包含合理的量測差異。", "ext": "誤差無法完全消除只能減小；提高儀器精密度與統一讀值方法可降低誤差。"}, {"num": 45, "content": "要更公平比較三種固體儲存熱的能力，還應確保？ (Ａ)任意改變加熱時間 (Ｂ)每組用不同水量 (Ｃ)三種固體顏色不同 (Ｄ)固體質量、起始與加熱後溫度等條件可比較。", "ans": "D", "topic": "公平測試", "analysis": "比較儲熱能力時，除固體種類外，固體質量、加熱前後溫度，以及水量、初溫等都須可比較，才能公平歸因於物質性質。", "ext": "公平測試要求各比較組僅目標變因不同；條件不一致時結果無法歸因於該變因。"}], "27": [{"num": 1, "content": "植物細胞與動物細胞都具有的基本構造是？ (Ａ)細胞膜與細胞質 (Ｂ)細胞壁與葉綠體 (Ｃ)葉綠體與大液泡 (Ｄ)根毛與氣孔。", "ans": "A", "topic": "細胞構造", "analysis": "植物與動物細胞都具有細胞膜、細胞質等基本構造；細胞壁、葉綠體與大液泡主要是植物細胞特徵。", "ext": "細胞壁、葉綠體與大液泡為植物細胞特有；動物細胞具中心粒，兩者皆有細胞核與細胞膜。"}, {"num": 2, "content": "葉片中的葉綠體主要進行？ (Ａ)消化作用 (Ｂ)光合作用 (Ｃ)排尿 (Ｄ)血液循環。", "ans": "B", "topic": "光合作用", "analysis": "葉綠體含葉綠素，能吸收光能並進行光合作用，製造有機養分。", "ext": "光合作用在葉綠體進行，吸收二氧化碳並釋出氧氣；呼吸作用則相反且日夜都進行。"}, {"num": 3, "content": "若環境缺水，植物氣孔關閉可直接減少？ (Ａ)蒸散失水 (Ｂ)花粉數量 (Ｃ)種子的質量 (Ｄ)根的固定作用。", "ans": "A", "topic": "蒸散作用", "analysis": "氣孔是葉片水蒸氣散失的主要通道，缺水時關閉氣孔可直接降低蒸散量，但也會限制二氧化碳進入。", "ext": "氣孔多分布於葉下表皮，關閉雖減少失水，也會阻礙二氧化碳進入而降低光合作用效率。"}, {"num": 4, "content": "鯨雖生活在水中，卻屬哺乳類，重要依據之一是？ (Ａ)用肺呼吸並以乳汁育幼 (Ｂ)有尾部 (Ｃ)身體呈流線形 (Ｄ)能游泳。", "ans": "A", "topic": "哺乳類特徵", "analysis": "鯨以肺呼吸、胎生並以乳汁哺育幼兒，這些是哺乳類的重要特徵；流線形和游泳能力並非哺乳類特有。", "ext": "哺乳類恆溫、胎生哺乳、用肺呼吸；鯨魚換氣時噴出的水霧即肺呼吸的證據。"}, {"num": 5, "content": "蜘蛛不屬於昆蟲，主要可由哪一特徵判斷？ (Ａ)吃昆蟲 (Ｂ)會結網 (Ｃ)體型小 (Ｄ)有八隻步足。", "ans": "D", "topic": "節肢動物", "analysis": "昆蟲成體有三對、共六隻步足，蜘蛛有四對、共八隻步足，並屬蛛形綱而非昆蟲綱。", "ext": "昆蟲身體分頭胸腹三部分、三對足；蜘蛛分頭胸部與腹部、四對足且無翅無觸角。"}, {"num": 6, "content": "食物在人體內經消化後，小分子養分進入血液的過程稱為？ (Ａ)排遺 (Ｂ)吸收 (Ｃ)感覺 (Ｄ)呼吸。", "ans": "B", "topic": "消化吸收", "analysis": "食物經消化成葡萄糖、胺基酸等小分子後，穿過小腸壁進入血液或淋巴的過程稱為吸收。", "ext": "吸收主要在小腸進行，小腸內壁絨毛可增大吸收表面積；未消化殘渣排出稱排遺。"}, {"num": 7, "content": "心臟瓣膜的主要功能是？ (Ａ)過濾尿液 (Ｂ)交換氧氣 (Ｃ)防止血液倒流 (Ｄ)製造紅血球。", "ans": "C", "topic": "心臟構造", "analysis": "心臟瓣膜可依壓力差開閉，確保血液單向流動並防止倒流。", "ext": "心房與心室間、心室與動脈間都有瓣膜；四肢靜脈亦有瓣膜協助血液單向回流。"}, {"num": 8, "content": "受傷後血液逐漸凝固，主要與哪一種血液成分有關？ (Ａ)神經細胞 (Ｂ)只有血漿中的水 (Ｃ)紅血球 (Ｄ)血小板。", "ans": "D", "topic": "血液成分", "analysis": "血小板在血管受傷處聚集並啟動凝血反應，形成血塊以減少失血。", "ext": "紅血球運送氧氣、白血球負責防禦、血小板幫助凝血，血漿則運輸養分與廢物。"}, {"num": 9, "content": "生態系中能量傳遞的起點多為？ (Ａ)土壤直接變動物 (Ｂ)分解者創造陽光 (Ｃ)消費者製造無限能量 (Ｄ)太陽能被生產者利用。", "ans": "D", "topic": "能量流動", "analysis": "多數生態系的能量源自太陽，先由生產者透過光合作用轉成化學能，再沿食物鏈傳遞。", "ext": "能量沿食物鏈傳遞時逐級遞減，無法循環利用；物質則可經分解者回到環境循環。"}, {"num": 10, "content": "同一食物網中，一種生物可能同時是不同級消費者，原因是？ (Ａ)牠可同時是太陽 (Ｂ)營養階層永遠固定為生產者 (Ｃ)牠可能取食不同營養階層的食物 (Ｄ)食物網沒有方向。", "ans": "C", "topic": "食物網", "analysis": "同一生物若取食不同營養階層的生物，在不同食物鏈中所處消費者級別也會不同，因此食物網中角色可不只一種。", "ext": "例如雜食動物吃植物時為初級消費者，吃草食動物時為次級消費者，階層可不同。"}, {"num": 11, "content": "兩杯相同水中各加5克食鹽，甲攪拌、乙不攪拌。最初甲溶得較快，說明攪拌可？ (Ａ)使食鹽變新物質 (Ｂ)加快溶解速率 (Ｃ)讓水沸騰 (Ｄ)增加食鹽總質量。", "ans": "B", "topic": "溶解速率", "analysis": "攪拌使溶質周圍已較濃的溶液被帶走、新的水接觸食鹽，能加快溶解速率，但不改變食鹽總質量。", "ext": "攪拌、加熱、將溶質磨細都能加快溶解速率，但不改變定溫下的最大溶解量。"}, {"num": 12, "content": "一杯20℃飽和糖水中仍有未溶糖，若要使更多糖溶解，最可能有效的是？ (Ａ)立即冷凍 (Ｂ)降低水量 (Ｃ)再加大量糖 (Ｄ)適度加熱並攪拌。", "ans": "D", "topic": "飽和溶液", "analysis": "20℃時溶液已飽和，再加糖不會多溶；適度升溫通常提高糖的溶解度，攪拌則加快達到新平衡。", "ext": "多數固體溶解度隨溫度升高而增加；氣體相反，汽水加熱時二氧化碳更易逸出。"}, {"num": 13, "content": "將藍色氯化亞鈷試紙靠近水蒸氣後變粉紅，可用來檢驗？ (Ａ)氮氣 (Ｂ)氧氣 (Ｃ)二氧化碳 (Ｄ)水分。", "ans": "D", "topic": "水的檢驗", "analysis": "藍色氯化亞鈷試紙遇水會變粉紅，可用來檢驗水或水蒸氣中的水分。", "ext": "氯化亞鈷試紙遇水由藍變粉紅；澄清石灰水遇二氧化碳變混濁，兩者勿混淆。"}, {"num": 14, "content": "銅線能導電而塑膠外皮不易導電，電線如此設計主要是？ (Ａ)塑膠傳電較快 (Ｂ)銅能防水但不能導電 (Ｃ)銅傳電、塑膠絕緣以增加安全 (Ｄ)兩者都為磁鐵。", "ans": "C", "topic": "導體絕緣體", "analysis": "銅的導電性佳，作為導線核心；塑膠不易導電，包覆外層可防止觸電與短路，提高安全性。", "ext": "金屬多為導體；塑膠、橡膠、玻璃為絕緣體。純水不易導電，含雜質的水則能導電。"}, {"num": 15, "content": "用力壓縮注射筒內封閉空氣，活塞可推進一段距離，顯示氣體？ (Ａ)一定是液體 (Ｂ)不能施力 (Ｃ)可被壓縮 (Ｄ)沒有質量也沒有體積。", "ans": "C", "topic": "氣體性質", "analysis": "封閉空氣受壓時粒子間距可縮小，體積減少，顯示氣體具有可壓縮性。", "ext": "氣體粒子間距大故易壓縮；液體與固體粒子緊密，幾乎無法壓縮，三態皆有質量。"}, {"num": 16, "content": "物體靜止不代表沒有受力，可能是因為？ (Ａ)物體沒有質量 (Ｂ)所有力方向相同 (Ｃ)重力不存在 (Ｄ)所受合力為零。", "ans": "D", "topic": "力的平衡", "analysis": "物體靜止表示加速度為零，可能同時受多個力但彼此平衡，使合力為零，例如桌上物體的重力與支持力。", "ext": "靜止或等速直線運動皆表示合力為零；桌上書本的重力與桌面支持力即互相平衡。"}, {"num": 17, "content": "汽車突然煞車，乘客身體向前傾，主要與？ (Ａ)浮力 (Ｂ)慣性 (Ｃ)磁力 (Ｄ)毛細現象。", "ans": "B", "topic": "慣性", "analysis": "煞車時車速突然降低，乘客身體仍傾向保持原有向前運動狀態，這是慣性。", "ext": "汽車起步時乘客後仰、煞車時前傾都是慣性；質量越大慣性越大，越難改變運動狀態。"}, {"num": 18, "content": "滾珠軸承能讓機械轉動順暢，主要是將？ (Ａ)摩擦力完全消除 (Ｂ)重力變為浮力 (Ｃ)滑動摩擦改為較小的滾動摩擦 (Ｄ)機械質量歸零。", "ans": "C", "topic": "摩擦力", "analysis": "滾珠使接觸面由直接滑動改為滾動，滾動摩擦通常比滑動摩擦小，因此轉動更順暢，但摩擦不會完全消失。", "ext": "加潤滑油、裝滾輪可減小摩擦；輪胎刻紋、鞋底紋路則是增大摩擦以防滑。"}, {"num": 19, "content": "同樣音量下，蚊子聲通常比牛叫聲音調高，表示蚊子翅膀振動？ (Ａ)頻率較高 (Ｂ)沒有振動 (Ｃ)頻率較低 (Ｄ)振幅一定較大。", "ans": "A", "topic": "聲音三要素", "analysis": "音調取決於振動頻率，蚊子聲較高表示翅膀每秒振動次數較多；相同音量不代表振幅必不同。", "ext": "音調由頻率決定，響度由振幅決定，音色可分辨不同發聲體，三者勿混淆。"}, {"num": 20, "content": "月光下可看到物體，是因為月球？ (Ａ)產生閃電 (Ｂ)像恆星自行核融合發光 (Ｃ)反射太陽光 (Ｄ)反射地球所有聲音。", "ans": "C", "topic": "光的反射", "analysis": "月球本身不會像恆星核融合發出可見光，月光主要是月面反射的太陽光。", "ext": "月球與行星都靠反射太陽光被看見；太陽等恆星才會自行發光。"}, {"num": 21, "content": "凸透鏡可將平行光會聚，生活中哪一物品主要利用此性質？ (Ａ)放大鏡 (Ｂ)平面鏡 (Ｃ)不透明紙板 (Ｄ)音叉。", "ans": "A", "topic": "凸透鏡", "analysis": "放大鏡使用凸透鏡，能使平行光折射並會聚，也能在物體位於焦距內時形成正立放大的虛像。", "ext": "凸透鏡會聚光線，可作放大鏡、老花眼鏡；凹透鏡發散光線，用於近視眼鏡。"}, {"num": 22, "content": "發電機的基本原理涉及磁場與線圈的相對運動產生？ (Ａ)電流 (Ｂ)重力 (Ｃ)只有聲音 (Ｄ)食鹽。", "ans": "A", "topic": "電磁感應", "analysis": "磁場與線圈發生相對運動、使穿過線圈的磁通量改變時，會產生感應電流，這是發電機的基本原理。", "ext": "發電機把動能轉為電能，馬達則把電能轉為動能，兩者原理互為相反應用。"}, {"num": 23, "content": "夏季臺灣午後積雨雲發展旺盛，可能帶來？ (Ａ)霜與暴雪 (Ｂ)短時強降雨與雷電 (Ｃ)極晝 (Ｄ)長期無雲。", "ans": "B", "topic": "對流天氣", "analysis": "強烈對流形成的積雨雲可在短時間內帶來大雨、雷電、強陣風，甚至冰雹。", "ext": "積雨雲垂直發展旺盛，常伴雷陣雨；卷雲位於高空、絲狀，多代表天氣尚穩定。"}, {"num": 24, "content": "當空氣中實際水氣量不變而氣溫降低，相對溼度通常？ (Ａ)一定超過1000% (Ｂ)上升 (Ｃ)下降到零 (Ｄ)不可能改變。", "ans": "B", "topic": "相對溼度", "analysis": "實際水氣量不變時，氣溫降低會使空氣可容納的飽和水氣量下降，所以相對溼度上升，接近露點時可能凝結。", "ext": "氣溫降至露點時水氣達飽和開始凝結，清晨氣溫最低，因此露水多在清晨出現。"}, {"num": 25, "content": "風吹過山脈後在背風坡下沉增溫，可能形成較乾熱的？ (Ａ)月食 (Ｂ)海嘯 (Ｃ)焚風 (Ｄ)寒流。", "ans": "C", "topic": "焚風", "analysis": "空氣越過山脈後在背風坡下沉，因壓縮而升溫、相對溼度降低，形成乾熱的焚風。", "ext": "迎風坡空氣上升冷卻易成雲致雨，背風坡下沉增溫乾燥，臺東常受焚風影響。"}, {"num": 26, "content": "礫石、砂與泥在流水速度降低時，通常先沉積的是？ (Ａ)較大礫石 (Ｂ)溶解鹽類 (Ｃ)水蒸氣 (Ｄ)最細泥粒。", "ans": "A", "topic": "沉積作用", "analysis": "水流減速時搬運能力下降，粒徑大、重量較大的礫石最先沉積，細泥則可被帶到更遠處。", "ext": "河流上游多侵蝕、下游多堆積；顆粒由大到小依序沉積，形成礫、砂、泥的分層。"}, {"num": 27, "content": "珊瑚礁若長期受海水升溫影響，可能發生？ (Ａ)海水完全凝固 (Ｂ)珊瑚行走上岸 (Ｃ)珊瑚白化 (Ｄ)珊瑚變成金屬。", "ans": "C", "topic": "珊瑚白化", "analysis": "海水長期過熱會使珊瑚排出或失去共生藻，顏色變白，稱為珊瑚白化。", "ext": "白化是珊瑚失去共生藻而非立即死亡，若水溫回穩共生藻可能回歸使其恢復。"}, {"num": 28, "content": "火山灰覆蓋地表後經長期風化，可能形成？ (Ａ)永久不變的玻璃 (Ｂ)純氧氣 (Ｃ)土壤的一部分 (Ｄ)月球岩石。", "ans": "C", "topic": "風化作用", "analysis": "火山灰中的礦物經長期物理、化學風化形成細粒，再混合有機物，可成為土壤的一部分。", "ext": "風化是岩石原地崩解或分解，侵蝕則伴隨搬運；土壤由岩石碎屑與腐植質組成。"}, {"num": 29, "content": "太陽東升西落的日行現象，主要是地球？ (Ａ)由西向東自轉 (Ｂ)由東向西公轉 (Ｃ)不自轉 (Ｄ)繞月球轉。", "ans": "A", "topic": "地球自轉", "analysis": "地球由西向東自轉，使地面觀察者看到太陽與星體似乎由東向西移動，產生太陽東升西落的日行現象。", "ext": "自轉造成晝夜交替與天體東升西落；公轉配合地軸傾斜造成四季與晝夜長短變化。"}, {"num": 30, "content": "在北半球觀察北極星，其高度角大致可反映觀測地的？ (Ａ)緯度 (Ｂ)海拔絕對值 (Ｃ)年雨量 (Ｄ)經度。", "ans": "A", "topic": "北極星", "analysis": "北極星接近北天極，在北半球其仰角約等於所在地緯度，因此可用來估計觀測地緯度。", "ext": "北極星位於小熊座，可利用北斗七星杓口兩星延長約五倍距離找到它。"}, {"num": 31, "content": "月球從地球上看有盈虧變化，主要因為？ (Ａ)地球影子每天都遮月球 (Ｂ)日、地、月相對位置改變 (Ｃ)月球自行熄滅 (Ｄ)月球每天改變形狀。", "ans": "B", "topic": "月相變化", "analysis": "月球有一半受太陽照亮，當月球繞地球公轉使日、地、月相對位置改變時，地球上看到的亮面比例便不同。", "ext": "月相盈虧是月球公轉造成，約29.5天一循環；月食才是地球影子遮住月球。"}, {"num": 32, "content": "登山時氣壓通常隨海拔升高而？ (Ａ)先歸零再無限大 (Ｂ)不變 (Ｃ)升高 (Ｄ)降低。", "ans": "D", "topic": "大氣壓力", "analysis": "海拔越高，上方空氣柱越短、重量越小，因此大氣壓通常隨海拔升高而降低。", "ext": "高山氣壓低使水的沸點降低，飯不易煮熟；密封零食袋上山則會膨脹鼓起。"}, {"num": 33, "content": "若以不同材質包住相同冰塊，比較融化速度，控制變因不包括？ (Ａ)冰塊大小 (Ｂ)包覆材質 (Ｃ)環境溫度 (Ｄ)觀察時間。", "ans": "B", "topic": "實驗變因", "analysis": "實驗刻意改變的包覆材質是操作變因，不是控制變因；冰塊大小、環境溫度與觀察時間等才應保持相同。", "ext": "操作變因是刻意改變的條件，控制變因須保持相同，應變變因則是觀測的結果。"}, {"num": 34, "content": "一個良好假設最重要的是？ (Ａ)可用觀察或實驗檢驗 (Ｂ)不可被否證 (Ｃ)不需依據問題 (Ｄ)一定要很長。", "ans": "A", "topic": "科學方法", "analysis": "科學假設必須能導出可觀察、可測量的預測，才可透過實驗或觀察檢驗，且結果可能支持或否證它。", "ext": "科學步驟：觀察、提出問題、假設、實驗驗證、結論；假設須可被檢驗與否證。"}, {"num": 35, "content": "長度量測結果寫成「約12.4公分」比寫成「完全精確12.400000公分」合理，因為？ (Ａ)小數越多越不科學 (Ｂ)所有尺都只能量整數 (Ｃ)長度沒有單位 (Ｄ)測量工具有精度限制。", "ans": "D", "topic": "測量精度", "analysis": "尺的最小刻度限制可可靠表示的位數，寫出遠超工具精度的小數位會造成虛假的精確感。", "ext": "讀數通常記錄到最小刻度的下一位估計值，過多小數位反而造成虛假精確。"}, {"num": 36, "content": "比較兩組平均值前也要留意每組數據分散程度，因為？ (Ａ)只要一筆數據就足夠 (Ｂ)分散程度一定等於零 (Ｃ)平均值從不提供資訊 (Ｄ)相同平均可能來自很不同的數據變化。", "ans": "D", "topic": "數據分析", "analysis": "兩組即使平均相同，一組數據可能集中、另一組可能非常分散，代表穩定性與變異不同，因此還需查看全距等分散指標。", "ext": "除平均值外，全距與各次數據差異可反映穩定性；重複測量可減少誤差影響。"}, {"num": 37, "content": "顯微鏡下看到氣泡邊緣黑且中央透明，最可能是製作玻片時？ (Ａ)蓋玻片方法不當夾入空氣 (Ｂ)細胞全部變成氣體 (Ｃ)倍率太低產生細胞 (Ｄ)染液一定有毒。", "ans": "A", "topic": "玻片製作", "analysis": "蓋玻片若未由一側斜放並緩慢放下，容易把空氣困在水滴中，顯微鏡下便見黑色邊緣、透明中央的氣泡。", "ext": "蓋玻片應以45度角從一側緩慢蓋下以排出空氣，避免氣泡影響觀察。"}, {"num": 38, "content": "解剖顯微鏡比複式顯微鏡更適合觀察整隻小昆蟲，主要因為？ (Ａ)放大倍率必達一萬倍 (Ｂ)只能觀察透明切片 (Ｃ)可觀察較大、具立體外形的材料 (Ｄ)完全沒有光源。", "ans": "C", "topic": "顯微鏡種類", "analysis": "解剖顯微鏡工作距離較大、倍率較低且可呈現立體感，適合觀察整隻昆蟲等較大、不透明的材料。", "ext": "複式顯微鏡倍率高，適合觀察透光薄標本；解剖顯微鏡成立體像，適合觀察外形。"}, {"num": 39, "content": "將麵包置於溫暖潮溼處較易發黴，若只研究溼度影響，應？ (Ａ)每組放不同天數 (Ｂ)不設任何比較組 (Ｃ)各組溫度相同，只改變溼度 (Ｄ)同時改變溫度與麵包種類。", "ans": "C", "topic": "對照實驗", "analysis": "只研究溼度時，溼度是操作變因，麵包種類與大小、溫度、光照及放置時間等必須相同。", "ext": "黴菌喜溫暖潮溼環境；冰箱冷藏是以低溫減緩黴菌與細菌生長來保存食物。"}, {"num": 40, "content": "在野外發現未知菇類，正確做法是？ (Ａ)昆蟲吃過人一定可吃 (Ｂ)不任意採食，先由可靠資料或專家辨識 (Ｃ)先吃一小口測毒性 (Ｄ)顏色鮮豔必可食。", "ans": "B", "topic": "野外安全", "analysis": "野生菇類外觀不足以可靠判斷毒性，昆蟲能吃也不代表人能吃，因此不應採食，需由可靠資料或專家辨識。", "ext": "毒菇無法以顏色鮮豔與否判斷，許多劇毒菇類外觀樸素，野外動植物勿隨意觸食。"}, {"num": 41, "content": "氣壓最低的是？ (Ａ)第1日 (Ｂ)第3日 (Ｃ)第6日 (Ｄ)第4日。", "ans": "D", "topic": "氣壓判讀", "analysis": "六日氣壓中第4日1002 hPa最低，低於第3日1008與其餘各日。", "ext": "低壓中心空氣上升易成雲降雨，高壓中心空氣下沉天氣多晴朗穩定。", "gr": "第 41–45 題", "gi": "某地連續六日中午資料如下：第1日氣壓1018 hPa、晴、25℃；第2日1015 hPa、多雲、26℃；第3日1008hPa、陰、27℃；第4日1002 hPa、大雨、風強、24℃；第5日1010 hPa、短暫雨、21℃；第6日1017 hPa、晴、22℃。"}, {"num": 42, "content": "天氣最劇烈的日期是？ (Ａ)第2日 (Ｂ)第4日 (Ｃ)第6日 (Ｄ)第1日。", "ans": "B", "topic": "天氣變化", "analysis": "第4日同時有大雨、強風及最低氣壓，顯示天氣變化最劇烈。", "ext": "氣壓驟降常伴隨風雨增強；觀察氣壓趨勢有助於預測鋒面或颱風接近。"}, {"num": 43, "content": "第3日至第5日氣溫的主要變化為？ (Ａ)完全不變 (Ｂ)先降後升 (Ｃ)持續下降 (Ｄ)先升後降。", "ans": "C", "topic": "氣溫變化", "analysis": "第3、4、5日氣溫依序為27、24、21℃，連續兩天下降，因此是持續下降。", "ext": "鋒面過境常使氣溫明顯改變，冷鋒過後氣溫下降、氣壓回升，天氣轉晴。"}, {"num": 44, "content": "綜合氣壓、降雨與風力，最可能在第4日前後有？ (Ａ)地震震央移入 (Ｂ)低壓或鋒面系統通過 (Ｃ)穩定高壓中心長期控制 (Ｄ)月食。", "ans": "B", "topic": "鋒面系統", "analysis": "第4日前氣壓下降、雲雨與風增強，之後氣溫下降且氣壓回升，符合低壓或鋒面系統通過的特徵。", "ext": "冷鋒過境常見短時強降雨與風向轉變，過境後氣溫降、氣壓升，與資料相符。"}, {"num": 45, "content": "若只憑這六天資料，下列哪個結論不宜直接下定論？ (Ａ)第4日氣壓最低 (Ｂ)第4日有大雨強風 (Ｃ)第6日氣壓高於第5日 (Ｄ)此地每年第4日都會大雨。", "ans": "D", "topic": "科學推論", "analysis": "資料只能描述這六天，無法證明每年同一日都會大雨；A、B、C都可由表中數值或天氣紀錄直接判斷。", "ext": "結論不能超出資料範圍，單一或少量樣本無法推得普遍規律，需長期多次觀測。"}], "28": [{"num": 1, "content": "沙漠植物的葉常退化成針狀，最主要的適應意義為何？ (Ａ)增加吸水面積 (Ｂ)儲存更多空氣 (Ｃ)吸引昆蟲授粉 (Ｄ)減少水分散失。", "ans": "D", "topic": "植物適應", "analysis": "針狀葉能縮小葉面積，降低蒸散作用造成的水分散失，是乾旱環境中的重要適應。", "ext": "仙人掌針狀葉減少蒸散，由肥厚莖行光合作用並儲水，是乾旱環境的典型適應。"}, {"num": 2, "content": "將金屬湯匙的一端放入熱湯，過一會兒握柄也變熱，熱主要以哪一種方式傳遞？ (Ａ)蒸發 (Ｂ)對流 (Ｃ)輻射 (Ｄ)傳導。", "ans": "D", "topic": "熱傳導", "analysis": "熱沿著金屬湯匙由高溫端傳到低溫端，屬於固體中的熱傳導。", "ext": "傳導靠粒子碰撞傳熱，多發生於固體；金屬導熱快，木材、塑膠導熱慢。"}, {"num": 3, "content": "要檢驗某無色氣體是否含有二氧化碳，最適合使用下列哪一種方法？ (Ａ)將燃燒旺盛的木條伸入 (Ｂ)滴在藍色石蕊試紙上 (Ｃ)通入澄清石灰水 (Ｄ)用磁鐵靠近。", "ans": "C", "topic": "氣體檢驗", "analysis": "二氧化碳通入澄清石灰水會生成碳酸鈣沉澱，使石灰水變混濁，可作為檢驗依據。", "ext": "二氧化碳使澄清石灰水變混濁；氧氣使帶火星木條復燃，兩種檢驗法勿混淆。"}, {"num": 4, "content": "一個木箱同時受到向東 12 牛頓與向西 12 牛頓的水平力，且仍靜止。下列敘述何者正確？ (Ａ)合力為零 (Ｂ)合力向東 (Ｃ)木箱沒有受到力 (Ｄ)合力向西。", "ans": "A", "topic": "二力平衡", "analysis": "向東與向西的力大小皆為 12 N，方向相反而互相抵消，因此合力為 0 N；物體仍受到兩個力。", "ext": "兩力大小相等、方向相反且作用於同一物體同一直線上時互相平衡，合力為零。"}, {"num": 5, "content": "臺灣五月、六月常因哪一種鋒面在附近徘徊而出現連日降雨？ (Ａ)冷鋒 (Ｂ)暖鋒 (Ｃ)滯留鋒 (Ｄ)颱風眼。", "ans": "C", "topic": "梅雨鋒面", "analysis": "臺灣五月、六月的梅雨主要由滯留鋒長時間徘徊造成，容易形成連續性降雨。", "ext": "滯留鋒為冷暖氣團勢力相當而少移動；冷鋒移速快，過境常帶來短暫強降雨。"}, {"num": 6, "content": "材質、粗細與鬆緊相同的弦，哪一條振動時通常發出最高的音調？ (Ａ)長 40 公分 (Ｂ)長 30 公分 (Ｃ)長 20 公分 (Ｄ)長 10 公分。", "ans": "D", "topic": "弦的振動", "analysis": "材質、粗細與鬆緊相同時，弦愈短振動頻率愈高，因此 10 公分的弦音調最高。", "ext": "弦愈短、愈細、愈緊，音調愈高；吉他按壓琴格縮短弦長即可提高音調。"}, {"num": 7, "content": "下列哪一個條件最能加快鐵釘生鏽？ (Ａ)乾燥且密封 (Ｂ)表面塗油 (Ｃ)潮溼並接觸空氣 (Ｄ)放在乾燥劑旁。", "ans": "C", "topic": "鐵的生鏽", "analysis": "鐵生鏽需要水與氧氣，潮溼並接觸空氣同時具備這兩項條件，生鏽最快。", "ext": "防鏽方法包括塗漆上油隔絕水氣與氧、鍍鋅或製成不鏽鋼合金等。"}, {"num": 8, "content": "使用開瓶器掀開瓶蓋時，瓶蓋位於支點與施力點之間。此工具通常具有哪一種效果？ (Ａ)一定費力 (Ｂ)較省力 (Ｃ)只改變方向 (Ｄ)完全沒有槓桿作用。", "ans": "B", "topic": "槓桿原理", "analysis": "開瓶器中瓶蓋位於支點與施力點之間，施力臂較長，能以較小的力產生足夠力矩。", "ext": "抗力點在中間為省力槓桿，如開瓶器、獨輪車；施力點在中間則費力，如鑷子。"}, {"num": 9, "content": "農曆十五前後，若天氣晴朗，晚上最可能觀察到哪一種月相？ (Ａ)滿月
